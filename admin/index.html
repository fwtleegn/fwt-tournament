<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FWT Tournament Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f8;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #17233c;
    }

    .login-card {
      width: min(420px, calc(100% - 32px));
      background: #ffffff;
      border-radius: 18px;
      padding: 42px 32px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
    }

    .brand {
      text-align: center;
      margin-bottom: 34px;
    }

    .brand-main {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #12284c;
    }

    .brand-sub {
      margin-top: 4px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #6b7280;
    }

    .admin-title {
      margin-top: 18px;
      font-size: 17px;
      font-weight: 700;
      color: #374151;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid #d6dbe3;
      border-radius: 10px;
      padding: 0 15px;
      font-size: 17px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #173e70;
      box-shadow: 0 0 0 3px rgba(23, 62, 112, 0.08);
    }

    button {
      width: 100%;
      height: 52px;
      margin-top: 18px;
      border: 0;
      border-radius: 10px;
      background: #173e70;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #102f58;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .message {
      min-height: 22px;
      margin-top: 14px;
      text-align: center;
      font-size: 14px;
    }

    .error {
      color: #c0392b;
    }

    .footer {
      margin-top: 30px;
      text-align: center;
      color: #8a919d;
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <main class="login-card">

    <div class="brand">
      <div class="brand-main">FWT</div>
      <div class="brand-sub">TOURNAMENT</div>
      <div class="admin-title">ADMIN</div>
    </div>

    <form id="loginForm">

      <label for="password">관리자 비밀번호</label>

      <input
        type="password"
        id="password"
        placeholder="비밀번호 입력"
        autocomplete="current-password"
        required
      />

      <button type="submit" id="loginButton">
        로그인
      </button>

      <div id="message" class="message"></div>

    </form>

    <div class="footer">
      FRIENDS WITH TENNIS
    </div>

  </main>

  <script>
    const SUPABASE_URL =
      "https://opwuyqerisocqobbbisg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Eo_zfONeGLs9ATCVg2Fk_g_y_IAJFV-";

    const ADMIN_EMAIL =
      "scooler.arg1@gmail.com";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const loginForm =
      document.getElementById("loginForm");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    async function checkExistingSession() {

      const { data } =
        await supabaseClient.auth.getSession();

      if (data.session) {
        window.location.href =
          "./dashboard.html";
      }

    }


    loginForm.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        message.textContent = "";
        message.className = "message";

        loginButton.disabled = true;
        loginButton.textContent =
          "로그인 중...";

        const password =
          passwordInput.value;


        const { error } =
          await supabaseClient.auth
            .signInWithPassword({
              email: ADMIN_EMAIL,
              password: password
            });


        if (error) {

          message.textContent =
            "비밀번호가 올바르지 않습니다.";

          message.className =
            "message error";

          loginButton.disabled = false;
          loginButton.textContent =
            "로그인";

          passwordInput.focus();

          return;
        }


        window.location.href =
          "./dashboard.html";

      }
    );


    checkExistingSession();

  </script>

</body>
</html>
