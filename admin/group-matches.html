<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>조별 예선 대진 | FWT Tournament</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --navy:#071a31;
      --blue:#184a79;
      --lime:#c9df45;
      --bg:#f4f6f9;
      --text:#172033;
      --muted:#7b8492;
      --line:#e3e8ee;
      --shadow:0 14px 40px rgba(20,35,55,.06);
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:
        Inter,
        Pretendard,
        "Noto Sans KR",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button {
      font:inherit;
      cursor:pointer;
    }

    .topbar {
      height:72px;
      padding:0 30px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      color:white;
      background:linear-gradient(110deg,#07182d,#0b2848 60%,#10375f);
    }

    .brand {
      display:flex;
      align-items:center;
      gap:25px;
    }

    .fwt {
      font-size:30px;
      font-weight:950;
      font-style:italic;
      letter-spacing:-3px;
    }

    .fwt span {
      color:var(--lime);
    }

    .top-title {
      font-size:11px;
      font-weight:800;
      letter-spacing:1.8px;
      color:rgba(255,255,255,.7);
    }

    .back-btn {
      padding:9px 13px;
      border:1px solid rgba(255,255,255,.15);
      border-radius:10px;
      background:rgba(255,255,255,.07);
      color:white;
      font-size:11px;
      font-weight:750;
    }

    .container {
      width:min(1180px,calc(100% - 34px));
      margin:auto;
      padding:42px 0 70px;
    }

    .page-head {
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:20px;
      margin-bottom:25px;
    }

    .kicker {
      color:var(--blue);
      font-size:10px;
      font-weight:850;
      letter-spacing:2px;
      margin-bottom:9px;
    }

    h1 {
      margin:0;
      color:var(--navy);
      font-size:36px;
      letter-spacing:-1.8px;
    }

    .desc {
      margin:9px 0 0;
      color:var(--muted);
      font-size:13px;
    }

    .summary {
      display:flex;
      flex-wrap:wrap;
      gap:7px;
    }

    .chip {
      padding:8px 11px;
      border:1px solid var(--line);
      border-radius:999px;
      background:white;
      font-size:10px;
      font-weight:800;
      color:#647083;
    }

    .chip strong {
      color:var(--navy);
    }

    .toolbar {
      margin-bottom:18px;
    }

    .reset-btn {
      height:41px;
      padding:0 14px;
      border:1px solid #dce2e8;
      border-radius:11px;
      background:white;
      color:#4f5c6e;
      font-size:11px;
      font-weight:800;
    }

    .groups {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:17px;
    }

    .group-card {
      background:white;
      border:1px solid var(--line);
      border-radius:20px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    .group-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:19px 20px;
      border-bottom:1px solid var(--line);
    }

    .group-title {
      color:var(--navy);
      font-size:16px;
      font-weight:900;
    }

    .match-count {
      padding:6px 9px;
      border-radius:999px;
      background:#f2f5f7;
      font-size:9px;
      font-weight:850;
      color:#687585;
    }

    .matches {
      padding:13px;
    }

    .match {
      display:grid;
      grid-template-columns:42px minmax(0,1fr) 72px;
      align-items:center;
      gap:10px;
      padding:12px;
      margin-bottom:8px;
      border:1px solid #e2e7ec;
      border-radius:12px;
    }

    .match:last-child {
      margin-bottom:0;
    }

    .number {
      width:38px;
      height:38px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:10px;
      background:#f3f6f8;
      color:#738091;
      font-size:10px;
      font-weight:900;
    }

    .player {
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
      font-size:12px;
      font-weight:850;
      color:#263247;
    }

    .vs {
      margin:3px 0;
      color:#a1a9b4;
      font-size:8px;
      font-weight:900;
    }

    .order {
      display:flex;
      justify-content:flex-end;
      gap:5px;
    }

    .move {
      width:31px;
      height:31px;
      border:1px solid #dce2e8;
      border-radius:8px;
      background:white;
      color:#596778;
      font-weight:900;
    }

    .move:disabled {
      opacity:.25;
      cursor:default;
    }

    .notice {
      margin-top:18px;
      padding:15px 17px;
      border:1px solid var(--line);
      border-radius:14px;
      background:white;
      color:#747f8d;
      font-size:11px;
      line-height:1.7;
    }

    .notice strong {
      color:var(--navy);
    }

    .bottom {
      display:flex;
      gap:12px;
      margin-top:20px;
    }

    .previous,
    .next {
      height:53px;
      border-radius:12px;
      font-weight:800;
    }

    .previous {
      width:170px;
      border:1px solid #d8dde4;
      background:white;
      color:#536072;
    }

    .next {
      flex:1;
      border:0;
      background:linear-gradient(115deg,var(--navy),#123e6c);
      color:white;
    }

    .next span {
      color:var(--lime);
      margin-left:5px;
    }

    .footer {
      display:flex;
      justify-content:space-between;
      margin-top:28px;
      padding-top:18px;
      border-top:1px solid #e2e6eb;
      color:#9aa2ad;
      font-size:9px;
      letter-spacing:1px;
    }

    .footer strong {
      color:var(--navy);
    }

    .q {
      color:#9eb421;
      font-weight:900;
    }

    @media(max-width:850px) {
      .groups {
        grid-template-columns:1fr;
      }
    }

    @media(max-width:650px) {
      .topbar {
        padding:0 17px;
      }

      .top-title {
        display:none;
      }

      .container {
        width:calc(100% - 26px);
        padding-top:30px;
      }

      .page-head {
        display:block;
      }

      .summary {
        margin-top:15px;
      }

      h1 {
        font-size:29px;
      }

      .bottom {
        flex-direction:column-reverse;
      }

      .previous,
      .next {
        width:100%;
      }
    }
  </style>
</head>

<body>

<header class="topbar">

  <div class="brand">
    <div class="fwt">FW<span>T</span></div>
    <div class="top-title">TOURNAMENT CONTROL</div>
  </div>

  <button
    class="back-btn"
    onclick="location.href='./group-setup.html'"
  >
    ← 조편성
  </button>

</header>

<main class="container">

  <div class="page-head">

    <div>
      <div class="kicker">GROUP MATCHES</div>
      <h1>조별 예선 대진</h1>

      <p class="desc">
        각 조의 풀리그 대진을 확인하고 경기 순서를 조정합니다.
      </p>
    </div>

    <div class="summary">

      <div class="chip">
        <strong id="groupCount">0</strong>개 조
      </div>

      <div class="chip">
        총 <strong id="matchCount">0</strong>경기
      </div>

    </div>

  </div>

  <div class="toolbar">

    <button
      class="reset-btn"
      id="resetButton"
    >
      기본 대진으로 다시 생성
    </button>

  </div>

  <div
    id="groups"
    class="groups"
  ></div>

  <div class="notice">
    <strong>경기 순서</strong><br>
    같은 조 안에서 ↑ ↓ 버튼으로 경기 순서를 조정할 수 있습니다.
    다음 단계에서는 시간을 고정하지 않고 실제 비는 코트에 경기를 배정합니다.
  </div>

  <div class="bottom">

    <button
      class="previous"
      onclick="location.href='./group-setup.html'"
    >
      이전 단계
    </button>

    <button
      class="next"
      id="nextButton"
    >
      경기 운영으로 이동
      <span>→</span>
    </button>

  </div>

  <footer class="footer">

    <div>
      <strong>FWT</strong> · FRIENDS WITH TENNIS
    </div>

    <div>
      CREATED BY <span class="q">Q</span>
    </div>

  </footer>

</main>

<script>

const SUPABASE_URL =
  "https://opwuyqerisocqobbbisg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Eo_zfONeGLs9ATCVg2Fk_g_y_IAJFV-";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

async function checkLogin() {

  const { data } =
    await supabaseClient.auth.getSession();

  if (!data.session) {
    location.href = "./";
  }

}

checkLogin();


const tournament =
  JSON.parse(
    sessionStorage.getItem(
      "fwtNewTournament"
    ) || "null"
  );

const entries =
  JSON.parse(
    sessionStorage.getItem(
      "fwtNewTournamentEntries"
    ) || "null"
  );

const groups =
  JSON.parse(
    sessionStorage.getItem(
      "fwtGroupData"
    ) || "null"
  );


if (
  !tournament ||
  !entries ||
  !groups
) {

  alert(
    "조편성 정보가 없습니다."
  );

  location.href =
    "./group-setup.html";

}


let matchGroups = [];


function entryName(entry) {

  if (entry.type === "singles") {

    if (
      entry.nickname &&
      entry.name
    ) {
      return `${entry.nickname} (${entry.name})`;
    }

    return (
      entry.nickname ||
      entry.name ||
      "이름 없음"
    );

  }

  const p1 =
    entry.player1.nickname ||
    entry.player1.name;

  const p2 =
    entry.player2.nickname ||
    entry.player2.name;

  return `${p1} / ${p2}`;

}


function generateRoundRobin(members) {

  let players =
    [...members];

  if (
    players.length % 2 !== 0
  ) {
    players.push(null);
  }

  const result = [];

  const count =
    players.length;

  const rounds =
    count - 1;

  const half =
    count / 2;


  for (
    let r = 0;
    r < rounds;
    r++
  ) {

    for (
      let i = 0;
      i < half;
      i++
    ) {

      const p1 =
        players[i];

      const p2 =
        players[
          count - 1 - i
        ];

      if (
        p1 !== null &&
        p2 !== null
      ) {

        result.push({
          player1:p1,
          player2:p2,
          round:r + 1
        });

      }

    }

    const fixed =
      players[0];

    const rest =
      players.slice(1);

    rest.unshift(
      rest.pop()
    );

    players =
      [
        fixed,
        ...rest
      ];

  }

  return result;

}


function generateAll() {

  matchGroups =
    groups.map(
      group => ({
        groupName:group.name,
        matches:
          generateRoundRobin(
            group.members
          )
      })
    );

  save();

}


function save() {

  sessionStorage.setItem(
    "fwtGroupMatches",
    JSON.stringify(
      matchGroups
    )
  );

}


function load() {

  const stored =
    sessionStorage.getItem(
      "fwtGroupMatches"
    );

  if (stored) {

    try {

      matchGroups =
        JSON.parse(stored);

      if (
        Array.isArray(
          matchGroups
        )
      ) {
        return;
      }

    } catch(e) {}

  }

  generateAll();

}


function escapeHtml(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value || "";

  return div.innerHTML;

}


function render() {

  const box =
    document.getElementById(
      "groups"
    );

  box.innerHTML = "";

  let total = 0;


  matchGroups.forEach(
    (group,gIndex) => {

      total +=
        group.matches.length;

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "group-card";

      let rows = "";


      group.matches.forEach(
        (match,mIndex) => {

          rows += `

            <div class="match">

              <div class="number">
                ${mIndex + 1}
              </div>

              <div>

                <div class="player">
                  ${escapeHtml(
                    entryName(
                      entries[
                        match.player1
                      ]
                    )
                  )}
                </div>

                <div class="vs">
                  VS
                </div>

                <div class="player">
                  ${escapeHtml(
                    entryName(
                      entries[
                        match.player2
                      ]
                    )
                  )}
                </div>

              </div>

              <div class="order">

                <button
                  class="move"
                  ${mIndex === 0 ? "disabled" : ""}
                  onclick="
                    moveMatch(
                      ${gIndex},
                      ${mIndex},
                      -1
                    )
                  "
                >
                  ↑
                </button>

                <button
                  class="move"
                  ${
                    mIndex ===
                    group.matches.length - 1
                      ? "disabled"
                      : ""
                  }
                  onclick="
                    moveMatch(
                      ${gIndex},
                      ${mIndex},
                      1
                    )
                  "
                >
                  ↓
                </button>

              </div>

            </div>

          `;

        }
      );


      card.innerHTML = `

        <div class="group-head">

          <div class="group-title">
            ${escapeHtml(
              group.groupName
            )}
          </div>

          <div class="match-count">
            ${group.matches.length}경기
          </div>

        </div>

        <div class="matches">
          ${rows}
        </div>

      `;

      box.appendChild(card);

    }
  );


  document.getElementById(
    "groupCount"
  ).textContent =
    matchGroups.length;

  document.getElementById(
    "matchCount"
  ).textContent =
    total;

  save();

}


function moveMatch(
  groupIndex,
  matchIndex,
  direction
) {

  const list =
    matchGroups[
      groupIndex
    ].matches;

  const target =
    matchIndex +
    direction;

  if (
    target < 0 ||
    target >= list.length
  ) {
    return;
  }

  [
    list[matchIndex],
    list[target]
  ] = [
    list[target],
    list[matchIndex]
  ];

  render();

}


document.getElementById(
  "resetButton"
).addEventListener(
  "click",
  function() {

    if (
      !confirm(
        "현재 경기 순서를 초기화하고 기본 대진으로 다시 만들까요?"
      )
    ) {
      return;
    }

    generateAll();

    /*
      대진 자체를 다시 만들었으므로
      운영 상태도 초기화
    */

    sessionStorage.removeItem(
      "fwtMatchControlState"
    );

    render();

  }
);


document.getElementById(
  "nextButton"
).addEventListener(
  "click",
  function() {

    save();

    location.href =
      "./match-control.html";

  }
);


load();
render();

</script>

</body>
</html>
