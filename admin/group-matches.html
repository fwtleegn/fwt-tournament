<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>조별 예선 대진 | FWT Tournament</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --navy:#071a31;
      --navy2:#0c294a;
      --blue:#184a79;
      --lime:#c9df45;

      --bg:#f4f6f9;
      --white:#ffffff;
      --text:#172033;
      --muted:#617083;
      --line:#dfe5eb;

      --green:#178b61;
      --green-soft:#edf8f3;

      --orange:#99631c;
      --orange-soft:#fff7eb;

      --red:#c64b4b;
      --red-soft:#fff2f2;

      --shadow:
        0 12px 35px rgba(20,35,55,.06);
    }

    * {
      box-sizing:border-box;
    }

    html,
    body {
      margin:0;
      min-height:100%;

      background:var(--bg);
      color:var(--text);

      font-family:
        Inter,
        Pretendard,
        "Noto Sans KR",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button {
      font:inherit;
      cursor:pointer;
    }

    button:disabled {
      cursor:not-allowed;
      opacity:.48;
    }

    /* HEADER */

    .topbar {
      min-height:72px;

      padding:0 20px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      color:white;

      background:
        linear-gradient(
          110deg,
          #06172b,
          #0a2848 62%,
          #103b67
        );

      box-shadow:
        0 5px 20px rgba(6,23,43,.16);
    }

    .fwt-logo {
      color:white;

      font-size:31px;
      line-height:1;

      font-weight:950;
      font-style:italic;

      letter-spacing:-4px;

      transform:skew(-5deg);
    }

    .fwt-logo span {
      color:var(--lime);
    }

    .back-btn {
      min-height:44px;

      padding:0 14px;

      border:
        1px solid rgba(255,255,255,.15);

      border-radius:11px;

      background:
        rgba(255,255,255,.08);

      color:white;

      font-size:12px;
      font-weight:850;
    }

    /* PAGE */

    .container {
      width:
        min(
          1120px,
          calc(100% - 34px)
        );

      margin:0 auto;

      padding:34px 0 60px;
    }

    .head {
      display:flex;
      align-items:flex-end;
      justify-content:space-between;

      gap:20px;

      margin-bottom:18px;
    }

    .kicker {
      margin-bottom:7px;

      color:var(--blue);

      font-size:11px;
      font-weight:950;

      letter-spacing:2px;
    }

    h1 {
      margin:0;

      color:var(--navy);

      font-size:34px;
      font-weight:950;

      letter-spacing:-1.5px;
    }

    .desc {
      margin:8px 0 0;

      color:var(--muted);

      font-size:13px;
      line-height:1.65;
    }

    .summary {
      display:flex;
      flex-wrap:wrap;

      gap:7px;
    }

    .summary-chip {
      padding:9px 12px;

      border:1px solid var(--line);
      border-radius:999px;

      background:white;
      color:#526073;

      font-size:11px;
      font-weight:850;
    }

    .summary-chip strong {
      margin-left:4px;

      color:var(--navy);

      font-size:15px;
      font-weight:950;
    }

    /* NOTICE */

    .notice {
      margin-bottom:14px;

      padding:14px 15px;

      border:1px solid #dce8df;
      border-radius:13px;

      background:var(--green-soft);

      color:#396451;

      font-size:12px;
      font-weight:750;

      line-height:1.65;
    }

    .notice.protected {
      border-color:#d9e3b0;

      background:#f8fae9;

      color:#58641c;
    }

    .notice strong {
      color:var(--navy);
    }

    /* GROUPS */

    .groups {
      display:flex;
      flex-direction:column;

      gap:13px;
    }

    .group-card {
      overflow:hidden;

      border:1px solid var(--line);
      border-radius:17px;

      background:white;

      box-shadow:var(--shadow);
    }

    .group-head {
      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:10px;

      padding:16px 18px;

      border-bottom:1px solid #e7ebef;

      background:#fafbfc;
    }

    .group-name {
      color:var(--navy);

      font-size:18px;
      font-weight:950;
    }

    .group-meta {
      color:#687587;

      font-size:11px;
      font-weight:800;
    }

    .rounds {
      padding:10px;
    }

    .round-block {
      margin-bottom:10px;

      overflow:hidden;

      border:1px solid #e5e9ed;
      border-radius:12px;

      background:#fff;
    }

    .round-block:last-child {
      margin-bottom:0;
    }

    .round-head {
      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:10px 12px;

      background:#f7f9fb;

      border-bottom:1px solid #e7ebef;
    }

    .round-title {
      color:var(--navy);

      font-size:13px;
      font-weight:900;
    }

    .round-rest {
      color:#7a8492;

      font-size:10px;
      font-weight:750;
    }

    .match-list {
      padding:8px;
    }

    .match-row {
      display:grid;

      grid-template-columns:
        42px minmax(0,1fr) auto;

      align-items:center;

      gap:10px;

      min-height:63px;

      padding:8px 9px;

      margin-bottom:6px;

      border:1px solid #e5e9ed;
      border-radius:10px;

      background:white;
    }

    .match-row:last-child {
      margin-bottom:0;
    }

    .match-number {
      width:37px;
      height:37px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:9px;

      background:#eef2f6;

      color:var(--navy);

      font-size:12px;
      font-weight:950;
    }

    .match-main {
      min-width:0;
    }

    .match-players {
      display:grid;

      grid-template-columns:
        minmax(0,1fr) auto minmax(0,1fr);

      align-items:center;

      gap:7px;
    }

    .player {
      overflow:hidden;

      color:#28364a;

      font-size:13px;
      font-weight:900;

      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .player.right {
      text-align:right;
    }

    .vs {
      color:#8a95a3;

      font-size:10px;
      font-weight:900;
    }

    .match-sub {
      display:flex;
      align-items:center;

      gap:6px;

      margin-top:5px;

      color:#718092;

      font-size:10px;
      font-weight:700;
    }

    .status-badge {
      display:inline-flex;
      align-items:center;

      min-height:23px;

      padding:0 7px;

      border-radius:999px;

      background:#eef2f5;

      color:#637083;

      font-size:9px;
      font-weight:900;
    }

    .status-badge.playing {
      background:var(--green-soft);
      color:var(--green);
    }

    .status-badge.completed {
      background:#e8f6ed;
      color:#14784f;
    }

    .status-badge.waiting {
      background:#eef3f7;
      color:#566579;
    }

    .order-actions {
      display:flex;

      gap:5px;
    }

    .order-btn {
      width:34px;
      height:34px;

      display:flex;
      align-items:center;
      justify-content:center;

      border:1px solid #d9e0e6;
      border-radius:8px;

      background:white;
      color:#526073;

      font-size:13px;
      font-weight:950;
    }

    /* BUTTONS */

    .bottom {
      display:flex;

      gap:10px;

      margin-top:18px;
    }

    .previous,
    .regenerate,
    .next {
      height:56px;
      min-height:56px;

      border-radius:11px;

      font-weight:900;
    }

    .previous {
      width:170px;

      border:1px solid #d8dee5;

      background:white;
      color:#526073;
    }

    .regenerate {
      width:190px;

      border:1px solid #d8dee5;

      background:white;
      color:#526073;
    }

    .next {
      flex:1;

      border:0;

      background:

          115deg,
          var(--navy),
          #123e6c
        );

      color:white;

      font-size:14px;
    }

    .next span {
      margin-left:5px;

      color:var(--lime);
    }

    /* LOADING */

    .loading-overlay {
      display:none;

      position:fixed;
      inset:0;

      z-index:300;

      align-items:center;
      justify-content:center;

      padding:20px;

      background:
        rgba(4,17,31,.62);
    }

    .loading-overlay.show {
      display:flex;
    }

    .loading-box {
      width:min(350px,100%);

      padding:25px;

      border-radius:17px;

      background:white;

      text-align:center;

      box-shadow:
        0 30px 80px rgba(0,0,0,.25);

    .spinner {
      width:38px;
      height:38px;

      margin:0 auto 15px;

      border:4px solid #e6eaee;
      border-top-color:var(--navy);

      border-radius:50%;

      animation:spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform:rotate(360deg);
      }
    }

    .loading-title {
      color:var(--navy);

      font-size:16px;
      font-weight:900;
    }

    .loading-text {
      margin-top:6px;

      color:#657184;

      font-size:12px;
      line-height:1.6;
    }

    /* FOOTER */

    .footer {
      display:flex;
      justify-content:space-between;

      margin-top:27px;
      padding-top:17px;

      border-top:1px solid #e2e6eb;

      color:#7c8795;

      font-size:10px;
      letter-spacing:1px;
    }

    .footer strong {
      color:var(--navy);
    }

    .q {
      color:#91a719;
      font-weight:900;
    }

    /* MOBILE */

    @media(max-width:700px) {

      .topbar {
        min-height:72px;

        padding:0 14px;
      }

      .fwt-logo {
        font-size:30px;
      }

      .back-btn {
        min-height:46px;

        flex:none;

        font-size:12px;
      }

      .container {
        width:calc(100% - 22px);

        padding:25px 0 50px;
      }

      .head {
        display:block;
      }

      .summary {
        margin-top:13px;
      }

      h1 {
        font-size:31px;
      }

      .desc {
        font-size:14px;
      }

      .notice {
        font-size:13px;
      }

      .summary-chip {
        font-size:12px;
      }

      .group-head {
        padding:14px;
      }

      .group-name {
        font-size:18px;
      }

      .group-meta {
        font-size:12px;
      }

      .round-head {
        padding:11px;
      }

      .round-title {
        font-size:14px;
      }

      .round-rest {
        font-size:11px;
      }

      .match-row {
        grid-template-columns:
          40px minmax(0,1fr);

        gap:8px;

        min-height:85px;

        padding:9px;
      }

      .match-number {
        width:38px;
        height:38px;

        font-size:13px;
      }

      .player {
        font-size:14px;
      }

      .match-sub {
        font-size:11px;
      }

      .order-actions {
        grid-column:1 / -1;

        display:grid;

        grid-template-columns:
          1fr 1fr;

        gap:7px;
      }

      .order-btn {
        width:100%;

        height:44px;
        min-height:44px;

        font-size:14px;
      }

      .bottom {
        flex-direction:column-reverse;

        gap:9px;
      }

      .previous,
      .regenerate,
      .next {
        width:100%;

        height:56px;
        min-height:56px;

        flex:none;

        font-size:15px;
      }

    }
  </style>
</head>

<script>

const SUPABASE_URL =
  "https://opwuyqerisocqobbbisg.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_Eo_zfONeGLs9ATCVg2Fk_g_y_IAJFV-";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const tournament =
  JSON.parse(
    sessionStorage.getItem(
      "fwtNewTournament"
    ) || "null"
  );


const entries =
  JSON.parse(
    sessionStorage.getItem(
      "fwtNewTournamentEntries"

  );


const groupData =
  JSON.parse(
    sessionStorage.getItem(

    ) || "null"
  );


if (
  !tournament ||
  !tournament.divisionId ||
  !Array.isArray(entries) ||
  !Array.isArray(groupData) ||
  groupData.length === 0
) {

  alert(
    "대회 또는 조편성 정보가 없습니다."
  );

  location.href =
    "./dashboard.html";

}


let busy = false;


/*
  TRUE가 되는 순간부터
  이 페이지에서는 기존 예선 DB를
  절대 DELETE / INSERT 하지 않는다.
*/
let dbMatchesExist = false;


let existingDbStatuses = [];


let groupMatches = [];


/* =====================================
   HELPERS
===================================== */

function escapeHtml(value) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value ?? "";

  return div.innerHTML;

}


function shortEntryName(entry) {

  if (!entry) {

    return "알 수 없음";

  }


  if (
    entry.type ===
    "singles"
  ) {

    return (
      entry.nickname ||
      entry.name ||
      "이름 없음"
    );

  }


  const p1 =
    entry.player1?.nickname ||
    entry.player1?.name ||
    "선수1";


  const p2 =
    entry.player2?.nickname ||
    entry.player2?.name ||
    "선수2";


  return `${p1}/${p2}`;

}


function statusText(status) {

  const map = {

    pending:"대기 전",
    waiting:"대기",
    playing:"경기중",
    completed:"완료",
    bye:"BYE",
    walkover:"기권승",
    cancelled:"취소"

  };


  return (
    map[status] ||
    status ||
    "대기"
  );

}


/* =====================================
   AUTH
===================================== */

async function checkLogin() {

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getSession();


  if (
    error ||
    !data.session
  ) {

    location.href =
      "./";

    return false;

  }


  return true;

}


/* =====================================
   BUSY
===================================== */

function setBusy(
  state,
  title = "",
  text = ""
) {

  busy =
    state;


  [
    "previousButton",
    "regenerateButton",
    "confirmButton"
  ]
    .forEach(
      id => {

        const button =
          document.getElementById(
            id
          );


        if (button) {

          button.disabled =
            state;

        }

      }
    );


  /*
    DB 경기가 이미 존재하면
    regenerate는 항상 잠금.
  */

  if (
    dbMatchesExist
  ) {

    document.getElementById(
      "regenerateButton"
    ).disabled =
      true;

  }


  document.getElementById(
    "loadingOverlay"
  ).classList.toggle(
    "show",
    state
  );


  if (title) {

    document.getElementById(
      "loadingTitle"
    ).textContent =
      title;

  }


  if (text) {

    document.getElementById(
      "loadingText"
    ).textContent =
      text;

  }

}


/* =====================================
   ROUND ROBIN
===================================== */

function createRoundRobin(
  memberIndexes
) {

  const list =
    [...memberIndexes];


  if (
    list.length % 2 === 1
  ) {

    list.push(null);

  }


  const n =
    list.length;


  if (
    n < 2
  ) {

    return [];

  }


  let rotating =
    [...list];


  const rounds = [];


  for (
    let roundIndex = 0;
    roundIndex < n - 1;
    roundIndex++
  ) {

    const matches = [];

    let restEntryIndex =
      null;


    for (
      let i = 0;
      i < n / 2;
      i++
    ) {

      const a =
        rotating[i];


      const b =
        rotating[
          n - 1 - i
        ];


      if (
        a === null &&
        b !== null
      ) {

        restEntryIndex =
          b;

        continue;

      }


      if (
        b === null &&
        a !== null
      ) {

        restEntryIndex =
          a;

        continue;

      }


      if (
        a === null ||
        b === null
      ) {

        continue;

      }


      matches.push({

        entry1Index:a,

        entry2Index:b,

        dbMatchId:null,

        status:"waiting",

        score1:null,

        score2:null

      });

    }


    rounds.push({

      roundNumber:
        roundIndex + 1,

      restEntryIndex,

      matches

    });


    const fixed =
      rotating[0];


    const rest =
      rotating.slice(1);


    rest.unshift(
      rest.pop()
    );


    rotating =
      [
        fixed,
        ...rest
      ];

  }


  return rounds;

}


/* =====================================
   GENERATE LOCAL ONLY
===================================== */

function generateLocalMatches() {

  /*
    안전장치.
    DB 경기가 존재하는 상태에서는
    절대 새 대진으로 바꾸지 않는다.
  */

  if (
    dbMatchesExist
  ) {

    alert(
      "이미 DB에 조별 예선 경기가 저장되어 있어 대진을 다시 생성할 수 없습니다."
    );

    return;

  }


  groupMatches =
    groupData.map(
      group => ({

        groupName:
          group.name,

        dbGroupId:
          group.dbGroupId,

        rounds:
          createRoundRobin(
            group.members || []
          )

      })
    );


  saveSession();

  render();

}


/* =====================================
   SESSION COMPATIBILITY
===================================== */

function saveSession() {

  sessionStorage.setItem(
    "fwtGroupMatches",
    JSON.stringify(
      groupMatches
    )
  );

}


/* =====================================
   REST PLAYER FROM DB ROUND
===================================== */

function detectRestEntry(
  group,
  roundMatches
) {

  const members =
    group.members || [];


  if (
    members.length % 2 === 0
  ) {

    return null;

  }


  const played =
    new Set();


  roundMatches.forEach(
    match => {

      played.add(
        match.entry1Index
      );

      played.add(
        match.entry2Index
      );

    }
  );


  const rest =
    members.find(
      index =>
        !played.has(index)
    );


  return (
    rest === undefined
      ? null
      : rest
  );

}


/* =====================================
   LOAD DB MATCHES
===================================== */

async function loadExistingMatches() {

  const {
    data:matchRows,
    error
  } =
    await supabaseClient
      .from("matches")
      .select(
        "id,group_id,entry1_id,entry2_id,round_number,match_number,sort_order,status,score1,score2,winner_entry_id,court_id,started_at,completed_at"
      )
      .eq(
        "division_id",
        tournament.divisionId
      )
      .eq(
        "stage",
        "group"
      )
      .order(
        "sort_order",
        {
          ascending:true
        }
      );


  if (error) {

    throw new Error(
      "기존 예선 대진 조회 실패: "
      +
      error.message
    );

  }


  /*
    DB에 아직 예선 경기가 없는 최초 상태
  */

  if (
    !matchRows ||
    matchRows.length === 0
  ) {

    dbMatchesExist =
      false;


    existingDbStatuses =
      [];


    /*
      임시로 만들어두었던 대진이 있으면
      sessionStorage 복원.
    */

    const saved =
      JSON.parse(
        sessionStorage.getItem(
          "fwtGroupMatches"
        ) || "null"
      );


    if (
      Array.isArray(saved) &&
      saved.length ===
        groupData.length
    ) {

      groupMatches =
        saved;

    } else {

      groupMatches =
        groupData.map(
          group => ({

            groupName:
              group.name,

            dbGroupId:
              group.dbGroupId,

            rounds:
              createRoundRobin(
                group.members || []
              )

          })
        );

    }


    saveSession();

    updateProtectionUI();

    return;

  }


  /*
    여기로 들어오면 DB 대진 존재.
    이후부터 절대 기존 경기를 삭제하지 않는다.
  */

  dbMatchesExist =
    true;


  existingDbStatuses =
    matchRows.map(
      row =>
        row.status
    );


  const entryIndexMap =
    new Map();


  entries.forEach(
    (
      entry,
      index
    ) => {

      if (
        entry.dbEntryId
      ) {

        entryIndexMap.set(
          entry.dbEntryId,
          index
        );

      }

    }
  );


  groupMatches =
    groupData.map(
      group => {

        const groupRows =
          matchRows
            .filter(
              row =>
                row.group_id ===
                group.dbGroupId
            );


        const roundNumbers =
          [
            ...new Set(
              groupRows.map(
                row =>
                  Number(
                    row.round_number || 1
                  )
              )
            )
          ]
            .sort(
              (a,b) =>
                a - b
            );


        const rounds =
          roundNumbers.map(
            roundNumber => {

              const rows =
                groupRows
                  .filter(
                    row =>
                      Number(
                        row.round_number || 1
                      ) ===
                      roundNumber
                  )
                  .sort(
                    (a,b) => {

                      const sortA =
                        Number(
                          a.sort_order || 0
                        );


                      const sortB =
                        Number(
                          b.sort_order || 0
                        );


                      if (
                        sortA !== sortB
                      ) {

                        return (
                          sortA -
                          sortB
                        );

                      }


                      return (
                        Number(
                          a.match_number || 0
                        )
                        -
                        Number(
                          b.match_number || 0
                        )
                      );

                    }
                  );


              const matches =
                rows
                  .map(
                    row => {

                      const entry1Index =
                        entryIndexMap.get(
                          row.entry1_id
                        );


                      const entry2Index =
                        entryIndexMap.get(
                          row.entry2_id
                        );


                      if (
                        entry1Index === undefined ||
                        entry2Index === undefined
                      ) {

                        return null;

                      }


                      return {

                        entry1Index,

                        entry2Index,

                        dbMatchId:
                          row.id,

                        status:
                          row.status,

                        score1:
                          row.score1,

                        score2:
                          row.score2,

                        winnerEntryId:
                          row.winner_entry_id,

                        courtId:
                          row.court_id,

                        startedAt:
                          row.started_at,

                        completedAt:
                          row.completed_at

                      };

                    }
                  )
                  .filter(Boolean);


              return {

                roundNumber,

                restEntryIndex:
                  detectRestEntry(
                    group,
                    matches
                  ),

                matches

              };

            }
          );


        return {

          groupName:
            group.name,

          dbGroupId:
            group.dbGroupId,

          rounds

        };

      }
    );


  saveSession();

  updateProtectionUI();

}


/* =====================================
   PROTECTION UI
===================================== */

function updateProtectionUI() {

  const notice =
    document.getElementById(
      "notice"
    );


  const regenerate =
    document.getElementById(
      "regenerateButton"
    );


  const confirmButton =
    document.getElementById(
      "confirmButton"
    );


  if (
    dbMatchesExist
  ) {

    regenerate.disabled =
      true;


    const hasProgress =
      existingDbStatuses.some(
        status =>
          [
            "playing",
            "completed",
            "walkover",
            "bye"
          ].includes(status)
      );


    notice.classList.add(
      "protected"
    );


    notice.innerHTML =
      hasProgress
        ? `
          <strong>DB 경기 보호 중.</strong>
          이미 진행 또는 완료된 예선 경기가 있습니다.
          이 화면에서는 기존 대진과 경기 결과를 삭제하거나 다시 생성하지 않습니다.
        `
        : `
          <strong>DB 대진 저장 완료.</strong>
          이미 조별 예선 경기가 생성되어 있으므로 기존 대진을 그대로 사용합니다.
          대진 재생성은 잠겨 있습니다.
        `;


    confirmButton.innerHTML =
      `경기 운영으로 이동 <span>→</span>`;

  } else {

    regenerate.disabled =
      false;


    notice.classList.remove(
      "protected"
    );


    notice.innerHTML =
      `
        홀수 인원 조에서는 매 라운드 한 명이 자동으로 휴식합니다.
        휴식은 실제 경기로 저장하지 않습니다.
      `;


    confirmButton.innerHTML =
      `대진 확정 · 경기 운영 <span>→</span>`;

  }

}


/* =====================================
   FLATTEN
===================================== */

function flattenMatches() {

  const result = [];


  groupMatches.forEach(
    group => {

      group.rounds.forEach(
        round => {

          round.matches.forEach(
            match => {

              result.push({

                group,

                round,

                match

              });

            }
          );

        }
      );

    }
  );


  return result;

}


/* =====================================
   MOVE LOCAL MATCH
===================================== */

function moveMatch(
  groupIndex,
  roundIndex,
  matchIndex,
  direction
) {

  if (
    busy
  ) {

    return;

  }


  /*
    DB가 생성된 뒤 순서를 이 페이지에서
    변경하는 것도 막는다.
  */

  if (
    dbMatchesExist
  ) {

    alert(
      "이미 DB에 저장된 예선 대진은 이 화면에서 순서를 변경할 수 없습니다."
    );

    return;

  }


  const matches =
    groupMatches[
      groupIndex
    ].rounds[
      roundIndex
    ].matches;


  const targetIndex =
    matchIndex +
    direction;


  if (
    targetIndex < 0 ||
    targetIndex >=
      matches.length
  ) {

    return;

  }


  [
    matches[matchIndex],
    matches[targetIndex]
  ] =
  [
    matches[targetIndex],
    matches[matchIndex]
  ];


  saveSession();

  render();

}


/* =====================================
   RENDER
===================================== */

function render() {

  const box =
    document.getElementById(
      "groups"
    );


  box.innerHTML = "";


  let totalMatches =
    0;


  groupMatches.forEach(
    (
      group,
      groupIndex
    ) => {

      const groupCard =
        document.createElement(
          "div"
        );


      groupCard.className =
        "group-card";


      const groupMatchCount =
        group.rounds.reduce(
          (
            sum,
            round
          ) =>
            sum +
            round.matches.length,
          0
        );


      totalMatches +=
        groupMatchCount;


      groupCard.innerHTML = `

        <div class="group-head">

          <div class="group-name">
            ${escapeHtml(
              group.groupName
            )}
          </div>

          <div class="group-meta">
            ${groupMatchCount}경기
          </div>

        </div>

        <div class="rounds"></div>

      `;


      const roundsBox =
        groupCard.querySelector(
          ".rounds"
        );


      group.rounds.forEach(
        (
          round,
          roundIndex
        ) => {

          const block =
            document.createElement(
              "div"
            );


          block.className =
            "round-block";


          let restText =
            "";


          if (
            round.restEntryIndex !==
            null &&
            round.restEntryIndex !==
            undefined
          ) {

            restText =
              `휴식: ${
                shortEntryName(
                  entries[
                    round.restEntryIndex
                  ]
                )
              }`;

          }


          block.innerHTML = `

            <div class="round-head">

              <div class="round-title">
                ROUND ${round.roundNumber}
              </div>

              <div class="round-rest">
                ${escapeHtml(
                  restText
                )}
              </div>

            </div>

            <div class="match-list"></div>

          `;


          const list =
            block.querySelector(
              ".match-list"
            );


          round.matches.forEach(
            (
              match,
              matchIndex
            ) => {

              const row =
                document.createElement(
                  "div"
                );


              row.className =
                "match-row";


              const status =
                match.status ||
                "waiting";


              let detail =
                dbMatchesExist
                  ? "DB 저장 경기"
                  : "확정 시 DB 저장";


              if (
                status ===
                "completed"
              ) {

                detail =
                  `결과 ${match.score1} - ${match.score2}`;

              }


              row.innerHTML = `

                <div class="match-number">
                  ${matchIndex + 1}
                </div>


                <div class="match-main">

                  <div class="match-players">

                    <div class="player">
                      ${escapeHtml(
                        shortEntryName(
                          entries[
                            match.entry1Index
                          ]
                        )
                      )}
                    </div>

                    <div class="vs">
                      VS
                    </div>

                    <div class="player right">
                      ${escapeHtml(
                        shortEntryName(
                          entries[
                            match.entry2Index
                          ]
                        )
                      )}
                    </div>

                  </div>


                  <div class="match-sub">

                    <span
                      class="status-badge ${escapeHtml(status)}"
                    >
                      ${escapeHtml(
                        statusText(status)
                      )}
                    </span>

                    <span>
                      ${escapeHtml(detail)}
                    </span>

                  </div>

                </div>


                <div class="order-actions">

                  <button
                    class="order-btn up"
                    type="button"
                    ${
                      dbMatchesExist ||
                      matchIndex === 0
                        ? "disabled"
                        : ""
                    }
                  >
                    ↑
                  </button>

                  <button
                    class="order-btn down"
                    type="button"
                    ${
                      dbMatchesExist ||
                      matchIndex ===
                        round.matches.length - 1
                        ? "disabled"
                        : ""
                    }
                  >
                    ↓
                  </button>

                </div>

              `;


              row
                .querySelector(
                  ".up"
                )
                .addEventListener(
                  "click",
                  function() {

                    moveMatch(
                      groupIndex,
                      roundIndex,
                      matchIndex,
                      -1
                    );

                  }
                );


              row
                .querySelector(
                  ".down"
                )
                .addEventListener(
                  "click",
                  function() {

                    moveMatch(
                      groupIndex,
                      roundIndex,
                      matchIndex,
                      1
                    );

                  }
                );


              list.appendChild(
                row
              );

            }
          );


          roundsBox.appendChild(
            block
          );

        }
      );


      box.appendChild(
        groupCard
      );

    }
  );


  document.getElementById(
    "groupCount"
  ).textContent =
    groupMatches.length;


  document.getElementById(
    "matchCount"
  ).textContent =
    totalMatches;


  updateProtectionUI();

}


/* =====================================
   VALIDATE LOCAL
===================================== */

function validateLocalMatches() {

  if (
    !Array.isArray(
      groupMatches
    ) ||
    groupMatches.length === 0
  ) {

    alert(
      "생성된 대진이 없습니다."
    );

    return false;

  }


  for (
    const group
    of groupMatches
  ) {

    if (
      !group.dbGroupId
    ) {

      alert(
        `${group.groupName}의 DB 조 정보가 없습니다.`
      );

      return false;

    }


    for (
      const round
      of group.rounds
    ) {

      for (
        const match
        of round.matches
      ) {

        const entry1 =
          entries[
            match.entry1Index
          ];


        const entry2 =
          entries[
            match.entry2Index
          ];


        if (
          !entry1?.dbEntryId ||
          !entry2?.dbEntryId
        ) {

          alert(
            "일부 참가자의 DB 연결정보가 없습니다."
          );

          return false;

        }

      }

    }

  }


  return true;

}


/* =====================================
   FIRST-TIME INSERT ONLY
===================================== */

async function insertMatchesFirstTime() {

  /*
    가장 중요한 안전 검사.
    INSERT 직전에 DB를 다시 확인한다.

    다른 탭/기기에서 이미 생성했어도
    중복 INSERT하지 않는다.
  */

  const {
    data:existing,
    error:checkError
  } =
    await supabaseClient
      .from("matches")
      .select(
        "id,status"
      )
      .eq(
        "division_id",
        tournament.divisionId
      )
      .eq(
        "stage",
        "group"
      )
      .limit(1);


  if (
    checkError
  ) {

    throw new Error(
      "기존 경기 확인 실패: "
      +
      checkError.message
    );

  }


  if (
    existing &&
    existing.length > 0
  ) {

    /*
      절대 DELETE하지 않는다.
    */

    dbMatchesExist =
      true;


    return {
      alreadyExists:true
    };

  }


  const rows = [];


  let globalSortOrder =
    1;


  groupMatches.forEach(
    group => {

      group.rounds.forEach(
        round => {

          round.matches.forEach(
            (
              match,
              matchIndex
            ) => {

              rows.push({

                division_id:
                  tournament.divisionId,

                group_id:
                  group.dbGroupId,

                court_id:null,

                stage:"group",

                round_number:
                  round.roundNumber,

                match_number:
                  matchIndex + 1,

                entry1_id:
                  entries[
                    match.entry1Index
                  ].dbEntryId,

                entry2_id:
                  entries[
                    match.entry2Index
                  ].dbEntryId,

                source1_match_id:null,

                source2_match_id:null,

                status:"waiting",

                score1:null,

                score2:null,

                winner_entry_id:null,

                started_at:null,

                completed_at:null,

                sort_order:
                  globalSortOrder++

              });

            }
          );

        }
      );

    }
  );


  if (
    rows.length === 0
  ) {

    throw new Error(
      "저장할 경기가 없습니다."
    );

  }


  const {
    data:savedMatches,
    error:insertError
  } =
    await supabaseClient
      .from("matches")
      .insert(rows)
      .select(
        "id,group_id,round_number,match_number,entry1_id,entry2_id,status,sort_order"
      );


  if (
    insertError
  ) {

    throw new Error(
      "조별 대진 저장 실패: "
      +
      insertError.message
    );

  }


  if (
    !savedMatches ||
    savedMatches.length !==
      rows.length
  ) {

    throw new Error(
      "저장된 경기 수가 맞지 않습니다."
    );

  }


  /*
    UUID를 현재 브라우저 데이터에도 연결.
  */

  const key =
    (
      groupId,
      round,
      entry1,
      entry2
    ) =>
      [
        groupId,
        round,
        entry1,
        entry2
      ].join("|");


  const map =
    new Map();


  savedMatches.forEach(
    row => {

      map.set(
        key(
          row.group_id,
          Number(
            row.round_number
          ),
          row.entry1_id,
          row.entry2_id
        ),
        row.id
      );

    }
  );


  groupMatches.forEach(
    group => {

      group.rounds.forEach(
        round => {

          round.matches.forEach(
            match => {

              match.dbMatchId =
                map.get(
                  key(
                    group.dbGroupId,
                    round.roundNumber,
                    entries[
                      match.entry1Index
                    ].dbEntryId,
                    entries[
                      match.entry2Index
                    ].dbEntryId
                  )
                ) ||
                null;


              match.status =
                "waiting";

            }
          );

        }
      );

    }
  );


  dbMatchesExist =
    true;


  existingDbStatuses =
    savedMatches.map(
      row =>
        row.status
    );


  saveSession();


  return {
    alreadyExists:false
  };

}


/* =====================================
   CONFIRM
===================================== */

async function confirmMatches() {

  if (
    busy
  ) {

    return;

  }


  /*
    이미 DB 경기가 있다면
    아무것도 쓰지 않고 바로 이동.
  */

  if (
    dbMatchesExist
  ) {

    saveSession();


    location.href =
      "./match-control.html";


    return;

  }


  if (
    !validateLocalMatches()
  ) {

    return;

  }


  if (
    !confirm(
      "현재 조별 예선 대진을 확정하고 경기 운영 화면으로 이동할까요?"
    )
  ) {

    return;

  }


  try {

    setBusy(
      true,
      "조별 대진을 저장하고 있습니다",
      "최초 예선 경기 정보를 FWT 데이터베이스에 생성하고 있습니다."
    );


    const result =
      await insertMatchesFirstTime();


    /*
      만약 다른 곳에서 이미 생성돼 있었다면
      다시 불러오기만 한다.
    */

    if (
      result.alreadyExists
    ) {

      await loadExistingMatches();

    }


    /*
      여기서는 예선 결과를 삭제하지 않는다.
      본선 관련 session만 제거.
    */

    sessionStorage.removeItem(
      "fwtKnockoutQualifiers"
    );

    sessionStorage.removeItem(
      "fwtKnockoutBracket"
    );


    location.href =
      "./match-control.html";


  } catch(error) {

    console.error(error);


    setBusy(false);


    alert(
      "조별 대진을 저장하지 못했습니다.\n\n"
      +
      (
        error?.message ||
        "알 수 없는 오류가 발생했습니다."
      )
    );

  }

}


/* =====================================
   REGENERATE
===================================== */

function regenerate() {

  if (
    busy
  ) {

    return;

  }


  /*
    DB에 경기 하나라도 있으면
    무조건 차단.
  */

  if (
    dbMatchesExist
  ) {

    alert(
      "이미 DB에 조별 예선 경기가 저장되어 있어 대진을 다시 생성할 수 없습니다.\n\n경기 결과 보호를 위해 기존 대진은 유지됩니다."
    );

    return;

  }


  if (
    !confirm(
      "아직 DB에 저장되지 않은 현재 대진을 다시 자동 생성할까요?"
    )
  ) {

    return;

  }


  generateLocalMatches();

}


/* =====================================
   EVENTS
===================================== */

document.getElementById(
  "regenerateButton"
).addEventListener(
  "click",
  regenerate
);


document.getElementById(
  "confirmButton"
).addEventListener(
  "click",
  confirmMatches
);


/* =====================================
   START
===================================== */

async function start() {

  const loggedIn =
    await checkLogin();


  if (
    !loggedIn
  ) {

    return;

  }


  try {

    setBusy(
      true,
      "조별 대진을 확인하고 있습니다",
      "Supabase에 기존 경기와 결과가 있는지 확인 중입니다."
    );


    await loadExistingMatches();


    setBusy(false);


    render();


  } catch(error) {

    console.error(error);


    setBusy(false);


    alert(
      "조별 대진을 불러오지 못했습니다.\n\n"
      +
      (
        error?.message ||
        "알 수 없는 오류"
      )
    );

  }

}


start();
