<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>조별 예선 대진 | FWT Tournament</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --navy:#071a31;
      --navy2:#0c294a;
      --blue:#184a79;
      --lime:#c9df45;

      --bg:#f4f6f9;
      --white:#ffffff;
      --text:#172033;
      --muted:#617083;
      --line:#dfe5eb;

      --green:#178b61;
      --green-soft:#edf8f3;

      --orange:#99631c;
      --orange-soft:#fff7eb;

      --red:#c64b4b;
      --red-soft:#fff2f2;

      --shadow:
        0 12px 35px rgba(20,35,55,.06);
    }

    * {
      box-sizing:border-box;
    }

    html,
    body {
      margin:0;
      min-height:100%;

      background:var(--bg);
      color:var(--text);

      font-family:
        Inter,
        Pretendard,
        "Noto Sans KR",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button {
      font:inherit;
      cursor:pointer;
    }

    /* =====================================
       HEADER
    ===================================== */

    .topbar {
      min-height:72px;

      padding:0 20px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      color:white;

      background:
        linear-gradient(
          110deg,
          #06172b,
          #0a2848 62%,
          #103b67
        );

      box-shadow:
        0 5px 20px rgba(6,23,43,.16);
    }

    .fwt-logo {
      color:white;

      font-size:31px;
      line-height:1;

      font-weight:950;
      font-style:italic;

      letter-spacing:-4px;

      transform:skew(-5deg);
    }

    .fwt-logo span {
      color:var(--lime);
    }

    .back-btn {
      min-height:44px;

      padding:0 14px;

      border:
        1px solid rgba(255,255,255,.15);

      border-radius:11px;

      background:
        rgba(255,255,255,.08);

      color:white;

      font-size:12px;
      font-weight:850;
    }

    /* =====================================
       PAGE
    ===================================== */

    .container {
      width:
        min(
          1120px,
          calc(100% - 34px)
        );

      margin:0 auto;

      padding:34px 0 60px;
    }

    .head {
      display:flex;
      align-items:flex-end;
      justify-content:space-between;

      gap:20px;

      margin-bottom:18px;
    }

    .kicker {
      margin-bottom:7px;

      color:var(--blue);

      font-size:11px;
      font-weight:950;

      letter-spacing:2px;
    }

    h1 {
      margin:0;

      color:var(--navy);

      font-size:34px;
      font-weight:950;

      letter-spacing:-1.5px;
    }

    .desc {
      margin:8px 0 0;

      color:var(--muted);

      font-size:13px;
      line-height:1.65;
    }

    .summary {
      display:flex;
      flex-wrap:wrap;

      gap:7px;
    }

    .summary-chip {
      padding:9px 12px;

      border:1px solid var(--line);
      border-radius:999px;

      background:white;
      color:#526073;

      font-size:11px;
      font-weight:850;
    }

    .summary-chip strong {
      margin-left:4px;

      color:var(--navy);

      font-size:15px;
      font-weight:950;
    }

    /* =====================================
       NOTICE
    ===================================== */

    .notice {
      margin-bottom:14px;

      padding:14px 15px;

      border:1px solid #dce8df;
      border-radius:13px;

      background:var(--green-soft);

      color:#396451;

      font-size:12px;
      font-weight:750;

      line-height:1.65;
    }

    /* =====================================
       GROUP CARDS
    ===================================== */

    .groups {
      display:flex;
      flex-direction:column;

      gap:13px;
    }

    .group-card {
      overflow:hidden;

      border:1px solid var(--line);
      border-radius:17px;

      background:white;

      box-shadow:var(--shadow);
    }

    .group-head {
      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:10px;

      padding:16px 18px;

      border-bottom:1px solid #e7ebef;

      background:#fafbfc;
    }

    .group-name {
      color:var(--navy);

      font-size:18px;
      font-weight:950;
    }

    .group-meta {
      color:#687587;

      font-size:11px;
      font-weight:800;
    }

    .rounds {
      padding:10px;
    }

    .round-block {
      margin-bottom:10px;

      overflow:hidden;

      border:1px solid #e5e9ed;
      border-radius:12px;

      background:#fff;
    }

    .round-block:last-child {
      margin-bottom:0;
    }

    .round-head {
      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:10px 12px;

      background:#f7f9fb;

      border-bottom:1px solid #e7ebef;
    }

    .round-title {
      color:var(--navy);

      font-size:13px;
      font-weight:900;
    }

    .round-rest {
      color:#7a8492;

      font-size:10px;
      font-weight:750;
    }

    .match-list {
      padding:8px;
    }

    .match-row {
      display:grid;

      grid-template-columns:
        42px minmax(0,1fr) auto;

      align-items:center;

      gap:10px;

      min-height:63px;

      padding:8px 9px;

      margin-bottom:6px;

      border:1px solid #e5e9ed;
      border-radius:10px;

      background:white;
    }

    .match-row:last-child {
      margin-bottom:0;
    }

    .match-number {
      width:37px;
      height:37px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:9px;

      background:#eef2f6;

      color:var(--navy);

      font-size:12px;
      font-weight:950;
    }

    .match-main {
      min-width:0;
    }

    .match-players {
      display:grid;

      grid-template-columns:
        minmax(0,1fr) auto minmax(0,1fr);

      align-items:center;

      gap:7px;
    }

    .player {
      overflow:hidden;

      color:#28364a;

      font-size:13px;
      font-weight:900;

      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .player.right {
      text-align:right;
    }

    .vs {
      color:#8a95a3;

      font-size:10px;
      font-weight:900;
    }

    .match-sub {
      margin-top:4px;

      color:#718092;

      font-size:10px;
      font-weight:700;
    }

    .order-actions {
      display:flex;

      gap:5px;
    }

    .order-btn {
      width:34px;
      height:34px;

      display:flex;
      align-items:center;
      justify-content:center;

      border:1px solid #d9e0e6;
      border-radius:8px;

      background:white;
      color:#526073;

      font-size:13px;
      font-weight:950;
    }

    .order-btn:disabled {
      opacity:.35;
      cursor:not-allowed;
    }

    /* =====================================
       BUTTONS
    ===================================== */

    .bottom {
      display:flex;

      gap:10px;

      margin-top:18px;
    }

    .previous,
    .regenerate,
    .next {
      height:56px;
      min-height:56px;

      border-radius:11px;

      font-weight:900;
    }

    .previous {
      width:170px;

      border:1px solid #d8dee5;

      background:white;
      color:#526073;
    }

    .regenerate {
      width:190px;

      border:1px solid #d8dee5;

      background:white;
      color:#526073;
    }

    .next {
      flex:1;

      border:0;

      background:
        linear-gradient(
          115deg,
          var(--navy),
          #123e6c
        );

      color:white;

      font-size:14px;
    }

    .next span {
      margin-left:5px;

      color:var(--lime);
    }

    button:disabled {
      cursor:not-allowed;
      opacity:.55;
    }

    /* =====================================
       LOADING
    ===================================== */

    .loading-overlay {
      display:none;

      position:fixed;
      inset:0;

      z-index:300;

      align-items:center;
      justify-content:center;

      padding:20px;

      background:
        rgba(4,17,31,.62);
    }

    .loading-overlay.show {
      display:flex;
    }

    .loading-box {
      width:min(350px,100%);

      padding:25px;

      border-radius:17px;

      background:white;

      text-align:center;

      box-shadow:
        0 30px 80px rgba(0,0,0,.25);
    }

    .spinner {
      width:38px;
      height:38px;

      margin:0 auto 15px;

      border:4px solid #e6eaee;
      border-top-color:var(--navy);

      border-radius:50%;

      animation:spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform:rotate(360deg);
      }
    }

    .loading-title {
      color:var(--navy);

      font-size:16px;
      font-weight:900;
    }

    .loading-text {
      margin-top:6px;

      color:#657184;

      font-size:12px;
      line-height:1.6;
    }

    /* =====================================
       FOOTER
    ===================================== */

    .footer {
      display:flex;
      justify-content:space-between;

      margin-top:27px;
      padding-top:17px;

      border-top:1px solid #e2e6eb;

      color:#7c8795;

      font-size:10px;
      letter-spacing:1px;
    }

    .footer strong {
      color:var(--navy);
    }

    .q {
      color:#91a719;
      font-weight:900;
    }

    /* =====================================
       MOBILE
    ===================================== */

    @media(max-width:700px) {

      .topbar {
        min-height:72px;

        padding:0 14px;
      }

      .fwt-logo {
        font-size:30px;
      }

      .back-btn {
        min-height:46px;

        flex:none;

        font-size:12px;
      }

      .container {
        width:
          calc(100% - 22px);

        padding:
          25px 0 50px;
      }

      .head {
        display:block;
      }

      .summary {
        margin-top:13px;
      }

      h1 {
        font-size:31px;
      }

      .desc {
        font-size:14px;
      }

      .notice {
        font-size:13px;
      }

      .summary-chip {
        font-size:12px;
      }

      .group-head {
        padding:14px;
      }

      .group-name {
        font-size:18px;
      }

      .group-meta {
        font-size:12px;
      }

      .round-head {
        padding:11px;
      }

      .round-title {
        font-size:14px;
      }

      .round-rest {
        font-size:11px;
      }

      .match-row {
        grid-template-columns:
          40px minmax(0,1fr);

        gap:8px;

        min-height:85px;

        padding:9px;
      }

      .match-number {
        width:38px;
        height:38px;

        font-size:13px;
      }

      .match-players {
        gap:5px;
      }

      .player {
        font-size:14px;
      }

      .match-sub {
        font-size:11px;
      }

      .order-actions {
        grid-column:1 / -1;

        display:grid;

        grid-template-columns:
          1fr 1fr;

        gap:7px;
      }

      .order-btn {
        width:100%;

        height:44px;
        min-height:44px;

        font-size:14px;
      }

      .bottom {
        flex-direction:column-reverse;

        gap:9px;
      }

      .previous,
      .regenerate,
      .next {
        width:100%;

        height:56px;
        min-height:56px;

        flex:none;

        font-size:15px;
      }

    }
  </style>
</head>

<script>

const SUPABASE_URL =
  "https://opwuyqerisocqobbbisg.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_Eo_zfONeGLs9ATCVg2Fk_g_y_IAJFV-";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const tournament =
  JSON.parse(
    sessionStorage.getItem(
      "fwtNewTournament"
    ) || "null"
  );


const entries =
  JSON.parse(
    sessionStorage.getItem(
      "fwtNewTournamentEntries"
    ) || "null"
  );


const groupData =
  JSON.parse(
    sessionStorage.getItem(
      "fwtGroupData"
    ) || "null"
  );


if (
  !tournament ||
  !tournament.divisionId ||
  !Array.isArray(entries) ||
  !Array.isArray(groupData) ||
  groupData.length === 0
) {

  alert(
    "대회 또는 조편성 정보가 없습니다."
  );

  location.href =
    "./dashboard.html";

}


let busy = false;


/*
  최종 형태

  groupMatches = [
    {
      groupName:"A조",
      dbGroupId:"uuid",
      rounds:[
        {
          roundNumber:1,
          restEntryIndex:null,
          matches:[
            {
              entry1Index:0,
              entry2Index:2,
              dbMatchId:null
            }
          ]
        }
      ]
    }
  ]
*/

let groupMatches = [];


/* =====================================
   HELPERS
===================================== */

function escapeHtml(value) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value ?? "";

  return div.innerHTML;

}


function shortEntryName(entry) {

  if (!entry) {

    return "알 수 없음";

  }


  if (
    entry.type ===
    "singles"
  ) {

    return (
      entry.nickname ||
      entry.name ||
      "이름 없음"
    );

  }


  const p1 =
    entry.player1?.nickname ||
    entry.player1?.name ||
    "선수1";


  const p2 =
    entry.player2?.nickname ||
    entry.player2?.name ||
    "선수2";


  return `${p1}/${p2}`;

}


/* =====================================
   AUTH
===================================== */

async function checkLogin() {

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getSession();


  if (
    error ||
    !data.session
  ) {

    location.href =
      "./";

    return false;

  }


  return true;

}


/* =====================================
   BUSY
===================================== */

function setBusy(
  state,
  title = "",
  text = ""
) {

  busy = state;


  [
    "previousButton",
    "regenerateButton",
    "confirmButton"
  ]
    .forEach(
      id => {

        const button =
          document.getElementById(
            id
          );


        if (button) {

          button.disabled =
            state;

        }

      }
    );


  document.getElementById(
    "loadingOverlay"
  ).classList.toggle(
    "show",
    state
  );


  if (title) {

    document.getElementById(
      "loadingTitle"
    ).textContent =
      title;

  }


  if (text) {

    document.getElementById(
      "loadingText"
    ).textContent =
      text;

  }

}


/* =====================================
   ROUND ROBIN
===================================== */

function createRoundRobin(
  memberIndexes
) {

  const list =
    [...memberIndexes];


  /*
    홀수 인원이면 null을 추가해서
    circle method 적용.
    null과 매칭되는 참가자는 해당 라운드 휴식.
  */

  if (
    list.length % 2 === 1
  ) {

    list.push(null);

  }


  const n =
    list.length;


  if (
    n < 2
  ) {

    return [];

  }


  let rotating =
    [...list];


  const rounds = [];


  for (
    let roundIndex = 0;
    roundIndex < n - 1;
    roundIndex++
  ) {

    const matches = [];

    let restEntryIndex =
      null;


    for (
      let i = 0;
      i < n / 2;
      i++
    ) {

      const a =
        rotating[i];


      const b =
        rotating[
          n - 1 - i
        ];


      if (
        a === null &&
        b !== null
      ) {

        restEntryIndex =
          b;

        continue;

      }


      if (
        b === null &&
        a !== null
      ) {

        restEntryIndex =
          a;

        continue;

      }


      if (
        a === null ||
        b === null
      ) {

        continue;

      }


      matches.push({

        entry1Index:a,

        entry2Index:b,

        dbMatchId:null

      });

    }


    rounds.push({

      roundNumber:
        roundIndex + 1,

      restEntryIndex:
        restEntryIndex,

      matches:
        matches

    });


    /*
      첫 번째 고정,
      나머지를 시계방향 회전
    */

    const fixed =
      rotating[0];


    const rest =
      rotating.slice(1);


    rest.unshift(
      rest.pop()
    );


    rotating =
      [
        fixed,
        ...rest
      ];

  }


  return rounds;

}


/* =====================================
   GENERATE ALL
===================================== */

function generateAllMatches() {

  groupMatches =
    groupData.map(
      group => {

        return {

          groupName:
            group.name,

          dbGroupId:
            group.dbGroupId,

          rounds:
            createRoundRobin(
              group.members || []
            )

        };

      }
    );


  saveSession();

  render();

}


/* =====================================
   SESSION
===================================== */

function saveSession() {

  sessionStorage.setItem(
    "fwtGroupMatches",
    JSON.stringify(
      groupMatches
    )
  );

}


/* =====================================
   LOAD EXISTING DB MATCHES
===================================== */

async function loadExistingMatches() {

  const {
    data:matchRows,
    error
  } =
    await supabaseClient
      .from("matches")
      .select(
        "id,group_id,entry1_id,entry2_id,round_number,match_number,sort_order,status"
      )
      .eq(
        "division_id",
        tournament.divisionId
      )
      .eq(
        "stage",
        "group"
      )
      .order(
        "sort_order",
        {
          ascending:true
        }
      );


  if (error) {

    throw new Error(
      "기존 대진 조회 실패: "
      +
      error.message
    );

  }


  if (
    !matchRows ||
    matchRows.length === 0
  ) {

    /*
      DB에 없다면 sessionStorage 대진이 있으면 복원
    */

    const saved =
      JSON.parse(
        sessionStorage.getItem(
          "fwtGroupMatches"
        ) || "null"
      );


    if (
      Array.isArray(saved) &&
      saved.length ===
        groupData.length
    ) {

      groupMatches =
        saved;

      return;

    }


    generateAllMatches();

    return;

  }


  /*
    entry uuid → index
  */

  const entryIndexMap =
    new Map();


  entries.forEach(
    (
      entry,
      index
    ) => {

      if (
        entry.dbEntryId
      ) {

        entryIndexMap.set(
          entry.dbEntryId,
          index
        );

      }

    }
  );


  /*
    group uuid → groupData
  */

  const groupById =
    new Map();


  groupData.forEach(
    group => {

      if (
        group.dbGroupId
      ) {

        groupById.set(
          group.dbGroupId,
          group
        );

      }

    }
  );


  const result = [];


  groupData.forEach(
    group => {

      const rows =
        matchRows
          .filter(
            row =>
              row.group_id ===
              group.dbGroupId
          )
          .sort(
            (a,b) => {

              const ra =
                Number(
                  a.round_number || 0
                );


              const rb =
                Number(
                  b.round_number || 0
                );


              if (
                ra !== rb
              ) {

                return ra - rb;

              }


              return (
                Number(
                  a.sort_order || 0
                )
                -
                Number(
                  b.sort_order || 0
                )
              );

            }
          );


      const roundMap =
        new Map();


      rows.forEach(
        row => {

          const roundNumber =
            Number(
              row.round_number || 1
            );


          if (
            !roundMap.has(
              roundNumber
            )
          ) {

            roundMap.set(
              roundNumber,
              {
                roundNumber,
                restEntryIndex:null,
                matches:[]
              }
            );

          }


          const entry1Index =
            entryIndexMap.get(
              row.entry1_id
            );


          const entry2Index =
            entryIndexMap.get(
              row.entry2_id
            );


          if (
            entry1Index === undefined ||
            entry2Index === undefined
          ) {

            return;

          }


          roundMap
            .get(
              roundNumber
            )
            .matches
            .push({

              entry1Index,

              entry2Index,

              dbMatchId:
                row.id

            });

        }
      );


      /*
        DB에는 실제 경기만 있으므로
        휴식자 정보는 새로 계산한 round robin에서 보완
      */

      const generated =
        createRoundRobin(
          group.members || []
        );


      const rounds =
        generated.map(
          generatedRound => {

            const loaded =
              roundMap.get(
                generatedRound.roundNumber
              );


            if (!loaded) {

              return generatedRound;

            }


            return {

              roundNumber:
                generatedRound.roundNumber,

              restEntryIndex:
                generatedRound.restEntryIndex,

              matches:
                loaded.matches

            };

          }
        );


      result.push({

        groupName:
          group.name,

        dbGroupId:
          group.dbGroupId,

        rounds

      });

    }
  );


  groupMatches =
    result;


  saveSession();

}


/* =====================================
   FLATTEN MATCHES
===================================== */

function flattenMatches() {

  const result = [];


  groupMatches.forEach(
    group => {

      group.rounds.forEach(
        round => {

          round.matches.forEach(
            match => {

              result.push({

                groupName:
                  group.groupName,

                dbGroupId:
                  group.dbGroupId,

                roundNumber:
                  round.roundNumber,

                entry1Index:
                  match.entry1Index,

                entry2Index:
                  match.entry2Index,

                dbMatchId:
                  match.dbMatchId || null

              });

            }
          );

        }
      );

    }
  );


  return result;

}


/* =====================================
   MOVE MATCH
===================================== */

function moveMatch(
  groupIndex,
  roundIndex,
  matchIndex,
  direction
) {

  if (busy) {

    return;

  }


  const matches =
    groupMatches[
      groupIndex
    ].rounds[
      roundIndex
    ].matches;


  const targetIndex =
    matchIndex +
    direction;


  if (
    targetIndex < 0 ||
    targetIndex >=
      matches.length
  ) {

    return;

  }


  [
    matches[matchIndex],
    matches[targetIndex]
  ] =
  [
    matches[targetIndex],
    matches[matchIndex]
  ];


  saveSession();

  render();

}


/* =====================================
   RENDER
===================================== */

function render() {

  const box =
    document.getElementById(
      "groups"
    );


  box.innerHTML = "";


  let totalMatches = 0;


  groupMatches.forEach(
    (
      group,
      groupIndex
    ) => {

      const groupCard =
        document.createElement(
          "div"
        );


      groupCard.className =
        "group-card";


      const groupMatchCount =
        group.rounds.reduce(
          (
            sum,
            round
          ) =>
            sum +
            round.matches.length,
          0
        );


      totalMatches +=
        groupMatchCount;


      groupCard.innerHTML = `

        <div class="group-head">

          <div class="group-name">
            ${escapeHtml(
              group.groupName
            )}
          </div>

          <div class="group-meta">
            ${groupMatchCount}경기
          </div>

        </div>

        <div class="rounds"></div>

      `;


      const roundsBox =
        groupCard.querySelector(
          ".rounds"
        );


      group.rounds.forEach(
        (
          round,
          roundIndex
        ) => {

          const block =
            document.createElement(
              "div"
            );


          block.className =
            "round-block";


          let restText =
            "";


          if (
            round.restEntryIndex !==
            null &&
            round.restEntryIndex !==
            undefined
          ) {

            restText =
              `휴식: ${
                shortEntryName(
                  entries[
                    round.restEntryIndex
                  ]
                )
              }`;

          }


          block.innerHTML = `

            <div class="round-head">

              <div class="round-title">
                ROUND ${round.roundNumber}
              </div>

              <div class="round-rest">
                ${escapeHtml(
                  restText
                )}
              </div>

            </div>

            <div class="match-list"></div>

          `;


          const list =
            block.querySelector(
              ".match-list"
            );


          round.matches.forEach(
            (
              match,
              matchIndex
            ) => {

              const row =
                document.createElement(
                  "div"
                );


              row.className =
                "match-row";


              row.innerHTML = `

                <div class="match-number">
                  ${matchIndex + 1}
                </div>


                <div class="match-main">

                  <div class="match-players">

                    <div class="player">
                      ${escapeHtml(
                        shortEntryName(
                          entries[
                            match.entry1Index
                          ]
                        )
                      )}
                    </div>

                    <div class="vs">
                      VS
                    </div>

                    <div class="player right">
                      ${escapeHtml(
                        shortEntryName(
                          entries[
                            match.entry2Index
                          ]
                        )
                      )}
                    </div>

                  </div>


                  <div class="match-sub">

                    ${
                      match.dbMatchId
                        ? "DB 저장된 경기"
                        : "대진 확정 시 DB 저장"
                    }

                  </div>

                </div>


                <div class="order-actions">

                  <button
                    class="order-btn up"
                    type="button"
                    ${
                      matchIndex === 0
                        ? "disabled"
                        : ""
                    }
                  >
                    ↑
                  </button>

                  <button
                    class="order-btn down"
                    type="button"
                    ${
                      matchIndex ===
                      round.matches.length - 1
                        ? "disabled"
                        : ""
                    }
                  >
                    ↓
                  </button>

                </div>

              `;


              row
                .querySelector(
                  ".up"
                )
                .addEventListener(
                  "click",
                  function() {

                    moveMatch(
                      groupIndex,
                      roundIndex,
                      matchIndex,
                      -1
                    );

                  }
                );


              row
                .querySelector(
                  ".down"
                )
                .addEventListener(
                  "click",
                  function() {

                    moveMatch(
                      groupIndex,
                      roundIndex,
                      matchIndex,
                      1
                    );

                  }
                );


              list.appendChild(
                row
              );

            }
          );


          roundsBox.appendChild(
            block
          );

        }
      );


      box.appendChild(
        groupCard
      );

    }
  );


  document.getElementById(
    "groupCount"
  ).textContent =
    groupMatches.length;


  document.getElementById(
    "matchCount"
  ).textContent =
    totalMatches;

}


/* =====================================
   VALIDATE
===================================== */

function validateMatches() {

  if (
    !Array.isArray(
      groupMatches
    ) ||
    groupMatches.length === 0
  ) {

    alert(
      "생성된 대진이 없습니다."
    );

    return false;

  }


  for (
    const group
    of groupMatches
  ) {

    if (
      !group.dbGroupId
    ) {

      alert(
        `${group.groupName}의 DB 조 정보가 없습니다.`
      );

      return false;

    }


    for (
      const round
      of group.rounds
    ) {

      for (
        const match
        of round.matches
      ) {

        const entry1 =
          entries[
            match.entry1Index
          ];


        const entry2 =
          entries[
            match.entry2Index
          ];


        if (
          !entry1?.dbEntryId ||
          !entry2?.dbEntryId
        ) {

          alert(
            "일부 참가자의 DB 연결정보가 없습니다."
          );

          return false;

        }

      }

    }

  }


  return true;

}


/* =====================================
   SAVE MATCHES TO DB
===================================== */

async function saveMatchesToDatabase() {

  /*
    현재 division의 조별예선 경기만 삭제.
    이후 토너먼트 경기까지 만들어진 상태에서
    조별대진을 다시 생성하는 문제는
    추후 경기운영 DB화 단계에서 잠금 처리할 예정.
  */

  const {
    error:deleteError
  } =
    await supabaseClient
      .from("matches")
      .delete()
      .eq(
        "division_id",
        tournament.divisionId
      )
      .eq(
        "stage",
        "group"
      );


  if (
    deleteError
  ) {

    throw new Error(
      "기존 조별 대진 삭제 실패: "
      +
      deleteError.message
    );

  }


  const rows = [];


  let globalSortOrder =
    0;


  groupMatches.forEach(
    group => {

      group.rounds.forEach(
        round => {

          round.matches.forEach(
            (
              match,
              matchIndex
            ) => {

              rows.push({

                division_id:
                  tournament.divisionId,

                group_id:
                  group.dbGroupId,

                court_id:
                  null,

                stage:
                  "group",

                round_number:
                  round.roundNumber,

                match_number:
                  matchIndex + 1,

                entry1_id:
                  entries[
                    match.entry1Index
                  ].dbEntryId,

                entry2_id:
                  entries[
                    match.entry2Index
                  ].dbEntryId,

                source1_match_id:
                  null,

                source2_match_id:
                  null,

                status:
                  "waiting",

                score1:
                  null,

                score2:
                  null,

                winner_entry_id:
                  null,

                sort_order:
                  globalSortOrder++

              });

            }
          );

        }
      );

    }
  );


  if (
    rows.length === 0
  ) {

    throw new Error(
      "저장할 경기가 없습니다."
    );

  }


  const {
    data:savedMatches,
    error:insertError
  } =
    await supabaseClient
      .from("matches")
      .insert(
        rows
      )
      .select(
        "id,group_id,round_number,match_number,entry1_id,entry2_id,sort_order,status"
      );


  if (
    insertError ||
    !savedMatches ||
    savedMatches.length !==
      rows.length
  ) {

    throw new Error(
      "조별 대진 저장 실패: "
      +
      (
        insertError?.message ||
        "저장된 경기 수가 맞지 않습니다."
      )
    );

  }


  /*
    저장된 DB id를 다시 groupMatches에 매칭
  */

  const entryPairKey =
    (
      groupId,
      roundNumber,
      entry1Id,
      entry2Id
    ) =>
      [
        groupId,
        roundNumber,
        entry1Id,
        entry2Id
      ].join("|");


  const savedMap =
    new Map();


  savedMatches.forEach(
    row => {

      const key =
        entryPairKey(
          row.group_id,
          Number(
            row.round_number
          ),
          row.entry1_id,
          row.entry2_id
        );


      savedMap.set(
        key,
        row.id
      );

    }
  );


  groupMatches.forEach(
    group => {

      group.rounds.forEach(
        round => {

          round.matches.forEach(
            match => {

              const entry1Id =
                entries[
                  match.entry1Index
                ].dbEntryId;


              const entry2Id =
                entries[
                  match.entry2Index
                ].dbEntryId;


              const key =
                entryPairKey(
                  group.dbGroupId,
                  round.roundNumber,
                  entry1Id,
                  entry2Id
                );


              match.dbMatchId =
                savedMap.get(
                  key
                ) || null;

            }
          );

        }
      );

    }
  );


  saveSession();

}


/* =====================================
   CONFIRM
===================================== */

async function confirmMatches() {

  if (busy) {

    return;

  }


  if (
    !validateMatches()
  ) {

    return;

  }


  if (
    !confirm(
      "현재 조별 예선 대진을 확정하고 경기 운영 화면으로 이동할까요?"
    )
  ) {

    return;

  }


  try {

    setBusy(
      true,
      "조별 대진을 저장하고 있습니다",
      "각 조의 경기 정보를 FWT 데이터베이스에 생성하고 있습니다."
    );


    await saveMatchesToDatabase();


    /*
      기존 경기운영 임시상태 초기화
    */

    sessionStorage.removeItem(
      "fwtMatchControlState"
    );

    sessionStorage.removeItem(
      "fwtStandingsData"
    );

    sessionStorage.removeItem(
      "fwtKnockoutQualifiers"
    );

    sessionStorage.removeItem(
      "fwtKnockoutBracket"
    );


    location.href =
      "./match-control.html";


  } catch(error) {

    console.error(error);


    setBusy(false);


    alert(
      "조별 대진을 저장하지 못했습니다.\n\n"
      +
      (
        error?.message ||
        "알 수 없는 오류가 발생했습니다."
      )
    );

  }

}


/* =====================================
   REGENERATE
===================================== */

function regenerate() {

  if (busy) {

    return;

  }


  if (
    !confirm(
      "현재 대진 순서를 모두 지우고 조별 대진을 다시 자동 생성할까요?\n\nDB에 저장된 경기정보는 '대진 확정'을 누르기 전까지 바뀌지 않습니다."
    )
  ) {

    return;

  }


  generateAllMatches();

}


/* =====================================
   EVENTS
===================================== */

document.getElementById(
  "regenerateButton"
).addEventListener(
  "click",
  regenerate
);


document.getElementById(
  "confirmButton"
).addEventListener(
  "click",
  confirmMatches
);


/* =====================================
   START
===================================== */

async function start() {

  const loggedIn =
    await checkLogin();


  if (!loggedIn) {

    return;

  }


  try {

    setBusy(
      true,
      "조별 대진을 확인하고 있습니다",
      "기존에 저장된 경기 대진이 있는지 확인 중입니다."
    );


    await loadExistingMatches();


    setBusy(false);


    render();


  } catch(error) {

    console.error(error);


    setBusy(false);


    alert(
      "조별 대진을 불러오지 못했습니다.\n\n"
      +
      (
        error?.message ||
        "알 수 없는 오류"
      )
    );


    generateAllMatches();

  }

}


start();

</script>
