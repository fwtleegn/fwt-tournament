<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>조별 순위 | FWT Tournament</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --navy:#071a31;
      --navy2:#0c294a;
      --blue:#184a79;
      --lime:#c9df45;

      --bg:#f4f6f9;
      --white:#ffffff;
      --text:#172033;
      --muted:#667386;
      --line:#dfe5eb;

      --green:#178b61;
      --green-soft:#edf8f3;

      --orange:#99631c;
      --orange-soft:#fff7eb;

      --red:#c64b4b;
      --red-soft:#fff2f2;

      --shadow:
        0 12px 35px rgba(20,35,55,.06);
    }

    * {
      box-sizing:border-box;
    }

    html,
    body {
      margin:0;
      min-height:100%;

      background:var(--bg);
      color:var(--text);

      font-family:
        Inter,
        Pretendard,
        "Noto Sans KR",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button {
      font:inherit;
      cursor:pointer;
    }

    .topbar {
      min-height:72px;

      padding:0 20px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      background:
        linear-gradient(
          110deg,
          #06172b,
          #0a2848 62%,
          #103b67
        );

      box-shadow:
        0 5px 20px rgba(6,23,43,.16);
    }

    .fwt-logo {
      color:white;

      font-size:31px;
      line-height:1;

      font-weight:950;
      font-style:italic;
      letter-spacing:-4px;

      transform:skew(-5deg);
    }

    .fwt-logo span {
      color:var(--lime);
    }

    .top-actions {
      display:flex;
      gap:7px;
    }

    .header-btn {
      min-height:44px;

      padding:0 14px;

      border:
        1px solid rgba(255,255,255,.15);

      border-radius:10px;

      background:
        rgba(255,255,255,.08);

      color:white;

      font-size:12px;
      font-weight:850;
    }

    .container {
      width:
        min(
          1120px,
          calc(100% - 34px)
        );

      margin:0 auto;

      padding:32px 0 60px;
    }

    .head {
      display:flex;
      align-items:flex-end;
      justify-content:space-between;

      gap:20px;

      margin-bottom:18px;
    }

    .kicker {
      margin-bottom:7px;

      color:var(--blue);

      font-size:11px;
      font-weight:950;
      letter-spacing:2px;
    }

    h1 {
      margin:0;

      color:var(--navy);

      font-size:34px;
      font-weight:950;
      letter-spacing:-1.5px;
    }

    .desc {
      margin:8px 0 0;

      color:var(--muted);

      font-size:13px;
      line-height:1.65;
    }

    .summary {
      display:flex;
      flex-wrap:wrap;
      gap:7px;
    }

    .summary-chip {
      padding:9px 12px;

      border:1px solid var(--line);
      border-radius:999px;

      background:white;
      color:#526073;

      font-size:11px;
      font-weight:850;
    }

    .summary-chip strong {
      margin-left:4px;

      color:var(--navy);

      font-size:15px;
      font-weight:950;
    }

    .notice {
      margin-bottom:14px;

      padding:13px 14px;

      border:1px solid #dce8df;
      border-radius:12px;

      background:var(--green-soft);
      color:#396451;

      font-size:12px;
      font-weight:750;
      line-height:1.65;
    }

    .wildcard-panel {
      display:none;

      margin-bottom:14px;

      border:1px solid #dbe3ea;
      border-radius:15px;

      background:white;

      box-shadow:var(--shadow);

      overflow:hidden;
    }

    .wildcard-panel.show {
      display:block;
    }

    .wildcard-head {
      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:12px;

      padding:14px 16px;

      border-bottom:1px solid #e8ecf0;

      background:#fafbfc;
    }

    .wildcard-title {
      color:var(--navy);

      font-size:17px;
      font-weight:950;
    }

    .wildcard-sub {
      margin-top:3px;

      color:var(--muted);

      font-size:10px;
      font-weight:750;
    }

    .wildcard-count {
      flex-shrink:0;

      padding:7px 10px;

      border-radius:999px;

      background:var(--navy);
      color:white;

      font-size:11px;
      font-weight:900;
    }

    .wildcard-count strong {
      color:var(--lime);
    }

    .wildcard-list {
      padding:8px 10px 10px;
    }

    .wildcard-row {
      display:grid;

      grid-template-columns:
        48px minmax(0,1fr) 48px 52px 52px 64px;

      align-items:center;

      gap:5px;

      min-height:54px;

      padding:7px 8px;

      border-bottom:1px solid #e9edf1;
    }

    .wildcard-row:last-child {
      border-bottom:0;
    }

    .wildcard-row.selected {
      border-radius:10px;

      background:
        linear-gradient(
          90deg,
          rgba(201,223,69,.16),
          rgba(201,223,69,.04)
        );
    }

    .wildcard-rank {
      width:38px;
      height:34px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:9px;

      background:#eef2f5;
      color:var(--navy);

      font-size:12px;
      font-weight:950;
    }

    .wildcard-row.selected .wildcard-rank {
      background:var(--navy);
      color:var(--lime);
    }

    .wildcard-name {
      min-width:0;

      overflow:hidden;

      color:#263247;

      font-size:13px;
      font-weight:900;

      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .wildcard-group {
      color:#687587;

      font-size:11px;
      font-weight:850;

      text-align:center;
    }

    .wildcard-stat {
      color:#556275;

      font-size:10px;
      font-weight:800;

      text-align:center;
    }

    .wildcard-stat strong {
      display:block;

      color:var(--navy);

      font-size:13px;
      font-weight:950;
    }

    .wildcard-badge {
      color:#7e9414;

      font-size:10px;
      font-weight:950;

      text-align:center;
    }

    .wildcard-warning {
      margin:0 10px 10px;

      padding:11px 12px;

      border:1px solid #ecd7b9;
      border-radius:10px;

      background:var(--orange-soft);
      color:#83561e;

      font-size:11px;
      font-weight:750;
      line-height:1.55;
    }

    .groups {
      display:grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(320px,1fr)
        );

      gap:12px;
    }

    .group-card {
      overflow:hidden;

      border:1px solid var(--line);
      border-radius:17px;

      background:white;

      box-shadow:var(--shadow);
    }

    .group-head {
      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:15px 16px;

      border-bottom:1px solid #e8ecf0;

      background:#fafbfc;
    }

    .group-name {
      color:var(--navy);

      font-size:18px;
      font-weight:950;
    }

    .group-progress {
      color:#687587;

      font-size:11px;
      font-weight:800;
    }

    .ranking {
      padding:9px;
    }

    .rank-row {
      display:grid;

      grid-template-columns:
        42px minmax(0,1fr) 44px 48px 48px 48px;

      align-items:center;

      gap:5px;

      min-height:58px;

      padding:8px 7px;

      border-bottom:1px solid #e9edf1;
    }

    .rank-row:last-child {
      border-bottom:0;
    }

    .rank-row.qualifier {
      border-radius:10px;

      background:
        linear-gradient(
          90deg,
          rgba(201,223,69,.14),
          rgba(201,223,69,.04)
        );
    }

    .rank-number {
      width:36px;
      height:36px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:9px;

      background:#eef2f5;
      color:var(--navy);

      font-size:13px;
      font-weight:950;
    }

    .qualifier .rank-number {
      background:var(--navy);
      color:white;
    }

    .player-name {
      min-width:0;

      overflow:hidden;

      color:#263247;

      font-size:14px;
      font-weight:900;

      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .qualifier-label {
      margin-top:3px;

      color:#7e9414;

      font-size:9px;
      font-weight:950;
    }

    .stat-cell {
      text-align:center;

      color:#556275;

      font-size:11px;
      font-weight:850;
    }

    .stat-cell strong {
      display:block;

      color:var(--navy);

      font-size:14px;
      font-weight:950;
    }

    .table-head {
      display:grid;

      grid-template-columns:
        42px minmax(0,1fr) 44px 48px 48px 48px;

      gap:5px;

      padding:8px 16px;

      border-bottom:1px solid #e8ecf0;

      background:#f4f6f8;

      color:#718092;

      font-size:9px;
      font-weight:900;

      text-align:center;
    }

    .table-head .name-head {
      text-align:left;
    }

    .tie-warning {
      margin:10px;

      padding:11px 12px;

      border:1px solid #ecd7b9;
      border-radius:10px;

      background:var(--orange-soft);
      color:#83561e;

      font-size:11px;
      font-weight:750;
      line-height:1.55;
    }

    .bottom {
      display:flex;

      gap:10px;

      margin-top:18px;
    }

    .previous,
    .next {
      height:56px;
      min-height:56px;

      border-radius:11px;

      font-weight:900;
    }

    .previous {
      width:190px;

      border:1px solid #d8dee5;

      background:white;
      color:#526073;
    }

    .next {
      flex:1;

      border:0;

      background:
        linear-gradient(
          115deg,
          var(--navy),
          #123e6c
        );

      color:white;

      font-size:14px;
    }

    .next span {
      margin-left:5px;

      color:var(--lime);
    }

    .next:disabled {
      cursor:not-allowed;

      opacity:.48;
    }

    .blocked-message {
      display:none;

      margin-top:11px;

      padding:12px 13px;

      border:1px solid #ecd7b9;
      border-radius:10px;

      background:var(--orange-soft);
      color:#83561e;

      font-size:12px;
      font-weight:750;
      line-height:1.6;
    }

    .blocked-message.show {
      display:block;
    }

    .loading-overlay {
      display:none;

      position:fixed;
      inset:0;

      z-index:300;

      align-items:center;
      justify-content:center;

      padding:20px;

      background:
        rgba(4,17,31,.62);
    }

    .loading-overlay.show {
      display:flex;
    }

    .loading-box {
      width:min(350px,100%);

      padding:25px;

      border-radius:17px;

      background:white;

      text-align:center;

      box-shadow:
        0 30px 80px rgba(0,0,0,.25);
    }

    .spinner {
      width:38px;
      height:38px;

      margin:0 auto 15px;

      border:4px solid #e6eaee;
      border-top-color:var(--navy);

      border-radius:50%;

      animation:spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform:rotate(360deg);
      }
    }

    .loading-title {
      color:var(--navy);

      font-size:16px;
      font-weight:900;
    }

    .footer {
      display:flex;
      justify-content:space-between;

      margin-top:27px;
      padding-top:17px;

      border-top:1px solid #e2e6eb;

      color:#7c8795;

      font-size:10px;
      letter-spacing:1px;
    }

    .footer strong {
      color:var(--navy);
    }

    .q {
      color:#91a719;
      font-weight:950;
    }

    @media(max-width:700px) {

      .topbar {
        min-height:72px;
        padding:0 14px;
      }

      .fwt-logo {
        font-size:30px;
      }

      .header-btn {
        min-height:46px;

        padding:0 11px;

        font-size:11px;
      }

      .container {
        width:calc(100% - 22px);

        padding:24px 0 50px;
      }

      .head {
        display:block;
      }

      .summary {
        margin-top:13px;
      }

      h1 {
        font-size:30px;
      }

      .desc {
        font-size:14px;
      }

      .notice {
        font-size:13px;
      }

      .wildcard-head {
        align-items:flex-start;
      }

      .wildcard-title {
        font-size:18px;
      }

      .wildcard-sub {
        font-size:11px;
      }

      .wildcard-row {
        grid-template-columns:
          42px minmax(0,1fr) 42px 45px 45px 58px;

        gap:3px;

        min-height:58px;
      }

      .wildcard-name {
        font-size:14px;
      }

      .wildcard-stat {
        font-size:9px;
      }

      .wildcard-stat strong {
        font-size:13px;
      }

      .groups {
        grid-template-columns:1fr;
      }

      .group-name {
        font-size:19px;
      }

      .group-progress {
        font-size:12px;
      }

      .table-head,
      .rank-row {
        grid-template-columns:
          39px minmax(0,1fr) 42px 44px 44px 44px;

        gap:3px;
      }

      .rank-row {
        min-height:64px;
      }

      .rank-number {
        width:36px;
        height:36px;

        font-size:14px;
      }

      .player-name {
        font-size:15px;
      }

      .stat-cell {
        font-size:10px;
      }

      .stat-cell strong {
        font-size:14px;
      }

      .tie-warning {
        font-size:12px;
      }

      .bottom {
        flex-direction:column-reverse;

        gap:9px;
      }

      .previous,
      .next {
        width:100%;

        height:56px;
        min-height:56px;

        flex:none;

        font-size:15px;
      }

      .blocked-message {
        font-size:13px;
      }

    }
  </style>
</head>

<body>

<header class="topbar">

  <div class="fwt-logo">
    FW<span>T</span>
  </div>

  <div class="top-actions">

    <button
      class="header-btn"
      id="refreshButton"
      type="button"
    >
      새로고침
    </button>

    <button
      class="header-btn"
      type="button"
      onclick="location.href='./match-control.html'"
    >
      경기 운영
    </button>

  </div>

</header>


<main class="container">

  <div class="head">

    <div>

      <div class="kicker">
        GROUP STANDINGS
      </div>

      <h1>
        조별 순위
      </h1>

      <p class="desc">
        현재까지 완료된 경기 결과를 기준으로 실시간 순위를 계산합니다.
      </p>

    </div>


    <div class="summary">

      <div class="summary-chip">
        완료
        <strong id="completedMatches">0</strong>
      </div>

      <div class="summary-chip">
        전체
        <strong id="totalMatches">0</strong>
      </div>

      <div class="summary-chip">
        진출
        <strong id="qualifierCount">0</strong>
      </div>

    </div>

  </div>


  <div class="notice">
    조별 순위: 승수 → 득실차 → 득점 → 2명 동률 시 상대전적
    <br>
    와일드카드 순위: 승수 → 득실차 → 득점
  </div>


  <section
    class="wildcard-panel"
    id="wildcardPanel"
  >

    <div class="wildcard-head">

      <div>

        <div class="wildcard-title">
          와일드카드 순위
        </div>

        <div class="wildcard-sub">
          각 조의 자동 진출 다음 순위 참가자를 같은 기준으로 비교합니다.
        </div>

      </div>

      <div class="wildcard-count">
        WC <strong id="wildcardSelectedCount">0</strong>/<span id="wildcardTargetCount">0</span>
      </div>

    </div>

    <div
      class="wildcard-list"
      id="wildcardList"
    ></div>

    <div
      class="wildcard-warning"
      id="wildcardWarning"
      style="display:none;"
    ></div>

  </section>


  <section
    class="groups"
    id="groups"
  ></section>


  <div
    class="blocked-message"
    id="blockedMessage"
  ></div>


  <div class="bottom">

    <button
      class="previous"
      type="button"
      onclick="location.href='./match-control.html'"
    >
      경기 운영으로
    </button>


    <button
      class="next"
      id="knockoutButton"
      type="button"
      disabled
    >
      본선 토너먼트 생성
      <span>→</span>
    </button>

  </div>


  <footer class="footer">

    <div>
      <strong>FWT</strong>
      · FRIENDS WITH TENNIS
    </div>

    <div>
      CREATED BY
      <span class="q">Q</span>
    </div>

  </footer>

</main>


<div
  class="loading-overlay"
  id="loadingOverlay"
>

  <div class="loading-box">

    <div class="spinner"></div>

    <div
      class="loading-title"
      id="loadingTitle"
    >
      순위를 계산하고 있습니다
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://opwuyqerisocqobbbisg.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_Eo_zfONeGLs9ATCVg2Fk_g_y_IAJFV-";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const tournament =
  JSON.parse(
    sessionStorage.getItem(
      "fwtNewTournament"
    ) || "null"
  );


const entries =
  JSON.parse(
    sessionStorage.getItem(
      "fwtNewTournamentEntries"
    ) || "null"
  );


const groupData =
  JSON.parse(
    sessionStorage.getItem(
      "fwtGroupData"
    ) || "null"
  );


if (
  !tournament ||
  !tournament.divisionId ||
  !Array.isArray(entries) ||
  !Array.isArray(groupData)
) {

  alert(
    "대회 또는 조편성 정보가 없습니다."
  );

  location.href =
    "./dashboard.html";

}


let advanceCount =
  Number(
    tournament.advanceCount || 0
  );


let wildcardCount =
  Number(
    tournament.wildcardCount || 0
  );


let matches = [];


let standingsData = [];


let qualifiers = [];


let wildcardCandidates = [];


let wildcardCutoffTie = false;


let busy = false;


/* =====================================
   HELPERS
===================================== */

function escapeHtml(value) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value ?? "";

  return div.innerHTML;

}


function shortEntryName(entry) {

  if (!entry) {

    return "알 수 없음";

  }


  if (
    entry.type ===
    "singles"
  ) {

    return (
      entry.nickname ||
      entry.name ||
      "이름 없음"
    );

  }


  const p1 =
    entry.player1?.nickname ||
    entry.player1?.name ||
    "선수1";


  const p2 =
    entry.player2?.nickname ||
    entry.player2?.name ||
    "선수2";


  return `${p1}/${p2}`;

}


function getEntryIndexById(entryId) {

  return entries.findIndex(
    entry =>
      entry.dbEntryId ===
      entryId
  );

}


function getGroupById(groupId) {

  return groupData.find(
    group =>
      group.dbGroupId ===
      groupId
  );

}


/* =====================================
   AUTH
===================================== */

async function checkLogin() {

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getSession();


  if (
    error ||
    !data.session
  ) {

    location.href =
      "./";

    return false;

  }


  return true;

}


/* =====================================
   BUSY
===================================== */

function setBusy(
  state,
  title =
    "순위를 계산하고 있습니다"
) {

  busy = state;


  document.getElementById(
    "loadingTitle"
  ).textContent =
    title;


  document.getElementById(
    "loadingOverlay"
  ).classList.toggle(
    "show",
    state
  );


  document.getElementById(
    "refreshButton"
  ).disabled =
    state;


  document.getElementById(
    "knockoutButton"
  ).disabled =
    state ||
    !canCreateKnockout();

}


/* =====================================
   DB LOAD
===================================== */

async function loadDivisionConfig() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("divisions")
      .select(
        "advance_count,wildcard_count"
      )
      .eq(
        "id",
        tournament.divisionId
      )
      .single();


  if (error) {

    throw new Error(
      "부문 설정 조회 실패: "
      +
      error.message
    );

  }


  advanceCount =
    Number(
      data?.advance_count ?? 0
    );


  wildcardCount =
    Number(
      data?.wildcard_count ?? 0
    );


  tournament.advanceCount =
    advanceCount;


  tournament.wildcardCount =
    wildcardCount;


  sessionStorage.setItem(
    "fwtNewTournament",
    JSON.stringify(
      tournament
    )
  );

}


async function loadMatches() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("matches")
      .select(
        "id,group_id,entry1_id,entry2_id,status,score1,score2,winner_entry_id,round_number,sort_order"
      )
      .eq(
        "division_id",
        tournament.divisionId
      )
      .eq(
        "stage",
        "group"
      )
      .order(
        "sort_order",
        {
          ascending:true
        }
      );


  if (error) {

    throw new Error(
      "경기 조회 실패: "
      +
      error.message
    );

  }


  matches =
    (data || [])
      .map(
        row => {

          const player1 =
            getEntryIndexById(
              row.entry1_id
            );


          const player2 =
            getEntryIndexById(
              row.entry2_id
            );


          const group =
            getGroupById(
              row.group_id
            );


          return {

            id:row.id,

            groupId:
              row.group_id,

            groupName:
              group?.name ||
              "조 미상",

            player1,

            player2,

            entry1Id:
              row.entry1_id,

            entry2Id:
              row.entry2_id,

            status:
              row.status,

            score1:
              row.score1,

            score2:
              row.score2,

            winnerEntryId:
              row.winner_entry_id,

            roundNumber:
              row.round_number,

            order:
              row.sort_order

          };

        }
      )
      .filter(
        match =>
          match.player1 >= 0 &&
          match.player2 >= 0
      );

}


/* =====================================
   HEAD TO HEAD
===================================== */

function getHeadToHeadWinner(
  indexA,
  indexB,
  groupMatches
) {

  const match =
    groupMatches.find(
      match =>
        match.status ===
          "completed"
        &&
        (
          (
            match.player1 ===
              indexA
            &&
            match.player2 ===
              indexB
          )
          ||
          (
            match.player1 ===
              indexB
            &&
            match.player2 ===
              indexA
          )
        )
    );


  if (!match) {

    return null;

  }


  if (
    match.score1 >
    match.score2
  ) {

    return match.player1;

  }


  if (
    match.score2 >
    match.score1
  ) {

    return match.player2;

  }


  return null;

}


/* =====================================
   CALCULATE ONE GROUP
===================================== */

function calculateGroup(
  group
) {

  const memberIndexes =
    group.members || [];


  const stats =
    new Map();


  memberIndexes.forEach(
    entryIndex => {

      stats.set(
        entryIndex,
        {

          entryIndex,

          played:0,

          wins:0,

          losses:0,

          scored:0,

          conceded:0,

          diff:0

        }
      );

    }
  );


  const groupMatches =
    matches.filter(
      match =>
        match.groupName ===
        group.name
    );


  const completedMatches =
    groupMatches.filter(
      match =>
        match.status ===
        "completed"
    );


  completedMatches.forEach(
    match => {

      const a =
        stats.get(
          match.player1
        );


      const b =
        stats.get(
          match.player2
        );


      if (
        !a ||
        !b
      ) {

        return;

      }


      const score1 =
        Number(
          match.score1 || 0
        );


      const score2 =
        Number(
          match.score2 || 0
        );


      a.played++;

      b.played++;


      a.scored +=
        score1;

      a.conceded +=
        score2;


      b.scored +=
        score2;

      b.conceded +=
        score1;


      if (
        score1 >
        score2
      ) {

        a.wins++;

        b.losses++;

      } else if (
        score2 >
        score1
      ) {

        b.wins++;

        a.losses++;

      }

    }
  );


  const ranking =
    Array.from(
      stats.values()
    );


  ranking.forEach(
    row => {

      row.diff =
        row.scored -
        row.conceded;

    }
  );


  /*
    1차 정렬
    승수 → 득실차 → 득점
  */

  ranking.sort(
    (a,b) => {

      if (
        b.wins !==
        a.wins
      ) {

        return (
          b.wins -
          a.wins
        );

      }


      if (
        b.diff !==
        a.diff
      ) {

        return (
          b.diff -
          a.diff
        );

      }


      if (
        b.scored !==
        a.scored
      ) {

        return (
          b.scored -
          a.scored
        );

      }


      return 0;

    }
  );


  /*
    동일 성적이 정확히 2명인 경우
    상대전적 적용
  */

  let i = 0;


  while (
    i <
    ranking.length
  ) {

    let j =
      i + 1;


    while (
      j <
      ranking.length
      &&
      ranking[j].wins ===
        ranking[i].wins
      &&
      ranking[j].diff ===
        ranking[i].diff
      &&
      ranking[j].scored ===
        ranking[i].scored
    ) {

      j++;

    }


    const size =
      j - i;


    if (
      size === 2
    ) {

      const a =
        ranking[i];


      const b =
        ranking[i + 1];


      const winner =
        getHeadToHeadWinner(
          a.entryIndex,
          b.entryIndex,
          completedMatches
        );


      if (
        winner ===
        b.entryIndex
      ) {

        ranking[i] =
          b;

        ranking[i + 1] =
          a;

      }

    }


    i = j;

  }


  /*
    완전 동률 그룹 표시
  */

  const tieGroups = [];


  i = 0;


  while (
    i <
    ranking.length
  ) {

    let j =
      i + 1;


    while (
      j <
      ranking.length
      &&
      ranking[j].wins ===
        ranking[i].wins
      &&
      ranking[j].diff ===
        ranking[i].diff
      &&
      ranking[j].scored ===
        ranking[i].scored
    ) {

      j++;

    }


    const tied =
      ranking.slice(
        i,
        j
      );


    if (
      tied.length >= 3
    ) {

      tieGroups.push(
        tied.map(
          row =>
            row.entryIndex
        )
      );

    }


    i = j;

  }


  /*
    본선 커트라인에
    완전 동률이 걸려있는지 확인
  */

  let cutoffTie =
    false;


  if (
    advanceCount > 0 &&
    ranking.length >
      advanceCount
  ) {

    const upper =
      ranking[
        advanceCount - 1
      ];


    const lower =
      ranking[
        advanceCount
      ];


    if (
      upper.wins ===
        lower.wins
      &&
      upper.diff ===
        lower.diff
      &&
      upper.scored ===
        lower.scored
    ) {

      const tiedIndexes =
        tieGroups.find(
          groupIndexes =>
            groupIndexes.includes(
              upper.entryIndex
            )
            &&
            groupIndexes.includes(
              lower.entryIndex
            )
        );


      if (
        tiedIndexes
      ) {

        cutoffTie =
          true;

      }

    }

  }


  return {

    name:
      group.name,

    dbGroupId:
      group.dbGroupId,

    totalMatches:
      groupMatches.length,

    completedMatches:
      completedMatches.length,

    ranking,

    tieGroups,

    cutoffTie

  };

}


/* =====================================
   ALL STANDINGS
===================================== */

function calculateStandings() {

  standingsData =
    groupData.map(
      group =>
        calculateGroup(
          group
        )
    );


  qualifiers = [];

  wildcardCandidates = [];

  wildcardCutoffTie = false;


  standingsData.forEach(
    group => {

      group.ranking
        .slice(
          0,
          advanceCount
        )
        .forEach(
          (
            row,
            index
          ) => {

            qualifiers.push({

              groupName:
                group.name,

              groupId:
                group.dbGroupId,

              rank:
                index + 1,

              entryIndex:
                row.entryIndex,

              dbEntryId:
                entries[
                  row.entryIndex
                ]?.dbEntryId ||
                null,

              wins:
                row.wins,

              diff:
                row.diff,

              scored:
                row.scored,

              qualifierType:
                "auto",

              isWildcard:
                false

            });

          }
        );


      if (
        wildcardCount > 0
        &&
        group.ranking.length >
          advanceCount
      ) {

        const row =
          group.ranking[
            advanceCount
          ];


        wildcardCandidates.push({

          groupName:
            group.name,

          groupId:
            group.dbGroupId,

          rank:
            advanceCount + 1,

          entryIndex:
            row.entryIndex,

          dbEntryId:
            entries[
              row.entryIndex
            ]?.dbEntryId ||
            null,

          wins:
            row.wins,

          diff:
            row.diff,

          scored:
            row.scored,

          qualifierType:
            "wildcard_candidate",

          isWildcard:
            false

        });

      }

    }
  );


  wildcardCandidates.sort(
    (a,b) => {

      if (
        b.wins !==
        a.wins
      ) {

        return (
          b.wins -
          a.wins
        );

      }


      if (
        b.diff !==
        a.diff
      ) {

        return (
          b.diff -
          a.diff
        );

      }


      if (
        b.scored !==
        a.scored
      ) {

        return (
          b.scored -
          a.scored
        );

      }


      return (
        a.groupName
          .localeCompare(
            b.groupName,
            "ko"
          )
      );

    }
  );


  if (
    wildcardCount > 0
    &&
    wildcardCandidates.length >
      wildcardCount
  ) {

    const upper =
      wildcardCandidates[
        wildcardCount - 1
      ];


    const lower =
      wildcardCandidates[
        wildcardCount
      ];


    wildcardCutoffTie =
      upper.wins === lower.wins
      &&
      upper.diff === lower.diff
      &&
      upper.scored === lower.scored;

  }


  wildcardCandidates.forEach(
    (
      candidate,
      index
    ) => {

      candidate.wildcardOrder =
        index + 1;


      let selected =
        index <
        wildcardCount;


      if (
        selected
        &&
        wildcardCutoffTie
      ) {

        const cutoff =
          wildcardCandidates[
            wildcardCount - 1
          ];


        const sameAsCutoff =
          candidate.wins === cutoff.wins
          &&
          candidate.diff === cutoff.diff
          &&
          candidate.scored === cutoff.scored;


        if (
          sameAsCutoff
        ) {

          selected =
            false;

        }

      }


      candidate.isWildcard =
        selected;


      if (
        candidate.isWildcard
      ) {

        qualifiers.push({

          ...candidate,

          qualifierType:
            "wildcard",

          isWildcard:
            true

        });

      }

    }
  );


  saveCompatibilityData();

}


/* =====================================
   SESSION COMPATIBILITY
===================================== */

function saveCompatibilityData() {

  sessionStorage.setItem(
    "fwtStandingsData",
    JSON.stringify(
      standingsData
    )
  );


  sessionStorage.setItem(
    "fwtKnockoutQualifiers",
    JSON.stringify(
      qualifiers
    )
  );

}


/* =====================================
   CREATE CHECK
===================================== */

function allMatchesCompleted() {

  if (
    matches.length === 0
  ) {

    return false;

  }


  return matches.every(
    match =>
      match.status ===
      "completed"
      ||
      match.status ===
      "bye"
      ||
      match.status ===
      "walkover"
  );

}


function hasCutoffTie() {

  return standingsData.some(
    group =>
      group.cutoffTie
  );

}


function hasWildcardSourceTie() {

  if (
    wildcardCount <= 0
  ) {

    return false;

  }


  return standingsData.some(
    group => {

      const candidateIndex =
        advanceCount;


      if (
        candidateIndex < 0
        ||
        candidateIndex >=
          group.ranking.length
      ) {

        return false;

      }


      const candidate =
        group.ranking[
          candidateIndex
        ];


      return group.tieGroups.some(
        tiedIndexes =>
          tiedIndexes.includes(
            candidate.entryIndex
          )
      );

    }
  );

}


function hasWildcardCutoffTie() {

  return (
    wildcardCount > 0
    &&
    wildcardCutoffTie
  );

}


function canCreateKnockout() {

  return (
    allMatchesCompleted()
    &&
    !hasCutoffTie()
    &&
    !hasWildcardSourceTie()
    &&
    !hasWildcardCutoffTie()
    &&
    qualifiers.length > 1
  );

}

}


function renderWildcards() {

  const panel =
    document.getElementById(
      "wildcardPanel"
    );


  const list =
    document.getElementById(
      "wildcardList"
    );


  const warning =
    document.getElementById(
      "wildcardWarning"
    );


  document.getElementById(
    "wildcardTargetCount"
  ).textContent =
    wildcardCount;


  const selectedCount =
    wildcardCandidates.filter(
      candidate =>
        candidate.isWildcard
    ).length;


  document.getElementById(
    "wildcardSelectedCount"
  ).textContent =
    selectedCount;


  if (
    wildcardCount <= 0
  ) {

    panel.classList.remove(
      "show"
    );

    list.innerHTML = "";

    warning.style.display =
      "none";

    return;

  }


  panel.classList.add(
    "show"
  );


  list.innerHTML = "";


  wildcardCandidates.forEach(
    candidate => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "wildcard-row"
        +
        (
          candidate.isWildcard
            ? " selected"
            : ""
        );


      row.innerHTML = `

        <div class="wildcard-rank">
          ${candidate.wildcardOrder}
        </div>

        <div class="wildcard-name">
          ${escapeHtml(
            shortEntryName(
              entries[
                candidate.entryIndex
              ]
            )
          )}
        </div>

        <div class="wildcard-group">
          ${escapeHtml(
            candidate.groupName
          )}
        </div>

        <div class="wildcard-stat">
          <strong>${candidate.wins}</strong>
          승
        </div>

        <div class="wildcard-stat">
          <strong>${
            candidate.diff > 0
              ? "+"
              : ""
          }${candidate.diff}</strong>
          득실
        </div>

        <div class="wildcard-badge">
          ${
            candidate.isWildcard
              ? `WC${candidate.wildcardOrder}`
              : "후보"
          }
        </div>

      `;


      list.appendChild(
        row
      );

    }
  );


  if (
    hasWildcardSourceTie()
  ) {

    warning.textContent =
      "와일드카드 후보가 되는 조 순위에 3명 이상 완전 동률이 있습니다. 해당 조 순위를 먼저 확정해야 합니다.";

    warning.style.display =
      "block";

    return;

  }


  if (
    hasWildcardCutoffTie()
  ) {

    warning.textContent =
      "와일드카드 커트라인에 승수·득실차·득점이 모두 같은 참가자가 있습니다. 현재는 자동 선정하지 않습니다. 다음 단계에서 관리자 수동 선택 기능으로 처리할 수 있습니다.";

    warning.style.display =
      "block";

    return;

  }


  warning.style.display =
    "none";

}


function renderGroups() {

  const box =
    document.getElementById(
      "groups"
    );


  box.innerHTML = "";


  standingsData.forEach(
    group => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "group-card";


      card.innerHTML = `

        <div class="group-head">

          <div class="group-name">
            ${escapeHtml(
              group.name
            )}
          </div>


          <div class="group-progress">
            ${group.completedMatches}/${group.totalMatches} 완료

          <div>순위</div>

          <div class="name-head">

          </div>

          <div>승</div>

          <div>득점</div>

          <div>실점</div>

          <div>득실</div>

        </div>


        <div class="ranking"></div>

      `;


      const rankingBox =
        card.querySelector(
          ".ranking"
        );


      group.ranking.forEach(
        (
          row,
          index
        ) => {

          const qualifier =
            index <
            advanceCount;


          const wildcardCandidate =
            wildcardCount > 0
            &&
            index ===
              advanceCount;


          const selectedWildcard =
            wildcardCandidates.some(
              candidate =>
                candidate.entryIndex ===
                  row.entryIndex
                &&
                candidate.groupId ===
                  group.dbGroupId
                &&
                candidate.isWildcard
            );


          const rankRow =
            document.createElement(
              "div"
            );


          rankRow.className =
            "rank-row"
            +
            (
              qualifier ||
              selectedWildcard
                ? " qualifier"
                : ""
            );


          rankRow.innerHTML = `

            <div class="rank-number">
              ${index + 1}
            </div>


            <div>

              <div class="player-name">
                ${escapeHtml(
                  shortEntryName(
                    entries[
                      row.entryIndex
                    ]
                  )
                )}
              </div>

              ${
                qualifier
                  ? `
                    <div class="qualifier-label">
                      자동 진출
                    </div>
                  `
                  : selectedWildcard
                    ? `
                      <div class="qualifier-label">
                        WC${wildcardCandidates.find(
                          candidate =>
                            candidate.entryIndex === row.entryIndex
                            &&
                            candidate.groupId === group.dbGroupId
                        )?.wildcardOrder || ""}
                      </div>
                    `
                    : wildcardCandidate
                      ? `
                        <div class="qualifier-label">
                          WC 후보
                        </div>
                      `
                      : ""
              }

            </div>


            <div class="stat-cell">

              <strong>
                ${row.wins}
              </strong>

              승

            </div>


            <div class="stat-cell">

              <strong>
                ${row.scored}
              </strong>

            </div>


            <div class="stat-cell">

              <strong>
                ${row.conceded}
              </strong>

            </div>


            <div class="stat-cell">

              <strong>
                ${
                  row.diff > 0
                    ? "+"
                    : ""
                }${row.diff}
              </strong>

            </div>

          `;


          rankingBox.appendChild(
            rankRow
          );

        }
      );


      if (
        group.tieGroups.length > 0
      ) {

        const warning =
          document.createElement(
            "div"
          );


        warning.className =
          "tie-warning";


        warning.textContent =
          group.cutoffTie
            ? "본선 진출 커트라인에 3명 이상 완전 동률이 있습니다. 순위를 직접 결정한 뒤 토너먼트를 생성해야 합니다."
            : "3명 이상 동일 성적 참가자가 있습니다. 현재 표시 순위는 임시 순서입니다.";


        card.appendChild(
          warning
        );

      }


      box.appendChild(
        card
      );

    }
  );

}


/* =====================================
   BUTTON
===================================== */

function renderButtonState() {

  const button =
    document.getElementById(
      "knockoutButton"
    );


  const blocked =
    document.getElementById(
      "blockedMessage"
    );


  button.disabled =
    !canCreateKnockout();


  if (
    matches.length === 0
  ) {

    blocked.textContent =
      "저장된 조별 경기가 없습니다.";

    blocked.classList.add(
      "show"
    );

    return;

  }


  if (
    !allMatchesCompleted()
  ) {

    const remaining =
      matches.filter(
        match =>
          ![
            "completed",
            "bye",
            "walkover"
          ].includes(
            match.status
          )
      ).length;


    blocked.textContent =
      `아직 ${remaining}경기가 완료되지 않았습니다. 모든 조별 예선이 끝나면 본선 토너먼트를 생성할 수 있습니다.`;

    blocked.classList.add(
      "show"
    );

    return;

  }


  if (
    hasCutoffTie()
  ) {

    blocked.textContent =
      "조별 자동 진출 커트라인에 해결되지 않은 완전 동률이 있습니다.";

    blocked.classList.add(
      "show"
    );

    return;

  }


  if (
    hasWildcardSourceTie()
  ) {

    blocked.textContent =
      "와일드카드 후보가 되는 조 순위에 해결되지 않은 완전 동률이 있습니다.";

    blocked.classList.add(
      "show"
    );

    return;

  }


  if (
    hasWildcardCutoffTie()
  ) {

    blocked.textContent =
      "와일드카드 커트라인이 완전 동률입니다. 자동 선정할 수 없습니다.";

    blocked.classList.add(
      "show"
    );

    return;

  }


  blocked.textContent = "";

  blocked.classList.remove(
    "show"
  );

}

  calculateStandings();

  renderSummary();

  renderWildcards();

function goKnockout() {

  if (
    !canCreateKnockout()
  ) {

    return;

  }


  saveCompatibilityData();


  sessionStorage.removeItem(
    "fwtKnockoutBracket"
  );


  location.href =
    "./knockout-bracket.html";

}

   REFRESH
===================================== */

async function refresh() {

  if (busy) {
    return;
  }


  try {

    setBusy(
      true,
      "DB 경기결과를 다시 불러오고 있습니다"
    );


    await loadDivisionConfig();

    await loadMatches();


    renderAll();


    setBusy(false);


  } catch(error) {

    setBusy(false);


    alert(
      "순위 정보를 불러오지 못했습니다.\n\n"
      +
      error.message
    );

  }

}


/* =====================================
   EVENTS
===================================== */

document.getElementById(
  "refreshButton"
).addEventListener(
  "click",
  refresh
);


document.getElementById(
  "knockoutButton"
).addEventListener(
  "click",
  goKnockout
);


/* =====================================
   START
===================================== */

async function start() {

  const loggedIn =
    await checkLogin();


  if (!loggedIn) {
    return;
  }


  try {

    setBusy(
      true,
      "DB 경기결과를 불러오고 있습니다"
    );


    await loadDivisionConfig();

    await loadMatches();


    renderAll();


    setBusy(false);


  } catch(error) {

    console.error(error);


    setBusy(false);


    alert(
      "조별 순위를 불러오지 못했습니다.\n\n"
      +
      error.message
    );

  }

}


start();

</script>
