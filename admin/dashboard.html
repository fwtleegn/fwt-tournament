<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>대회관리 | FWT Tournament</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --navy:#071a31;
      --navy2:#0c294a;
      --blue:#184a79;
      --lime:#c9df45;

      --bg:#f4f6f9;
      --white:#ffffff;

      --text:#172033;
      --muted:#657184;
      --line:#dfe5eb;

      --green:#178b61;
      --green-soft:#eaf7f1;

      --blue-soft:#edf5fd;

      --orange:#99631c;
      --orange-soft:#fff6e9;

      --red:#c64b4b;
      --red-soft:#fff1f1;

      --gray-soft:#f0f2f5;

      --shadow:
        0 12px 35px rgba(20,35,55,.06);
    }

    * {
      box-sizing:border-box;
    }

    html,
    body {
      margin:0;
      min-height:100%;

      background:var(--bg);
      color:var(--text);

      font-family:
        Inter,
        Pretendard,
        "Noto Sans KR",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button {
      font:inherit;
      cursor:pointer;
    }

    /* =====================================
       HEADER
    ===================================== */

    .topbar {
      min-height:78px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:0 30px;

      background:
        linear-gradient(
          110deg,
          #06172b,
          #0a2848 62%,
          #103b67
        );

      box-shadow:
        0 5px 20px rgba(6,23,43,.16);
    }

    /*
      FWT 로고
      오른쪽 장식선 완전 제거
    */

    .fwt-logo {
      color:white;

      font-size:34px;
      line-height:1;

      font-weight:950;
      font-style:italic;

      letter-spacing:-4px;

      transform:
        skew(-5deg);
    }

    .fwt-logo span {
      color:var(--lime);
    }

    .logout-btn {
      min-height:44px;

      padding:0 18px;

      border:
        1px solid rgba(255,255,255,.12);

      border-radius:13px;

      background:
        rgba(255,255,255,.09);

      color:white;

      font-size:13px;
      font-weight:850;
    }

    /* =====================================
       PAGE
    ===================================== */

    .container {
      width:
        min(
          1080px,
          calc(100% - 38px)
        );

      margin:0 auto;

      padding:46px 0 65px;
    }

    .kicker {
      display:flex;
      align-items:center;

      gap:10px;

      margin-bottom:12px;

      color:var(--blue);

      font-size:12px;
      font-weight:950;

      letter-spacing:3px;
    }

    .kicker::before {
      content:"";

      width:38px;
      height:3px;

      border-radius:99px;

      background:var(--lime);
    }

    h1 {
      margin:0;

      color:var(--navy);

      font-size:42px;
      font-weight:950;

      letter-spacing:-2px;
    }

    .desc {
      margin:
        13px 0 28px;

      color:#697586;

      font-size:15px;
      line-height:1.65;
    }

    /* =====================================
       NEW TOURNAMENT
    ===================================== */

    .create-btn {
      width:100%;

      min-height:72px;

      display:flex;
      align-items:center;
      justify-content:center;

      gap:13px;

      border:0;
      border-radius:16px;

      background:
        linear-gradient(
          115deg,
          #061d37,
          #0f467a
        );

      color:white;

      box-shadow:
        0 14px 34px rgba(8,39,71,.14);

      font-size:18px;
      font-weight:900;
    }

    .create-btn .plus {
      color:var(--lime);

      font-size:26px;
      font-weight:950;
    }

    /* =====================================
       STATS
    ===================================== */

    .stats {
      display:grid;

      grid-template-columns:
        repeat(4,minmax(0,1fr));

      gap:11px;

      margin-top:20px;
    }

    .stat-card {
      min-height:119px;

      padding:18px;

      display:flex;
      flex-direction:column;
      justify-content:space-between;

      border:1px solid var(--line);
      border-radius:15px;

      background:white;

      box-shadow:var(--shadow);
    }

    .stat-label {
      color:#687587;

      font-size:12px;
      font-weight:850;
    }

    .stat-bottom {
      display:flex;
      align-items:flex-end;
      justify-content:space-between;

      gap:8px;
    }

    .stat-number {
      color:var(--navy);

      font-size:34px;
      line-height:1;

      font-weight:950;
    }

    .stat-badge {
      min-height:28px;

      display:flex;
      align-items:center;

      padding:0 10px;

      border-radius:999px;

      font-size:9px;
      font-weight:950;

      letter-spacing:1.3px;
    }

    .total-badge {
      background:var(--gray-soft);
      color:#697586;
    }

    .draft-badge {
      background:var(--blue-soft);
      color:#2875a9;
    }

    .live-badge {
      background:var(--green-soft);
      color:var(--green);
    }

    .finish-badge {
      background:#f4f0e9;
      color:#85765f;
    }

    /* =====================================
       TOURNAMENT SECTION
    ===================================== */

    .section {
      margin-top:34px;
    }

    .section-head {
      display:flex;
      align-items:flex-end;
      justify-content:space-between;

      gap:14px;

      margin-bottom:12px;
    }

    .section-title {
      color:var(--navy);

      font-size:21px;
      font-weight:950;

      letter-spacing:-.6px;
    }

    .section-sub {
      margin-top:4px;

      color:#788493;

      font-size:11px;
    }

    .refresh-btn {
      min-height:38px;

      padding:0 13px;

      border:1px solid #d8dfe6;
      border-radius:9px;

      background:white;
      color:#526073;

      font-size:11px;
      font-weight:850;
    }

    /* =====================================
       TOURNAMENT LIST
    ===================================== */

    .tournament-list {
      display:flex;
      flex-direction:column;

      gap:10px;
    }

    .tournament-card {
      overflow:hidden;

      border:1px solid var(--line);
      border-radius:16px;

      background:white;

      box-shadow:var(--shadow);
    }

    .tournament-main {
      padding:18px 19px;
    }

    .tournament-top {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;

      gap:15px;
    }

    .tournament-name {
      color:var(--navy);

      font-size:18px;
      font-weight:950;

      line-height:1.35;
    }

    .status {
      flex-shrink:0;

      min-height:29px;

      display:flex;
      align-items:center;

      padding:0 10px;

      border-radius:999px;

      font-size:10px;
      font-weight:900;
    }

    .status-draft {
      background:var(--blue-soft);
      color:#2875a9;
    }

    .status-active {
      background:var(--green-soft);
      color:var(--green);
    }

    .status-completed {
      background:#f2efe9;
      color:#7d715f;
    }

    .status-archived {
      background:#f0f1f3;
      color:#717987;
    }

    .meta {
      display:flex;
      flex-wrap:wrap;

      gap:6px;

      margin-top:11px;
    }

    .meta-chip {
      min-height:29px;

      display:flex;
      align-items:center;

      padding:0 9px;

      border-radius:999px;

      background:#f5f7f9;
      color:#5d6979;

      font-size:10px;
      font-weight:800;
    }

    .progress-area {
      margin-top:15px;
    }

    .progress-label {
      display:flex;
      justify-content:space-between;

      margin-bottom:6px;

      color:#657184;

      font-size:10px;
      font-weight:800;
    }

    .progress-track {
      height:6px;

      overflow:hidden;

      border-radius:99px;

      background:#edf0f3;
    }

    .progress-bar {
      height:100%;

      border-radius:99px;

      background:
        linear-gradient(
          90deg,
          var(--lime),
          #91bd2e
        );
    }

    .tournament-actions {
      display:grid;

      grid-template-columns:
        minmax(0,1fr) auto;

      gap:8px;

      padding:12px 18px 17px;
    }

    .continue-btn {
      min-height:50px;

      border:0;
      border-radius:11px;

      background:var(--navy);
      color:white;

      font-size:13px;
      font-weight:900;
    }

    .continue-btn span {
      margin-left:5px;
      color:var(--lime);
    }

    .delete-btn {
      min-height:50px;

      padding:0 15px;

      border:1px solid #ebd1d1;
      border-radius:11px;

      background:var(--red-soft);
      color:var(--red);

      font-size:11px;
      font-weight:850;
    }

    /* =====================================
       EMPTY
    ===================================== */

    .empty {
      padding:54px 20px;

      border:1px solid var(--line);
      border-radius:16px;

      background:white;

      text-align:center;

      box-shadow:var(--shadow);
    }

    .empty-icon {
      width:65px;
      height:65px;

      margin:0 auto 15px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:18px;

      background:#f2f5f7;

      color:#91a4b6;

      font-size:27px;
    }

    .empty-title {
      color:var(--navy);

      font-size:16px;
      font-weight:900;
    }

    .empty-desc {
      margin-top:6px;

      color:#738091;

      font-size:12px;
      line-height:1.6;
    }

    /* =====================================
       ERROR
    ===================================== */

    .error-box {
      display:none;

      margin-top:14px;

      padding:13px 14px;

      border:1px solid #edcece;
      border-radius:11px;

      background:var(--red-soft);
      color:#a84242;

      font-size:12px;
      font-weight:750;

      line-height:1.6;
    }

    .error-box.show {
      display:block;
    }

    /* =====================================
       LOADING
    ===================================== */

    .loading-overlay {
      display:none;

      position:fixed;
      inset:0;

      z-index:300;

      align-items:center;
      justify-content:center;

      padding:20px;

      background:
        rgba(4,17,31,.62);
    }

    .loading-overlay.show {
      display:flex;
    }

    .loading-box {
      width:min(350px,100%);

      padding:25px;

      border-radius:17px;

      background:white;

      text-align:center;

      box-shadow:
        0 30px 80px rgba(0,0,0,.25);
    }

    .spinner {
      width:38px;
      height:38px;

      margin:0 auto 15px;

      border:4px solid #e7eaee;
      border-top-color:var(--navy);

      border-radius:50%;

      animation:spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform:rotate(360deg);
      }
    }

    .loading-title {
      color:var(--navy);

      font-size:16px;
      font-weight:900;
    }

    .loading-text {
      margin-top:6px;

      color:#657184;

      font-size:12px;
      line-height:1.6;
    }

    /* =====================================
       FOOTER
    ===================================== */

    .footer {
      display:flex;
      justify-content:space-between;

      margin-top:32px;
      padding-top:17px;

      border-top:1px solid #e0e5ea;

      color:#7c8795;

      font-size:10px;
      letter-spacing:1px;
    }

    .footer strong {
      color:var(--navy);
    }

    .q {
      color:#91a719;
      font-weight:900;
    }

    /* =====================================
       MOBILE
    ===================================== */

    @media(max-width:700px) {

      .topbar {
        min-height:72px;

        padding:0 16px;
      }

      .fwt-logo {
        font-size:31px;
      }

      .logout-btn {
        min-height:48px;

        padding:0 16px;

        font-size:13px;
      }

      .container {
        width:
          calc(100% - 24px);

        padding:
          32px 0 55px;
      }

      .kicker {
        font-size:11px;
        letter-spacing:2.7px;
      }

      .kicker::before {
        width:30px;
      }

      h1 {
        font-size:38px;
      }

      .desc {
        margin-bottom:24px;

        font-size:15px;
      }

      /*
        모바일 핵심버튼
        얇아짐 방지
      */

      .create-btn {
        width:100%;

        height:64px;
        min-height:64px;

        flex:none;

        border-radius:15px;

        font-size:17px;
      }

      .stats {
        grid-template-columns:
          repeat(2,minmax(0,1fr));

        gap:8px;
      }

      .stat-card {
        min-height:109px;

        padding:15px;
      }

      .stat-label {
        font-size:13px;
      }

      .stat-number {
        font-size:32px;
      }

      .section {
        margin-top:30px;
      }

      .section-title {
        font-size:22px;
      }

      .section-sub {
        font-size:12px;
      }

      .refresh-btn {
        min-height:43px;

        font-size:12px;
      }

      .tournament-main {
        padding:17px 15px;
      }

      .tournament-name {
        font-size:18px;
      }

      .status {
        min-height:31px;

        font-size:11px;
      }

      .meta-chip {
        min-height:31px;

        font-size:11px;
      }

      .progress-label {
        font-size:11px;
      }

      .tournament-actions {
        grid-template-columns:1fr;

        gap:8px;

        padding:
          0 15px 15px;
      }

      /*
        대회 계속관리 버튼은
        모바일 최소 56px
      */

      .continue-btn {
        width:100%;

        height:56px;
        min-height:56px;

        flex:none;

        font-size:15px;
      }

      .delete-btn {
        width:100%;

        height:48px;
        min-height:48px;

        flex:none;

        font-size:12px;
      }

      .empty {
        padding:45px 17px;
      }

      .empty-title {
        font-size:17px;
      }

      .empty-desc {
        font-size:13px;
      }

    }
  </style>
</head>


<body>

<header class="topbar">

  <!--
    꼬리선 없는 FWT 로고
  -->
  <div class="fwt-logo">
    FW<span>T</span>
  </div>


  <button
    class="logout-btn"
    id="logoutButton"
    type="button"
  >
    로그아웃
  </button>

</header>


<main class="container">

  <div class="kicker">
    ADMIN DASHBOARD
  </div>

  <h1>
    대회관리
  </h1>

  <p class="desc">
    대회를 만들고, 저장된 대회를 다시 열어 이어서 관리합니다.
  </p>


  <button
    class="create-btn"
    id="createButton"
    type="button"
  >
    <span class="plus">＋</span>
    새 대회 만들기
  </button>


  <!-- 통계 -->

  <section class="stats">

    <div class="stat-card">

      <div class="stat-label">
        전체 대회
      </div>

      <div class="stat-bottom">

        <div
          class="stat-number"
          id="totalCount"
        >
          0
        </div>

        <div class="stat-badge total-badge">
          TOTAL
        </div>

      </div>

    </div>


    <div class="stat-card">

      <div class="stat-label">
        준비 중
      </div>

      <div class="stat-bottom">

        <div
          class="stat-number"
          id="draftCount"
        >
          0
        </div>

        <div class="stat-badge draft-badge">
          READY
        </div>

      </div>

    </div>


    <div class="stat-card">

      <div class="stat-label">
        진행 중
      </div>

      <div class="stat-bottom">

        <div
          class="stat-number"
          id="activeCount"
        >
          0
        </div>

        <div class="stat-badge live-badge">
          LIVE
        </div>

      </div>

    </div>


    <div class="stat-card">

      <div class="stat-label">
        종료
      </div>

      <div class="stat-bottom">

        <div
          class="stat-number"
          id="completedCount"
        >
          0
        </div>

        <div class="stat-badge finish-badge">
          FINISHED
        </div>

      </div>

    </div>

  </section>


  <!-- 저장 대회 -->

  <section class="section">

    <div class="section-head">

      <div>

        <div class="section-title">
          저장된 대회
        </div>

        <div class="section-sub">
          DB에 저장된 대회를 선택해 계속 진행할 수 있습니다.
        </div>

      </div>


      <button
        class="refresh-btn"
        id="refreshButton"
        type="button"
      >
        새로고침
      </button>

    </div>


    <div
      class="tournament-list"
      id="tournamentList"
    ></div>


    <div
      class="error-box"
      id="errorBox"
    ></div>

  </section>


  <footer class="footer">

    <div>
      <strong>FWT</strong>
      · FRIENDS WITH TENNIS
    </div>

    <div>
      CREATED BY
      <span class="q">Q</span>
    </div>

  </footer>

</main>


<!-- LOADING -->

<div
  class="loading-overlay"
  id="loadingOverlay"
>

  <div class="loading-box">

    <div class="spinner"></div>

    <div
      class="loading-title"
      id="loadingTitle"
    >
      대회 정보를 불러오고 있습니다
    </div>

    <div
      class="loading-text"
      id="loadingText"
    >
      FWT 데이터베이스에 연결 중입니다.
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://opwuyqerisocqobbbisg.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_Eo_zfONeGLs9ATCVg2Fk_g_y_IAJFV-";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentSession =
  null;


let tournaments =
  [];


let divisions =
  [];


let courts =
  [];


let entries =
  [];


let groups =
  [];


let matches =
  [];


let busy =
  false;


/* =====================================
   HELPERS
===================================== */

function escapeHtml(value) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value ?? "";

  return div.innerHTML;

}


function formatDate(value) {

  if (!value) {

    return "날짜 미정";

  }


  const parts =
    value.split("-");


  if (
    parts.length !== 3
  ) {

    return value;

  }


  return (
    `${parts[0]}.${parts[1]}.${parts[2]}`
  );

}


function statusText(status) {

  const map = {

    draft:"준비 중",
    active:"진행 중",
    completed:"종료",
    archived:"보관됨"

  };


  return (
    map[status] ||
    status ||
    "준비 중"
  );

}


function statusClass(status) {

  const map = {

    draft:"status-draft",
    active:"status-active",
    completed:"status-completed",
    archived:"status-archived"

  };


  return (
    map[status] ||
    "status-draft"
  );

}


function genderText(value) {

  const map = {

    male:"남자",
    female:"여자",
    mixed:"혼합",
    open:"오픈"

  };


  return (
    map[value] ||
    value ||
    ""
  );

}


function matchTypeText(value) {

  const map = {

    singles:"단식",
    doubles:"복식"

  };


  return (
    map[value] ||
    value ||
    ""
  );

}


function formatText(value) {

  const map = {

    group_knockout:
      "조별예선 + 본선",

    knockout:
      "토너먼트"

  };


  return (
    map[value] ||
    value ||
    ""
  );

}


/* =====================================
   AUTH
===================================== */

async function checkLogin() {

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getSession();


  if (
    error ||
    !data.session
  ) {

    location.href =
      "./";

    return false;

  }


  currentSession =
    data.session;


  return true;

}


/* =====================================
   LOADING
===================================== */

function setBusy(
  state,
  title = "",
  text = ""
) {

  busy =
    state;


  document.getElementById(
    "loadingOverlay"
  ).classList.toggle(
    "show",
    state
  );


  document.getElementById(
    "logoutButton"
  ).disabled =
    state;


  document.getElementById(
    "createButton"
  ).disabled =
    state;


  document.getElementById(
    "refreshButton"
  ).disabled =
    state;


  if (title) {

    document.getElementById(
      "loadingTitle"
    ).textContent =
      title;

  }


  if (text) {

    document.getElementById(
      "loadingText"
    ).textContent =
      text;

  }

}


/* =====================================
   LOAD DASHBOARD DATA
===================================== */

async function loadDashboard() {

  const {
    data:tournamentRows,
    error:tournamentError
  } =
    await supabaseClient
      .from("tournaments")
      .select(
        "id,name,tournament_date,status,is_public,created_at"
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if (
    tournamentError
  ) {

    throw new Error(
      "대회 목록 조회 실패: "
      +
      tournamentError.message
    );

  }


  tournaments =
    tournamentRows || [];


  if (
    tournaments.length === 0
  ) {

    divisions = [];
    courts = [];
    entries = [];
    groups = [];
    matches = [];

    renderDashboard();

    return;

  }


  const tournamentIds =
    tournaments.map(
      row =>
        row.id
    );


  /*
    DIVISIONS
  */

  const {
    data:divisionRows,
    error:divisionError
  } =
    await supabaseClient
      .from("divisions")
      .select(
        "id,tournament_id,name,match_type,gender,format,group_count,advance_count,expected_match_minutes,sort_order"
      )
      .in(
        "tournament_id",
        tournamentIds
      )
      .order(
        "sort_order",
        {
          ascending:true
        }
      );


  if (
    divisionError
  ) {

    throw new Error(
      "부문 조회 실패: "
      +
      divisionError.message
    );

  }


  divisions =
    divisionRows || [];


  /*
    COURTS
  */

  const {
    data:courtRows,
    error:courtError
  } =
    await supabaseClient
      .from("courts")
      .select(
        "id,tournament_id,name,sort_order,is_active"
      )
      .in(
        "tournament_id",
        tournamentIds
      )
      .order(
        "sort_order",
        {
          ascending:true
        }
      );


  if (
    courtError
  ) {

    throw new Error(
      "코트 조회 실패: "
      +
      courtError.message
    );

  }


  courts =
    courtRows || [];


  const divisionIds =
    divisions.map(
      row =>
        row.id
    );


  if (
    divisionIds.length === 0
  ) {

    entries = [];
    groups = [];
    matches = [];

    renderDashboard();

    return;

  }


  /*
    ENTRIES
  */

  const {
    data:entryRows,
    error:entryError
  } =
    await supabaseClient
      .from("entries")
      .select(
        "id,division_id,status,sort_order"
      )
      .in(
        "division_id",
        divisionIds
      );


  if (
    entryError
  ) {

    throw new Error(
      "참가자 조회 실패: "
      +
      entryError.message
    );

  }


  entries =
    entryRows || [];


  /*
    GROUPS
  */

  const {
    data:groupRows,
    error:groupError
  } =
    await supabaseClient
      .from("groups")
      .select(
        "id,division_id,name,sort_order"
      )
      .in(
        "division_id",
        divisionIds
      );


  if (
    groupError
  ) {

    throw new Error(
      "조편성 조회 실패: "
      +
      groupError.message
    );

  }


  groups =
    groupRows || [];


  /*
    MATCHES
  */

  const {
    data:matchRows,
    error:matchError
  } =
    await supabaseClient
      .from("matches")
      .select(
        "id,division_id,status,stage"
      )
      .in(
        "division_id",
        divisionIds
      );


  if (
    matchError
  ) {

    throw new Error(
      "경기 조회 실패: "
      +
      matchError.message
    );

  }


  matches =
    matchRows || [];


  renderDashboard();

}


/* =====================================
   TOURNAMENT DATA HELPERS
===================================== */

function divisionsForTournament(
  tournamentId
) {

  return divisions
    .filter(
      division =>
        division.tournament_id ===
        tournamentId
    )
    .sort(
      (a,b) =>
        Number(
          a.sort_order || 0
        )
        -
        Number(
          b.sort_order || 0
        )
    );

}


function courtsForTournament(
  tournamentId
) {

  return courts
    .filter(
      court =>
        court.tournament_id ===
        tournamentId
        &&
        court.is_active !== false
    )
    .sort(
      (a,b) =>
        Number(
          a.sort_order || 0
        )
        -
        Number(
          b.sort_order || 0
        )
    );

}


function entriesForDivision(
  divisionId
) {

  return entries.filter(
    entry =>
      entry.division_id ===
      divisionId
  );

}


function groupsForDivision(
  divisionId
) {

  return groups.filter(
    group =>
      group.division_id ===
      divisionId
  );

}


function matchesForDivision(
  divisionId
) {

  return matches.filter(
    match =>
      match.division_id ===
      divisionId
  );

}


/* =====================================
   PROGRESS
===================================== */

function getProgressInfo(
  tournament
) {

  const tournamentDivisions =
    divisionsForTournament(
      tournament.id
    );


  if (
    tournamentDivisions.length === 0
  ) {

    return {

      percent:5,
      label:"대회 기본정보 생성",
      action:"대회 계속 관리"

    };

  }


  const division =
    tournamentDivisions[0];


  const tournamentEntries =
    entriesForDivision(
      division.id
    );


  const tournamentGroups =
    groupsForDivision(
      division.id
    );


  const tournamentMatches =
    matchesForDivision(
      division.id
    );


  if (
    tournamentEntries.length === 0
  ) {

    return {

      percent:20,
      label:"참가자 등록 단계",
      action:"참가자 등록 계속"

    };

  }


  if (
    division.format ===
    "knockout"
  ) {

    if (
      tournamentMatches.length === 0
    ) {

      return {

        percent:45,
        label:"참가자 등록 완료",
        action:"대회 계속 관리"

      };

    }


    return {

      percent:75,
      label:"토너먼트 경기 진행",
      action:"경기 관리"

    };

  }


  if (
    tournamentGroups.length === 0
  ) {

    return {

      percent:40,
      label:"조편성 단계",
      action:"조편성 계속"

    };

  }


  if (
    tournamentMatches.length === 0
  ) {

    return {

      percent:55,
      label:"조편성 완료 · 대진 생성 단계",
      action:"대진 생성 계속"

    };

  }


  const completed =
    tournamentMatches
      .filter(
        match =>
          match.status ===
          "completed"
          ||
          match.status ===
          "bye"
          ||
          match.status ===
          "walkover"
      )
      .length;


  if (
    completed <
    tournamentMatches.length
  ) {

    return {

      percent:75,
      label:"경기 진행 중",
      action:"경기 관리"

    };

  }


  return {

    percent:90,
    label:"예선 경기 완료",
    action:"결과 관리"

  };

}

/* =====================================
   RENDER LIST
===================================== */

function renderTournamentList() {

  const box =
    document.getElementById(
      "tournamentList"
    );


  box.innerHTML = "";


  if (
    tournaments.length === 0
  ) {

    box.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ◉
        </div>

        <div class="empty-title">
          아직 저장된 대회가 없습니다.
        </div>

        <div class="empty-desc">
          새 대회를 만들면 이곳에서 다시 열어<br>
          언제든 이어서 관리할 수 있습니다.
        </div>

      </div>

    `;

    return;

  }


  tournaments.forEach(
    tournament => {

      const tournamentDivisions =
        divisionsForTournament(
          tournament.id
        );


      const firstDivision =
        tournamentDivisions[0] ||
        null;


      const tournamentCourts =
        courtsForTournament(
          tournament.id
        );


      const entryCount =
        tournamentDivisions
          .reduce(
            (
              sum,
              division
            ) =>
              sum
              +
              entriesForDivision(
                division.id
              ).length,
            0
          );


      const progress =
        getProgressInfo(
          tournament
        );


      let divisionText =
        "부문 미설정";


      if (
        firstDivision
      ) {

        divisionText =
          firstDivision.name
          ||
          `${
            genderText(
              firstDivision.gender
            )
          } ${
            matchTypeText(
              firstDivision.match_type
            )
          }`;


        if (
          tournamentDivisions.length > 1
        ) {

          divisionText +=
            ` 외 ${
              tournamentDivisions.length - 1
            }개`;

        }

      }


      const card =
        document.createElement(
          "article"
        );


      card.className =
        "tournament-card";


      card.innerHTML = `

        <div class="tournament-main">

          <div class="tournament-top">

            <div class="tournament-name">

              ${escapeHtml(
                tournament.name
              )}

            </div>


            <div
              class="status ${
                statusClass(
                  tournament.status
                )
              }"
            >
              ${escapeHtml(
                statusText(
                  tournament.status
                )
              )}
            </div>

          </div>


          <div class="meta">

            <div class="meta-chip">

              ${escapeHtml(
                formatDate(
                  tournament.tournament_date
                )
              )}

            </div>


            <div class="meta-chip">

              ${escapeHtml(
                divisionText
              )}

            </div>


            ${
              firstDivision
                ? `
                  <div class="meta-chip">
                    ${escapeHtml(
                      formatText(
                        firstDivision.format
                      )
                    )}
                  </div>
                `
                : ""
            }


            <div class="meta-chip">
              참가 ${entryCount}
            </div>


            <div class="meta-chip">
              코트 ${tournamentCourts.length}
            </div>

          </div>


          <div class="progress-area">

            <div class="progress-label">

              <span>
                ${escapeHtml(
                  progress.label
                )}
              </span>

              <span>
                ${progress.percent}%
              </span>

            </div>


            <div class="progress-track">

              <div
                class="progress-bar"
                style="
                  width:
                  ${progress.percent}%;
                "
              ></div>

            </div>

          </div>

        </div>


        <div class="tournament-actions">

          <button
            class="continue-btn"
            type="button"
          >
            ${escapeHtml(
              progress.action
            )}
            <span>→</span>
          </button>


          <button
            class="delete-btn"
            type="button"
          >
            대회 삭제
          </button>

        </div>

      `;


      card
        .querySelector(
          ".continue-btn"
        )
        .addEventListener(
          "click",
          function() {

            openTournament(
              tournament.id
            );

          }
        );


      card
        .querySelector(
          ".delete-btn"
        )
        .addEventListener(
          "click",
          function() {

            deleteTournament(
              tournament.id
            );

          }
        );


      box.appendChild(
        card
      );

    }
  );

}

/* =====================================
   LOAD FULL ENTRIES FOR SELECTED DIVISION

   players + entries + entry_members
   를 읽어 기존 페이지 형식으로 복원
===================================== */

async function loadEntriesForDivision(
  division
) {

  const {
    data:entryRows,
    error:entryError
  } =
    await supabaseClient
      .from("entries")
      .select(
        "id,display_name,seed,status,sort_order"
      )
      .eq(
        "division_id",
        division.id
      )
      .order(
        "sort_order",
        {
          ascending:true
        }
      );


  if (
    entryError
  ) {

    throw new Error(
      "참가자 정보 조회 실패: "
      +
      entryError.message
    );

  }


  if (
    !entryRows ||
    entryRows.length === 0
  ) {

    return [];

  }


  const entryIds =
    entryRows.map(
      row =>
        row.id
    );


  const {
    data:memberRows,
    error:memberError
  } =
    await supabaseClient
      .from("entry_members")
      .select(
        "entry_id,player_id,member_order"
      )
      .in(
        "entry_id",
        entryIds
      );


  if (
    memberError
  ) {

    throw new Error(
      "참가자 연결정보 조회 실패: "
      +
      memberError.message
    );

  }


  const playerIds =
    [
      ...new Set(
        (memberRows || [])
          .map(
            member =>
              member.player_id
          )
      )
    ];


  let playerRows = [];


  if (
    playerIds.length > 0
  ) {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("players")
        .select(
          "id,name,nickname"
        )
        .in(
          "id",
          playerIds
        );


    if (
      error
    ) {

      throw new Error(
        "선수정보 조회 실패: "
        +
        error.message
      );

    }


    playerRows =
      data || [];

  }


  const playerMap =
    new Map();


  playerRows.forEach(
    player => {

      playerMap.set(
        player.id,
        player
      );

    }
  );


  const membersByEntry =
    new Map();


  (memberRows || [])
    .forEach(
      member => {

        if (
          !membersByEntry.has(
            member.entry_id
          )
        ) {

          membersByEntry.set(
            member.entry_id,
            []
          );

        }


        membersByEntry
          .get(
            member.entry_id
          )
          .push(
            member
          );

      }
    );


  return entryRows.map(
    entryRow => {

      const members =
        (
          membersByEntry.get(
            entryRow.id
          ) || []
        )
        .sort(
          (a,b) =>
            a.member_order -
            b.member_order
        );


      if (
        division.match_type ===
        "doubles"
      ) {

        const member1 =
          members.find(
            member =>
              member.member_order === 1
          );


        const member2 =
          members.find(
            member =>
              member.member_order === 2
          );


        const player1 =
          member1
            ? playerMap.get(
                member1.player_id
              )
            : null;


        const player2 =
          member2
            ? playerMap.get(
                member2.player_id
              )
            : null;


        return {

          type:"doubles",

          dbEntryId:
            entryRow.id,

          sortOrder:
            entryRow.sort_order,

          player1: {

            dbPlayerId:
              player1?.id || null,

            name:
              player1?.name || "",

            nickname:
              player1?.nickname || ""

          },

          player2: {

            dbPlayerId:
              player2?.id || null,

            name:
              player2?.name || "",

            nickname:
              player2?.nickname || ""

          }

        };

      }


      const member =
        members[0] || null;


      const player =
        member
          ? playerMap.get(
              member.player_id
            )
          : null;


      return {

        type:"singles",

        dbEntryId:
          entryRow.id,

        dbPlayerId:
          player?.id || null,

        sortOrder:
          entryRow.sort_order,

        name:
          player?.name || "",

        nickname:
          player?.nickname || ""

      };

    }
  );

}


/* =====================================
   LOAD GROUP DATA

   기존 group-matches.html과 호환되게
   members를 entry 배열 index로 복원
===================================== */

async function loadGroupDataForDivision(
  division,
  restoredEntries
) {

  const {
    data:groupRows,
    error:groupError
  } =
    await supabaseClient
      .from("groups")
      .select(
        "id,name,sort_order"
      )
      .eq(
        "division_id",
        division.id
      )
      .order(
        "sort_order",
        {
          ascending:true
        }
      );


  if (
    groupError
  ) {

    throw new Error(
      "조편성 조회 실패: "
      +
      groupError.message
    );

  }


  if (
    !groupRows ||
    groupRows.length === 0
  ) {

    return {

      groupData:[],
      assignments:
        new Array(
          restoredEntries.length
        ).fill(null)

    };

  }


  const groupIds =
    groupRows.map(
      row =>
        row.id
    );


  const {
    data:groupEntryRows,
    error:groupEntryError
  } =
    await supabaseClient
      .from("group_entries")
      .select(
        "group_id,entry_id,seed_order"
      )
      .in(
        "group_id",
        groupIds
      );


  if (
    groupEntryError
  ) {

    throw new Error(
      "조 참가자 조회 실패: "
      +
      groupEntryError.message
    );

  }


  const entryIndexMap =
    new Map();


  restoredEntries.forEach(
    (
      entry,
      index
    ) => {

      entryIndexMap.set(
        entry.dbEntryId,
        index
      );

    }
  );


  const assignments =
    new Array(
      restoredEntries.length
    ).fill(null);


  const groupData =
    groupRows.map(
      group => {

        const memberRows =
          (groupEntryRows || [])
            .filter(
              row =>
                row.group_id ===
                group.id
            )
            .sort(
              (a,b) =>
                Number(
                  a.seed_order || 0
                )
                -
                Number(
                  b.seed_order || 0
                )
            );


        const members =
          memberRows
            .map(
              row =>
                entryIndexMap.get(
                  row.entry_id
                )
            )
            .filter(
              index =>
                index !== undefined
            );


        members.forEach(
          index => {

            assignments[index] =
              group.name;

          }
        );


        return {

          name:
            group.name,

          dbGroupId:
            group.id,

          members:
            members

        };

      }
    );


  return {

    groupData,
    assignments

  };

}


/* =====================================
   OPEN TOURNAMENT
===================================== */

async function openTournament(
  tournamentId
) {

  if (busy) {

    return;

  }


  const tournament =
    tournaments.find(
      row =>
        row.id ===
        tournamentId
    );


  if (!tournament) {

    alert(
      "대회 정보를 찾을 수 없습니다."
    );

    return;

  }


  const tournamentDivisions =
    divisionsForTournament(
      tournament.id
    );


  if (
    tournamentDivisions.length === 0
  ) {

    alert(
      "이 대회의 부문 정보를 찾을 수 없습니다."
    );

    return;

  }


  /*
    현재 생성화면은 대회당 첫 부문 1개를
    만드는 구조이므로 우선 첫 부문 사용.
  */

  const division =
    tournamentDivisions[0];


  const tournamentCourts =
    courtsForTournament(
      tournament.id
    );


  try {

    setBusy(
      true,
      "대회를 불러오고 있습니다",
      "참가자와 현재 진행 단계를 복원하고 있습니다."
    );


    clearCurrentTournamentSession();


    /*
      1. 대회 기본정보를
         기존 페이지가 사용하는 형식으로 복원
    */

    const tournamentContext = {

      tournamentId:
        tournament.id,

      divisionId:
        division.id,

      tournamentName:
        tournament.name,

      tournamentDate:
        tournament.tournament_date,

      format:
        division.format,

      matchType:
        division.match_type,

      gender:
        division.gender,

      divisionName:
        division.name,

      groupCount:
        Number(
          division.group_count || 0
        ),

      advanceCount:
        Number(
          division.advance_count || 0
        ),

      matchDuration:
        division.expected_match_minutes,

      courts:
        tournamentCourts.map(
          court =>
            court.name
        ),

      courtRecords:
        tournamentCourts.map(
          court => ({

            id:
              court.id,

            name:
              court.name,

            sortOrder:
              court.sort_order

          })
        )

    };


    sessionStorage.setItem(
      "fwtNewTournament",
      JSON.stringify(
        tournamentContext
      )
    );


    /*
      2. 참가자 DB에서 복원
    */

    const restoredEntries =
      await loadEntriesForDivision(
        division
      );


    sessionStorage.setItem(
      "fwtNewTournamentEntries",
      JSON.stringify(
        restoredEntries
      )
    );


    /*
      참가자가 없으면
      참가자 등록으로
    */

    if (
      restoredEntries.length === 0
    ) {

      location.href =
        "./participant-registration.html";

      return;

    }


    /*
      토너먼트 전용 방식은
      knockout-setup 페이지가 아직
      완성 전이라 현재는 참가자 페이지로 복귀.
    */

    if (
      division.format ===
      "knockout"
    ) {

      setBusy(false);


      alert(
        "이 대회는 토너먼트 전용 방식입니다.\n\n현재 토너먼트 전용 대진 설정 화면은 아직 연결 작업 전이므로 참가자 등록 화면으로 이동합니다."
      );


      location.href =
        "./participant-registration.html";

      return;

    }


    /*
      3. 조편성 DB에서 복원
    */

    const {
      groupData,
      assignments
    } =
      await loadGroupDataForDivision(
        division,
        restoredEntries
      );


    sessionStorage.setItem(
      "fwtGroupData",
      JSON.stringify(
        groupData
      )
    );


    sessionStorage.setItem(
      "fwtGroupAssignments",
      JSON.stringify(
        assignments
      )
    );


    /*
      조편성이 없으면
      group-setup
    */

    if (
      groupData.length === 0
    ) {

      location.href =
        "./group-setup.html";

      return;

    }


    /*
      현재 group-matches 이후는
      아직 DB 이전 작업 전.

      조가 DB에 있다면
      우선 대진 생성 단계로 복귀.
    */

    location.href =
      "./group-matches.html";


  } catch(error) {

    console.error(error);


    setBusy(false);


    alert(
      "대회를 불러오지 못했습니다.\n\n"
      +
      (
        error?.message ||
        "알 수 없는 오류가 발생했습니다."
      )
    );

  }

}


/* =====================================
   DELETE TOURNAMENT
===================================== */

async function deleteTournament(
  tournamentId
) {

  if (busy) {

    return;

  }


  const tournament =
    tournaments.find(
      row =>
        row.id ===
        tournamentId
    );


  if (!tournament) {

    return;

  }


  const firstConfirm =
    confirm(
      `"${tournament.name}" 대회를 삭제할까요?\n\n참가자, 조편성, 경기 데이터도 함께 삭제됩니다.`
    );


  if (!firstConfirm) {

    return;

  }


  const secondConfirm =
    confirm(
      "삭제한 대회는 되돌릴 수 없습니다.\n정말 삭제하시겠습니까?"
    );


  if (!secondConfirm) {

    return;

  }


  try {

    setBusy(
      true,
      "대회를 삭제하고 있습니다",
      "연결된 대회 데이터를 정리하고 있습니다."
    );


    const {
      error
    } =
      await supabaseClient
        .from("tournaments")
        .delete()
        .eq(
          "id",
          tournamentId
        );


    if (error) {

      throw new Error(
        error.message
      );

    }


    /*
      현재 선택중인 대회였다면
      sessionStorage도 제거
    */

    const current =
      JSON.parse(
        sessionStorage.getItem(
          "fwtNewTournament"
        ) || "null"
      );


    if (
      current?.tournamentId ===
      tournamentId
    ) {

      clearCurrentTournamentSession();

    }


    await loadDashboard();


    setBusy(false);


  } catch(error) {

    console.error(error);


    setBusy(false);


    alert(
      "대회를 삭제하지 못했습니다.\n\n"
      +
      (
        error?.message ||
        "알 수 없는 오류"
      )
    );

  }

}


/* =====================================
   LOGOUT
===================================== */

async function logout() {

  if (busy) {

    return;

  }


  try {

    setBusy(
      true,
      "로그아웃 중",
      "관리자 세션을 종료하고 있습니다."
    );


    await supabaseClient
      .auth
      .signOut();


    /*
      DB 데이터는 삭제하지 않음.
      현재 브라우저 작업 데이터만 비움.
    */

    clearCurrentTournamentSession();


    location.href =
      "./";


  } catch(error) {

    console.error(error);


    setBusy(false);


    alert(
      "로그아웃하지 못했습니다."
    );

  }

}


/* =====================================
   REFRESH
===================================== */

async function refreshDashboard() {

  if (busy) {

    return;

  }


  try {

    setBusy(
      true,
      "대회 정보를 새로고침합니다",
      "FWT 데이터베이스를 다시 확인하고 있습니다."
    );


    await loadDashboard();


    setBusy(false);


  } catch(error) {

    console.error(error);


    setBusy(false);


    showError(
      error.message
    );

  }

}


/* =====================================
   ERROR
===================================== */

function showError(message) {

  const box =
    document.getElementById(
      "errorBox"
    );


  box.textContent =
    message;


  box.classList.add(
    "show"
  );

}


function clearError() {

  const box =
    document.getElementById(
      "errorBox"
    );


  box.textContent = "";


  box.classList.remove(
    "show"
  );

}


/* =====================================
   EVENTS
===================================== */

document.getElementById(
  "createButton"
).addEventListener(
  "click",
  function() {

    location.href =
      "./create-tournament.html";

  }
);


document.getElementById(
  "logoutButton"
).addEventListener(
  "click",
  logout
);


document.getElementById(
  "refreshButton"
).addEventListener(
  "click",
  refreshDashboard
);


/* =====================================
   START
===================================== */

async function start() {

  const loggedIn =
    await checkLogin();


  if (!loggedIn) {

    return;

  }


  try {

    clearError();


    setBusy(
      true,
      "대회 정보를 불러오고 있습니다",
      "저장된 FWT 대회 목록을 확인하고 있습니다."
    );


    await loadDashboard();


    setBusy(false);


  } catch(error) {

    console.error(error);


    setBusy(false);


    showError(
      "대회 정보를 불러오지 못했습니다. "
      +
      (
        error?.message ||
        ""
      )
    );

  }

}


start();

</script>
