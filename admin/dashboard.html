<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FWT Tournament Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --navy:#071a31;
      --navy2:#0c294a;
      --blue:#184a79;
      --lime:#c9df45;

      --bg:#f3f6f9;
      --white:#fff;
      --text:#172033;
      --muted:#687587;
      --line:#dfe5eb;

      --green:#178b61;
      --green-soft:#edf8f3;

      --orange:#9a671e;
      --orange-soft:#fff7eb;

      --gray-soft:#f1f4f7;

      --red:#c64b4b;
      --red-soft:#fff2f2;

      --shadow:
        0 12px 35px rgba(20,35,55,.06);
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      min-height:100%;

      background:var(--bg);
      color:var(--text);

      font-family:
        Inter,
        Pretendard,
        "Noto Sans KR",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button{
      font:inherit;
      cursor:pointer;
    }

    button:disabled{
      cursor:not-allowed;
      opacity:.5;
    }

    /* HEADER */

    .topbar{
      min-height:74px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:0 20px;

      background:
        linear-gradient(
          110deg,
          #06172b,
          #0a2848 62%,
          #103b67
        );

      box-shadow:
        0 5px 20px rgba(6,23,43,.16);
    }

    .logo-wrap{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .fwt-logo{
      color:white;

      font-size:31px;
      line-height:1;

      font-weight:950;
      font-style:italic;
      letter-spacing:-4px;

      transform:skew(-5deg);
    }

    .fwt-logo span{
      color:var(--lime);
    }

    .admin-label{
      color:rgba(255,255,255,.58);

      font-size:10px;
      font-weight:850;
      letter-spacing:1.5px;
    }

    .logout-btn{
      min-height:44px;

      padding:0 15px;

      border:
        1px solid rgba(255,255,255,.15);

      border-radius:10px;

      background:
        rgba(255,255,255,.08);

      color:white;

      font-size:12px;
      font-weight:850;
    }

    /* PAGE */

    .container{
      width:
        min(
          1160px,
          calc(100% - 34px)
        );

      margin:0 auto;

      padding:34px 0 60px;
    }

    .page-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;

      gap:18px;

      margin-bottom:20px;
    }

    .kicker{
      margin-bottom:7px;

      color:var(--blue);

      font-size:11px;
      font-weight:950;
      letter-spacing:2px;
    }

    h1{
      margin:0;

      color:var(--navy);

      font-size:35px;
      font-weight:950;
      letter-spacing:-1.5px;
    }

    .desc{
      margin:8px 0 0;

      color:var(--muted);

      font-size:13px;
      line-height:1.65;
    }

    .create-btn{
      min-width:190px;
      height:54px;
      min-height:54px;

      border:0;
      border-radius:11px;

      background:
        linear-gradient(
          115deg,
          var(--navy),
          #123e6c
        );

      color:white;

      font-size:13px;
      font-weight:950;
    }

    .create-btn span{
      color:var(--lime);

      margin-left:5px;
    }

    /* STATS */

    .stats{
      display:grid;

      grid-template-columns:
        repeat(4,minmax(0,1fr));

      gap:9px;

      margin-bottom:20px;
    }

    .stat-card{
      padding:17px;

      border:1px solid var(--line);
      border-radius:14px;

      background:white;

      box-shadow:var(--shadow);
    }

    .stat-label{
      color:#718092;

      font-size:10px;
      font-weight:850;
    }

    .stat-value{
      margin-top:5px;

      color:var(--navy);

      font-size:27px;
      font-weight:950;
    }

    /* SECTION */

    .section-head{
      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:10px;

      margin:7px 0 11px;
    }

    .section-title{
      color:var(--navy);

      font-size:19px;
      font-weight:950;
    }

    .section-sub{
      color:#778394;

      font-size:11px;
      font-weight:750;
    }

    /* TOURNAMENT LIST */

    .tournament-list{
      display:flex;
      flex-direction:column;

      gap:11px;
    }

    .tournament-card{
      overflow:hidden;

      border:1px solid var(--line);
      border-radius:17px;

      background:white;

      box-shadow:var(--shadow);
    }

    .tournament-main{
      display:grid;

      grid-template-columns:
        minmax(0,1fr) auto;

      gap:16px;

      padding:18px;
    }

    .tournament-name{
      color:var(--navy);

      font-size:20px;
      font-weight:950;
      letter-spacing:-.5px;
    }

    .tournament-meta{
      display:flex;
      flex-wrap:wrap;

      gap:6px;

      margin-top:9px;
    }

    .chip{
      min-height:27px;

      display:inline-flex;
      align-items:center;

      padding:0 9px;

      border-radius:999px;

      background:#f0f3f6;
      color:#586678;

      font-size:10px;
      font-weight:850;
    }

    .chip.active{
      background:var(--green-soft);
      color:var(--green);
    }

    .chip.completed{
      background:#edf3fb;
      color:#285c91;
    }

    .chip.draft{
      background:var(--orange-soft);
      color:var(--orange);
    }

    .progress-wrap{
      margin-top:14px;
    }

    .progress-top{
      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:10px;

      margin-bottom:6px;
    }

    .progress-label{
      color:#596779;

      font-size:11px;
      font-weight:850;
    }

    .progress-count{
      color:var(--navy);

      font-size:11px;
      font-weight:950;
    }

    .progress{
      height:7px;

      overflow:hidden;

      border-radius:999px;

      background:#ebeff3;
    }

    .progress-bar{
      height:100%;

      border-radius:999px;

      background:
        linear-gradient(
          90deg,
          var(--navy),
          #35658e
        );
    }

    .card-actions{
      min-width:165px;

      display:flex;
      flex-direction:column;

      gap:7px;
    }

    .manage-btn,
    .delete-btn{
      width:100%;
      min-height:47px;

      border-radius:10px;

      font-size:12px;
      font-weight:900;
    }

    .manage-btn{
      border:0;

      background:var(--navy);
      color:white;
    }

    .manage-btn span{
      margin-left:4px;

      color:var(--lime);
    }

    .delete-btn{
      border:1px solid #ead5d5;

      background:white;
      color:var(--red);
    }

    .empty{
      padding:50px 20px;

      border:1px dashed #ced6de;
      border-radius:16px;

      background:white;

      text-align:center;
    }

    .empty-title{
      color:var(--navy);

      font-size:18px;
      font-weight:950;
    }

    .empty-text{
      margin-top:7px;

      color:#718092;

      font-size:12px;
      line-height:1.6;
    }

    /* LOADING */

    .loading-overlay{
      display:none;

      position:fixed;
      inset:0;

      z-index:500;

      align-items:center;
      justify-content:center;

      padding:20px;

      background:rgba(4,17,31,.62);
    }

    .loading-overlay.show{
      display:flex;
    }

    .loading-box{
      width:min(350px,100%);

      padding:25px;

      border-radius:17px;

      background:white;

      text-align:center;

      box-shadow:
        0 30px 80px rgba(0,0,0,.25);
    }

    .spinner{
      width:38px;
      height:38px;

      margin:0 auto 15px;

      border:4px solid #e6eaee;
      border-top-color:var(--navy);

      border-radius:50%;

      animation:spin .8s linear infinite;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    .loading-title{
      color:var(--navy);

      font-size:16px;
      font-weight:950;
    }

    .loading-text{
      margin-top:6px;

      color:#657184;

      font-size:12px;
      line-height:1.6;
    }

    /* FOOTER */

    .footer{
      display:flex;
      justify-content:space-between;

      margin-top:28px;
      padding-top:17px;

      border-top:1px solid #e2e6eb;

      color:#7c8795;

      font-size:10px;
      letter-spacing:1px;
    }

    .footer strong{
      color:var(--navy);
    }

    .q{
      color:#91a719;
      font-weight:950;
    }

    /* MOBILE */

    @media(max-width:700px){

      .topbar{
        min-height:72px;

        padding:0 14px;
      }

      .fwt-logo{
        font-size:30px;
      }

      .admin-label{
        display:none;
      }

      .logout-btn{
        height:46px;
        min-height:46px;

        flex:none;
      }

      .container{
        width:calc(100% - 22px);

        padding:25px 0 50px;
      }

      .page-head{
        display:block;
      }

      h1{
        font-size:31px;
      }

      .desc{
        font-size:14px;
      }

      .create-btn{
        width:100%;
        height:56px;
        min-height:56px;

        margin-top:15px;

        font-size:15px;
      }

      .stats{
        grid-template-columns:
          repeat(2,minmax(0,1fr));

        gap:7px;
      }

      .stat-card{
        padding:14px;
      }

      .stat-label{
        font-size:11px;
      }

      .stat-value{
        font-size:25px;
      }

      .section-title{
        font-size:20px;
      }

      .section-sub{
        font-size:11px;
      }

      .tournament-main{
        grid-template-columns:1fr;

        gap:14px;

        padding:15px;
      }

      .tournament-name{
        font-size:20px;
      }

      .chip{
        min-height:29px;

        font-size:11px;
      }

      .progress-label,
      .progress-count{
        font-size:12px;
      }

      .card-actions{
        min-width:0;

        display:grid;

        grid-template-columns:
          1fr .55fr;

        gap:7px;
      }

      .manage-btn,
      .delete-btn{
        height:54px;
        min-height:54px;

        font-size:14px;
      }

    }

  </style>
</head>

<body>

<header class="topbar">

  <div class="logo-wrap">

    <div class="fwt-logo">
      FW<span>T</span>
    </div>

    <div class="admin-label">
      TOURNAMENT ADMIN
    </div>

  </div>


  <button
    class="logout-btn"
    id="logoutButton"
    type="button"
  >
    로그아웃
  </button>

</header>


<main class="container">

  <div class="page-head">

    <div>

      <div class="kicker">
        TOURNAMENT DASHBOARD
      </div>

      <h1>
        대회 관리
      </h1>

      <p class="desc">
        저장된 대회를 선택하면 DB 진행상태를 확인해 마지막 운영 단계로 이동합니다.
      </p>

    </div>


    <button
      class="create-btn"
      type="button"
      onclick="location.href='./create-tournament.html'"
    >
      새 대회 만들기
      <span>+</span>
    </button>

  </div>


  <section class="stats">

    <div class="stat-card">
      <div class="stat-label">전체 대회</div>
      <div class="stat-value" id="totalStat">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">준비중</div>
      <div class="stat-value" id="draftStat">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">진행중</div>
      <div class="stat-value" id="activeStat">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">완료</div>
      <div class="stat-value" id="completedStat">0</div>
    </div>

  </section>


  <div class="section-head">

    <div class="section-title">
      저장된 대회
    </div>

    <div class="section-sub">
      SUPABASE DATABASE
    </div>

  </div>


  <section
    class="tournament-list"
    id="tournamentList"
  ></section>


  <footer class="footer">

    <div>
      <strong>FWT</strong>
      · FRIENDS WITH TENNIS
    </div>

    <div>
      CREATED BY
      <span class="q">Q</span>
    </div>

  </footer>

</main>


<div
  class="loading-overlay"
  id="loadingOverlay"
>

  <div class="loading-box">

    <div class="spinner"></div>

    <div
      class="loading-title"
      id="loadingTitle"
    >
      대회 정보를 불러오고 있습니다
    </div>

    <div
      class="loading-text"
      id="loadingText"
    >
      FWT 데이터베이스를 확인 중입니다.
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://opwuyqerisocqobbbisg.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_Eo_zfONeGLs9ATCVg2Fk_g_y_IAJFV-";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let tournaments = [];

let tournamentSummaries = [];

let busy = false;


/* =====================================
   HTML
===================================== */

function escapeHtml(value){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value ?? "";

  return div.innerHTML;

}


/* =====================================
   AUTH
===================================== */

async function checkLogin(){

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getSession();


  if (
    error ||
    !data.session
  ){

    location.href =
      "./";

    return false;

  }


  return true;

}


/* =====================================
   BUSY
===================================== */

function setBusy(
  state,
  title = "",
  text = ""
){

  busy = state;


  document.getElementById(
    "loadingOverlay"
  ).classList.toggle(
    "show",
    state
  );


  document.getElementById(
    "logoutButton"
  ).disabled =
    state;


  if (title){

    document.getElementById(
      "loadingTitle"
    ).textContent =
      title;

  }


  if (text){

    document.getElementById(
      "loadingText"
    ).textContent =
      text;

  }

}


/* =====================================
   DATE
===================================== */

function formatDate(value){

  if (!value){
    return "날짜 미정";
  }


  const date =
    new Date(
      `${value}T00:00:00`
    );


  if (
    Number.isNaN(
      date.getTime()
    )
  ){
    return value;
  }


  return new Intl.DateTimeFormat(
    "ko-KR",
    {
      year:"numeric",
      month:"long",
      day:"numeric"
    }
  ).format(date);

}


/* =====================================
   LABELS
===================================== */

function formatLabel(value){

  const map = {

    group_knockout:
      "조별예선 + 본선",

    knockout:
      "토너먼트",

    singles:
      "단식",

    doubles:
      "복식",

    male:
      "남자",

    female:
      "여자",

    mixed:
      "혼합",

    open:
      "오픈"

  };


  return (
    map[value] ||
    value ||
    "-"
  );

}


function statusLabel(status){

  const map = {
    draft:"준비중",
    active:"진행중",
    completed:"완료",
    archived:"보관"
  };


  return (
    map[status] ||
    status ||
    "준비중"
  );

}


/* =====================================
   CLEAR CURRENT SESSION

   다른 대회를 선택했을 때
   이전 대회의 sessionStorage가 섞이는
   문제를 막는다.
===================================== */

function clearCurrentTournamentSession(){

  [
    "fwtNewTournament",
    "fwtNewTournamentEntries",
    "fwtGroupAssignments",
    "fwtGroupData",
    "fwtGroupMatches",
    "fwtMatchControlState",
    "fwtStandingsData",
    "fwtKnockoutQualifiers",
    "fwtKnockoutBracket"
  ]
    .forEach(
      key =>
        sessionStorage.removeItem(
          key
        )
    );

}


/* =====================================
   DASHBOARD LOAD
===================================== */

async function loadDashboard(){

  const {
    data:tournamentRows,
    error:tournamentError
  } =
    await supabaseClient
      .from("tournaments")
      .select(
        "id,name,tournament_date,status,is_public,created_at,updated_at"
      )
      .order(
        "tournament_date",
        {
          ascending:false,
          nullsFirst:false
        }
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if (tournamentError){

    throw new Error(
      "대회 목록 조회 실패: "
      +
      tournamentError.message
    );

  }


  tournaments =
    tournamentRows || [];


  if (
    tournaments.length === 0
  ){

    tournamentSummaries = [];

    renderDashboard();

    return;

  }


  const tournamentIds =
    tournaments.map(
      row => row.id
    );


  const [
    divisionResult,
    courtResult
  ] =
    await Promise.all([

      supabaseClient
        .from("divisions")
        .select(
          "id,tournament_id,name,match_type,gender,format,group_count,advance_count,expected_match_minutes,sort_order"
        )
        .in(
          "tournament_id",
          tournamentIds
        )
        .order(
          "sort_order",
          {
            ascending:true
          }
        ),

      supabaseClient
        .from("courts")
        .select(
          "id,tournament_id,name,sort_order,is_active"
        )
        .in(
          "tournament_id",
          tournamentIds
        )

    ]);


  if (
    divisionResult.error
  ){

    throw new Error(
      "부문 조회 실패: "
      +
      divisionResult.error.message
    );

  }


  if (
    courtResult.error
  ){

    throw new Error(
      "코트 조회 실패: "
      +
      courtResult.error.message
    );

  }


  const divisions =
    divisionResult.data || [];


  const divisionIds =
    divisions.map(
      row => row.id
    );


  let entries = [];

  let groups = [];

  let matches = [];


  if (
    divisionIds.length > 0
  ){

    const [
      entryResult,
      groupResult,
      matchResult
    ] =
      await Promise.all([

        supabaseClient
          .from("entries")
          .select(
            "id,division_id,status"
          )
          .in(
            "division_id",
            divisionIds
          ),

        supabaseClient
          .from("groups")
          .select(
            "id,division_id"
          )
          .in(
            "division_id",
            divisionIds
          ),

        supabaseClient
          .from("matches")
          .select(
            "id,division_id,stage,status"
          )
          .in(
            "division_id",
            divisionIds
          )

      ]);


    if (
      entryResult.error
    ){

      throw new Error(
        "참가자 조회 실패: "
        +
        entryResult.error.message
      );

    }


    if (
      groupResult.error
    ){

      throw new Error(
        "조편성 조회 실패: "
        +
        groupResult.error.message
      );

    }


    if (
      matchResult.error
    ){

      throw new Error(
        "경기 조회 실패: "
        +
        matchResult.error.message
      );

    }


    entries =
      entryResult.data || [];


    groups =
      groupResult.data || [];


    matches =
      matchResult.data || [];

  }


  tournamentSummaries =
    tournaments.map(
      tournament => {

        /*
          현재 UI는 대회당 첫 번째 division을
          관리 대상으로 사용.
        */

        const division =
          divisions.find(
            row =>
              row.tournament_id ===
              tournament.id
          ) || null;


        const divisionId =
          division?.id ||
          null;


        const divisionEntries =
          entries.filter(
            row =>
              row.division_id ===
              divisionId
          );


        const divisionGroups =
          groups.filter(
            row =>
              row.division_id ===
              divisionId
          );


        const divisionMatches =
          matches.filter(
            row =>
              row.division_id ===
              divisionId
          );


        const groupMatches =
          divisionMatches.filter(
            row =>
              row.stage ===
              "group"
          );


        const knockoutMatches =
          divisionMatches.filter(
            row =>
              row.stage !==
              "group"
          );


        const completedMatches =
          divisionMatches.filter(
            row =>
              [
                "completed",
                "bye",
                "walkover"
              ].includes(
                row.status
              )
          ).length;


        const courtCount =
          (courtResult.data || [])
            .filter(
              row =>
                row.tournament_id ===
                tournament.id
                &&
                row.is_active !== false
            )
            .length;


        const progress =
          getProgressInfo({

            division,

            entryCount:
              divisionEntries.length,

            groupCount:
              divisionGroups.length,

            groupMatches,

            knockoutMatches

          });


        return {

          tournament,

          division,

          entryCount:
            divisionEntries.length,

          groupCount:
            divisionGroups.length,

          matchCount:
            divisionMatches.length,

          completedMatches,

          courtCount,

          progress

        };

      }
    );


  renderDashboard();

}


/* =====================================
   PROGRESS
===================================== */

function getProgressInfo({
  division,
  entryCount,
  groupCount,
  groupMatches,
  knockoutMatches
}){

  if (!division){

    return {
      label:"부문 설정 필요",
      percent:5
    };

  }


  if (
    entryCount === 0
  ){

    return {
      label:"참가자 등록",
      percent:10
    };

  }


  if (
    division.format ===
    "knockout"
  ){

    if (
      knockoutMatches.length > 0
    ){

      const finished =
        knockoutMatches.filter(
          row =>
            [
              "completed",
              "bye",
              "walkover"
            ].includes(
              row.status
            )
        ).length;


      return {
        label:
          `본선 경기 ${finished}/${knockoutMatches.length}`,
        percent:
          Math.min(
            100,
            50 +
            (
              knockoutMatches.length
                ? (
                    finished /
                    knockoutMatches.length
                  ) * 50
                : 0
            )
          )
      };

    }


    return {
      label:"본선 대진 준비",
      percent:35
    };

  }


  if (
    groupCount === 0
  ){

    return {
      label:"조편성",
      percent:25
    };

  }


  if (
    groupMatches.length === 0
  ){

    return {
      label:"예선 대진 생성",
      percent:38
    };

  }


  const groupFinished =
    groupMatches.filter(
      row =>
        [
          "completed",
          "bye",
          "walkover"
        ].includes(
          row.status
        )
    ).length;


  if (
    knockoutMatches.length > 0
  ){

    const knockoutFinished =
      knockoutMatches.filter(
        row =>
          [
            "completed",
            "bye",
            "walkover"
          ].includes(
            row.status
          )
      ).length;


    const ratio =
      knockoutMatches.length
        ? (
            knockoutFinished /
            knockoutMatches.length
          )
        : 0;


    return {
      label:
        `본선 ${knockoutFinished}/${knockoutMatches.length}`,
      percent:
        Math.min(
          100,
          75 +
          ratio * 25
        )
    };

  }


  if (
    groupFinished >=
    groupMatches.length
  ){

    return {
      label:"예선 완료 · 본선 준비",
      percent:72
    };

  }


  return {
    label:
      `예선 ${groupFinished}/${groupMatches.length}`,
    percent:
      40 +
      (
        groupMatches.length
          ? (
              groupFinished /
              groupMatches.length
            ) * 30
          : 0
      )
  };

}


/* =====================================
   RENDER DASHBOARD
===================================== */

function renderDashboard(){

  document.getElementById(
    "totalStat"
  ).textContent =
    tournaments.length;


  document.getElementById(
    "draftStat"
  ).textContent =
    tournaments.filter(
      item =>
        item.status ===
        "draft"
    ).length;


  document.getElementById(
    "activeStat"
  ).textContent =
    tournaments.filter(
      item =>
        item.status ===
        "active"
    ).length;


  document.getElementById(
    "completedStat"
  ).textContent =
    tournaments.filter(
      item =>
        item.status ===
        "completed"
    ).length;


  const box =
    document.getElementById(
      "tournamentList"
    );


  box.innerHTML = "";


  if (
    tournamentSummaries.length === 0
  ){

    box.innerHTML = `

      <div class="empty">

        <div class="empty-title">
          아직 저장된 대회가 없습니다.
        </div>

        <div class="empty-text">

  tournamentSummaries.forEach(

      const division =

      card.innerHTML = `

        <div class="tournament-main">

          <div>

            <div class="tournament-name">
              ${escapeHtml(
                tournament.name
              )}
            </div>


            <div class="tournament-meta">

              <span class="chip ${escapeHtml(status)}">
                ${escapeHtml(
                  statusLabel(status)
                )}
              </span>

              <span class="chip">
                ${escapeHtml(
                  formatDate(
                    tournament.tournament_date
                  )
                )}
              </span>

              ${
                division
                  ? `
                    <span class="chip">
                      ${escapeHtml(
                        division.name
                      )}
                    </span>

                    <span class="chip">
                      ${escapeHtml(
                        formatLabel(
                          division.match_type
                        )
                      )}
                    </span>

                    <span class="chip">
                      참가 ${summary.entryCount}
                    </span>

                    <span class="chip">
                      코트 ${summary.courtCount}
                    </span>
                  `
                  : ""
              }

            </div>


            <div class="progress-wrap">

              <div class="progress-top">

                <div class="progress-label">
                  ${escapeHtml(
                    summary.progress.label
                  )}
                </div>

                <div class="progress-count">

                </div>

              </div>


              <div class="progress">

                  class="progress-bar"

                    Math.min(
                      100,

            <button

            <button

    }
  );

}


/* =====================================
   LOAD FULL TOURNAMENT CONTEXT
===================================== */

async function continueTournament(
  tournamentId
){

  if (busy){
    return;
  }


  try{

    setBusy(
      true,
      "대회 진행상태를 복원하고 있습니다",
      "참가자, 조편성, 경기 결과와 본선 대진을 DB에서 확인 중입니다."
    );


    clearCurrentTournamentSession();


    /* TOURNAMENT */

    const {
      data:tournament,
      error:tournamentError
    } =
      await supabaseClient
        .from("tournaments")
        .select(
          "id,name,tournament_date,status,is_public"
        )
        .eq(
          "id",
          tournamentId
        )
        .single();


    if (
      tournamentError ||
      !tournament
    ){

      throw new Error(
        "대회 정보를 불러오지 못했습니다."
      );

    }


    /* DIVISION */

    const {
      data:divisions,
      error:divisionError
    } =
      await supabaseClient
        .from("divisions")
        .select(
          "id,tournament_id,name,match_type,gender,format,group_count,advance_count,expected_match_minutes,sort_order"
        )
        .eq(
          "tournament_id",
          tournamentId
        )
        .order(
          "sort_order",
          {
            ascending:true
          }
        );


    if (
      divisionError
    ){

      throw new Error(
        "부문 정보를 불러오지 못했습니다."
      );

    }


    const division =
      divisions?.[0];


    if (!division){

      throw new Error(
        "이 대회에 등록된 부문이 없습니다."
      );

    }


    /* COURTS */

    const {
      data:courtRows,
      error:courtError
    } =
      await supabaseClient
        .from("courts")
        .select(
          "id,name,sort_order,is_active"
        )
        .eq(
          "tournament_id",
          tournamentId
        )
        .order(
          "sort_order",
          {
            ascending:true
          }
        );


    if (
      courtError
    ){

      throw new Error(
        "코트 정보를 불러오지 못했습니다."
      );

    }


    const courts =
      (courtRows || [])
        .filter(
          row =>
            row.is_active !== false
        );


    const tournamentSession = {

      tournamentId:
        tournament.id,

      id:
        tournament.id,

      tournamentName:
        tournament.name,

      name:
        tournament.name,

      tournamentDate:
        tournament.tournament_date,

      date:
        tournament.tournament_date,

      status:
        tournament.status,

      isPublic:
        tournament.is_public,

      divisionId:
        division.id,

      divisionName:
        division.name,

      format:
        division.format,

      matchType:
        division.match_type,

      gender:
        division.gender,

      groupCount:
        Number(
          division.group_count || 0
        ),

      advanceCount:
        Number(
          division.advance_count || 0
        ),

      matchDuration:
        division.expected_match_minutes,

      courts:
        courts.map(
          row =>
            row.name
        ),

      courtRecords:
        courts.map(
          row => ({
            id:row.id,
            name:row.name,
            sortOrder:row.sort_order
          })
        )

    };


    sessionStorage.setItem(
      "fwtNewTournament",
      JSON.stringify(
        tournamentSession
      )
    );


    /* ENTRIES */

    const {
      data:entryRows,
      error:entryError
    } =
      await supabaseClient
        .from("entries")
        .select(
          "id,display_name,seed,status,sort_order"
        )
        .eq(
          "division_id",
          division.id
        )
        .order(
          "sort_order",
          {
            ascending:true
          }
        );


    if (
      entryError
    ){

      throw new Error(
        "참가자 정보를 불러오지 못했습니다."
      );

    }


    const activeEntryRows =
      (entryRows || [])
        .filter(
          row =>
            row.status !==
            "withdrawn"
            &&
            row.status !==
            "disqualified"
        );


    if (
      activeEntryRows.length === 0
    ){

      sessionStorage.setItem(
        "fwtNewTournamentEntries",
        JSON.stringify([])
      );


      setBusy(false);


      location.href =
        "./participant-registration.html";


      return;

    }


    const entryIds =
      activeEntryRows.map(
        row => row.id
      );


    const {
      data:memberRows,
      error:memberError
    } =
      await supabaseClient
        .from("entry_members")
        .select(
          "entry_id,player_id,member_order"
        )
        .in(
          "entry_id",
          entryIds
        )
        .order(
          "member_order",
          {
            ascending:true
          }
        );


    if (
      memberError
    ){

      throw new Error(
        "참가자 구성정보를 불러오지 못했습니다."
      );

    }


    const playerIds =
      [
        ...new Set(
          (memberRows || [])
            .map(
              row => row.player_id
            )
        )
      ];


    let playerRows = [];


    if (
      playerIds.length > 0
    ){

      const {
        data,
        error
      } =
        await supabaseClient
          .from("players")
          .select(
            "id,name,nickname"
          )
          .in(
            "id",
            playerIds
          );


      if (error){

        throw new Error(
          "선수 정보를 불러오지 못했습니다."
        );

      }


      playerRows =
        data || [];

    }


    const playerMap =
      new Map(
        playerRows.map(
          player => [
            player.id,
            player
          ]
        )
      );


    const restoredEntries =
      activeEntryRows.map(
        entry => {

          const members =
            (memberRows || [])
              .filter(
                row =>
                  row.entry_id ===
                  entry.id
              )
              .sort(
                (a,b) =>
                  Number(
                    a.member_order
                  )
                  -
                  Number(
                    b.member_order
                  )
              );


          if (
            division.match_type ===
            "doubles"
          ){

            const member1 =
              members[0];

            const member2 =
              members[1];


            const player1 =
              member1
                ? playerMap.get(
                    member1.player_id
                  )
                : null;


            const player2 =
              member2
                ? playerMap.get(
                    member2.player_id
                  )
                : null;


            return {

              type:"doubles",

              dbEntryId:
                entry.id,

              displayName:
                entry.display_name,

              seed:
                entry.seed,

              player1:{

                dbPlayerId:
                  player1?.id ||
                  null,

                name:
                  player1?.name ||
                  "",

                nickname:
                  player1?.nickname ||
                  ""

              },

              player2:{

                dbPlayerId:
                  player2?.id ||
                  null,

                name:
                  player2?.name ||
                  "",

                nickname:
                  player2?.nickname ||
                  ""

              }

            };

          }


          const member =
            members[0];


          const player =
            member
              ? playerMap.get(
                  member.player_id
                )
              : null;


          return {

            type:"singles",

            dbEntryId:
              entry.id,

            dbPlayerId:
              player?.id ||
              null,

            displayName:
              entry.display_name,

            seed:
              entry.seed,

            name:
              player?.name ||
              entry.display_name ||
              "",

            nickname:
              player?.nickname ||
              ""

          };

        }
      );


    sessionStorage.setItem(
      "fwtNewTournamentEntries",
      JSON.stringify(
        restoredEntries
      )
    );


    /* GROUPS */

    const {
      data:groupRows,
      error:groupError
    } =
      await supabaseClient
        .from("groups")
        .select(
          "id,name,sort_order"
        )
        .eq(
          "division_id",
          division.id
        )
        .order(
          "sort_order",
          {
            ascending:true
          }
        );


    if (
      groupError
    ){

      throw new Error(
        "조편성 정보를 불러오지 못했습니다."
      );

    }


    let restoredGroupData = [];


    if (
      groupRows &&
      groupRows.length > 0
    ){

      const groupIds =
        groupRows.map(
          row => row.id
        );


      const {
        data:groupEntryRows,
        error:groupEntryError
      } =
        await supabaseClient
          .from("group_entries")
          .select(
            "group_id,entry_id,seed_order"
          )
          .in(
            "group_id",
            groupIds
          )
          .order(
            "seed_order",
            {
              ascending:true
            }
          );


      if (
        groupEntryError
      ){

        throw new Error(
          "조 참가자 정보를 불러오지 못했습니다."
        );

      }


      const entryIndexMap =
        new Map();


      restoredEntries.forEach(
        (
          entry,
          index
        ) => {

          entryIndexMap.set(
            entry.dbEntryId,
            index
          );

        }
      );


      restoredGroupData =
        groupRows.map(
          group => {

            const members =
              (groupEntryRows || [])
                .filter(
                  row =>
                    row.group_id ===
                    group.id
                )
                .sort(
                  (a,b) =>
                    Number(
                      a.seed_order || 0
                    )
                    -
                    Number(
                      b.seed_order || 0
                    )
                )
                .map(
                  row =>
                    entryIndexMap.get(
                      row.entry_id
                    )
                )
                .filter(
                  index =>
                    index !==
                    undefined
                );


            return {

              name:
                group.name,

              dbGroupId:
                group.id,

              members

            };

          }
        );


      sessionStorage.setItem(
        "fwtGroupData",
        JSON.stringify(
          restoredGroupData
        )
      );


      /*
        참가자 index → group index
      */

      const assignments =
        new Array(
          restoredEntries.length
        ).fill(null);


      restoredGroupData.forEach(
        (
          group,
          groupIndex
        ) => {

          group.members.forEach(
            entryIndex => {

              assignments[
                entryIndex
              ] =
                groupIndex;

            }
          );

        }
      );


      sessionStorage.setItem(
        "fwtGroupAssignments",
        JSON.stringify(
          assignments
        )
      );

    }


    /* MATCHES */

    const {
      data:matchRows,
      error:matchError
    } =
      await supabaseClient
        .from("matches")
        .select(
          "id,group_id,court_id,stage,round_number,match_number,entry1_id,entry2_id,source1_match_id,source2_match_id,status,score1,score2,winner_entry_id,started_at,completed_at,sort_order"
        )
        .eq(
          "division_id",
          division.id
        )
        .order(
          "sort_order",
          {
            ascending:true
          }
        );


    if (
      matchError
    ){

      throw new Error(
        "경기 진행상태를 불러오지 못했습니다."
      );

    }


    const allMatches =
      matchRows || [];


    const groupMatches =
      allMatches.filter(
        row =>
          row.stage ===
          "group"
      );


    const knockoutMatches =
      allMatches.filter(
        row =>
          row.stage !==
          "group"
      );


    /*
      여기부터 실제 진행상태 기반 ROUTING.
    */


    /* 토너먼트 ONLY */

    if (
      division.format ===
      "knockout"
    ){

      setBusy(false);


      if (
        knockoutMatches.length > 0
      ){

        location.href =
          "./knockout-control.html";

      } else {

        /*
          knockout-only setup 페이지는
          아직 별도 구축 전.
        */

        alert(
          "토너먼트 단독 대회 설정 기능은 아직 연결 작업 중입니다."
        );


        location.href =
          "./participant-registration.html";

      }


      return;

    }


    /*
      GROUP + KNOCKOUT
    */


    /* 조편성 자체가 아직 없음 */

    if (
      !groupRows ||
      groupRows.length === 0
    ){

      setBusy(false);


      location.href =
        "./group-setup.html";


      return;

    }


    /* 조편성은 있지만 예선 대진 없음 */

    if (
      groupMatches.length === 0
    ){

      setBusy(false);


      location.href =
        "./group-matches.html";


      return;

    }


    /*
      본선 MATCH가 이미 존재한다면
      예선 상태보다 본선 진행이 더 뒤 단계이므로
      본선 경기운영으로 이동.

      예선 결과가 잘못 초기화됐더라도
      기존 본선 DB가 존재하면 본선 단계 복원이 우선.
    */

    if (
      knockoutMatches.length > 0
    ){

      setBusy(false);


      location.href =
        "./knockout-control.html";


      return;

    }


    const groupAllFinished =
      groupMatches.every(
        row =>
          [
            "completed",
            "bye",
            "walkover"
          ].includes(
            row.status
          )
      );


    /* 예선 전부 완료, 본선 아직 없음 */

    if (
      groupAllFinished
    ){

      setBusy(false);


      location.href =
        "./group-standings.html";


      return;

    }


    /*
      waiting / playing / 일부 completed
      → 예선 경기 운영
    */

    setBusy(false);


    location.href =
      "./match-control.html";


  } catch(error){

    console.error(error);


    setBusy(false);


    alert(
      "대회 정보를 복원하지 못했습니다.\n\n"
      +
      (
        error?.message ||
        "알 수 없는 오류가 발생했습니다."
      )
    );

  }

}


/* =====================================
   DELETE
===================================== */

async function deleteTournament(
  tournamentId,
  tournamentName
){

  if (busy){
    return;
  }


  if (
    !confirm(
      `"${tournamentName}" 대회를 삭제할까요?`
    )
  ){
    return;
  }


  if (
    !confirm(
      "참가자, 조편성, 경기 결과와 본선 데이터까지 함께 삭제됩니다.\n\n정말 삭제하시겠습니까?"
    )
  ){
    return;
  }


  try{

    setBusy(
      true,
      "대회를 삭제하고 있습니다",
      "연결된 대회 데이터를 정리 중입니다."
    );


    const {
      error
    } =
      await supabaseClient
        .from("tournaments")
        .delete()
        .eq(
          "id",
          tournamentId
        );


    if (error){

      throw new Error(
        error.message
      );

    }


    const current =
      JSON.parse(
        sessionStorage.getItem(
          "fwtNewTournament"
        ) || "null"
      );


    if (
      current?.tournamentId ===
      tournamentId
    ){

      clearCurrentTournamentSession();

    }


    await loadDashboard();


    setBusy(false);


  } catch(error){

    setBusy(false);


    alert(
      "대회를 삭제하지 못했습니다.\n\n"
      +
      error.message
    );

  }

}


/* =====================================
   LOGOUT
===================================== */

async function logout(){

  if (busy){
    return;
  }


  try{

    setBusy(
      true,
      "로그아웃하고 있습니다",
      ""
    );


    const {
      error
    } =
      await supabaseClient
        .auth
        .signOut();


    if (error){

      throw error;

    }


    clearCurrentTournamentSession();


    location.href =
      "./";


  } catch(error){

    setBusy(false);


    alert(
      "로그아웃하지 못했습니다.\n\n"
      +
      error.message
    );

  }

}


/* =====================================
   EVENTS
===================================== */

document.getElementById(
  "logoutButton"
).addEventListener(
  "click",
  logout
);


/* =====================================
   START
===================================== */

async function start(){

  const loggedIn =
    await checkLogin();


  if (!loggedIn){
    return;
  }


  try{

    setBusy(
      true,
      "대회 정보를 불러오고 있습니다",
      "Supabase에 저장된 진행상태를 확인 중입니다."
    );


    await loadDashboard();


    setBusy(false);


  } catch(error){

    console.error(error);


    setBusy(false);


    alert(
      "대시보드를 불러오지 못했습니다.\n\n"
      +
      (
        error?.message ||
        "알 수 없는 오류"
      )
    );

  }

}


start();

</script>
