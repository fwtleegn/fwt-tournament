<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#071a31"
  >

  <title>FWT 관리자 비밀번호 재설정</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --navy:#071a31;
      --navy2:#0d2949;
      --lime:#c9df45;

      --bg:#eef2f5;
      --card:#ffffff;

      --text:#172437;
      --muted:#6f7c8d;
      --line:#dfe5ea;

      --green:#16845c;
      --green-bg:#eaf7f1;

      --red:#b94747;
      --red-bg:#fff0f0;

      --shadow:
        0 18px 50px rgba(7,26,49,.10);
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;

      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:24px;

      background:
        radial-gradient(
          circle at top right,
          rgba(201,223,69,.13),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #06172b 0%,
          #0c2d50 42%,
          #eef2f5 42%,
          #eef2f5 100%
        );

      color:var(--text);

      font-family:
        Inter,
        Pretendard,
        "Noto Sans KR",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      -webkit-font-smoothing:
        antialiased;
    }

    .wrap{
      width:min(440px,100%);
    }

    .brand{
      display:flex;
      align-items:center;
      justify-content:center;

      margin-bottom:18px;
    }

    .logo{
      color:white;

      font-size:36px;
      line-height:1;

      font-weight:950;
      font-style:italic;

      letter-spacing:-4px;

      transform:skew(-5deg);
    }

    .logo span{
      color:var(--lime);
    }

    .card{
      overflow:hidden;

      border:
        1px solid rgba(255,255,255,.4);

      border-radius:22px;

      background:white;

      box-shadow:var(--shadow);
    }

    .accent{
      height:5px;

      background:
        linear-gradient(
          90deg,
          var(--lime),
          #9db626
        );
    }

    .card-body{
      padding:28px;
    }

    .kicker{
      margin-bottom:7px;

      color:#52708e;

      font-size:10px;
      font-weight:950;

      letter-spacing:1.7px;
    }

    h1{
      margin:0;

      color:var(--navy);

      font-size:27px;
      font-weight:950;

      letter-spacing:-1.1px;
    }

    .desc{
      margin:
        10px 0 0;

      color:var(--muted);

      font-size:13px;
      line-height:1.7;
    }

    .state{
      margin-top:21px;

      padding:13px 14px;

      border-radius:11px;

      background:#f3f5f7;

      color:#657386;

      font-size:12px;
      font-weight:750;

      line-height:1.55;
    }

    .state.ready{
      background:var(--green-bg);
      color:var(--green);
    }

    .state.error{
      background:var(--red-bg);
      color:var(--red);
    }

    .form{
      display:none;

      margin-top:21px;
    }

    .form.show{
      display:block;
    }

    .field{
      margin-bottom:14px;
    }

    label{
      display:block;

      margin-bottom:7px;

      color:#34445a;

      font-size:12px;
      font-weight:900;
    }

    input{
      width:100%;
      height:54px;

      padding:0 15px;

      border:
        1px solid #d7dee5;

      border-radius:11px;

      outline:none;

      background:white;
      color:#182437;

      font-size:15px;
      font-weight:750;

      transition:.15s ease;
    }

    input:focus{
      border-color:#9caf2f;

      box-shadow:
        0 0 0 4px rgba(201,223,69,.15);
    }

    .hint{
      margin-top:6px;

      color:#8a95a2;

      font-size:10px;
      line-height:1.5;
    }

    .button{
      width:100%;
      min-height:56px;

      margin-top:5px;

      border:0;
      border-radius:12px;

      background:var(--navy);
      color:white;

      font-size:14px;
      font-weight:950;

      cursor:pointer;

      transition:.15s ease;
    }

    .button:hover{
      background:var(--navy2);
    }

    .button:disabled{
      cursor:not-allowed;

      opacity:.45;
    }

    .success{
      display:none;

      margin-top:20px;

      padding:22px 16px;

      border-radius:14px;

      background:var(--green-bg);

      text-align:center;
    }

    .success.show{
      display:block;
    }

    .success-title{
      color:var(--green);

      font-size:19px;
      font-weight:950;
    }

    .success-desc{
      margin-top:7px;

      color:#487564;

      font-size:12px;
      line-height:1.65;
    }

    .login-link{
      min-height:50px;

      display:flex;
      align-items:center;
      justify-content:center;

      margin-top:15px;

      border:
        1px solid #cfd9d4;

      border-radius:11px;

      background:white;

      color:var(--navy);

      text-decoration:none;

      font-size:12px;
      font-weight:900;
    }

    .footer{
      margin-top:18px;

      text-align:center;

      color:rgba(255,255,255,.58);

      font-size:9px;
      font-weight:750;

      letter-spacing:1px;
    }

    .footer strong{
      color:var(--lime);
    }

    @media(max-width:520px){

      body{
        align-items:flex-start;

        padding:
          38px 15px;
      }

      .card-body{
        padding:23px 19px;
      }

      h1{
        font-size:25px;
      }

      .desc{
        font-size:13px;
      }

      input{
        height:56px;
      }

      .button{
        min-height:58px;
      }
    }
  </style>
</head>

<body>

  <div class="wrap">

    <div class="brand">
      <div class="logo">
        FW<span>T</span>
      </div>
    </div>


    <section class="card">

      <div class="accent"></div>

      <div class="card-body">

        <div class="kicker">
          ADMIN SECURITY
        </div>

        <h1>
          관리자 비밀번호 재설정
        </h1>

        <p class="desc">
          Supabase에서 발송한 비밀번호 재설정 메일을 통해
          이 페이지에 접속한 경우에만 새 비밀번호를 설정할 수 있습니다.
        </p>


        <div
          class="state"
          id="stateBox"
        >
          비밀번호 재설정 권한을 확인하고 있습니다.
        </div>


        <form
          class="form"
          id="passwordForm"
        >

          <div class="field">

            <label for="newPassword">
              새 비밀번호
            </label>

            <input
              id="newPassword"
              type="password"
              autocomplete="new-password"
              placeholder="새 비밀번호 입력"
              minlength="8"
              required
            >

            <div class="hint">
              최소 8자 이상을 권장합니다.
            </div>

          </div>


          <div class="field">

            <label for="confirmPassword">
              새 비밀번호 확인
            </label>

            <input
              id="confirmPassword"
              type="password"
              autocomplete="new-password"
              placeholder="새 비밀번호 다시 입력"
              minlength="8"
              required
            >

          </div>


          <button
            class="button"
            id="submitButton"
            type="submit"
          >
            새 비밀번호로 변경
          </button>

        </form>


        <div
          class="success"
          id="successBox"
        >

          <div class="success-title">
            비밀번호가 변경되었습니다.
          </div>

          <div class="success-desc">
            기존 관리자 비밀번호는 더 이상 사용할 수 없습니다.
            새 비밀번호로 다시 로그인하세요.
          </div>

          <a
            class="login-link"
            href="./"
          >
            관리자 로그인으로 이동
          </a>

        </div>

      </div>

    </section>


    <div class="footer">
      FWT · CREATED BY <strong>Q</strong>
    </div>

  </div>


<script>

const SUPABASE_URL =
  "https://opwuyqerisocqobbbisg.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_Eo_zfONeGLs9ATCVg2Fk_g_y_IAJFV-";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const stateBox =
  document.getElementById(
    "stateBox"
  );


const form =
  document.getElementById(
    "passwordForm"
  );


const newPasswordInput =
  document.getElementById(
    "newPassword"
  );


const confirmPasswordInput =
  document.getElementById(
    "confirmPassword"
  );


const submitButton =
  document.getElementById(
    "submitButton"
  );


const successBox =
  document.getElementById(
    "successBox"
  );


let recoveryVerified =
  false;


/* ==============================
   UI STATE
============================== */

function showReady(){

  recoveryVerified =
    true;


  stateBox.className =
    "state ready";


  stateBox.textContent =
    "비밀번호 재설정 인증이 확인되었습니다. 새 비밀번호를 입력하세요.";


  form.classList.add(
    "show"
  );
}


function showError(message){

  recoveryVerified =
    false;


  stateBox.className =
    "state error";


  stateBox.textContent =
    message;


  form.classList.remove(
    "show"
  );
}


/* ==============================
   RECOVERY CHECK
============================== */

/*
  중요:

  단순히 이 페이지 주소를 직접 입력했다고 해서
  비밀번호 변경 폼을 열지 않는다.

  Supabase 비밀번호 재설정 메일을 통해 들어왔을 때
  PASSWORD_RECOVERY 이벤트가 발생해야 활성화한다.
*/

const {
  data:authListener
} =
  supabaseClient.auth.onAuthStateChange(
    function(
      event,
      session
    ){

      console.log(
        "Auth event:",
        event
      );


      if (
        event ===
        "PASSWORD_RECOVERY"
        &&
        session
      ){

        showReady();
      }

    }
  );


/*
  인증 링크 처리에 약간의 시간이 걸릴 수 있으므로
  일정 시간 후에도 recovery 이벤트가 없으면
  잘못된 접근으로 안내한다.
*/

setTimeout(
  function(){

    if (
      !recoveryVerified
    ){

      showError(
        "유효한 비밀번호 재설정 인증이 없습니다. Supabase에서 새 Reset Password 메일을 발송한 뒤 이메일의 링크를 통해 다시 접속하세요."
      );
    }

  },
  4500
);


/* ==============================
   PASSWORD UPDATE
============================== */

form.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();


    if (
      !recoveryVerified
    ){

      showError(
        "비밀번호 재설정 인증이 확인되지 않았습니다."
      );

      return;
    }


    const newPassword =
      newPasswordInput.value;


    const confirmPassword =
      confirmPasswordInput.value;


    if (
      newPassword.length < 8
    ){

      alert(
        "새 비밀번호는 최소 8자 이상으로 입력해주세요."
      );

      return;
    }


    if (
      newPassword !==
      confirmPassword
    ){

      alert(
        "새 비밀번호와 확인 비밀번호가 일치하지 않습니다."
      );

      return;
    }


    submitButton.disabled =
      true;


    submitButton.textContent =
      "변경 중...";


    const {
      error
    } =
      await supabaseClient.auth.updateUser({
        password:
          newPassword
      });


    if (error){

      console.error(
        error
      );


      submitButton.disabled =
        false;


      submitButton.textContent =
        "새 비밀번호로 변경";


      alert(
        "비밀번호 변경에 실패했습니다.\n\n"
        +
        error.message
      );


      return;
    }


    /*
      변경 완료 후 현재 recovery 세션을 종료한다.

      이후 새 비밀번호로 관리자 로그인하도록 한다.
    */

    await supabaseClient.auth.signOut();


    form.classList.remove(
      "show"
    );


    stateBox.style.display =
      "none";


    successBox.classList.add(
      "show"
    );
  }
);

</script>

</body>
</html>
