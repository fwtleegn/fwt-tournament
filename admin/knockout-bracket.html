<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>본선 토너먼트 | FWT Tournament</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --navy:#071a31;
      --navy2:#0c294a;
      --blue:#184a79;
      --lime:#c9df45;

      --bg:#f4f6f9;
      --white:#ffffff;
      --text:#172033;
      --muted:#647184;
      --line:#dfe5eb;

      --green:#178b61;
      --green-soft:#edf8f3;

      --gold:#9b7515;
      --gold-soft:#fff9e8;

      --shadow:
        0 12px 35px rgba(20,35,55,.06);
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      min-height:100%;

      background:var(--bg);
      color:var(--text);

      font-family:
        Inter,
        Pretendard,
        "Noto Sans KR",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button{
      font:inherit;
      cursor:pointer;
    }

    .topbar{
      min-height:72px;

      padding:0 20px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      background:
        linear-gradient(
          110deg,
          #06172b,
          #0a2848 62%,
          #103b67
        );

      box-shadow:
        0 5px 20px rgba(6,23,43,.16);
    }

    .fwt-logo{
      color:white;

      font-size:31px;
      line-height:1;

      font-weight:950;
      font-style:italic;
      letter-spacing:-4px;

      transform:skew(-5deg);
    }

    .fwt-logo span{
      color:var(--lime);
    }

    .top-actions{
      display:flex;
      gap:7px;
    }

    .header-btn{
      min-height:44px;

      padding:0 14px;

      border:
        1px solid rgba(255,255,255,.15);

      border-radius:10px;

      background:
        rgba(255,255,255,.08);

      color:white;

      font-size:12px;
      font-weight:850;
    }

    .container{
      width:
        min(
          1280px,
          calc(100% - 34px)
        );

      margin:0 auto;

      padding:32px 0 60px;
    }

    .head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;

      gap:20px;

      margin-bottom:18px;
    }

    .kicker{
      margin-bottom:7px;

      color:var(--blue);

      font-size:11px;
      font-weight:950;
      letter-spacing:2px;
    }

    h1{
      margin:0;

      color:var(--navy);

      font-size:34px;
      font-weight:950;
      letter-spacing:-1.5px;
    }

    .desc{
      margin:8px 0 0;

      color:var(--muted);

      font-size:13px;
      line-height:1.65;
    }

    .summary{
      display:flex;
      flex-wrap:wrap;

      gap:7px;
    }

    .summary-chip{
      padding:9px 12px;

      border:1px solid var(--line);
      border-radius:999px;

      background:white;
      color:#526073;

      font-size:11px;
      font-weight:850;
    }

    .summary-chip strong{
      margin-left:4px;

      color:var(--navy);

      font-size:15px;
      font-weight:950;
    }

    .notice{
      margin-bottom:15px;

      padding:14px 15px;

      border:1px solid #dce8df;
      border-radius:13px;

      background:var(--green-soft);
      color:#396451;

      font-size:12px;
      font-weight:750;
      line-height:1.65;
    }

    .qualifier-card{
      overflow:hidden;

      margin-bottom:16px;

      border:1px solid var(--line);
      border-radius:16px;

      background:white;

      box-shadow:var(--shadow);
    }

    .card-head{
      display:flex;
      justify-content:space-between;
      align-items:center;

      padding:15px 17px;

      border-bottom:1px solid #e8ecf0;
    }

    .card-title{
      color:var(--navy);

      font-size:17px;
      font-weight:950;
    }

    .db-status{
      display:flex;
      align-items:center;

      gap:6px;

      color:var(--green);

      font-size:10px;
      font-weight:900;
    }

    .db-dot{
      width:7px;
      height:7px;

      border-radius:50%;

      background:var(--green);
    }

    .qualifiers{
      display:grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(180px,1fr)
        );

      gap:7px;

      padding:10px;
    }

    .qualifier{
      padding:11px 12px;

      border:1px solid #e2e7ec;
      border-radius:10px;

      background:#fafbfc;
    }

    .qualifier-source{
      color:#748093;

      font-size:10px;
      font-weight:800;
    }

    .qualifier-name{
      overflow:hidden;

      margin-top:4px;

      color:#253348;

      font-size:14px;
      font-weight:900;

      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .bracket-section{
      margin-top:18px;
    }

    .section-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;

      gap:12px;

      margin-bottom:10px;
    }

    .section-title{
      color:var(--navy);

      font-size:19px;
      font-weight:950;
    }

    .section-sub{
      color:#718092;

      font-size:11px;
      font-weight:750;
    }

    .bracket-scroll{
      overflow-x:auto;

      padding:2px 2px 14px;

      scrollbar-width:thin;
    }

    .bracket{
      min-width:max-content;

      display:flex;

      gap:12px;

      align-items:stretch;
    }

    .round{
      width:260px;

      display:flex;
      flex-direction:column;

      gap:10px;
    }

    .round-title{
      position:sticky;
      top:0;

      z-index:2;

      padding:11px 12px;

      border:1px solid var(--line);
      border-radius:10px;

      background:var(--navy);
      color:white;

      text-align:center;

      font-size:13px;
      font-weight:950;
    }

    .round-matches{
      flex:1;

      display:flex;
      flex-direction:column;

      justify-content:space-around;

      gap:10px;
    }

    .match{
      overflow:hidden;

      border:1px solid var(--line);
      border-radius:13px;

      background:white;

      box-shadow:var(--shadow);
    }

    .match-top{
      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:8px;

      padding:9px 11px;

      border-bottom:1px solid #e8ecf0;

      background:#f8fafb;
    }

    .match-no{
      color:var(--navy);

      font-size:11px;
      font-weight:950;
    }

    .status{
      min-height:25px;

      display:flex;
      align-items:center;

      padding:0 8px;

      border-radius:999px;

      background:#eef2f5;
      color:#667386;

      font-size:9px;
      font-weight:900;
    }

    .status.waiting{
      background:var(--green-soft);
      color:var(--green);
    }

    .status.bye{
      background:var(--gold-soft);
      color:var(--gold);
    }

    .slots{
      padding:8px;
    }

    .slot{
      min-height:48px;

      display:flex;
      flex-direction:column;
      justify-content:center;

      padding:8px 9px;

      margin-bottom:6px;

      border:1px solid #e5e9ed;
      border-radius:9px;

      background:white;
    }

    .slot:last-child{
      margin-bottom:0;
    }

    .slot-source{
      margin-bottom:3px;

      color:#7b8796;

      font-size:9px;
      font-weight:750;
    }

    .slot-player{
      overflow:hidden;

      color:#263247;

      font-size:13px;
      font-weight:900;

      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .slot-player.empty{
      color:#939ca8;

      font-weight:750;
    }

    .winner{
      margin:0 8px 8px;

      padding:7px 9px;

      border-radius:8px;

      background:var(--green-soft);
      color:var(--green);

      font-size:10px;
      font-weight:900;
    }

    .actions{
      display:grid;

      grid-template-columns:
        190px minmax(0,1fr);

      gap:9px;

      margin-top:18px;
    }

    .action-btn{
      height:56px;
      min-height:56px;

      border-radius:11px;

      font-weight:900;
    }

    .back-btn{
      border:1px solid #d8dee5;

      background:white;
      color:#526073;
    }

    .continue-btn{
      border:0;

      background:
        linear-gradient(
          115deg,
          var(--navy),
          #123e6c
        );

      color:white;

      font-size:14px;
    }

    .continue-btn span{
      margin-left:5px;

      color:var(--lime);
    }

    button:disabled{
      cursor:not-allowed;
      opacity:.5;
    }

    .loading-overlay{
      display:none;

      position:fixed;
      inset:0;

      z-index:500;

      align-items:center;
      justify-content:center;

      padding:20px;

      background:
        rgba(4,17,31,.62);
    }

    .loading-overlay.show{
      display:flex;
    }

    .loading-box{
      width:min(350px,100%);

      padding:25px;

      border-radius:17px;

      background:white;

      text-align:center;

      box-shadow:
        0 30px 80px rgba(0,0,0,.25);
    }

    .spinner{
      width:38px;
      height:38px;

      margin:0 auto 15px;

      border:4px solid #e6eaee;
      border-top-color:var(--navy);

      border-radius:50%;

      animation:
        spin .8s linear infinite;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    .loading-title{
      color:var(--navy);

      font-size:16px;
      font-weight:950;
    }

    .loading-text{
      margin-top:6px;

      color:#657184;

      font-size:12px;
      line-height:1.6;
    }

    .footer{
      display:flex;
      justify-content:space-between;

      margin-top:28px;
      padding-top:17px;

      border-top:1px solid #e2e6eb;

      color:#7c8795;

      font-size:10px;
      letter-spacing:1px;
    }

    .footer strong{
      color:var(--navy);
    }

    .q{
      color:#91a719;
      font-weight:950;
    }

    @media(max-width:700px){

      .topbar{
        min-height:72px;
        padding:0 14px;
      }

      .fwt-logo{
        font-size:30px;
      }

      .header-btn{
        height:46px;
        min-height:46px;

        padding:0 11px;

        font-size:11px;
      }

      .container{
        width:calc(100% - 22px);

        padding:24px 0 50px;
      }

      .head{
        display:block;
      }

      .summary{
        margin-top:13px;
      }

      h1{
        font-size:30px;
      }

      .desc{
        font-size:14px;
      }

      .summary-chip{
        font-size:12px;
      }

      .notice{
        font-size:13px;
      }

      .card-title{
        font-size:18px;
      }

      .qualifiers{
        grid-template-columns:
          repeat(2,minmax(0,1fr));
      }

      .qualifier-source{
        font-size:11px;
      }

      .qualifier-name{
        font-size:14px;
      }

      .section-title{
        font-size:20px;
      }

      .section-sub{
        font-size:12px;
      }

      .round{
        width:235px;
      }

      .round-title{
        min-height:44px;

        display:flex;
        align-items:center;
        justify-content:center;

        font-size:14px;
      }

      .slot{
        min-height:52px;
      }

      .slot-source{
        font-size:10px;
      }

      .slot-player{
        font-size:14px;
      }

      .actions{
        grid-template-columns:1fr;
        gap:9px;
      }

      .action-btn{
        width:100%;

        height:56px;
        min-height:56px;

        flex:none;

        font-size:15px;
      }

    }

    @media(max-width:390px){

      .qualifiers{
        grid-template-columns:1fr;
      }

    }
  </style>
</head>

<body>

<header class="topbar">

  <div class="fwt-logo">
    FW<span>T</span>
  </div>

  <div class="top-actions">

    <button
      class="header-btn"
      type="button"
      onclick="location.href='./group-standings.html'"
    >
      조별 순위
    </button>

    <button
      class="header-btn"
      type="button"
      onclick="location.href='./dashboard.html'"
    >
      대시보드
    </button>

  </div>

</header>

<main class="container">

  <div class="head">

    <div>

      <div class="kicker">
        KNOCKOUT BRACKET
      </div>

      <h1>
        본선 토너먼트
      </h1>

      <p class="desc">
        예선 순위를 기준으로 본선 대진을 자동 배치합니다.
      </p>

    </div>

    <div class="summary">

      <div class="summary-chip">
        진출
        <strong id="qualifierCount">0</strong>
      </div>

      <div class="summary-chip">
        본선
        <strong id="bracketSize">0</strong>강
      </div>

      <div class="summary-chip">
        BYE
        <strong id="byeCount">0</strong>
      </div>

    </div>

  </div>

  <div class="notice">
    같은 조에서 2명이 본선에 진출한 경우 서로 반대쪽 하프에 배치하여
    8강·4강 재대결을 방지하고, 다시 만날 수 있는 시점은 결승으로 제한합니다.
  </div>

  <section class="qualifier-card">

    <div class="card-head">

      <div class="card-title">
        본선 진출자
      </div>

      <div class="db-status">
        <div class="db-dot"></div>
        DB 연결
      </div>

    </div>

    <div
      class="qualifiers"
      id="qualifiers"
    ></div>

  </section>

  <section class="bracket-section">

    <div class="section-head">

      <div class="section-title">
        대진표
      </div>

      <div class="section-sub">
        좌우로 밀어서 전체 대진 확인
      </div>

    </div>

    <div class="bracket-scroll">

      <div
        class="bracket"
        id="bracket"
      ></div>

    </div>

  </section>

  <div class="actions">

    <button
      class="action-btn back-btn"
      type="button"
      onclick="location.href='./group-standings.html'"
    >
      이전 단계
    </button>

    <button
      class="action-btn continue-btn"
      id="continueButton"
      type="button"
    >
      본선 대진 확정 · 경기 운영
      <span>→</span>
    </button>

  </div>

  <footer class="footer">

    <div>
      <strong>FWT</strong>
      · FRIENDS WITH TENNIS
    </div>

    <div>
      CREATED BY
      <span class="q">Q</span>
    </div>

  </footer>

</main>

<div
  class="loading-overlay"
  id="loadingOverlay"
>

  <div class="loading-box">

    <div class="spinner"></div>

    <div
      class="loading-title"
      id="loadingTitle"
    >
      본선 대진을 불러오고 있습니다
    </div>

    <div
      class="loading-text"
      id="loadingText"
    >
      FWT 데이터베이스에 연결 중입니다.
    </div>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://opwuyqerisocqobbbisg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Eo_zfONeGLs9ATCVg2Fk_g_y_IAJFV-";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const tournament =
  JSON.parse(
    sessionStorage.getItem(
      "fwtNewTournament"
    ) || "null"
  );

const entries =
  JSON.parse(
    sessionStorage.getItem(
      "fwtNewTournamentEntries"
    ) || "null"
  );

const qualifiers =
  JSON.parse(
    sessionStorage.getItem(
      "fwtKnockoutQualifiers"
    ) || "null"
  );

if (
  !tournament ||
  !tournament.tournamentId ||
  !tournament.divisionId ||
  !Array.isArray(entries) ||
  !Array.isArray(qualifiers) ||
  qualifiers.length < 2
){

  alert(
    "본선 진출자 정보가 없습니다."
  );

  location.href =
    "./group-standings.html";

}

let busy =
  false;

let bracketData =
  null;

let bracketAlreadySaved =
  false;

/* =========================
   HELPERS
========================= */

function escapeHtml(value){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value ?? "";

  return div.innerHTML;

}

function shortEntryName(entry){

  if (!entry){
    return "알 수 없음";
  }

  if (
    entry.type ===
    "singles"
  ){

    return (
      entry.nickname ||
      entry.name ||
      "이름 없음"
    );

  }

  const p1 =
    entry.player1?.nickname ||
    entry.player1?.name ||
    "선수1";

  const p2 =
    entry.player2?.nickname ||
    entry.player2?.name ||
    "선수2";

  return `${p1}/${p2}`;

}

function entryName(index){

  if (
    index === null ||
    index === undefined
  ){
    return null;
  }

  return shortEntryName(
    entries[index]
  );

}

function entryIndexFromId(id){

  return entries.findIndex(
    entry =>
      entry.dbEntryId === id
  );

}

function entryIdFromIndex(index){

  if (
    index === null ||
    index === undefined
  ){
    return null;
  }

  return (
    entries[index]?.dbEntryId ||
    null
  );

}

function nextPowerOfTwo(number){

  let value = 2;

  while (
    value < number
  ){
    value *= 2;
  }

  return value;

}

function roundLabelBySize(size){

  if (size === 2){
    return "결승";
  }

  if (size === 4){
    return "4강";
  }

  if (size === 8){
    return "8강";
  }

  if (size === 16){
    return "16강";
  }

  if (size === 32){
    return "32강";
  }

  return `${size}강`;

}

function stageFromSize(size){

  if (size === 2){
    return "final";
  }

  if (size === 4){
    return "semifinal";
  }

  if (size === 8){
    return "quarterfinal";
  }

  if (size === 16){
    return "round16";
  }

  return "round32";

}

function statusText(status){

  const map = {
    pending:"진출자 대기",
    waiting:"대기",
    playing:"경기중",
    completed:"완료",
    bye:"BYE",
    walkover:"기권승",
    cancelled:"취소"
  };

  return (
    map[status] ||
    status ||
    "대기"
  );

}

/* =========================
   QUALIFIER HELPERS
========================= */

function findQualifier(
  groupName,
  rank
){

  return qualifiers.find(
    qualifier =>
      qualifier.groupName === groupName
      &&
      Number(
        qualifier.rank
      ) === rank
  ) || null;

}

function getGroupNames(){

  return [
    ...new Set(
      qualifiers.map(
        qualifier =>
          qualifier.groupName
      )
    )
  ];

}

/* =========================
   AUTH
========================= */

async function checkLogin(){

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getSession();

  if (
    error ||
    !data.session
  ){

    location.href =
      "./";

    return false;

  }

  return true;

}

/* =========================
   BUSY
========================= */

function setBusy(
  state,
  title = "",
  text = ""
){

  busy =
    state;

  document.getElementById(
    "loadingOverlay"
  ).classList.toggle(
    "show",
    state
  );

  document.getElementById(
    "continueButton"
  ).disabled =
    state;

  if (title){

    document.getElementById(
      "loadingTitle"
    ).textContent =
      title;

  }

  if (text){

    document.getElementById(
      "loadingText"
    ).textContent =
      text;

  }

}

/* =========================
   STANDARD 4 GROUP / TOP 2

   A1-B2
   C1-D2
   ----------
   B1-A2
   D1-C2

   같은 조 1·2위는
   서로 반대 half 배치.
========================= */

function buildStandardEightBracket(){

  const groupNames =
    getGroupNames();

  if (
    groupNames.length !== 4
  ){
    return null;
  }

  const [
    A,
    B,
    C,
    D
  ] =
    groupNames;

  const A1 =
    findQualifier(A,1);

  const A2 =
    findQualifier(A,2);

  const B1 =
    findQualifier(B,1);

  const B2 =
    findQualifier(B,2);

  const C1 =
    findQualifier(C,1);

  const C2 =
    findQualifier(C,2);

  const D1 =
    findQualifier(D,1);

  const D2 =
    findQualifier(D,2);

  if (
    !A1 || !A2 ||
    !B1 || !B2 ||
    !C1 || !C2 ||
    !D1 || !D2
  ){
    return null;
  }

  return [
    [A1,B2],
    [C1,D2],
    [B1,A2],
    [D1,C2]
  ];

}

/* =========================
   6 GROUP / TOP 1 + WC 2

   예:
   C조 1위 + C조 WC
   F조 1위 + F조 WC

   같은 조 1위와 WC는
   반드시 서로 반대 half에 배치.

   따라서 둘 다 승리해도
   4강에서는 만날 수 없고,
   재대결 가능 시점은 결승뿐.
========================= */

function isWildcardQualifier(
  qualifier
){

  return (
    qualifier?.isWildcard === true
    ||
    qualifier?.qualifierType ===
      "wildcard"
  );

}

function buildSixGroupWildcardEightBracket(){

  const groupNames =
    getGroupNames();

  if (
    groupNames.length !== 6
  ){

    return null;

  }

  const wildcards =
    qualifiers
      .filter(
        qualifier =>
          isWildcardQualifier(
            qualifier
          )
      )
      .sort(
        (a,b) => {

          const orderA =
            Number(
              a.wildcardOrder || 999
            );

          const orderB =
            Number(
              b.wildcardOrder || 999
            );

          if (
            orderA !== orderB
          ){

            return (
              orderA -
              orderB
            );

          }

          return String(
            a.groupName
          ).localeCompare(
            String(
              b.groupName
            ),
            "ko"
          );

        }
      );

  const groupWinners =
    qualifiers
      .filter(
        qualifier =>
          !isWildcardQualifier(
            qualifier
          )
          &&
          Number(
            qualifier.rank
          ) === 1
      )
      .sort(
        (a,b) =>
          String(
            a.groupName
          ).localeCompare(
            String(
              b.groupName
            ),
            "ko"
          )
      );

  if (
    wildcards.length !== 2
    ||
    groupWinners.length !== 6
  ){

    return null;

  }

  const wc1 =
    wildcards[0];

  const wc2 =
    wildcards[1];

  if (
    wc1.groupName ===
    wc2.groupName
  ){

    return null;

  }

  const wc1GroupWinner =
    groupWinners.find(
      qualifier =>
        qualifier.groupName ===
        wc1.groupName
    );

  const wc2GroupWinner =
    groupWinners.find(
      qualifier =>
        qualifier.groupName ===
        wc2.groupName
    );

  if (
    !wc1GroupWinner
    ||
    !wc2GroupWinner
  ){

    return null;

  }

  const otherGroupWinners =
    groupWinners.filter(
      qualifier =>
        qualifier.groupName !==
          wc1.groupName
        &&
        qualifier.groupName !==
          wc2.groupName
    );

  if (
    otherGroupWinners.length !== 4
  ){

    return null;

  }

  /*
    8강 1·2경기 = 상단 half
    8강 3·4경기 = 하단 half

    WC1의 조 1위는 상단,
    WC1은 하단.

    WC2의 조 1위는 하단,
    WC2는 상단.

    결과적으로 같은 조 1위와 WC는
    결승 전에는 절대 만날 수 없음.
  */

  return [

    [
      wc1GroupWinner,
      wc2
    ],

    [
      otherGroupWinners[0],
      otherGroupWinners[1]
    ],

    [
      wc2GroupWinner,
      wc1
    ],

    [
      otherGroupWinners[2],
      otherGroupWinners[3]
    ]

  ];

}

/* =========================
   GENERAL FALLBACK

   4조 8강이 아닌 경우에도
   같은 조끼리 1R 재대결을
   최대한 피하는 방식.
========================= */

function buildGeneralPairs(list){

  const sorted =
    [...list]
      .sort(
        (a,b) => {

          if (
            Number(a.rank) !==
            Number(b.rank)
          ){
            return (
              Number(a.rank) -
              Number(b.rank)
            );
          }

          return String(
            a.groupName
          ).localeCompare(
            String(b.groupName),
            "ko"
          );

        }
      );

  const pairCount =
    sorted.length / 2;

  const upper =
    sorted.slice(
      0,
      pairCount
    );

  const lower =
    sorted.slice(
      pairCount
    );

  const pairs = [];

  while (
    upper.length > 0
  ){

    const first =
      upper.shift();

    let index =
      lower.findIndex(
        opponent =>
          opponent.groupName !==
          first.groupName
      );

    if (
      index < 0
    ){
      index = 0;
    }

    const opponent =
      lower.splice(
        index,
        1
      )[0];

    pairs.push([
      first,
      opponent
    ]);

  }

  return pairs;

}

/* =========================
   FIRST ROUND
========================= */

function buildFirstRound(
  bracketSize
){

  /*
    남자 FWT 형식:
    6개조 × 조 1위 6명 + WC 2명 = 8명

    같은 조 1위와 WC는
    서로 반대 half에 배치해서
    4강 재대결까지 방지.
  */

  if (
    bracketSize === 8 &&
    qualifiers.length === 8
  ){

    const sixGroupWildcard =
      buildSixGroupWildcardEightBracket();

    if (
      sixGroupWildcard
    ){

      return sixGroupWildcard.map(
        (
          pair,
          matchIndex
        ) =>
          makeFirstRoundMatch(
            pair[0],
            pair[1],
            matchIndex
          )
      );

    }

  }

  /*
    가장 흔한 FWT 형식:
    4개조 × 각 2명 = 8명
  */

  if (
    bracketSize === 8 &&
    qualifiers.length === 8
  ){

    const standard =
      buildStandardEightBracket();

    if (standard){

      return standard.map(
        (
          pair,
          matchIndex
        ) =>
          makeFirstRoundMatch(
            pair[0],
            pair[1],
            matchIndex
          )
      );

    }

  }

  /*
    그 외 인원은
    BYE + 일반 회피 방식 사용
  */

  const sorted =
    [...qualifiers]
      .sort(
        (a,b) => {

          if (
            Number(a.rank) !==
            Number(b.rank)
          ){
            return (
              Number(a.rank) -
              Number(b.rank)
            );
          }

          return String(
            a.groupName
          ).localeCompare(
            String(b.groupName),
            "ko"
          );

        }
      );

  const byeCount =
    bracketSize -
    sorted.length;

  const byeEntrants =
    sorted.slice(
      0,
      byeCount
    );

  const playEntrants =
    sorted.slice(
      byeCount
    );

  const pairs =
    buildGeneralPairs(
      playEntrants
    );

  const firstRoundMatchCount =
    bracketSize / 2;

  const result =
    new Array(
      firstRoundMatchCount
    ).fill(null);

  /*
    BYE를 bracket 양쪽으로
    최대한 분산
  */

  const preferredByeSlots = [];

  for (
    let left = 0,
        right = firstRoundMatchCount - 1;

    left <= right;

    left++,
    right--
  ){

    preferredByeSlots.push(
      left
    );

    if (
      right !== left
    ){

      preferredByeSlots.push(
        right
      );

    }

  }

  byeEntrants.forEach(
    (
      qualifier,
      index
    ) => {

      const slot =
        preferredByeSlots[
          index
        ];

      result[slot] =
        makeByeMatch(
          qualifier,
          slot
        );

    }
  );

  let pairIndex = 0;

  for (
    let i = 0;
    i < result.length;
    i++
  ){

    if (
      result[i] !== null
    ){
      continue;
    }

    const pair =
      pairs[
        pairIndex++
      ];

    if (!pair){
      continue;
    }

    result[i] =
      makeFirstRoundMatch(
        pair[0],
        pair[1],
        i
      );

  }

  return result;

}

/* =========================
   MATCH FACTORIES
========================= */

function makeFirstRoundMatch(
  first,
  second,
  matchIndex
){

  return {

    id:
      `LOCAL-R0-M${matchIndex}`,

    dbMatchId:null,

    roundIndex:0,

    matchIndex,

    player1:
      first.entryIndex,

    player2:
      second.entryIndex,

    source1:
      `${first.groupName} ${first.rank}위`,

    source2:
      `${second.groupName} ${second.rank}위`,

    status:"waiting",

    winner:null,

    score1:null,

    score2:null,

    court:null

  };

}

function makeByeMatch(
  qualifier,
  matchIndex
){

  return {

    id:
      `LOCAL-R0-M${matchIndex}`,

    dbMatchId:null,

    roundIndex:0,

    matchIndex,

    player1:
      qualifier.entryIndex,

    player2:null,

    source1:
      `${qualifier.groupName} ${qualifier.rank}위`,

    source2:"BYE",

    status:"bye",

    winner:
      qualifier.entryIndex,

    score1:null,

    score2:null,

    court:null

  };

}

/* =========================
   CREATE BRACKET
========================= */

function createBracket(){

  const bracketSize =
    nextPowerOfTwo(
      qualifiers.length
    );

  const rounds = [];

  const firstRound =
    buildFirstRound(
      bracketSize
    );

  rounds.push(
    firstRound
  );

  let currentSize =
    bracketSize;

  while (
    currentSize > 2
  ){

    const previousSize =
      currentSize;

    currentSize /=
      2;

    const roundIndex =
      rounds.length;

    const matchCount =
      currentSize / 2;

    const round = [];

    for (
      let i = 0;
      i < matchCount;
      i++
    ){

      round.push({

        id:
          `LOCAL-R${roundIndex}-M${i}`,

        dbMatchId:null,

        roundIndex,

        matchIndex:i,

        player1:null,

        player2:null,

        source1:
          `${roundLabelBySize(
            previousSize
          )} ${i * 2 + 1}경기 승자`,

        source2:
          `${roundLabelBySize(
            previousSize
          )} ${i * 2 + 2}경기 승자`,

        source1MatchId:null,

        source2MatchId:null,

        status:"pending",

        winner:null,

        score1:null,

        score2:null,

        court:null

      });

    }

    rounds.push(
      round
    );

  }

  const data = {

    bracketSize,

    rounds

  };

  propagateKnownWinners(
    data
  );

  return data;

}

/* =========================
   STATUS
========================= */

function normalizeStatus(match){

  if (
    [
      "completed",
      "playing",
      "walkover"
    ].includes(
      match.status
    )
  ){
    return;
  }

  const has1 =
    match.player1 !== null &&
    match.player1 !== undefined;

  const has2 =
    match.player2 !== null &&
    match.player2 !== undefined;

  if (
    has1 &&
    has2
  ){

    match.status =
      "waiting";

    return;

  }

  if (
    match.roundIndex === 0 &&
    has1 &&
    !has2
  ){

    match.status =
      "bye";

    match.winner =
      match.player1;

    return;

  }

  match.status =
    "pending";

}

/* =========================
   WINNER PROPAGATION
========================= */

function propagateKnownWinners(data){

  for (
    let r = 0;
    r <
    data.rounds.length - 1;
    r++
  ){

    const current =
      data.rounds[r];

    const next =
      data.rounds[
        r + 1
      ];

    current.forEach(
      (
        match,
        index
      ) => {

        if (
          ![
            "bye",
            "completed",
            "walkover"
          ].includes(
            match.status
          )
        ){
          return;
        }

        if (
          match.winner === null ||
          match.winner === undefined
        ){
          return;
        }

        const nextMatch =
          next[
            Math.floor(
              index / 2
            )
          ];

        if (!nextMatch){
          return;
        }

        if (
          index % 2 === 0
        ){

          nextMatch.player1 =
            match.winner;

        } else {

          nextMatch.player2 =
            match.winner;

        }

        normalizeStatus(
          nextMatch
        );

      }
    );

  }

  data.rounds.forEach(
    round => {

      round.forEach(
        match => {

          normalizeStatus(
            match
          );

        }
      );

    }
  );

}

/* =========================
   SESSION
========================= */

function saveCompatibility(){

  sessionStorage.setItem(
    "fwtKnockoutBracket",
    JSON.stringify({

      signature:
        JSON.stringify(
          qualifiers.map(
            q => ({
              groupName:q.groupName,
              rank:q.rank,
              entryIndex:q.entryIndex,
              dbEntryId:q.dbEntryId
            })
          )
        ),

      data:
        bracketData

    })
  );

}

/* =========================
   LOAD EXISTING DB
========================= */

async function loadExistingBracket(){

  const {
    data:rows,
    error
  } =
    await supabaseClient
      .from("matches")
      .select(
        "id,stage,round_number,match_number,entry1_id,entry2_id,source1_match_id,source2_match_id,status,score1,score2,winner_entry_id,court_id,sort_order"
      )
      .eq(
        "division_id",
        tournament.divisionId
      )
      .neq(
        "stage",
        "group"
      )
      .order(
        "round_number",
        {
          ascending:true
        }
      )
      .order(
        "match_number",
        {
          ascending:true
        }
      );

  if (error){

    throw new Error(
      "본선 대진 조회 실패: "
      +
      error.message
    );

  }

  if (
    !rows ||
    rows.length === 0
  ){

    bracketAlreadySaved =
      false;

    bracketData =
      createBracket();

    saveCompatibility();

    return;

  }

  bracketAlreadySaved =
    true;

  const maxRound =
    Math.max(
      ...rows.map(
        row =>
          Number(
            row.round_number || 1
          )
      )
    );

  const bracketSize =
    Math.pow(
      2,
      maxRound
    );

  const rounds = [];

  for (
    let r = 1;
    r <= maxRound;
    r++
  ){

    const roundRows =
      rows
        .filter(
          row =>
            Number(
              row.round_number
            ) === r
        )
        .sort(
          (a,b) =>
            Number(
              a.match_number
            )
            -
            Number(
              b.match_number
            )
        );

    const roundIndex =
      r - 1;

    rounds.push(
      roundRows.map(
        (
          row,
          matchIndex
        ) => {

          const p1 =
            row.entry1_id
              ? entryIndexFromId(
                  row.entry1_id
                )
              : null;

          const p2 =
            row.entry2_id
              ? entryIndexFromId(
                  row.entry2_id
                )
              : null;

          const winner =
            row.winner_entry_id
              ? entryIndexFromId(
                  row.winner_entry_id
                )
              : null;

          return {

            id:row.id,

            dbMatchId:row.id,

            roundIndex,

            matchIndex,

            player1:
              p1 >= 0
                ? p1
                : null,

            player2:
              p2 >= 0
                ? p2
                : null,

            source1:
              roundIndex === 0
                ? ""
                : `이전 경기 승자`,

            source2:
              roundIndex === 0
                ? ""
                : `이전 경기 승자`,

            source1MatchId:
              row.source1_match_id,

            source2MatchId:
              row.source2_match_id,

            status:
              row.status,

            winner:
              winner >= 0
                ? winner
                : null,

            score1:
              row.score1,

            score2:
              row.score2,

            court:null

          };

        }
      )
    );

  }

  /*
    1라운드 출처 표시 복원
  */

  const qualifierMap =
    new Map();

  qualifiers.forEach(
    qualifier => {

      qualifierMap.set(
        qualifier.entryIndex,
        qualifier
      );

    }
  );

  rounds[0]?.forEach(
    match => {

      const q1 =
        qualifierMap.get(
          match.player1
        );

      const q2 =
        qualifierMap.get(
          match.player2
        );

      match.source1 =
        q1
          ? `${q1.groupName} ${q1.rank}위`
          : "";

      match.source2 =
        q2
          ? `${q2.groupName} ${q2.rank}위`
          : (
              match.status === "bye"
                ? "BYE"
                : ""
            );

    }
  );

  bracketData = {

    bracketSize,

    rounds

  };

  saveCompatibility();

}

/* =========================
   DELETE OLD KNOCKOUT
========================= */

async function deleteExistingKnockout(){

  const {
    error
  } =
    await supabaseClient
      .from("matches")
      .delete()
      .eq(
        "division_id",
        tournament.divisionId
      )
      .neq(
        "stage",
        "group"
      );

  if (error){

    throw new Error(
      "기존 본선 대진 삭제 실패: "
      +
      error.message
    );

  }

}

/* =========================
   SAVE DB
========================= */

async function saveBracketToDatabase(){

  /*
    현재 페이지에서 확정하는 시점에만
    기존 본선 데이터를 교체.
  */

  await deleteExistingKnockout();

  const dbRounds = [];

  let globalSort =
    10000;

  for (
    let r = 0;
    r <
    bracketData.rounds.length;
    r++
  ){

    const round =
      bracketData.rounds[r];

    const roundSize =
      bracketData.bracketSize /
      Math.pow(
        2,
        r
      );

    const stage =
      stageFromSize(
        roundSize
      );

    const rows =
      round.map(
        (
          match,
          matchIndex
        ) => {

          let source1MatchId =
            null;

          let source2MatchId =
            null;

          if (
            r > 0
          ){

            source1MatchId =
              dbRounds[
                r - 1
              ][
                matchIndex * 2
              ].id;

            source2MatchId =
              dbRounds[
                r - 1
              ][
                matchIndex * 2 + 1
              ].id;

          }

          return {

            division_id:
              tournament.divisionId,

            group_id:null,

            court_id:null,

            stage,

            round_number:
              r + 1,

            match_number:
              matchIndex + 1,

            entry1_id:
              entryIdFromIndex(
                match.player1
              ),

            entry2_id:
              entryIdFromIndex(
                match.player2
              ),

            source1_match_id:
              source1MatchId,

            source2_match_id:
              source2MatchId,

            status:
              match.status,

            score1:null,

            score2:null,

            winner_entry_id:
              entryIdFromIndex(
                match.winner
              ),

            started_at:null,

            completed_at:null,

            sort_order:
              globalSort++

          };

        }
      );

    const {
      data:saved,
      error
    } =
      await supabaseClient
        .from("matches")
        .insert(
          rows
        )
        .select(
          "id,round_number,match_number"
        );

    if (
      error ||
      !saved ||
      saved.length !==
        rows.length
    ){

      throw new Error(
        "본선 경기 저장 실패: "
        +
        (
          error?.message ||
          "저장된 경기 수가 맞지 않습니다."
        )
      );

    }

    saved.sort(
      (a,b) =>
        Number(
          a.match_number
        )
        -
        Number(
          b.match_number
        )
    );

    dbRounds.push(
      saved
    );

  }

  /*
    브라우저 객체에 DB UUID 부여
  */

  bracketData.rounds.forEach(
    (
      round,
      r
    ) => {

      round.forEach(
        (
          match,
          m
        ) => {

          match.id =
            dbRounds[r][m].id;

          match.dbMatchId =
            dbRounds[r][m].id;

          if (
            r > 0
          ){

            match.source1MatchId =
              dbRounds[
                r - 1
              ][
                m * 2
              ].id;

            match.source2MatchId =
              dbRounds[
                r - 1
              ][
                m * 2 + 1
              ].id;

          }

        }
      );

    }
  );

  /*
    BYE 진출자 다음 라운드 반영
  */

  for (
    let r = 0;
    r <
    bracketData.rounds.length - 1;
    r++
  ){

    const round =
      bracketData.rounds[r];

    for (
      let m = 0;
      m < round.length;
      m++
    ){

      const match =
        round[m];

      if (
        ![
          "bye",
          "completed",
          "walkover"
        ].includes(
          match.status
        )
      ){
        continue;
      }

      if (
        match.winner === null ||
        match.winner === undefined
      ){
        continue;
      }

      const next =
        bracketData.rounds[
          r + 1
        ][
          Math.floor(
            m / 2
          )
        ];

      if (!next){
        continue;
      }

      if (
        m % 2 === 0
      ){

        next.player1 =
          match.winner;

      } else {

        next.player2 =
          match.winner;

      }

      normalizeStatus(
        next
      );

      const {
        error
      } =
        await supabaseClient
          .from("matches")
          .update({

            entry1_id:
              entryIdFromIndex(
                next.player1
              ),

            entry2_id:
              entryIdFromIndex(
                next.player2
              ),

            status:
              next.status

          })
          .eq(
            "id",
            next.dbMatchId
          );

      if (error){

        throw new Error(
          "BYE 진출자 연결 실패: "
          +
          error.message
        );

      }

    }

  }

  bracketAlreadySaved =
    true;

  saveCompatibility();

}

/* =========================
   RENDER QUALIFIERS
========================= */

function renderQualifiers(){

  const box =
    document.getElementById(
      "qualifiers"
    );

  box.innerHTML = "";

  qualifiers
    .slice()
    .sort(
      (a,b) => {

        const groupCompare =
          String(
            a.groupName
          ).localeCompare(
            String(
              b.groupName
            ),
            "ko"
          );

        if (
          groupCompare !== 0
        ){
          return groupCompare;
        }

        return (
          Number(a.rank)
          -
          Number(b.rank)
        );

      }
    )
    .forEach(
      qualifier => {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "qualifier";

        item.innerHTML = `

          <div class="qualifier-source">
            ${escapeHtml(
              qualifier.groupName
            )}
            ${Number(
              qualifier.rank
            )}위
          </div>

          <div class="qualifier-name">
            ${escapeHtml(
              entryName(
                qualifier.entryIndex
              )
            )}
          </div>

        `;

        box.appendChild(
          item
        );

      }
    );

}

/* =========================
   SLOT
========================= */

function slotHtml(
  playerIndex,
  source
){

  if (
    playerIndex === null ||
    playerIndex === undefined
  ){

    return `

      <div class="slot">

        <div class="slot-source">
          ${escapeHtml(
            source ||
            "진출자 대기"
          )}
        </div>

        <div class="slot-player empty">
          미정
        </div>

      </div>

    `;

  }

  return `

    <div class="slot">

      <div class="slot-source">
        ${escapeHtml(
          source ||
          ""
        )}
      </div>

      <div class="slot-player">
        ${escapeHtml(
          entryName(
            playerIndex
          )
        )}
      </div>

    </div>

  `;

}

/* =========================
   BRACKET
========================= */

function renderBracket(){

  const box =
    document.getElementById(
      "bracket"
    );

  box.innerHTML = "";

  bracketData.rounds.forEach(
    (
      round,
      roundIndex
    ) => {

      const size =
        bracketData.bracketSize /
        Math.pow(
          2,
          roundIndex
        );

      const column =
        document.createElement(
          "section"
        );

      column.className =
        "round";

      column.innerHTML = `

        <div class="round-title">
          ${escapeHtml(
            roundLabelBySize(
              size
            )
          )}
        </div>

        <div class="round-matches"></div>

      `;

      const matchesBox =
        column.querySelector(
          ".round-matches"
        );

      round.forEach(
        match => {

          const card =
            document.createElement(
              "article"
            );

          card.className =
            "match";

          let statusClass =
            "";

          if (
            match.status ===
            "waiting"
          ){
            statusClass =
              "waiting";
          }

          if (
            match.status ===
            "bye"
          ){
            statusClass =
              "bye";
          }

          let winnerHtml =
            "";

          if (
            match.winner !== null &&
            match.winner !== undefined
          ){

            winnerHtml = `

              <div class="winner">
                진출 ·
                ${escapeHtml(
                  entryName(
                    match.winner
                  )
                )}
              </div>

            `;

          }

          card.innerHTML = `

            <div class="match-top">

              <div class="match-no">
                ${match.matchIndex + 1}경기
              </div>

              <div
                class="status ${statusClass}"
              >
                ${escapeHtml(
                  statusText(
                    match.status
                  )
                )}
              </div>

            </div>

            <div class="slots">

              ${slotHtml(
                match.player1,
                match.source1
              )}

              ${slotHtml(
                match.player2,
                match.source2
              )}

            </div>

            ${winnerHtml}

          `;

          matchesBox.appendChild(
            card
          );

        }
      );

      box.appendChild(
        column
      );

    }
  );

}

/* =========================
   SUMMARY
========================= */

function renderSummary(){

  document.getElementById(
    "qualifierCount"
  ).textContent =
    qualifiers.length;

  document.getElementById(
    "bracketSize"
  ).textContent =
    bracketData.bracketSize;

  document.getElementById(
    "byeCount"
  ).textContent =
    bracketData.bracketSize -
    qualifiers.length;

}

/* =========================
   ALL
========================= */

function renderAll(){

  renderQualifiers();

  renderSummary();

  renderBracket();

  document.getElementById(
    "continueButton"
  ).innerHTML =
    bracketAlreadySaved
      ? `본선 경기 운영 <span>→</span>`
      : `본선 대진 확정 · 경기 운영 <span>→</span>`;

}

/* =========================
   CONTINUE
========================= */

async function continueTournament(){

  if (busy){
    return;
  }

  try{

    if (
      !bracketAlreadySaved
    ){

      if (
        !confirm(
          "현재 본선 대진을 확정하고 경기 운영 화면으로 이동할까요?"
        )
      ){
        return;
      }

      setBusy(
        true,
        "본선 대진을 저장하고 있습니다",
        "본선 경기 정보를 FWT 데이터베이스에 저장 중입니다."
      );

      await saveBracketToDatabase();

    } else {

      setBusy(
        true,
        "본선 경기 운영을 준비하고 있습니다",
        "저장된 본선 대진을 불러오고 있습니다."
      );

    }

    saveCompatibility();

    location.href =
      "./knockout-control.html";

  } catch(error){

    console.error(error);

    setBusy(false);

    alert(
      "본선 대진을 저장하지 못했습니다.\n\n"
      +
      (
        error?.message ||
        "알 수 없는 오류"
      )
    );

  }

}

/* =========================
   EVENT
========================= */

document.getElementById(
  "continueButton"
).addEventListener(
  "click",
  continueTournament
);

/* =========================
   START
========================= */

async function start(){

  const loggedIn =
    await checkLogin();

  if (!loggedIn){
    return;
  }

  try{

    setBusy(
      true,
      "본선 대진을 불러오고 있습니다",
      "기존에 저장된 본선 경기가 있는지 확인 중입니다."
    );

    await loadExistingBracket();

    renderAll();

    setBusy(false);

  } catch(error){

    console.error(error);

    setBusy(false);

    alert(
      "본선 대진을 불러오지 못했습니다.\n\n"
      +
      (
        error?.message ||
        "알 수 없는 오류"
      )
    );

  }

}

start();

</script>
