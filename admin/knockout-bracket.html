<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>본선 토너먼트 | FWT Tournament</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --navy:#071a31;
      --navy2:#0c294a;
      --blue:#184a79;
      --lime:#c9df45;

      --bg:#f4f6f9;
      --white:#ffffff;
      --text:#172033;
      --muted:#647184;
      --line:#dfe5eb;

      --green:#178b61;
      --green-soft:#edf8f3;

      --orange:#99631c;
      --orange-soft:#fff7eb;

      --gold:#9b7515;
      --gold-soft:#fff9e8;

      --red:#c64b4b;
      --red-soft:#fff2f2;

      --shadow:
        0 12px 35px rgba(20,35,55,.06);
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      min-height:100%;

      background:var(--bg);
      color:var(--text);

      font-family:
        Inter,
        Pretendard,
        "Noto Sans KR",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button{
      font:inherit;
      cursor:pointer;
    }

    /* =========================
       HEADER
    ========================= */

    .topbar{
      min-height:72px;

      padding:0 20px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      background:
        linear-gradient(
          110deg,
          #06172b,
          #0a2848 62%,
          #103b67
        );

      box-shadow:
        0 5px 20px rgba(6,23,43,.16);
    }

    .fwt-logo{
      color:white;

      font-size:31px;
      line-height:1;

      font-weight:950;
      font-style:italic;

      letter-spacing:-4px;

      transform:skew(-5deg);
    }

    .fwt-logo span{
      color:var(--lime);
    }

    .top-actions{
      display:flex;
      gap:7px;
    }

    .header-btn{
      min-height:44px;

      padding:0 14px;

      border:
        1px solid rgba(255,255,255,.15);

      border-radius:10px;

      background:
        rgba(255,255,255,.08);

      color:white;

      font-size:12px;
      font-weight:850;
    }

    /* =========================
       PAGE
    ========================= */

    .container{
      width:
        min(
          1280px,
          calc(100% - 34px)
        );

      margin:0 auto;

      padding:32px 0 60px;
    }

    .head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;

      gap:20px;

      margin-bottom:18px;
    }

    .kicker{
      margin-bottom:7px;

      color:var(--blue);

      font-size:11px;
      font-weight:950;
      letter-spacing:2px;
    }

    h1{
      margin:0;

      color:var(--navy);

      font-size:34px;
      font-weight:950;
      letter-spacing:-1.5px;
    }

    .desc{
      margin:8px 0 0;

      color:var(--muted);

      font-size:13px;
      line-height:1.65;
    }

    .summary{
      display:flex;
      flex-wrap:wrap;

      gap:7px;
    }

    .summary-chip{
      padding:9px 12px;

      border:1px solid var(--line);
      border-radius:999px;

      background:white;
      color:#526073;

      font-size:11px;
      font-weight:850;
    }

    .summary-chip strong{
      margin-left:4px;

      color:var(--navy);

      font-size:15px;
      font-weight:950;
    }

    /* =========================
       NOTICE
    ========================= */

    .notice{
      margin-bottom:15px;

      padding:14px 15px;

      border:1px solid #dce8df;
      border-radius:13px;

      background:var(--green-soft);
      color:#396451;

      font-size:12px;
      font-weight:750;
      line-height:1.65;
    }

    /* =========================
       QUALIFIERS
    ========================= */

    .qualifier-card{
      overflow:hidden;

      margin-bottom:16px;

      border:1px solid var(--line);
      border-radius:16px;

      background:white;

      box-shadow:var(--shadow);
    }

    .card-head{
      display:flex;
      justify-content:space-between;
      align-items:center;

      padding:15px 17px;

      border-bottom:1px solid #e8ecf0;
    }

    .card-title{
      color:var(--navy);

      font-size:17px;
      font-weight:950;
    }

    .db-status{
      display:flex;
      align-items:center;

      gap:6px;

      color:var(--green);

      font-size:10px;
      font-weight:900;
    }

    .db-dot{
      width:7px;
      height:7px;

      border-radius:50%;

      background:var(--green);
    }

    .qualifiers{
      display:grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(180px,1fr)
        );

      gap:7px;

      padding:10px;
    }

    .qualifier{
      padding:11px 12px;

      border:1px solid #e2e7ec;
      border-radius:10px;

      background:#fafbfc;
    }

    .qualifier-source{
      color:#748093;

      font-size:10px;
      font-weight:800;
    }

    .qualifier-name{
      overflow:hidden;

      margin-top:4px;

      color:#253348;

      font-size:14px;
      font-weight:900;

      text-overflow:ellipsis;
      white-space:nowrap;
    }

    /* =========================
       BRACKET
    ========================= */

    .bracket-section{
      margin-top:18px;
    }

    .section-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;

      gap:12px;

      margin-bottom:10px;
    }

    .section-title{
      color:var(--navy);

      font-size:19px;
      font-weight:950;
    }

    .section-sub{
      color:#718092;

      font-size:11px;
      font-weight:750;
    }

    .bracket-scroll{
      overflow-x:auto;

      padding:
        2px 2px 14px;

      scrollbar-width:thin;
    }

    .bracket{
      min-width:max-content;

      display:flex;

      gap:12px;

      align-items:stretch;
    }

    .round{
      width:260px;

      display:flex;
      flex-direction:column;

      gap:10px;
    }

    .round-title{
      position:sticky;
      top:0;

      z-index:2;

      padding:11px 12px;

      border:1px solid var(--line);
      border-radius:10px;

      background:var(--navy);
      color:white;

      text-align:center;

      font-size:13px;
      font-weight:950;
    }

    .round-matches{
      flex:1;

      display:flex;
      flex-direction:column;

      justify-content:space-around;

      gap:10px;
    }

    .match{
      overflow:hidden;

      border:1px solid var(--line);
      border-radius:13px;

      background:white;

      box-shadow:var(--shadow);
    }

    .match-top{
      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:8px;

      padding:9px 11px;

      border-bottom:1px solid #e8ecf0;

      background:#f8fafb;
    }

    .match-no{
      color:var(--navy);

      font-size:11px;
      font-weight:950;
    }

    .status{
      min-height:25px;

      display:flex;
      align-items:center;

      padding:0 8px;

      border-radius:999px;

      background:#eef2f5;
      color:#667386;

      font-size:9px;
      font-weight:900;
    }

    .status.waiting{
      background:var(--green-soft);
      color:var(--green);
    }

    .status.bye{
      background:var(--gold-soft);
      color:var(--gold);
    }

    .status.completed{
      background:var(--green-soft);
      color:var(--green);
    }

    .slots{
      padding:8px;
    }

    .slot{
      min-height:48px;

      display:flex;
      flex-direction:column;
      justify-content:center;

      padding:8px 9px;

      margin-bottom:6px;

      border:1px solid #e5e9ed;
      border-radius:9px;

      background:white;
    }

    .slot:last-child{
      margin-bottom:0;
    }

    .slot-source{
      margin-bottom:3px;

      color:#7b8796;

      font-size:9px;
      font-weight:750;
    }

    .slot-player{
      overflow:hidden;

      color:#263247;

      font-size:13px;
      font-weight:900;

      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .slot-player.empty{
      color:#939ca8;

      font-weight:750;
    }

    .winner{
      margin:0 8px 8px;

      padding:7px 9px;

      border-radius:8px;

      background:var(--green-soft);
      color:var(--green);

      font-size:10px;
      font-weight:900;
    }

    /* =========================
       ACTIONS
    ========================= */

    .actions{
      display:grid;

      grid-template-columns:
        190px 210px minmax(0,1fr);

      gap:9px;

      margin-top:18px;
    }

    .action-btn{
      height:56px;
      min-height:56px;

      border-radius:11px;

      font-weight:900;
    }

    .back-btn{
      border:1px solid #d8dee5;

      background:white;
      color:#526073;
    }

    .regenerate-btn{
      border:1px solid #ecd5d5;

      background:var(--red-soft);
      color:var(--red);
    }

    .continue-btn{
      border:0;

      background:
        linear-gradient(
          115deg,
          var(--navy),
          #123e6c
        );

      color:white;

      font-size:14px;
    }

    .continue-btn span{
      margin-left:5px;

      color:var(--lime);
    }

    button:disabled{
      cursor:not-allowed;
      opacity:.5;
    }

    /* =========================
       LOADING
    ========================= */

    .loading-overlay{
      display:none;

      position:fixed;
      inset:0;

      z-index:500;

      align-items:center;
      justify-content:center;

      padding:20px;

      background:
        rgba(4,17,31,.62);
    }

    .loading-overlay.show{
      display:flex;
    }

    .loading-box{
      width:min(350px,100%);

      padding:25px;

      border-radius:17px;

      background:white;

      text-align:center;

      box-shadow:
        0 30px 80px rgba(0,0,0,.25);
    }

    .spinner{
      width:38px;
      height:38px;

      margin:0 auto 15px;

      border:4px solid #e6eaee;
      border-top-color:var(--navy);

      border-radius:50%;

      animation:
        spin .8s linear infinite;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    .loading-title{
      color:var(--navy);

      font-size:16px;
      font-weight:950;
    }

    .loading-text{
      margin-top:6px;

      color:#657184;

      font-size:12px;
      line-height:1.6;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer{
      display:flex;
      justify-content:space-between;

      margin-top:28px;
      padding-top:17px;

      border-top:1px solid #e2e6eb;

      color:#7c8795;

      font-size:10px;
      letter-spacing:1px;
    }

    .footer strong{
      color:var(--navy);
    }

    .q{
      color:#91a719;
      font-weight:950;
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:700px){

      .topbar{
        min-height:72px;

        padding:0 14px;
      }

      .fwt-logo{
        font-size:30px;
      }

      .header-btn{
        height:46px;
        min-height:46px;

        padding:0 11px;

        font-size:11px;
      }

      .container{
        width:
          calc(100% - 22px);

        padding:
          24px 0 50px;
      }

      .head{
        display:block;
      }

      .summary{
        margin-top:13px;
      }

      h1{
        font-size:30px;
      }

      .desc{
        font-size:14px;
      }

      .summary-chip{
        font-size:12px;
      }

      .notice{
        font-size:13px;
      }

      .card-title{
        font-size:18px;
      }

      .qualifiers{
        grid-template-columns:
          repeat(
            2,
            minmax(0,1fr)
          );
      }

      .qualifier-source{
        font-size:11px;
      }

      .qualifier-name{
        font-size:14px;
      }

      .section-title{
        font-size:20px;
      }

      .section-sub{
        font-size:12px;
      }

      .round{
        width:235px;
      }

      .round-title{
        min-height:44px;

        display:flex;
        align-items:center;
        justify-content:center;

        font-size:14px;
      }

      .slot{
        min-height:52px;
      }

      .slot-source{
        font-size:10px;
      }

      .slot-player{
        font-size:14px;
      }

      /*
        모바일 주요 버튼
      */

      .actions{
        grid-template-columns:1fr;

        gap:9px;
      }

      .action-btn{
        width:100%;

        height:56px;
        min-height:56px;

        flex:none;

        font-size:15px;
      }

    }

    @media(max-width:390px){

      .qualifiers{
        grid-template-columns:1fr;
      }

    }
  </style>
</head>


<body>

<header class="topbar">

  <div class="fwt-logo">
    FW<span>T</span>
  </div>


  <div class="top-actions">

    <button
      class="header-btn"
      type="button"
      onclick="location.href='./group-standings.html'"
    >
      조별 순위
    </button>

    <button
      class="header-btn"
      type="button"
      onclick="location.href='./dashboard.html'"
    >
      대시보드
    </button>

  </div>

</header>


<main class="container">

  <div class="head">

    <div>

      <div class="kicker">
        KNOCKOUT BRACKET
      </div>

      <h1>
        본선 토너먼트
      </h1>

      <p class="desc">
        예선 순위를 기준으로 본선 대진을 생성합니다.
      </p>

    </div>


    <div class="summary">

      <div class="summary-chip">
        진출
        <strong id="qualifierCount">0</strong>
      </div>

      <div class="summary-chip">
        본선
        <strong id="bracketSize">0</strong>강
      </div>

      <div class="summary-chip">
        BYE
        <strong id="byeCount">0</strong>
      </div>

    </div>

  </div>


  <div class="notice">
    진출 순위가 높은 참가자에게 BYE를 우선 배정하며,
    실제 경기가 필요한 경우 가능한 한 같은 조 참가자끼리 첫 경기에서 다시 만나지 않도록 배치합니다.
  </div>


  <section class="qualifier-card">

    <div class="card-head">

      <div class="card-title">
        본선 진출자
      </div>

      <div class="db-status">

        <div class="db-dot"></div>

        DB 연결

      </div>

    </div>


    <div
      class="qualifiers"
      id="qualifiers"
    ></div>

  </section>


  <section class="bracket-section">

    <div class="section-head">

      <div class="section-title">
        대진표
      </div>

      <div class="section-sub">
        좌우로 밀어서 전체 대진 확인
      </div>

    </div>


    <div class="bracket-scroll">

      <div
        class="bracket"
        id="bracket"
      ></div>

    </div>

  </section>


  <div class="actions">

    <button
      class="action-btn back-btn"
      type="button"
      onclick="location.href='./group-standings.html'"
    >
      이전 단계
    </button>


    <button
      class="action-btn regenerate-btn"
      id="regenerateButton"
      type="button"
    >
      본선 대진 다시 생성
    </button>


    <button
      class="action-btn continue-btn"
      id="continueButton"
      type="button"
    >
      본선 대진 확정 · 경기 운영
      <span>→</span>
    </button>

  </div>


  <footer class="footer">

    <div>
      <strong>FWT</strong>
      · FRIENDS WITH TENNIS
    </div>

    <div>
      CREATED BY
      <span class="q">Q</span>
    </div>

  </footer>

</main>


<div
  class="loading-overlay"
  id="loadingOverlay"
>

  <div class="loading-box">

    <div class="spinner"></div>

    <div
      class="loading-title"
      id="loadingTitle"
    >
      본선 대진을 불러오고 있습니다
    </div>

    <div
      class="loading-text"
      id="loadingText"
    >
      FWT 데이터베이스에 연결 중입니다.
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://opwuyqerisocqobbbisg.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_Eo_zfONeGLs9ATCVg2Fk_g_y_IAJFV-";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const tournament =
  JSON.parse(
    sessionStorage.getItem(
      "fwtNewTournament"
    ) || "null"
  );


const entries =
  JSON.parse(
    sessionStorage.getItem(
      "fwtNewTournamentEntries"
    ) || "null"
  );


const qualifiers =
  JSON.parse(
    sessionStorage.getItem(
      "fwtKnockoutQualifiers"
    ) || "null"
  );


if (
  !tournament ||
  !tournament.tournamentId ||
  !tournament.divisionId ||
  !Array.isArray(entries) ||
  !Array.isArray(qualifiers) ||
  qualifiers.length < 2
) {

  alert(
    "본선 진출자 정보가 없습니다."
  );

  location.href =
    "./group-standings.html";

}


let busy =
  false;


let bracketData =
  null;


let bracketAlreadySaved =
  false;


/* =========================
   HELPERS
========================= */

function escapeHtml(value){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    value ?? "";


  return div.innerHTML;

}


function shortEntryName(entry){

  if (!entry){

    return "알 수 없음";

  }


  if (
    entry.type ===
    "singles"
  ){

    return (
      entry.nickname ||
      entry.name ||
      "이름 없음"
    );

  }


  const p1 =
    entry.player1?.nickname ||
    entry.player1?.name ||
    "선수1";


  const p2 =
    entry.player2?.nickname ||
    entry.player2?.name ||
    "선수2";


  return `${p1}/${p2}`;

}


function entryName(index){

  if (
    index === null ||
    index === undefined
  ){

    return null;

  }


  return shortEntryName(
    entries[index]
  );

}


function entryIndexFromId(id){

  return entries.findIndex(
    entry =>
      entry.dbEntryId ===
      id
  );

}


function entryIdFromIndex(index){

  if (
    index === null ||
    index === undefined
  ){

    return null;

  }


  return (
    entries[index]?.dbEntryId ||
    null
  );

}


function nextPowerOfTwo(number){

  let value = 2;


  while (
    value < number
  ){

    value *= 2;

  }


  return value;

}


function roundLabelBySize(size){

  if (size === 2){
    return "결승";
  }

  if (size === 4){
    return "4강";
  }

  if (size === 8){
    return "8강";
  }

  if (size === 16){
    return "16강";
  }

  if (size === 32){
    return "32강";
  }


  return `${size}강`;

}


function stageFromSize(size){

  if (size === 2){
    return "final";
  }

  if (size === 4){
    return "semifinal";
  }

  if (size === 8){
    return "quarterfinal";
  }

  if (size === 16){
    return "round16";
  }

  return "round32";

}


function statusText(status){

  const map = {

    pending:"진출자 대기",
    waiting:"대기",
    playing:"경기중",
    completed:"완료",
    bye:"BYE",
    walkover:"기권승",
    cancelled:"취소"

  };


  return (
    map[status] ||
    status ||
    "대기"
  );

}


/* =========================
   SIGNATURE
========================= */

const sortedQualifiers =
  [...qualifiers]
    .sort(
      (a,b) => {

        if (
          Number(a.rank) !==
          Number(b.rank)
        ){

          return (
            Number(a.rank) -
            Number(b.rank)
          );

        }


        return String(
          a.groupName
        ).localeCompare(
          String(b.groupName),
          "ko"
        );

      }
    );


const bracketSignature =
  JSON.stringify(
    sortedQualifiers.map(
      item => ({

        groupName:
          item.groupName,

        rank:
          item.rank,

        entryIndex:
          item.entryIndex,

        dbEntryId:
          item.dbEntryId

      })
    )
  );


/* =========================
   AUTH
========================= */

async function checkLogin(){

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getSession();


  if (
    error ||
    !data.session
  ){

    location.href =
      "./";


    return false;

  }


  return true;

}


/* =========================
   BUSY
========================= */

function setBusy(
  state,
  title = "",
  text = ""
){

  busy =
    state;


  document.getElementById(
    "loadingOverlay"
  ).classList.toggle(
    "show",
    state
  );


  document.getElementById(
    "regenerateButton"
  ).disabled =
    state;


  document.getElementById(
    "continueButton"
  ).disabled =
    state;


  if (title){

    document.getElementById(
      "loadingTitle"
    ).textContent =
      title;

  if (text){

    ).textContent =

/* =========================
   PLAY-IN PAIRING

   상위 Pool과 하위 Pool을
   짝지어 같은 조 재대결을
   가능한 한 회피.
========================= */

function pairEntrants(list){

  const sorted =
    [...list]
      .sort(
        (a,b) => {

          if (
            Number(a.rank) !==
            Number(b.rank)
          ){

            return (
              Number(a.rank) -
              Number(b.rank)
            );

          }


          return String(
            a.groupName
          ).localeCompare(
            String(b.groupName),
            "ko"
          );

        }
      );


  const half =
    sorted.length / 2;


  const upper =
    sorted.slice(
      0,
      half
    );


  const lower =
    sorted.slice(
      half
    );


  const pairings =
    [];


  while (
    upper.length > 0
  ){

    const first =
      upper.shift();


    let opponentIndex =
      lower.findIndex(
        item =>
          item.groupName !==
          first.groupName
      );


    if (
      opponentIndex < 0
    ){

      opponentIndex = 0;

    }


    const opponent =
      lower.splice(
        opponentIndex,
        1
      )[0];


    pairings.push([
      first,
      opponent
    ]);

  }


  return pairings;

}


/* =========================
   FIRST ROUND

   bracketSize 8,
   qualifiers 6 예시:

   BYE 2명
   실제 1R 경기 2경기

   총 4개의 1R match node
========================= */

function buildFirstRound(
  bracketSize
){

  const firstRoundMatchCount =
    bracketSize / 2;


  const byeCount =
    bracketSize -
    sortedQualifiers.length;


  /*
    상위 진출자부터 BYE
  */

  const byeEntrants =
    sortedQualifiers.slice(
      0,
      byeCount
    );


  const playEntrants =
    sortedQualifiers.slice(
      byeCount
    );


  const realPairs =
    pairEntrants(
      playEntrants
    );


  const slots =
    new Array(
      firstRoundMatchCount
    ).fill(null);


  /*
    BYE를 가능한 한
    서로 떨어뜨려 배치
  */

  let byeCursor = 0;


  for (
    let i = 0;
    i < slots.length &&
    byeCursor < byeEntrants.length;
    i += 2
  ){

    slots[i] = {

      type:"bye",

      player:
        byeEntrants[
          byeCursor++
        ]

    };

  }


  /*
    BYE가 많으면
    남은 빈 슬롯에 계속 배치
  */

  for (
    let i = 0;
    i < slots.length &&
    byeCursor < byeEntrants.length;
    i++
  ){

    if (
      slots[i] === null
    ){

      slots[i] = {

        type:"bye",

        player:
          byeEntrants[
            byeCursor++
          ]

      };

    }

  }


  /*
    실제 경기 배치
  */

  let pairCursor = 0;


  for (
    let i = 0;
    i < slots.length;
    i++
  ){

    if (
      slots[i] === null
    ){

      slots[i] = {

        type:"match",

        pair:
          realPairs[
            pairCursor++
          ]

      };

    }

  }


  return slots.map(
    (
      slot,
      matchIndex
    ) => {

      if (
        slot.type ===
        "bye"
      ){

        const qualifier =
          slot.player;


        return {

          id:
            `LOCAL-R0-M${matchIndex}`,

          dbMatchId:
            null,

          roundIndex:
            0,

          matchIndex,

          player1:
            qualifier.entryIndex,

          player2:
            null,

          source1:
            `${qualifier.groupName} ${qualifier.rank}위`,

          source2:
            null,

          status:
            "bye",

          winner:
            qualifier.entryIndex,

          score1:
            null,

          score2:
            null,

          court:
            null

        };

      }


      const [
        first,
        second
      ] =
        slot.pair;


      return {

        id:
          `LOCAL-R0-M${matchIndex}`,

        dbMatchId:
          null,

        roundIndex:
          0,

        matchIndex,

        player1:
          first.entryIndex,

        player2:
          second.entryIndex,

        source1:
          `${first.groupName} ${first.rank}위`,

        source2:
          `${second.groupName} ${second.rank}위`,

        status:
          "waiting",

        winner:
          null,

        score1:
          null,

        score2:
          null,

        court:
          null

      };

    }
  );

}


/* =========================
   CREATE LOCAL BRACKET
========================= */

function createBracket(){

  const bracketSize =
    nextPowerOfTwo(
      sortedQualifiers.length
    );


  const rounds =
    [];


  rounds.push(
    buildFirstRound(
      bracketSize
    )
  );


  let currentSize =
    bracketSize;


  while (
    currentSize > 2
  ){

    const previousSize =
      currentSize;


    currentSize =
      currentSize / 2;


    const roundIndex =
      rounds.length;


    const matchCount =
      currentSize / 2;


    const newRound =
      [];


    for (
      let i = 0;
      i < matchCount;
      i++
    ){

      newRound.push({

        id:
          `LOCAL-R${roundIndex}-M${i}`,

        dbMatchId:
          null,

        roundIndex,

        matchIndex:i,

        player1:null,

        player2:null,

        source1:
          `${roundLabelBySize(
            previousSize
          )} ${i * 2 + 1}경기 승자`,

        source2:
          `${roundLabelBySize(
            previousSize
          )} ${i * 2 + 2}경기 승자`,

        status:
          "pending",

        winner:null,

        score1:null,

        score2:null,

        court:null

      });

    }


    rounds.push(
      newRound
    );

  }


  const data = {

    bracketSize,

    rounds

  };


  propagateKnownWinners(
    data
  );


  return data;

}


/* =========================
   BYE 전파
========================= */

function normalizeStatus(
  match
){

  if (
    match.status ===
    "completed"
    ||
    match.status ===
    "playing"
    ||
    match.status ===
    "walkover"
  ){

    return;

  }


  if (
    match.player1 !== null &&
    match.player1 !== undefined &&
    match.player2 !== null &&
    match.player2 !== undefined
  ){

    match.status =
      "waiting";


    return;

  }


  if (
    match.roundIndex === 0 &&
    (
      match.player1 !== null &&
      match.player1 !== undefined
    )
    &&
    (
      match.player2 === null ||
      match.player2 === undefined
    )
  ){

    match.status =
      "bye";


    match.winner =
      match.player1;


    return;

  }


  match.status =
    "pending";

}


function propagateKnownWinners(
  data
){

  for (
    let r = 0;
    r <
    data.rounds.length - 1;
    r++
  ){

    const current =
      data.rounds[r];


    const next =
      data.rounds[
        r + 1
      ];


    current.forEach(
      (
        match,
        matchIndex
      ) => {

        if (
          ![
            "bye",
            "completed",
            "walkover"
          ].includes(
            match.status
          )
        ){

          return;

        }


        if (
          match.winner === null ||
          match.winner === undefined
        ){

          return;

        }


        const nextMatch =
          next[
            Math.floor(
              matchIndex / 2
            )
          ];


        if (!nextMatch){
          return;
        }


        if (
          matchIndex % 2 === 0
        ){

          nextMatch.player1 =
            match.winner;

        } else {

          nextMatch.player2 =
            match.winner;

        }


        normalizeStatus(
          nextMatch
        );

      }
    );

  }


  data.rounds.forEach(
    round => {

      round.forEach(
        match => {

          normalizeStatus(
            match
          );

        }
      );

    }
  );

}

/* =========================
   LOAD DB
========================= */

async function loadExistingBracket(){

  const {
    data:rows,
    error
  } =
    await supabaseClient
      .from("matches")
      .select(
        "id,stage,round_number,match_number,entry1_id,entry2_id,source1_match_id,source2_match_id,status,score1,score2,winner_entry_id,court_id,sort_order"
      )
      .eq(
        "division_id",
        tournament.divisionId
      )
      .neq(
        "stage",
        "group"
      )
      .order(
        "round_number",
        {
          ascending:true
        }
      )
      .order(
        "match_number",
        {
          ascending:true
        }
      );


  if (error){

    throw new Error(
      "본선 대진 조회 실패: "
      +
      error.message
    );

  }


  if (
    !rows ||
    rows.length === 0
  ){

    bracketAlreadySaved =
      false;


    bracketData =
      createBracket();


    saveCompatibility();


    return;

  }


  bracketAlreadySaved =
    true;


  const maxRound =
    Math.max(
      ...rows.map(
        row =>
          Number(
            row.round_number || 1
          )
      )
    );


  const roundCount =
    maxRound;


  const bracketSize =
    Math.pow(
      2,
      roundCount
    );


  const rounds =
    [];


  for (
    let r = 1;
    r <= roundCount;
    r++
  ){

    const roundRows =
      rows
        .filter(
          row =>
            Number(
              row.round_number
            ) === r
        )
        .sort(
          (a,b) =>
            Number(
              a.match_number
            )
            -
            Number(
              b.match_number
            )
        );


    const roundIndex =
      r - 1;


    rounds.push(
      roundRows.map(
        (
          row,
          matchIndex
        ) => {

          const p1 =
            row.entry1_id
              ? entryIndexFromId(
                  row.entry1_id
                )
              : null;


          const p2 =
            row.entry2_id
              ? entryIndexFromId(
                  row.entry2_id
                )
              : null;


          const winner =
            row.winner_entry_id
              ? entryIndexFromId(
                  row.winner_entry_id
                )
              : null;


          return {

            id:
              row.id,

            dbMatchId:
              row.id,

            roundIndex,

            matchIndex,

            player1:
              p1 >= 0
                ? p1
                : null,

            player2:
              p2 >= 0
                ? p2
                : null,

            source1:
              roundIndex === 0
                ? null
                : `이전 경기 승자`,

            source2:
              roundIndex === 0
                ? null
                : `이전 경기 승자`,

            source1MatchId:
              row.source1_match_id,

            source2MatchId:
              row.source2_match_id,

            status:
              row.status,

            winner:
              winner >= 0
                ? winner
                : null,

            score1:
              row.score1,

            score2:
              row.score2,

            court:
              null

          };

        }
      )
    );

  }


  /*
    첫 라운드의 출처 표시는
    qualifier 정보로 다시 구성
  */

  const qualifierByEntryIndex =
    new Map();


  sortedQualifiers.forEach(
    item => {

      qualifierByEntryIndex.set(
        item.entryIndex,
        item
      );

    }
  );


  rounds[0]?.forEach(
    match => {

      const q1 =
        qualifierByEntryIndex.get(
          match.player1
        );


      const q2 =
        qualifierByEntryIndex.get(
          match.player2
        );


      match.source1 =
        q1
          ? `${q1.groupName} ${q1.rank}위`
          : null;


      match.source2 =
        q2
          ? `${q2.groupName} ${q2.rank}위`
          : null;

    }
  );


  bracketData = {

    bracketSize,

    rounds

  };


  saveCompatibility();

}

async function deleteExistingKnockout(){

  } =
    await supabaseClient

      +
      error.message
    );

  }

}


async function saveBracketToDatabase(){

  await deleteExistingKnockout();


  const dbRounds =
    [];


  let globalSort =
    10000;


  /*
    라운드별 순차 INSERT.

    다음 라운드가
    이전 경기 UUID를 source로
    참조해야 하므로 한 라운드씩 저장.
  */

  for (
    let r = 0;
    r <
    bracketData.rounds.length;
    r++
  ){

    const round =
      bracketData.rounds[r];


    const size =
      bracketData.bracketSize /
      Math.pow(
        2,
        r
      );


    const stage =
      stageFromSize(
        size
      );


    const rows =
      round.map(
        (
          match,
          matchIndex
        ) => {

          let source1MatchId =
            null;


          let source2MatchId =
            null;


          if (
            r > 0
          ){

            source1MatchId =
              dbRounds[
                r - 1
              ][
                matchIndex * 2
              ].id;


            source2MatchId =
              dbRounds[
                r - 1
              ][
                matchIndex * 2 + 1
              ].id;

          }


          return {

            division_id:
              tournament.divisionId,

            group_id:
              null,

            court_id:
              null,

            stage,

            round_number:
              r + 1,

            match_number:
              matchIndex + 1,

            entry1_id:
              entryIdFromIndex(
                match.player1
              ),

            entry2_id:
              entryIdFromIndex(
                match.player2
              ),

            source1_match_id:
              source1MatchId,

            source2_match_id:
              source2MatchId,

            status:
              match.status,

            score1:
              match.score1,

            score2:
              match.score2,

            winner_entry_id:
              entryIdFromIndex(
                match.winner
              ),

            started_at:
              null,

            completed_at:
              null,

            sort_order:
              globalSort++

          };

        }
      );


    const {
      data:saved,
      error
    } =
      await supabaseClient
        .from("matches")
        .insert(
          rows
        )
        .select(
          "id,stage,round_number,match_number,entry1_id,entry2_id,source1_match_id,source2_match_id,status,winner_entry_id"
        );


    if (
      error ||
      !saved ||
      saved.length !==
        rows.length
    ){

      throw new Error(
        "본선 경기 저장 실패: "
        +
        (
          error?.message ||
          "저장 경기 수가 맞지 않습니다."
        )
      );

    }


    saved.sort(
      (a,b) =>
        Number(
          a.match_number
        )
        -
        Number(
          b.match_number
        )
    );


    dbRounds.push(
      saved
    );

  }


  /*
    DB UUID를 브라우저 대진에도 적용
  */

  bracketData.rounds.forEach(
    (
      round,
      r
    ) => {

      round.forEach(
        (
          match,
          m
        ) => {

          match.id =
            dbRounds[r][m].id;


          match.dbMatchId =
            dbRounds[r][m].id;


          if (
            r > 0
          ){

            match.source1MatchId =
              dbRounds[
                r - 1
              ][
                m * 2
              ].id;


            match.source2MatchId =
              dbRounds[
                r - 1
              ][
                m * 2 + 1
              ].id;

          }

        }
      );

    }
  );


  /*
    BYE 승자를 다음 라운드 DB 슬롯에 반영
  */

  for (
    let r = 0;
    r <
    bracketData.rounds.length - 1;
    r++
  ){

    const round =
      bracketData.rounds[r];


    for (
      let m = 0;
      m < round.length;
      m++
    ){

      const match =
        round[m];


      if (
        ![
          "bye",
          "completed",
          "walkover"
        ].includes(
          match.status
        )
      ){

        continue;

      }


      if (
        match.winner === null ||
        match.winner === undefined
      ){

        continue;

      }


      const next =
        bracketData.rounds[
          r + 1
        ][
          Math.floor(
            m / 2
          )
        ];


      if (!next){
        continue;
      }


      if (
        m % 2 === 0
      ){

        next.player1 =
          match.winner;

      } else {

        next.player2 =
          match.winner;

      }


      normalizeStatus(
        next
      );


      const updateValues = {

        entry1_id:
          entryIdFromIndex(
            next.player1
          ),

        entry2_id:
          entryIdFromIndex(
            next.player2
          ),

        status:
          next.status

      };


      const {
        error:updateError
      } =
        await supabaseClient
          .from("matches")
          .update(
            updateValues
          )
          .eq(
            "id",
            next.dbMatchId
          );


      if (updateError){

        throw new Error(
          "BYE 진출자 반영 실패: "
          +
          updateError.message
        );

      }

    }

  }


  bracketAlreadySaved =
    true;


  saveCompatibility();

}

  playerIndex,
  source
){

  if (
    playerIndex === null ||
    playerIndex === undefined
  ){

    return `

      <div class="slot">

        <div class="slot-source">
          ${escapeHtml(
            source ||
            "진출자 대기"
          )}
        </div>

        <div class="slot-player empty">
          미정
        </div>

      </div>

    `;

  }


  return `

    <div class="slot">

      <div class="slot-source">
        ${escapeHtml(
          source ||
          ""
        )}
      </div>

      <div class="slot-player">

          entryName(
            playerIndex

   BRACKET RENDER
========================= */

function renderBracket(){

    document.getElementById(
      "bracket"
    );

    !bracketData
  ){

    return;

  }


  bracketData.rounds.forEach(
    (
      round,
      roundIndex
    ) => {

      const size =
        bracketData.bracketSize /
        Math.pow(
          2,
          roundIndex
        );


      const column =
        document.createElement(
          "section"
        );


      column.className =
        "round";


      column.innerHTML = `

        <div class="round-title">
          ${escapeHtml(
            roundLabelBySize(
              size
            )
          )}
        </div>

        <div class="round-matches"></div>

        column.querySelector(
          ".round-matches"
        );

        match => {

            document.createElement(

            );

            match.status ===
            "waiting"
          ){

            statusClass =
              "waiting";

          } else if (
            match.status ===
            "bye"
          ){

            statusClass =
              "bye";

          } else if (
            match.status ===
            "completed"
          ){

            statusClass =
              "completed";

          }


          let winnerHtml =
            "";


          if (
            match.winner !== null &&
            match.winner !== undefined
          ){

            winnerHtml = `

              <div class="winner">
                진출 ·
                ${escapeHtml(
                  entryName(
                    match.winner
                  )
                )}
              </div>

            `;

          }


          card.innerHTML = `

            <div class="match-top">

              <div class="match-no">
                ${match.matchIndex + 1}경기
              </div>

              <div
                class="status ${statusClass}"
              >
                ${escapeHtml(
                  statusText(
                    match.status
                  )
                )}
              </div>

            </div>


            <div class="slots">

              ${slotHtml(
                match.player1,
                match.source1
              )}

              ${slotHtml(
                match.player2,
                match.source2
              )}

            </div>


            ${winnerHtml}

          `;


          matchesBox.appendChild(
            card
          );

        }
      );


      box.appendChild(
        column
      );

    }
  );

}

async function regenerateBracket(){

  if (busy){
    return;
  }


  let message =
    "본선 대진을 새로 다시 생성할까요?";


  if (
    bracketAlreadySaved
  ){

    message +=
      "\n\n현재 DB에 저장된 본선 대진이 삭제되고 새 대진으로 교체됩니다.";


    message +=
      "\n이미 본선 경기를 진행했다면 결과도 삭제될 수 있습니다.";

  }


  if (
    !confirm(message)
  ){

    return;

  }


  try{

    setBusy(
      true,
      "본선 대진을 다시 생성하고 있습니다",
      "새로운 대진을 준비 중입니다."
    );


    if (
      bracketAlreadySaved
    ){

      await deleteExistingKnockout();

    }


    bracketAlreadySaved =
      false;


    bracketData =
      createBracket();


    saveCompatibility();


    renderAll();


    setBusy(false);


  } catch(error){

    setBusy(false);


    alert(
      "본선 대진을 다시 생성하지 못했습니다.\n\n"
      +
      error.message
    );

  }

}


/* =========================
   CONTINUE
========================= */

async function continueTournament(){

  if (busy){
    return;
  }


  try{

    if (
      !bracketAlreadySaved
    ){

      const ok =
        confirm(
          "현재 본선 대진을 확정하고 경기 운영 화면으로 이동할까요?"
        );


      if (!ok){
        return;
      }


      setBusy(
        true,
        "본선 대진을 저장하고 있습니다",
        "본선 경기와 BYE 정보를 FWT 데이터베이스에 저장 중입니다."
      );


      await saveBracketToDatabase();

    } else {

      setBusy(
        true,
        "본선 경기 운영을 준비하고 있습니다",
        "저장된 본선 대진을 불러오고 있습니다."
      );

    }


    saveCompatibility();


    location.href =
      "./knockout-control.html";


  } catch(error){

    console.error(error);


    setBusy(false);


    alert(
      "본선 대진을 저장하지 못했습니다.\n\n"
      +
      (
        error?.message ||
        "알 수 없는 오류"
      )
    );

  }

}


/* =========================
   EVENTS
========================= */

document.getElementById(
  "regenerateButton"
).addEventListener(
  "click",
  regenerateBracket
);


document.getElementById(
  "continueButton"
).addEventListener(
  "click",
  continueTournament
);


/* =========================
   START
========================= */

async function start(){

  const loggedIn =
    await checkLogin();


  if (!loggedIn){
    return;
  }


  try{

    setBusy(
      true,
      "본선 대진을 불러오고 있습니다",
      "기존에 저장된 본선 경기가 있는지 확인 중입니다."
    );


    await loadExistingBracket();


    renderAll();


    setBusy(false);


  } catch(error){

    console.error(error);


    setBusy(false);


    alert(
      "본선 대진을 불러오지 못했습니다.\n\n"
      +
      (
        error?.message ||
        "알 수 없는 오류"
      )
    );

  }

}


start();

</script>
