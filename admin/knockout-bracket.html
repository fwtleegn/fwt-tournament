<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>본선 토너먼트 | FWT Tournament</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --navy:#071a31;
      --navy2:#0c294a;
      --blue:#184a79;
      --lime:#c9df45;

      --bg:#f4f6f9;
      --white:#ffffff;
      --text:#172033;
      --muted:#617083;
      --line:#e1e6eb;

      --green:#178b61;
      --green-soft:#edf8f3;

      --orange:#9e651d;
      --orange-soft:#fff7e9;

      --shadow:
        0 10px 30px rgba(20,35,55,.055);
    }

    * {
      box-sizing:border-box;
    }

    html,
    body {
      margin:0;
      min-height:100%;

      background:var(--bg);
      color:var(--text);

      font-family:
        Inter,
        Pretendard,
        "Noto Sans KR",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button {
      font:inherit;
      cursor:pointer;
    }

    .topbar {
      height:68px;
      padding:0 24px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      color:white;

      background:
        linear-gradient(
          110deg,
          #07182d,
          #0b2848 60%,
          #10375f
        );
    }

    .brand {
      display:flex;
      align-items:center;
      gap:22px;
    }

    .fwt {
      font-size:29px;
      font-weight:950;
      font-style:italic;
      letter-spacing:-3px;
    }

    .fwt span {
      color:var(--lime);
    }

    .top-title {
      font-size:11px;
      font-weight:800;
      letter-spacing:1.8px;
      color:rgba(255,255,255,.72);
    }

    .back-btn {
      padding:9px 13px;

      border:
        1px solid rgba(255,255,255,.16);

      border-radius:10px;

      background:
        rgba(255,255,255,.07);

      color:white;

      font-size:12px;
      font-weight:750;
    }

    .container {
      width:min(1400px,calc(100% - 34px));

      margin:0 auto;

      padding:32px 0 64px;
    }

    .head {
      display:flex;
      justify-content:space-between;
      align-items:flex-end;

      gap:20px;

      margin-bottom:18px;
    }

    .kicker {
      margin-bottom:7px;

      color:var(--blue);

      font-size:11px;
      font-weight:900;
      letter-spacing:1.8px;
    }

    h1 {
      margin:0;

      color:var(--navy);

      font-size:34px;
      font-weight:900;
      letter-spacing:-1.5px;
    }

    .desc {
      margin:7px 0 0;

      color:var(--muted);

      font-size:13px;
      line-height:1.6;
    }

    .summary {
      display:flex;
      flex-wrap:wrap;
      gap:7px;
    }

    .chip {
      padding:8px 11px;

      border:1px solid var(--line);
      border-radius:999px;

      background:white;

      color:#526073;

      font-size:11px;
      font-weight:800;
    }

    .chip strong {
      color:var(--navy);
      font-size:13px;
    }

    .notice {
      margin-bottom:17px;

      padding:14px 16px;

      border:1px solid #dfe5ea;
      border-radius:14px;

      background:white;

      color:#536174;

      font-size:12px;
      line-height:1.7;
    }

    .notice strong {
      color:var(--navy);
    }

    .bracket-wrap {
      overflow-x:auto;

      padding-bottom:10px;
    }

    .bracket {
      display:flex;
      align-items:stretch;

      gap:20px;

      min-width:max-content;
    }

    .round {
      width:270px;

      display:flex;
      flex-direction:column;
    }

    .round-head {
      margin-bottom:10px;

      padding:11px 13px;

      border-radius:11px;

      background:var(--navy);

      color:white;

      font-size:14px;
      font-weight:900;

      text-align:center;
    }

    .round-count {
      margin-left:5px;

      color:var(--lime);

      font-size:10px;
    }

    .round-matches {
      flex:1;

      display:flex;
      flex-direction:column;
      justify-content:space-around;

      gap:14px;
    }

    .match {
      overflow:hidden;

      border:1px solid var(--line);
      border-radius:14px;

      background:white;

      box-shadow:var(--shadow);
    }

    .match-head {
      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:8px 11px;

      border-bottom:1px solid #e8ecf0;

      background:#f8fafb;
    }

    .match-number {
      color:#687587;

      font-size:10px;
      font-weight:900;
    }

    .match-status {
      padding:4px 7px;

      border-radius:999px;

      background:#eef2f5;

      color:#697687;

      font-size:9px;
      font-weight:850;
    }

    .match-status.bye {
      background:var(--orange-soft);
      color:var(--orange);
    }

    .match-status.ready {
      background:var(--green-soft);
      color:var(--green);
    }

    .slot {
      display:flex;
      align-items:center;

      min-height:53px;

      padding:10px 12px;

      border-bottom:1px solid #edf0f3;
    }

    .slot:last-child {
      border-bottom:0;
    }

    .seed {
      width:47px;
      flex-shrink:0;

      color:#667386;

      font-size:10px;
      font-weight:900;
    }

    .player {
      min-width:0;

      flex:1;

      overflow:hidden;

      color:#263247;

      font-size:14px;
      font-weight:850;

      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .player.empty {
      color:#9ba4ae;
      font-weight:700;
    }

    .player.bye {
      color:#9a651e;
    }

    .source {
      margin-top:3px;

      color:#788493;

      font-size:9px;
      font-weight:700;
    }

    .qualifiers {
      margin-top:18px;

      display:grid;

      grid-template-columns:
        repeat(

          minmax(200px,1fr)

      gap:9px;
    }

    .qualifier-card {
      display:flex;
      align-items:center;
      gap:10px;

      padding:12px 13px;

      border:1px solid var(--line);
      border-radius:12px;

      background:white;

    .qualifier-seed {
      min-width:47px;

      padding:6px 7px;

      border-radius:8px;

      background:#eef2f6;

      color:var(--navy);

      text-align:center;

      font-size:11px;
      font-weight:900;
    }

    .qualifier-name {
      color:#263247;

      font-size:13px;
      font-weight:850;
    }

    .bottom {
      display:flex;
      gap:10px;

      margin-top:19px;
    }

    .previous,
    .next {
      min-height:53px;

      border-radius:11px;

      font-weight:850;
    }

    .previous {
      width:180px;

      border:1px solid #d8dee5;

      color:#526073;
    }

    .next {

      border:0;

    }

    .footer {
      display:flex;
      justify-content:space-between;

      margin-top:26px;
      padding-top:17px;

      border-top:1px solid #e2e6eb;

      color:#7c8795;

      font-size:10px;
      letter-spacing:1px;

    .footer strong {

    }

    .q {
      color:#91a719;
      font-weight:900;
    }

    @media(max-width:700px) {

        height:64px;
        padding:0 14px;
      }

      .top-title {
        display:none;
      }

      .container {

      }

      .head {
        display:block;
      }

      .summary {
        margin-top:13px;
      }

      h1 {
        font-size:30px;
      }

      .desc {
        font-size:14px;
      }

      .notice {
        font-size:13px;
      }

      /*
        모바일은 가로 스크롤로
        대진표를 보는 구조.
      */

      .round {
        width:245px;
      }

      .round-head {
        font-size:15px;
      }

      .player {
        font-size:15px;
      }

      .seed {
        font-size:11px;
      }

      .match-status {
        font-size:10px;
      }

      .qualifier-name {
        font-size:14px;
      }

      .bottom {
        flex-direction:column-reverse;
      }

      .previous,
      .next {
        width:100%;
        flex:none;
        min-height:54px;
      }

      .next {
        font-size:15px;
      }

    }
  </style>
</head>

<script>

const SUPABASE_URL =
  "https://opwuyqerisocqobbbisg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Eo_zfONeGLs9ATCVg2Fk_g_y_IAJFV-";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function checkLogin() {

  const { data } =
    await supabaseClient.auth.getSession();

  if (!data.session) {
    location.href = "./";
  }

}


checkLogin();


const tournament =
  JSON.parse(
    sessionStorage.getItem(
      "fwtNewTournament"
    ) || "null"
  );


const entries =
  JSON.parse(
    sessionStorage.getItem(
      "fwtNewTournamentEntries"
    ) || "null"
  );


const qualifiers =
  JSON.parse(
    sessionStorage.getItem(
      "fwtKnockoutQualifiers"
    ) || "null"
  );


if (
  !tournament ||
  !entries ||
  !qualifiers ||
  !Array.isArray(qualifiers)
  ||
  qualifiers.length < 2
) {

  alert(
    "본선 진출자 정보가 없습니다."
  );

  location.href =
    "./group-standings.html";

}


/* ==========================
   이름
========================== */

function shortEntryName(entry) {

  if (!entry) {
    return "알 수 없음";
  }


  if (
    entry.type === "singles"
  ) {

    return (
      entry.nickname ||
      entry.name ||
      "이름 없음"
    );

  }


  const p1 =
    entry.player1?.nickname ||
    entry.player1?.name ||
    "선수1";


  const p2 =
    entry.player2?.nickname ||
    entry.player2?.name ||
    "선수2";


  return `${p1}/${p2}`;

}


function escapeHtml(value) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value ?? "";

  return div.innerHTML;

}


/* ==========================
   다음 2의 제곱
========================== */

function nextPowerOfTwo(number) {

  let result = 1;


  while (
    result < number
  ) {

    result *= 2;

  }


  return result;

}


/* ==========================
   라운드 이름
========================== */

function roundName(size) {

  if (size === 2) {
    return "결승";
  }

  if (size === 4) {
    return "4강";
  }

  if (size === 8) {
    return "8강";
  }

  if (size === 16) {
    return "16강";
  }

  if (size === 32) {
    return "32강";
  }


  return `${size}강`;

}


/* ==========================
   진출자 정렬

   rank 우선
   그다음 조 순서
========================== */

function groupOrder(name) {

  const index =
    qualifiers
      .map(
        item =>
          item.groupName
      )
      .filter(
        (
          value,
          index,
          array
        ) =>
          array.indexOf(value)
          === index
      )
      .indexOf(name);


  return index;

}


const sortedQualifiers =
  [...qualifiers]
    .sort(
      (a,b) => {

        if (
          a.rank !== b.rank
        ) {

          return (
            a.rank -
            b.rank
          );

        }


        return (
          groupOrder(
            a.groupName
          )
          -
          groupOrder(
            b.groupName
          )
        );

      }
    );


/* ==========================
   첫 라운드 페어링

   기본 목표:
   조 1위 vs 다른 조 하위진출자
========================== */

function buildPairings(
  qualifierList
) {

  /*
    먼저 순위별 Pool을 만듦.

    1위 그룹
    2위 그룹
    ...
  */

  const rankMap =
    new Map();


  qualifierList.forEach(
    qualifier => {

      if (
        !rankMap.has(
          qualifier.rank
        )
      ) {

        rankMap.set(
          qualifier.rank,
          []
        );

      }


      rankMap
        .get(
          qualifier.rank
        )
        .push(
          qualifier
        );

    }
  );


  const ranks =
    [...rankMap.keys()]
      .sort(
        (a,b) =>
          a - b
      );


  /*
    가장 흔한 형태:
    조 1위 + 조 2위

    1위와 2위를 서로 교차.
  */

  if (
    ranks.length === 2
  ) {

    const top =
      [...rankMap.get(
        ranks[0]
      )];


    const lower =
      [...rankMap.get(
        ranks[1]
      )];


    const pairings = [];


    while (
      top.length > 0
    ) {

      const first =
        top.shift();


      let opponentIndex =
        lower.findIndex(
          item =>
            item.groupName !==
            first.groupName
        );


      if (
        opponentIndex < 0
      ) {

        opponentIndex = 0;

      }


      const opponent =
        lower.splice(
          opponentIndex,
          1
        )[0];


      pairings.push([
        first,
        opponent || null
      ]);

    }


    /*
      만약 하위 Pool 쪽에
      남은 인원이 있다면 추가
    */

    while (
      lower.length > 0
    ) {

      pairings.push([
        lower.shift(),
        null
      ]);

    }


    return pairings;

  }


  /*
    진출 순위가 3개 이상이면
    간단한 Greedy 방식으로
    같은 조를 피해서 페어링.
  */

  const remaining =
    [...qualifierList];


  const pairings = [];


  while (
    remaining.length > 1
  ) {

    const first =
      remaining.shift();


    let opponentIndex =
      remaining.findIndex(
        item =>
          item.groupName !==
          first.groupName
      );


    if (
      opponentIndex < 0
    ) {

      opponentIndex = 0;

    }


    const opponent =
      remaining.splice(
        opponentIndex,
        1
      )[0];


    pairings.push([
      first,
      opponent
    ]);

  }


  if (
    remaining.length === 1
  ) {

    pairings.push([
      remaining[0],
      null
    ]);

  }


  return pairings;

}


/* ==========================
   전체 토너먼트 생성
========================== */

function createBracket() {

  const qualifierCount =
    sortedQualifiers.length;


  const bracketSize =
    nextPowerOfTwo(
      qualifierCount
    );


  const firstRoundMatchCount =
    bracketSize / 2;


  const initialPairings =
    buildPairings(
      sortedQualifiers
    );


  const firstRound = [];


  /*
    Pairing을 먼저 넣음
  */

  initialPairings.forEach(
    (
      pairing,
      index
    ) => {

      firstRound.push({

        id:
          `R0-M${index}`,

        roundIndex:0,

        matchIndex:index,

        player1:
          pairing[0]
            ? pairing[0].entryIndex
            : null,

        player2:
          pairing[1]
            ? pairing[1].entryIndex
            : null,

        source1:
          pairing[0]
            ? `${pairing[0].groupName} ${pairing[0].rank}위`
            : null,

        source2:
          pairing[1]
            ? `${pairing[1].groupName} ${pairing[1].rank}위`
            : null,

        status:
          null,

        winner:
          null,

        score1:null,
        score2:null,
        court:null

      });

    }
  );


  /*
    본선 슬롯 수에 맞게
    남은 Match는 BYE 공간 생성
  */

  while (
    firstRound.length <
    firstRoundMatchCount
  ) {

    firstRound.push({

      id:
        `R0-M${firstRound.length}`,

      roundIndex:0,

      matchIndex:
        firstRound.length,

      player1:null,
      player2:null,

      source1:null,
      source2:null,

      status:"bye",

      winner:null,

      score1:null,
      score2:null,
      court:null

    });

  }


  /*
    첫 라운드 BYE 처리

    선수 한 명만 있으면
    자동 다음 라운드 진출.
  */

  firstRound.forEach(
    match => {

      if (
        match.player1 !== null
        &&
        match.player2 === null
      ) {

        match.status =
          "bye";

        match.winner =
          match.player1;

      } else if (
        match.player1 === null
        &&
        match.player2 !== null
      ) {

        match.status =
          "bye";

        match.winner =
          match.player2;

      } else if (
        match.player1 !== null
        &&
        match.player2 !== null
      ) {

        match.status =
          "waiting";

      }

    }
  );


  const rounds = [
    firstRound
  ];


  let currentSize =
    bracketSize;


  while (
    currentSize > 2
  ) {

    currentSize =
      currentSize / 2;


    const previousRound =
      rounds[
        rounds.length - 1
      ];


    const roundIndex =
      rounds.length;


    const matchCount =
      currentSize / 2;


    const newRound = [];


    for (
      let i = 0;
      i < matchCount;
      i++
    ) {

      newRound.push({

        id:
          `R${roundIndex}-M${i}`,

        roundIndex,

        matchIndex:i,

        player1:null,
        player2:null,

        source1:
          `${roundName(
            currentSize * 2
          )} ${i * 2 + 1}경기 승자`,

        source2:
          `${roundName(
            currentSize * 2
          )} ${i * 2 + 2}경기 승자`,

        status:"pending",

        winner:null,

        score1:null,
        score2:null,
        court:null

      });

    }


    rounds.push(
      newRound
    );

  }


  /*
    첫 라운드 BYE 승자를
    다음 라운드 슬롯에 반영.
  */

  propagateByes(
    rounds
  );


  return {

    bracketSize,

    rounds

  };

}


/* ==========================
   BYE 자동 진출 전파
========================== */

function propagateByes(
  rounds
) {

  for (
    let r = 0;
    r < rounds.length - 1;
    r++
  ) {

    const current =
      rounds[r];


    const next =
      rounds[r + 1];


    current.forEach(
      (
        match,
        matchIndex
      ) => {

        if (
          match.status !==
          "bye"
          ||
          match.winner === null
        ) {

          return;

        }


        const nextMatchIndex =
          Math.floor(
            matchIndex / 2
          );


        const nextMatch =
          next[
            nextMatchIndex
          ];


        if (!nextMatch) {
          return;
        }


        if (
          matchIndex % 2 === 0
        ) {

          nextMatch.player1 =
            match.winner;

        } else {

          nextMatch.player2 =
            match.winner;

        }


        updateMatchStatus(
          nextMatch
        );

      }
    );

  }

}


/* ==========================
   경기 상태 계산
========================== */

function updateMatchStatus(
  match
) {

  if (
    match.player1 !== null
    &&
    match.player2 !== null
  ) {

    if (
      match.status !==
      "completed"
    ) {

      match.status =
        "waiting";

    }


    return;

  }


  if (
    match.player1 !== null
    ||
    match.player2 !== null
  ) {

    match.status =
      "pending";

    return;

  }


  match.status =
    "pending";

}


/* ==========================
   저장/로드
========================== */

function bracketSignature() {

  return JSON.stringify(
    sortedQualifiers.map(
      item => ({
        groupName:
          item.groupName,
        rank:
          item.rank,
        entryIndex:
          item.entryIndex
      })
    )
  );

}


const currentSignature =
  bracketSignature();


let bracketData = null;


function saveBracket() {

  sessionStorage.setItem(
    "fwtKnockoutBracket",
    JSON.stringify({

      signature:
        currentSignature,

      data:
        bracketData

    })
  );

}


function loadBracket() {

  const raw =
    sessionStorage.getItem(
      "fwtKnockoutBracket"
    );


  if (raw) {

    try {

      const parsed =
        JSON.parse(raw);


      if (
        parsed
        &&
        parsed.signature ===
          currentSignature
        &&
        parsed.data
      ) {

        bracketData =
          parsed.data;

        return;

      }

    } catch(e) {}

  }


  bracketData =
    createBracket();


  saveBracket();

}


/* ==========================
   상태 텍스트
========================== */

function statusInfo(
  match
) {

  if (
    match.status ===
    "bye"
  ) {

    return {
      text:"BYE",
      className:"bye"
    };

  }


  if (
    match.status ===
    "waiting"
  ) {

    return {
      text:"대기",
      className:"ready"
    };

  }


  if (
    match.status ===
    "completed"
  ) {

    return {
      text:"완료",
      className:"ready"
    };

  }


  return {
    text:"진출자 대기",
    className:""
  };

}


/* ==========================
   슬롯
========================== */

function slotHtml(
  playerIndex,
  source
) {

  if (
    playerIndex === null
    ||
    playerIndex === undefined
  ) {

    return `

      <div class="slot">

        <div class="seed">
          -
        </div>

        <div>

          <div class="player empty">
            ${
              source
                ? escapeHtml(source)
                : "BYE"
            }
          </div>

        </div>

      </div>

    `;

  }


  return `

    <div class="slot">

      <div class="seed">
        ${
          source
            ? escapeHtml(source)
            : ""
        }
      </div>

      <div>

        <div class="player">
          ${escapeHtml(
            shortEntryName(
              entries[
                playerIndex
              ]
            )
          )}
        </div>

      </div>

    </div>

  `;

}


/* ==========================
   렌더
========================== */

function renderBracket() {

  const box =
    document.getElementById(
      "bracket"
    );


  box.innerHTML = "";


  bracketData.rounds.forEach(
    (
      round,
      roundIndex
    ) => {

      const size =
        bracketData.bracketSize /
        Math.pow(
          2,
          roundIndex
        );


      const column =
        document.createElement(
          "div"
        );


      column.className =
        "round";


      let matchesHtml = "";


      round.forEach(
        (
          match,
          matchIndex
        ) => {

          const status =
            statusInfo(
              match
            );


          matchesHtml += `

            <div class="match">

              <div class="match-head">

                <div class="match-number">
                  ${matchIndex + 1}경기
                </div>

                <div
                  class="match-status ${status.className}"
                >
                  ${status.text}
                </div>

              </div>

              ${slotHtml(
                match.player1,
                match.source1
              )}

              ${slotHtml(
                match.player2,
                match.source2
              )}

            </div>

          `;

        }
      );


      column.innerHTML = `

        <div class="round-head">

          ${roundName(size)}

          <span class="round-count">
            ${round.length}경기
          </span>

        </div>

        <div class="round-matches">
          ${matchesHtml}
        </div>

      `;


      box.appendChild(
        column
      );

    }
  );


  document.getElementById(
    "qualifierCount"
  ).textContent =
    sortedQualifiers.length;


  document.getElementById(
    "bracketSize"
  ).textContent =
    bracketData.bracketSize;


  const byeCount =
    bracketData.rounds[0]
      .filter(
        match =>
          match.status ===
          "bye"
      )
      .length;


  document.getElementById(
    "byeCount"
  ).textContent =
    byeCount;

}


/* ==========================
   진출자 목록
========================== */

function renderQualifiers() {

  const box =
    document.getElementById(
      "qualifiers"
    );


  box.innerHTML = "";


  sortedQualifiers.forEach(
    qualifier => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "qualifier-card";


      card.innerHTML = `

        <div class="qualifier-seed">

          ${escapeHtml(
            qualifier.groupName
          )}

          ${qualifier.rank}위

        </div>

        <div class="qualifier-name">

          ${escapeHtml(
            shortEntryName(
              entries[
                qualifier.entryIndex
              ]
            )
          )}

        </div>

      `;


      box.appendChild(
        card
      );

    }
  );

}


/* ==========================
   본선 경기 운영
========================== */

document.getElementById(
  "controlButton"
).addEventListener(
  "click",
  function() {

    saveBracket();


    /*
      다음 파일까지 미리 연결.

      다음 단계에서
      knockout-control.html만
      새로 만들면 됨.
    */

    location.href =
      "./knockout-control.html";

  }
);


/* ==========================
   START
========================== */

loadBracket();

renderBracket();

renderQualifiers();

</script>
