<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>경기 운영 | FWT Tournament</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --navy:#071a31;
      --navy2:#0c294a;
      --blue:#184a79;
      --lime:#c9df45;

      --bg:#f4f6f9;
      --white:#ffffff;
      --text:#172033;
      --muted:#667386;
      --line:#e2e7ec;

      --green:#178b61;
      --green-soft:#edf8f3;

      --orange:#9d651d;
      --orange-soft:#fff8ed;

      --red:#c64b4b;
      --red-soft:#fff2f2;

      --shadow:
        0 10px 30px rgba(20,35,55,.055);
    }

    * {
      box-sizing:border-box;
    }

    html,
    body {
      margin:0;
      min-height:100%;

      background:var(--bg);
      color:var(--text);

      font-family:
        Inter,
        Pretendard,
        "Noto Sans KR",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input {
      font:inherit;
    }

    button {
      cursor:pointer;
    }

    /* HEADER */

    .topbar {
      min-height:72px;

      padding:0 20px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      background:
        linear-gradient(
          110deg,
          #06172b,
          #0a2848 62%,
          #103b67
        );

      box-shadow:
        0 5px 20px rgba(6,23,43,.16);
    }

    .fwt-logo {
      color:white;

      font-size:31px;
      line-height:1;

      font-weight:950;
      font-style:italic;
      letter-spacing:-4px;

      transform:skew(-5deg);
    }

    .fwt-logo span {
      color:var(--lime);
    }

    .top-actions {
      display:flex;
      gap:7px;
    }

    .header-btn {
      min-height:44px;

      padding:0 14px;

      border:
        1px solid rgba(255,255,255,.15);

      border-radius:10px;

      background:
        rgba(255,255,255,.08);

      color:white;

      font-size:12px;
      font-weight:850;
    }

    /* PAGE */

    .container {
      width:
        min(
          1280px,
          calc(100% - 34px)
        );

      margin:0 auto;

      padding:32px 0 60px;
    }

    .head {
      display:flex;
      justify-content:space-between;
      align-items:flex-end;

      gap:20px;

      margin-bottom:18px;
    }

    .kicker {
      margin-bottom:7px;

      color:var(--blue);

      font-size:11px;
      font-weight:950;
      letter-spacing:2px;
    }

    h1 {
      margin:0;

      color:var(--navy);

      font-size:34px;
      font-weight:950;
      letter-spacing:-1.5px;
    }

    .desc {
      margin:7px 0 0;

      color:#5f6c7e;

      font-size:13px;
      line-height:1.6;
    }

    .head-right {
      display:flex;
      flex-direction:column;
      align-items:flex-end;

      gap:9px;
    }

    .stats {
      display:flex;
      flex-wrap:wrap;

      gap:7px;
    }

    .stat {
      padding:8px 11px;

      border:1px solid var(--line);
      border-radius:999px;

      background:white;
      color:#526073;

      font-size:11px;
      font-weight:850;
    }

    .stat strong {
      color:var(--navy);

      font-size:14px;
    }

    .standings-btn {
      min-height:46px;

      padding:0 18px;

      border:0;
      border-radius:10px;

      background:var(--navy);
      color:white;

      font-size:13px;
      font-weight:900;
    }

    .standings-btn span {
      margin-left:5px;
      color:var(--lime);
    }

    /* SECTION */

    .section-title {
      display:flex;
      align-items:center;
      justify-content:space-between;

      margin:22px 0 10px;
    }

    .section-title-main {
      color:var(--navy);

      font-size:18px;
      font-weight:950;
    }

    .section-title-sub {
      color:#6b7788;

      font-size:11px;
      font-weight:750;
    }

    /* COURTS */

    .courts {
      display:grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(220px,1fr)
        );

      gap:9px;
    }

    .court {
      overflow:hidden;

      border:1px solid var(--line);
      border-radius:14px;

      background:white;

      box-shadow:var(--shadow);
    }

    .court-inner {
      min-height:101px;

      padding:12px 13px;
    }

    .court-top {
      display:flex;
      justify-content:space-between;
      align-items:center;

      gap:7px;

      margin-bottom:8px;
    }

    .court-name {
      color:var(--navy);

      font-size:15px;
      font-weight:950;
    }

    .court-status {
      padding:5px 8px;

      border-radius:999px;

      background:#f0f3f6;
      color:#657183;

      font-size:10px;
      font-weight:850;
    }

    .court-status.live {
      background:var(--green-soft);
      color:var(--green);
    }

    .court-empty {
      padding-top:6px;

      color:#677487;

      font-size:13px;
      font-weight:750;
    }

    .court-group {
      margin-bottom:4px;

      color:var(--navy2);

      font-size:12px;
      font-weight:950;
    }

    .court-match-line {
      overflow:hidden;

      color:#202d41;

      font-size:14px;
      font-weight:900;

      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .court-actions {
      display:grid;

      grid-template-columns:
        .78fr 1.35fr;

      gap:6px;

      margin-top:9px;
    }

    .court-btn {
      min-width:0;
      height:42px;
      min-height:42px;

      padding:0 7px;

      border:1px solid #d9e0e6;
      border-radius:8px;

      background:white;
      color:#526073;

      font-size:11px;
      font-weight:850;
    }

    .court-btn.finish {
      border:0;

      background:var(--navy);
      color:white;

      font-size:12px;
    }

    /* NEXT */

    .next-card {
      overflow:hidden;

      border:1px solid var(--line);
      border-radius:16px;

      background:white;

      box-shadow:var(--shadow);
    }

    .next-list {
      padding:8px;
    }

    .next-match {
      display:grid;

      grid-template-columns:
        65px minmax(0,1fr) 120px;

      align-items:center;

      gap:10px;

      min-height:67px;

      padding:10px 11px;

      border-bottom:1px solid #e8ecf0;
    }

    .next-match:last-child {
      border-bottom:0;
    }

    .group-badge {
      height:39px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:10px;

      background:#eef2f6;
      color:var(--navy);

      font-size:14px;
      font-weight:950;
    }

    .next-main {
      min-width:0;
    }

    .next-players {
      overflow:hidden;

      color:#202d41;

      font-size:15px;
      font-weight:900;

      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .next-sub {
      margin-top:3px;

      color:#718092;

      font-size:10px;
      font-weight:750;
    }

    .assign-btn {
      min-height:42px;

      border:0;
      border-radius:9px;

      background:
        linear-gradient(
          115deg,
          var(--navy),
          #123e6c
        );

      color:white;

      font-size:12px;
      font-weight:900;
    }

    /* FULL WAITING */

    .waiting-toggle-wrap {
      margin-top:10px;
    }

    .waiting-toggle {
      width:100%;

      height:52px;
      min-height:52px;

      border:1px solid #dce2e8;
      border-radius:11px;

      background:white;
      color:var(--navy);

      font-size:13px;
      font-weight:900;
    }

    .full-waiting {
      display:none;

      margin-top:10px;

      overflow:hidden;

      border:1px solid var(--line);
      border-radius:16px;

      background:white;

      box-shadow:var(--shadow);
    }

    .full-waiting.show {
      display:block;
    }

    .waiting-tabs {
      display:flex;

      gap:6px;

      overflow-x:auto;

      padding:10px 10px 0;

      scrollbar-width:none;
    }

    .waiting-tabs::-webkit-scrollbar {
      display:none;
    }

    .tab-btn {
      flex-shrink:0;

      height:40px;
      min-height:40px;

      padding:0 14px;

      border:1px solid #dce2e8;
      border-radius:999px;

      background:white;
      color:#4d5a6c;

      font-size:12px;
      font-weight:900;
    }

    .tab-btn.active {
      border-color:var(--navy);

      background:var(--navy);
      color:white;
    }

    .waiting-list {
      padding:10px;
    }

    .waiting-row {
      display:grid;

      grid-template-columns:
        65px minmax(0,1fr) 110px;

      align-items:center;

      gap:10px;

      min-height:63px;

      padding:9px 10px;

      border-bottom:1px solid #e9edf1;
    }

    .waiting-row:last-child {
      border-bottom:0;
    }

    .waiting-group {
      color:var(--navy);

      font-size:13px;
      font-weight:950;
    }

    .waiting-players {
      overflow:hidden;

      color:#263247;

      font-size:14px;
      font-weight:850;

      text-overflow:ellipsis;
      white-space:nowrap;
    }

    /* COMPLETED */

    .completed-card {
      margin-top:13px;

      overflow:hidden;

      border:1px solid var(--line);
      border-radius:16px;

      background:white;

      box-shadow:var(--shadow);
    }

    .card-head {
      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:15px 16px;

      border-bottom:1px solid var(--line);
    }

    .card-title {
      color:var(--navy);

      font-size:17px;
      font-weight:950;
    }

    .count {
      min-width:31px;
      height:31px;

      padding:0 9px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:999px;

      background:#eef2f5;
      color:var(--navy);

      font-size:12px;
      font-weight:950;
    }

    .completed-list {
      padding:10px;
    }

    .completed {
      display:grid;

      grid-template-columns:
        minmax(0,1fr) auto;

      align-items:center;

      gap:12px;

      padding:11px 12px;
      margin-bottom:7px;

      border:1px solid #e2e8e5;
      border-radius:11px;

      background:#fbfdfc;
    }

    .completed:last-child {
      margin-bottom:0;
    }

    .completed-group {
      margin-bottom:4px;

      color:var(--navy);

      font-size:12px;
      font-weight:950;
    }

    .completed-name {
      color:#263247;

      font-size:14px;
      font-weight:900;
    }

    .completed-actions {
      display:flex;

      gap:6px;

      margin-top:8px;
    }

    .small-btn {
      min-height:36px;

      padding:0 10px;

      border:1px solid #dce2e8;
      border-radius:8px;

      background:white;
      color:#536071;

      font-size:10px;
      font-weight:850;
    }

    .small-btn.restore {
      border-color:#ecd4b3;

      background:var(--orange-soft);
      color:var(--orange);
    }

    .score {
      min-width:54px;

      padding:8px 10px;

      border-radius:8px;

      background:var(--green-soft);
      color:var(--green);

      text-align:center;

      font-size:14px;
      font-weight:950;
    }

    .empty {
      padding:30px 15px;

      text-align:center;

      color:#657184;

      font-size:13px;
      line-height:1.6;
    }

    /* MODAL */

    .modal-wrap {
      display:none;

      position:fixed;
      inset:0;

      z-index:300;

      align-items:center;
      justify-content:center;

      padding:18px;

      background:rgba(4,17,31,.62);
    }

    .modal-wrap.show {
      display:flex;
    }

    .modal {
      width:min(460px,100%);
      max-height:calc(100vh - 36px);

      overflow-y:auto;

      padding:22px;

      border-radius:19px;

      background:white;

      box-shadow:
        0 30px 80px rgba(0,0,0,.24);
    }

    .modal-title {
      color:var(--navy);

      font-size:21px;
      font-weight:950;
    }

    .modal-desc {
      margin:7px 0 16px;

      color:#5d697a;

      font-size:13px;
      line-height:1.55;
    }

    .selected-match {
      padding:13px 14px;
      margin-bottom:15px;

      border:1px solid #e1e6eb;
      border-radius:11px;

      background:#f7f9fb;
      color:#263247;

      font-size:15px;
      font-weight:900;

      line-height:1.6;
    }

    .court-picker {
      display:grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap:8px;
    }

    .court-choice {
      min-height:64px;

      padding:10px;

      border:1px solid #dce2e8;
      border-radius:11px;

      background:white;
      color:var(--navy);

      font-size:14px;
      font-weight:950;
    }

    .court-choice small {
      display:block;

      margin-top:4px;

      color:#667386;

      font-size:11px;
      font-weight:750;
    }

    .court-choice:disabled {
      cursor:not-allowed;

      background:#f1f3f5;
      color:#929ba7;
    }

    .score-grid {
      display:grid;

      grid-template-columns:
        1fr 30px 1fr;

      align-items:end;

      gap:9px;
    }

    .score-player {
      min-height:37px;

      margin-bottom:7px;

      color:#354255;

      font-size:12px;
      font-weight:900;
    }

    .score-input {
      width:100%;

      height:58px;
      min-height:58px;

      border:1px solid #d9e0e6;
      border-radius:11px;

      outline:none;

      text-align:center;

      font-size:24px;
      font-weight:950;
    }

    .score-dash {
      height:58px;

      display:flex;
      align-items:center;
      justify-content:center;

      color:#7e8997;

      font-size:20px;
      font-weight:950;
    }

    .modal-bottom {
      display:grid;

      grid-template-columns:
        .8fr 1.2fr;

      gap:8px;

      margin-top:18px;
    }

    .modal-btn {
      height:52px;
      min-height:52px;

      border-radius:10px;

      font-size:13px;
      font-weight:900;
    }

    .cancel {
      border:1px solid #dce2e8;

      background:white;
      color:#536071;
    }

    .confirm-btn {
      border:0;

      background:var(--navy);
      color:white;
    }

    /* LOADING */

    .loading-overlay {
      display:none;

      position:fixed;
      inset:0;

      z-index:500;

      align-items:center;
      justify-content:center;

      background:rgba(4,17,31,.56);
    }

    .loading-overlay.show {
      display:flex;
    }

    .loading-box {
      width:min(320px,calc(100% - 36px));

      padding:23px;

      border-radius:16px;

      background:white;

      text-align:center;
    }

    .spinner {
      width:36px;
      height:36px;

      margin:0 auto 13px;

      border:4px solid #e5e9ed;
      border-top-color:var(--navy);

      border-radius:50%;

      animation:spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform:rotate(360deg);
      }
    }

    .loading-title {
      color:var(--navy);

      font-size:15px;
      font-weight:950;
    }

    /* FOOTER */

    .footer {
      display:flex;
      justify-content:space-between;

      margin-top:26px;
      padding-top:17px;

      border-top:1px solid #e2e6eb;

      color:#7c8795;

      font-size:10px;
      letter-spacing:1px;
    }

    .footer strong {
      color:var(--navy);
    }

    .q {
      color:#91a719;
      font-weight:950;
    }

    /* MOBILE */

    @media(max-width:700px) {

      .topbar {
        min-height:72px;

        padding:0 14px;
      }

      .fwt-logo {
        font-size:30px;
      }

      .header-btn {
        height:46px;
        min-height:46px;

        padding:0 11px;

        font-size:11px;
      }

      .container {
        width:calc(100% - 22px);

        padding:24px 0 50px;
      }

      .head {
        display:block;
      }

      .head-right {
        margin-top:13px;

        align-items:stretch;
      }

      h1 {
        font-size:30px;
      }

      .desc {
        font-size:14px;
      }

      .stat {
        font-size:12px;
      }

      .standings-btn {
        width:100%;

        height:54px;
        min-height:54px;

        flex:none;

        font-size:14px;
      }

      .section-title-main {
        font-size:19px;
      }

      .section-title-sub {
        font-size:12px;
      }

      /*
        코트: 모바일 2열 고정
      */

      .courts {
        grid-template-columns:
          repeat(2,minmax(0,1fr));

        gap:7px;
      }

      .court-inner {
        min-height:118px;

        padding:10px;
      }

      .court-name {
        font-size:15px;
      }

      .court-status {
        padding:4px 6px;

        font-size:10px;
      }

      .court-group {
        font-size:12px;
      }

      .court-match-line {
        font-size:14px;
      }

      .court-empty {
        font-size:13px;
      }

      /*
        핵심 현장 버튼
      */

      .court-btn {
        height:46px;
        min-height:46px;

        flex:none;

        padding:0 5px;

        font-size:11px;
      }

      .court-btn.finish {
        font-size:12px;
      }

      .next-match {
        grid-template-columns:
          50px minmax(0,1fr);

        gap:8px;

        min-height:102px;

        padding:9px;
      }

      .group-badge {
        height:43px;

        font-size:14px;
      }

      .next-players {
        font-size:15px;
      }

      .next-sub {
        font-size:11px;
      }

      .assign-btn {
        grid-column:1 / -1;

        width:100%;

        height:50px;
        min-height:50px;

        flex:none;

        font-size:13px;
      }

      .waiting-toggle {
        height:54px;
        min-height:54px;

        font-size:14px;
      }

      .waiting-row {
        grid-template-columns:
          48px minmax(0,1fr);

        gap:7px;

        min-height:100px;

        padding:9px;
      }

      .waiting-group {
        font-size:14px;
      }

      .waiting-players {
        font-size:14px;
      }

      .waiting-row .assign-btn {
        grid-column:1 / -1;
      }

      .card-title {
        font-size:18px;
      }

      .completed {
        grid-template-columns:1fr;

        gap:8px;
      }

      .completed-group {
        font-size:13px;
      }

      .completed-name {
        font-size:15px;
      }

      .score {
        width:100%;

        font-size:15px;
      }

      .completed-actions {
        display:grid;

        grid-template-columns:1fr 1fr;
      }

      .small-btn {
        width:100%;

        height:44px;
        min-height:44px;

        font-size:11px;
      }

      .modal {
        padding:18px;
      }

      .court-choice {
        min-height:66px;
      }

      .modal-btn {
        height:54px;
        min-height:54px;

        font-size:14px;
      }

    }

    @media(max-width:370px) {

      .courts {
        grid-template-columns:1fr;
      }

    }
  </style>
</head>


<body>

<header class="topbar">

  <div class="fwt-logo">
    FW<span>T</span>
  </div>


  <div class="top-actions">

    <button
      class="header-btn"
      id="refreshButton"
      type="button"
    >
      새로고침
    </button>

    <button
      class="header-btn"
      type="button"
      onclick="location.href='./dashboard.html'"
    >
      대시보드
    </button>

  </div>

</header>


<main class="container">

  <div class="head">

    <div>

      <div class="kicker">
        MATCH CONTROL
      </div>

      <h1>
        경기 운영
      </h1>

      <p class="desc">
        빈 코트에 다음 경기를 배정하고 경기 결과를 입력합니다.
      </p>

    </div>


    <div class="head-right">

      <div class="stats">

        <div class="stat">
          전체
          <strong id="totalCount">0</strong>
        </div>

        <div class="stat">
          경기중
          <strong id="playingCount">0</strong>
        </div>

        <div class="stat">
          대기
          <strong id="waitingCount">0</strong>
        </div>

        <div class="stat">
          완료
          <strong id="completedCount">0</strong>
        </div>

      </div>


      <button
        class="standings-btn"
        type="button"
        onclick="goStandings()"
      >
        조별 순위 보기
        <span>→</span>
      </button>

    </div>

  </div>


  <!-- COURTS -->

  <div class="section-title">

    <div class="section-title-main">

<script>

const SUPABASE_URL =

const tournament =

if (

) {

}

let matches = [];

let selectedCourtMatchId =

  null;


let scoreMode =
  "finish";


let waitingOpen =
  false;


let waitingFilter =

/* =====================================
   HELPERS
===================================== */

function escapeHtml(value) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value ?? "";

  return div.innerHTML;

}


function shortEntryName(entry) {

  if (!entry) {

    return "알 수 없음";

  }


  if (
    entry.type ===
    "singles"
  ) {

    return (
      entry.nickname ||
      entry.name ||
      "이름 없음"
    );

  }


  const p1 =
    entry.player1?.nickname ||
    entry.player1?.name ||
    "선수1";


  const p2 =
    entry.player2?.nickname ||
    entry.player2?.name ||
    "선수2";


  return `${p1}/${p2}`;

}


function entryName(index) {

  return shortEntryName(
    entries[index]
  );

}


function getEntryIndexById(
  entryId
) {

  return entries.findIndex(
    entry =>
      entry.dbEntryId ===
      entryId
  );

}


function getGroupById(
  groupId
) {

  return groupData.find(
    group =>
      group.dbGroupId ===
      groupId
  );

}


function getCourtById(
  courtId
) {

  return courts.find(
    court =>
      court.id ===
      courtId
  );

}


function getMatch(id) {

  return matches.find(
    match =>
      match.id === id
  );

}


function matchPlayers(match) {

  return (
    `${entryName(
      match.player1
    )} vs ${entryName(
      match.player2
    )}`
  );

}


/* =====================================
   AUTH
===================================== */

  } =

/* =====================================
   BUSY
===================================== */

function setBusy(
  state,
  title = "저장 중입니다"
) {

  busy =
    state;


  document.getElementById(
    "loadingTitle"

/* =====================================
   DB LOAD
===================================== */

async function loadMatches() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("matches")
      .select(
        "id,group_id,court_id,round_number,match_number,entry1_id,entry2_id,status,score1,score2,winner_entry_id,started_at,completed_at,sort_order"
      )
      .eq(
        "division_id",
        tournament.divisionId
      )
      .eq(
        "stage",
        "group"
      )
      .order(
        "sort_order",
        {
          ascending:true
        }
      );


  if (error) {

    throw new Error(
      "경기 조회 실패: "
      +
      error.message
    );

  }


  matches =
    (data || [])
      .map(
        row => {

          const player1 =
            getEntryIndexById(
              row.entry1_id
            );


          const player2 =
            getEntryIndexById(
              row.entry2_id
            );


          const group =
            getGroupById(
              row.group_id
            );


          const court =
            getCourtById(
              row.court_id
            );


          return {

            id:
              row.id,

            dbMatchId:
              row.id,

            groupId:
              row.group_id,

            groupName:
              group?.name ||
              "조 미상",

            player1,

            player2,

            entry1Id:
              row.entry1_id,

            entry2Id:
              row.entry2_id,

            status:
              row.status,

            courtId:
              row.court_id,

            court:
              court?.name ||
              null,

            score1:
              row.score1,

            score2:
              row.score2,

            winnerEntryId:
              row.winner_entry_id,

            roundNumber:
              row.round_number,

            matchNumber:
              row.match_number,

            order:
              row.sort_order,

            startedAt:
              row.started_at,

            completedAt:
              row.completed_at

          };

        }
      )
      .filter(
        match =>
          match.player1 >= 0 &&
          match.player2 >= 0
      );


  saveCompatibilityState();

}


/* =====================================
   기존 GROUP-STANDINGS 호환
===================================== */

function saveCompatibilityState() {

  sessionStorage.setItem(
    "fwtMatchControlState",
    JSON.stringify({

      signature:
        `db-${tournament.divisionId}`,

      matches:
        matches.map(
          match => ({

            id:
              match.id,

            dbMatchId:
              match.dbMatchId,

            groupName:
              match.groupName,

            groupIndex:
              groupData.findIndex(
                group =>
                  group.name ===
                  match.groupName
              ),

            order:
              match.order,

            player1:
              match.player1,

            player2:
              match.player2,

            status:
              match.status,

            court:
              match.court,

            score1:
              match.score1,

            score2:
              match.score2

          })
        )

    })
  );

}


/* =====================================
   COURT / PLAYER STATUS
===================================== */

function getPlayingMatchOnCourt(
  courtId
) {

  return matches.find(
    match =>
      match.status ===
        "playing"
      &&
      match.courtId ===
        courtId
  );

}


function isCourtBusy(
  courtId
) {

  return Boolean(
    getPlayingMatchOnCourt(
      courtId
    )
  );

}


function getPlayingMatchForEntry(
  entryIndex,
  excludeId = null
) {

  return matches.find(
    match => {

      if (
        excludeId &&
        match.id ===
        excludeId
      ) {

        return false;

      }


      if (
        match.status !==
        "playing"
      ) {

        return false;

      }


      return (
        match.player1 ===
          entryIndex
        ||
        match.player2 ===
          entryIndex
      );

    }
  );

}


function canStartMatch(match) {

  if (
    getPlayingMatchForEntry(
      match.player1,
      match.id
    )
  ) {

    return false;

  }


  if (
    getPlayingMatchForEntry(
      match.player2,
      match.id
    )
  ) {

    return false;

  }


  return true;

}


/* =====================================
   DB UPDATE
===================================== */

async function updateMatch(
  matchId,
  values
) {

  const {
    error
  } =
    await supabaseClient
      .from("matches")
      .update(values)
      .eq(
        "id",
        matchId
      );


  if (error) {

    throw new Error(
      error.message
    );

  }

}


/* =====================================
   START MATCH
===================================== */

async function assignCourt(
  matchId,
  courtId
) {

  if (busy) {
    return;
  }


  const match =
    getMatch(matchId);


  const court =
    getCourtById(courtId);


  if (
    !match ||
    !court
  ) {

    return;

  }


  if (
    isCourtBusy(courtId)
  ) {

    alert(
      "이미 사용 중인 코트입니다."
    );

    renderCourtPicker();

    return;

  }


  const p1Busy =
    getPlayingMatchForEntry(
      match.player1,
      match.id
    );


  if (p1Busy) {

    alert(
      `${entryName(
        match.player1
      )} 참가자가 이미 ${p1Busy.court}에서 경기 중입니다.`
    );

    return;

  }


  const p2Busy =
    getPlayingMatchForEntry(
      match.player2,
      match.id
    );


  if (p2Busy) {

    alert(
      `${entryName(
        match.player2
      )} 참가자가 이미 ${p2Busy.court}에서 경기 중입니다.`
    );

    return;

  }


  try {

    setBusy(
      true,
      "코트 배정 중"
    );


    const now =
      new Date()
        .toISOString();


    await updateMatch(
      match.id,
      {

        status:
          "playing",

        court_id:
          court.id,

        started_at:
          now,

        completed_at:
          null

      }
    );


    /*
      첫 실제 경기 시작 시
      대회 상태도 active로 변경
    */

    await supabaseClient
      .from("tournaments")
      .update({

        status:
          "active"

      })
      .eq(
        "id",
        tournament.tournamentId
      )
      .eq(
        "status",
        "draft"
      );


    match.status =
      "playing";

    match.courtId =
      court.id;

    match.court =
      court.name;

    match.startedAt =
      now;


    closeCourtModal();


    saveCompatibilityState();

    renderAll();


    setBusy(false);


  } catch(error) {

    setBusy(false);


    alert(
      "코트를 배정하지 못했습니다.\n\n"
      +
      error.message
    );

  }

}


/* =====================================
   RETURN TO WAITING
===================================== */

async function returnToWaiting(
  matchId
) {

  if (busy) {
    return;
  }


  const match =
    getMatch(matchId);


  if (!match) {
    return;
  }


  if (
    !confirm(
      `${matchPlayers(match)}\n\n이 경기를 다시 대기 상태로 돌릴까요?`
    )
  ) {

    return;

  }


  try {

    setBusy(
      true,
      "대기 상태로 변경 중"
    );


    await updateMatch(
      match.id,
      {

        status:
          "waiting",

        court_id:
          null,

        started_at:
          null

      }
    );


    match.status =
      "waiting";

    match.courtId =
      null;

    match.court =
      null;

    match.startedAt =
      null;


    saveCompatibilityState();

    renderAll();


    setBusy(false);


  } catch(error) {

    setBusy(false);


    alert(
      "변경하지 못했습니다.\n\n"
      +
      error.message
    );

  }

}


/* =====================================
   COURT MODAL
===================================== */

function openCourtModal(
  matchId
) {

  const match =
    getMatch(matchId);


  if (
    !match ||
    match.status !==
      "waiting"
  ) {

    return;

  }


  const p1Busy =
    getPlayingMatchForEntry(
      match.player1,
      match.id
    );


  const p2Busy =
    getPlayingMatchForEntry(
      match.player2,
      match.id
    );


  if (
    p1Busy ||
    p2Busy
  ) {

    const blocked =
      p1Busy
        ? entryName(
            match.player1
          )
        : entryName(
            match.player2
          );


    const live =
      p1Busy ||
      p2Busy;


    alert(
      `${blocked} 참가자가 현재 ${live.court}에서 경기 중입니다.`
    );

    return;

  }


  selectedCourtMatchId =
    matchId;


  document.getElementById(
    "courtModalMatch"
  ).innerHTML = `

    <strong>
      ${escapeHtml(
        match.groupName
      )}
    </strong>

    <br>

    ${escapeHtml(
      matchPlayers(match)
    )}

  `;


  renderCourtPicker();


  document.getElementById(
    "courtModal"
  ).classList.add(
    "show"
  );

}


function renderCourtPicker() {

  const box =
    document.getElementById(
      "courtPicker"
    );


  box.innerHTML = "";


  if (
    courts.length === 0
  ) {

    box.innerHTML = `

      <div class="empty">
        등록된 코트가 없습니다.
      </div>

    `;

    return;

  }


  courts.forEach(
    court => {

      const playing =
        getPlayingMatchOnCourt(
          court.id
        );


      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "court-choice";


      if (playing) {

        button.disabled =
          true;


        button.innerHTML = `

          ${escapeHtml(
            court.name
          )}

          <small>
            ${escapeHtml(
              matchPlayers(
                playing
              )
            )}
          </small>

        `;

      } else {

        button.innerHTML = `

          ${escapeHtml(
            court.name
          )}

          <small>
            사용 가능
          </small>

        `;


        button.addEventListener(
          "click",
          function() {

            assignCourt(
              selectedCourtMatchId,
              court.id
            );

          }
        );

      }


      box.appendChild(
        button
      );

    }
  );

}


function closeCourtModal() {

  selectedCourtMatchId =
    null;


  document.getElementById(
    "courtModal"
  ).classList.remove(
    "show"
  );

}


/* =====================================
   SCORE MODAL
===================================== */

function openScoreModal(
  matchId,
  mode = "finish"
) {

  const match =
    getMatch(matchId);


  if (!match) {
    return;
  }


  selectedScoreMatchId =
    matchId;


  scoreMode =
    mode;


  document.getElementById(
    "scoreModalTitle"
  ).textContent =
    mode === "edit"
      ? "경기 결과 수정"
      : "경기 완료";


  document.getElementById(
    "scoreModalDesc"
  ).textContent =
    mode === "edit"
      ? "수정할 최종 점수를 입력하세요."
      : "최종 점수를 입력하면 코트가 즉시 비워집니다.";


  document.getElementById(
    "scorePlayer1"
  ).textContent =
    entryName(
      match.player1
    );


  document.getElementById(
    "scorePlayer2"
  ).textContent =
    entryName(
      match.player2
    );


  document.getElementById(
    "score1"
  ).value =
    match.score1 ??
    "";


  document.getElementById(
    "score2"
  ).value =
    match.score2 ??
    "";


  document.getElementById(
    "saveScoreButton"
  ).textContent =
    mode === "edit"
      ? "수정 저장"
      : "경기 완료";


  document.getElementById(
    "scoreModal"
  ).classList.add(
    "show"
  );

}


function closeScoreModal() {

  selectedScoreMatchId =
    null;


  document.getElementById(
    "scoreModal"
  ).classList.remove(
    "show"
  );

}


/* =====================================
   SAVE SCORE
===================================== */

async function saveScore() {

  if (busy) {
    return;
  }


  const match =
    getMatch(
      selectedScoreMatchId
    );


  if (!match) {
    return;
  }


  const raw1 =
    document.getElementById(
      "score1"
    ).value;


  const raw2 =
    document.getElementById(
      "score2"
    ).value;


  if (
    raw1 === "" ||
    raw2 === ""
  ) {

    alert(
      "양쪽 점수를 모두 입력해주세요."
    );

    return;

  }


  const score1 =
    Number(raw1);


  const score2 =
    Number(raw2);


  if (
    !Number.isInteger(score1) ||
    !Number.isInteger(score2) ||
    score1 < 0 ||
    score2 < 0
  ) {

    alert(
      "점수는 0 이상의 정수로 입력해주세요."
    );

    return;

  }


  if (
    score1 === score2
  ) {

    alert(
      "동점으로 경기 완료할 수 없습니다."
    );

    return;

  }


  const winnerEntryId =
    score1 > score2
      ? match.entry1Id
      : match.entry2Id;


  try {

    setBusy(
      true,
      scoreMode === "edit"
        ? "결과 수정 중"
        : "경기 완료 처리 중"
    );


    const completedAt =
      scoreMode === "edit"
        ? (
            match.completedAt ||
            new Date()
              .toISOString()
          )
        : new Date()
            .toISOString();


    await updateMatch(
      match.id,
      {

        status:
          "completed",

        score1:
          score1,

        score2:
          score2,

        winner_entry_id:
          winnerEntryId,

        court_id:
          null,

        completed_at:
          completedAt

      }
    );


    match.status =
      "completed";

    match.score1 =
      score1;

    match.score2 =
      score2;

    match.winnerEntryId =
      winnerEntryId;

    match.courtId =
      null;

    match.court =
      null;

    match.completedAt =
      completedAt;


    closeScoreModal();


    saveCompatibilityState();

    renderAll();


    setBusy(false);


  } catch(error) {

    setBusy(false);


    alert(
      "결과를 저장하지 못했습니다.\n\n"
      +
      error.message
    );

  }

}

  if (busy) {
    return;
  }


  const match =

  if (
    !confirm(
      `${matchPlayers(match)}\n\n완료 결과를 취소하고 다시 대기 경기로 돌릴까요?`
    )
  ) {

    return;

  }


  try {

    setBusy(
      true,
      "경기 복원 중"
    );


    await updateMatch(
      match.id,
      {

        status:
          "waiting",

        court_id:
          null,

        score1:
          null,

        score2:
          null,

        winner_entry_id:
          null,

        started_at:
          null,

        completed_at:
          null

      }
    );


    match.status =
      "waiting";

    match.courtId =
      null;

    match.court =
      null;

    match.score1 =
      null;

    match.score2 =
      null;

    match.winnerEntryId =
      null;

    match.startedAt =
      null;

    match.completedAt =
      null;


    saveCompatibilityState();

    renderAll();


    setBusy(false);


  } catch(error) {

    setBusy(false);


    alert(
      "경기를 복원하지 못했습니다.\n\n"
      +
      error.message
    );

  }

}


/* =====================================
   STATS
===================================== */

function renderStats() {

  document.getElementById(
    "totalCount"
  ).textContent =
    matches.length;


  document.getElementById(
    "playingCount"
  ).textContent =
    matches.filter(
      match =>
        match.status ===
        "playing"
    ).length;


  document.getElementById(
    "waitingCount"
  ).textContent =
    matches.filter(
      match =>
        match.status ===
        "waiting"
    ).length;


  document.getElementById(
    "completedCount"
  ).textContent =
    matches.filter(
      match =>
        match.status ===
        "completed"
    ).length;

}


/* =====================================
   RENDER COURTS
===================================== */

function renderCourts() {

  const box =
    document.getElementById(
      "courts"
    );


  box.innerHTML = "";


  if (
    courts.length === 0
  ) {

    box.innerHTML = `

      <div class="empty">
        등록된 코트가 없습니다.
      </div>

    `;

    return;

  }


  courts.forEach(
    court => {

      const match =
        getPlayingMatchOnCourt(
          court.id
        );


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "court";


      if (!match) {

        card.innerHTML = `

          <div class="court-inner">

            <div class="court-top">

              <div class="court-name">
                ${escapeHtml(
                  court.name
                )}
              </div>

              <div class="court-status">
                빈 코트
              </div>

            </div>


            <div class="court-empty">
              다음 경기를 배정할 수 있습니다.
            </div>

          </div>

        `;

      } else {

        card.innerHTML = `

          <div class="court-inner">

            <div class="court-top">

              <div class="court-name">
                ${escapeHtml(
                  court.name
                )}
              </div>

              <div class="court-status live">
                경기중
              </div>

            </div>


            <div class="court-group">
              ${escapeHtml(
                match.groupName
              )}
            </div>


            <div class="court-match-line">
              ${escapeHtml(
                matchPlayers(match)
              )}
            </div>


            <div class="court-actions">

              <button
                class="court-btn waiting"
                type="button"
              >
                대기로
              </button>

              <button
                class="court-btn finish"
                type="button"
              >
                경기 완료
              </button>

            </div>

          </div>

        `;


        card
          .querySelector(
            ".waiting"
          )
          .addEventListener(
            "click",
            function() {

              returnToWaiting(
                match.id
              );

            }
          );


        card
          .querySelector(
            ".finish"
          )
          .addEventListener(
            "click",
            function() {

              openScoreModal(
                match.id,
                "finish"
              );

            }
          );

      }


      box.appendChild(
        card
      );

    }
  );

}


/* =====================================
   NEXT MATCH PER GROUP
===================================== */

function getNextMatches() {

  const result = [];


  groupData.forEach(
    group => {

      const waiting =
        matches
          .filter(
            match =>
              match.groupName ===
                group.name
              &&
              match.status ===
                "waiting"
          )
          .sort(
            (a,b) =>
              Number(a.order || 0)
              -
              Number(b.order || 0)
          );


      if (
        waiting.length === 0
      ) {

        return;

      }


      /*
        가능하면 현재 다른 경기 중인
        참가자가 없는 경기 우선.
      */

      const available =
        waiting.find(
          match =>
            canStartMatch(match)
        );


      result.push(
        available ||
        waiting[0]
      );

    }
  );


  return result;

}


function renderNext() {

  const box =
    document.getElementById(
      "nextList"
    );


  box.innerHTML = "";


  const nextMatches =
    getNextMatches();


  if (
    nextMatches.length === 0
  ) {

    box.innerHTML = `

      <div class="empty">
        현재 대기 중인 경기가 없습니다.
      </div>

    `;

    return;

  }


  nextMatches.forEach(
    match => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "next-match";


      const blocked =
        !canStartMatch(match);


      row.innerHTML = `

        <div class="group-badge">
          ${escapeHtml(
            match.groupName
          )}
        </div>


        <div class="next-main">

          <div class="next-players">
            ${escapeHtml(
              matchPlayers(match)
            )}
          </div>

          <div class="next-sub">
            ${
              blocked
                ? "참가자 경기중 · 현재 배정 불가"
                : "코트 배정 가능"
            }
          </div>

        </div>


        <button
          class="assign-btn"
          type="button"
          ${
            blocked
              ? "disabled"
              : ""
          }
        >
          코트 배정
        </button>

      `;


      if (!blocked) {

        row
          .querySelector(
            ".assign-btn"
          )
          .addEventListener(
            "click",
            function() {

              openCourtModal(
                match.id
              );

            }
          );

      }


      box.appendChild(
        row
      );

    }
  );

}


/* =====================================
   FULL WAITING
===================================== */

function renderWaitingTabs() {

  const box =
    document.getElementById(
      "waitingTabs"
    );


  box.innerHTML = "";


  const filters =
    [
      {
        value:"ALL",
        label:"전체"
      },
      ...groupData.map(
        group => ({
          value:group.name,
          label:group.name
        })
      )
    ];


  filters.forEach(
    filter => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "tab-btn"
        +
        (
          waitingFilter ===
          filter.value
            ? " active"
            : ""
        );


      button.textContent =
        filter.label;


      button.addEventListener(
        "click",
        function() {

          waitingFilter =
            filter.value;


          renderWaitingTabs();

          renderWaitingList();

        }
      );


      box.appendChild(
        button
      );

    }
  );

}


function renderWaitingList() {

  const box =
    document.getElementById(
      "waitingList"
    );


  box.innerHTML = "";


  let waiting =
    matches
      .filter(
        match =>
          match.status ===
          "waiting"
      )
      .sort(
        (a,b) =>
          Number(a.order || 0)
          -
          Number(b.order || 0)
      );


  if (
    waitingFilter !==
    "ALL"
  ) {

    waiting =
      waiting.filter(
        match =>
          match.groupName ===
          waitingFilter
      );

  }


  if (
    waiting.length === 0
  ) {

    box.innerHTML = `

      <div class="empty">
        해당 조건의 대기 경기가 없습니다.
      </div>

    `;

    return;

  }


  waiting.forEach(
    match => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "waiting-row";


      const blocked =
        !canStartMatch(match);


      row.innerHTML = `

        <div class="waiting-group">
          ${escapeHtml(
            match.groupName
          )}
        </div>


        <div class="waiting-players">
          ${escapeHtml(
            matchPlayers(match)
          )}
        </div>


        <button
          class="assign-btn"
          type="button"
          ${
            blocked
              ? "disabled"
              : ""
          }
        >
          ${
            blocked
              ? "경기중"
              : "코트 배정"
          }
        </button>

      `;


      if (!blocked) {

        row
          .querySelector(
            ".assign-btn"
          )
          .addEventListener(
            "click",
            function() {

              openCourtModal(
                match.id
              );

            }
          );

      }


      box.appendChild(
        row
      );

    }
  );

}


/* =====================================
   COMPLETED
===================================== */

function renderCompleted() {

  const box =
    document.getElementById(
      "completedList"
    );


  box.innerHTML = "";


  const completed =
    matches
      .filter(
        match =>
          match.status ===
          "completed"
      )
      .sort(
        (a,b) => {

          if (
            a.completedAt &&
            b.completedAt
          ) {

            return (
              new Date(
                b.completedAt
              )
              -
              new Date(
                a.completedAt
              )
            );

          }


          return (
            Number(b.order || 0)
            -
            Number(a.order || 0)
          );

        }
      );


  document.getElementById(
    "completedBadge"
  ).textContent =
    completed.length;


  if (
    completed.length === 0
  ) {

    box.innerHTML = `

      <div class="empty">
        아직 완료된 경기가 없습니다.
      </div>

    `;

    return;

  }


  completed.forEach(
    match => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "completed";


      row.innerHTML = `

        <div>

          <div class="completed-group">
            ${escapeHtml(
              match.groupName
            )}
          </div>


          <div class="completed-name">
            ${escapeHtml(
              matchPlayers(match)
            )}
          </div>


          <div class="completed-actions">

            <button
              class="small-btn edit"
              type="button"
            >
              결과 수정
            </button>


            <button
              class="small-btn restore"
              type="button"
            >
              대기로 복원
            </button>

          </div>

        </div>


        <div class="score">
          ${match.score1}
          -
          ${match.score2}
        </div>

      `;


      row
        .querySelector(
          ".edit"
        )
        .addEventListener(
          "click",
          function() {

            openScoreModal(
              match.id,
              "edit"
            );

          }
        );


      row
        .querySelector(
          ".restore"
        )
        .addEventListener(
          "click",
          function() {

            restoreCompleted(
              match.id
            );

          }
        );


      box.appendChild(
        row
      );

    }
  );

}


/* =====================================
   RENDER
===================================== */

function renderAll() {

  renderStats();

  renderCourts();

  renderNext();

  renderWaitingTabs();

  renderWaitingList();

  renderCompleted();


  const waiting =
    matches.filter(
      match =>
        match.status ===
        "waiting"
    ).length;


  document.getElementById(
    "waitingToggleCount"
  ).textContent =
    waiting;

}


/* =====================================
   WAITING TOGGLE
===================================== */

function toggleWaiting() {

  waitingOpen =
    !waitingOpen;


  document.getElementById(
    "fullWaiting"
  ).classList.toggle(
    "show",
    waitingOpen
  );


  document.getElementById(
    "waitingToggle"
  ).innerHTML =
    waitingOpen
      ? `전체 대기 경기 <span>${matches.filter(m => m.status === "waiting").length}</span>개 닫기`
      : `전체 대기 경기 <span>${matches.filter(m => m.status === "waiting").length}</span>개 보기`;

}


/* =====================================
   STANDINGS
===================================== */

function goStandings() {

  saveCompatibilityState();


  location.href =
    "./group-standings.html";

}


/* =====================================
   REFRESH
===================================== */

async function refreshMatches() {

  if (busy) {
    return;
  }


  try {

    setBusy(
      true,
      "DB 경기정보 새로고침 중"
    );


    await loadMatches();


    renderAll();


    setBusy(false);


  } catch(error) {

    setBusy(false);


    alert(
      "경기정보를 불러오지 못했습니다.\n\n"
      +
      error.message
    );

  }

}


/* =====================================
   EVENTS
===================================== */

document.getElementById(
  "waitingToggle"
).addEventListener(
  "click",
  toggleWaiting
);


document.getElementById(
  "saveScoreButton"
).addEventListener(
  "click",
  saveScore
);


document.getElementById(
  "refreshButton"
).addEventListener(
  "click",
  refreshMatches
);


/* =====================================
   START
===================================== */

async function start() {

  const loggedIn =
    await checkLogin();


  if (!loggedIn) {
    return;
  }


  try {

    setBusy(
      true,
      "경기정보 불러오는 중"
    );


    await loadMatches();


    renderAll();


    setBusy(false);


  } catch(error) {

    console.error(error);


    setBusy(false);


    alert(
      "경기 운영 정보를 불러오지 못했습니다.\n\n"
      +
      error.message
    );

  }

}


start();

</script>
