<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>경기 운영 | FWT Tournament</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --navy:#071a31;
      --navy2:#0c294a;
      --blue:#184a79;
      --lime:#c9df45;

      --bg:#f4f6f9;
      --white:#ffffff;
      --text:#172033;
      --muted:#7b8492;
      --line:#e3e8ee;

      --green:#178b61;
      --green-soft:#edf8f3;

      --red:#d94b4b;
      --red-soft:#fff1f1;

      --shadow:
        0 14px 40px rgba(20,35,55,.06);
    }

    * {
      box-sizing:border-box;
    }

    html,
    body {
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--text);

      font-family:
        Inter,
        Pretendard,
        "Noto Sans KR",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input {
      font:inherit;
    }

    button {
      cursor:pointer;
    }

    .topbar {
      height:72px;
      padding:0 30px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      color:white;

      background:
        linear-gradient(
          110deg,
          #07182d,
          #0b2848 60%,
          #10375f
        );

      box-shadow:
        0 4px 22px rgba(6,23,43,.16);
    }

    .brand {
      display:flex;
      align-items:center;
      gap:25px;
    }

    .fwt {
      font-size:30px;
      font-weight:950;
      font-style:italic;
      letter-spacing:-3px;
    }

    .fwt span {
      color:var(--lime);
    }

    .top-title {
      font-size:11px;
      font-weight:800;
      letter-spacing:1.8px;
      color:rgba(255,255,255,.7);
    }

    .back-btn {
      padding:9px 13px;

      border:
        1px solid rgba(255,255,255,.15);

      border-radius:10px;

      background:
        rgba(255,255,255,.07);

      color:white;

      font-size:11px;
      font-weight:750;
    }

    .container {
      width:
        min(
          1280px,
          calc(100% - 34px)
        );

      margin:0 auto;

      padding:
        38px 0 70px;
    }

    .head {
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:20px;

      margin-bottom:24px;
    }

    .kicker {
      margin-bottom:8px;

      color:var(--blue);

      font-size:10px;
      font-weight:850;
      letter-spacing:2px;
    }

    h1 {
      margin:0;

      color:var(--navy);

      font-size:36px;
      font-weight:900;
      letter-spacing:-1.7px;
    }

    .desc {
      margin:8px 0 0;

      color:var(--muted);

      font-size:13px;
      line-height:1.6;
    }

    .stats {
      display:flex;
      flex-wrap:wrap;
      gap:7px;
    }

    .stat {
      padding:8px 11px;

      border:
        1px solid var(--line);

      border-radius:999px;

      background:white;

      color:#657184;

      font-size:10px;
      font-weight:800;
    }

    .stat strong {
      color:var(--navy);
    }

    .section-title {
      margin:
        27px 0 12px;

      color:var(--navy);

      font-size:16px;
      font-weight:900;
    }

    .courts {
      display:grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(230px,1fr)
        );

      gap:12px;
    }

    .court {
      overflow:hidden;

      border:
        1px solid var(--line);

      border-radius:17px;

      background:white;

      box-shadow:var(--shadow);
    }

    .court-head {
      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:15px 16px;

      border-bottom:
        1px solid var(--line);
    }

    .court-name {
      color:var(--navy);

      font-size:14px;
      font-weight:900;
    }

    .court-status {
      padding:5px 8px;

      border-radius:999px;

      background:#f2f5f7;

      color:#7a8593;

      font-size:9px;
      font-weight:850;
    }

    .court-status.live {
      background:var(--green-soft);
      color:var(--green);
    }

    .court-body {
      min-height:177px;
      padding:14px;
    }

    .empty-court {
      height:145px;

      display:flex;
      align-items:center;
      justify-content:center;

      text-align:center;

      color:#9ca5b0;

      font-size:11px;
      line-height:1.7;
    }

    .live-group {
      margin-bottom:8px;

      color:#8b95a2;

      font-size:9px;
      font-weight:900;
      letter-spacing:1px;
    }

    .live-player {
      padding:10px 11px;

      border:
        1px solid #e2e7ec;

      border-radius:10px;

      background:#fafbfc;

      color:#263247;

      font-size:12px;
      font-weight:850;
    }

    .vs {
      margin:5px 0;

      text-align:center;

      color:#a0a8b3;

      font-size:8px;
      font-weight:900;
    }

    .court-actions {
      display:flex;
      gap:7px;

      margin-top:12px;
    }

    .court-btn {
      flex:1;
      height:38px;

      border-radius:9px;

      border:
        1px solid #dce2e8;

      background:white;

      color:#536071;

      font-size:10px;
      font-weight:800;
    }

    .court-btn.finish {
      border:0;

      background:var(--navy);

      color:white;
    }

    .layout {
      display:grid;

      grid-template-columns:
        minmax(0,1.25fr)
        minmax(310px,.75fr);

      gap:18px;

      margin-top:13px;
    }

    .card {
      overflow:hidden;

      border:
        1px solid var(--line);

      border-radius:18px;

      background:white;

      box-shadow:var(--shadow);
    }

    .card-head {
      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:18px 19px;

      border-bottom:
        1px solid var(--line);
    }

    .card-title {
      color:var(--navy);

      font-size:14px;
      font-weight:900;
    }

    .card-sub {
      margin-top:4px;

      color:var(--muted);

      font-size:10px;
    }

    .count {
      min-width:29px;
      height:29px;

      padding:0 9px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:999px;

      background:#f2f5f7;

      color:var(--navy);

      font-size:10px;
      font-weight:900;
    }

    .waiting-list,
    .completed-list {
      padding:12px;
    }

    .match-row {
      display:grid;

      grid-template-columns:
        minmax(0,1fr) 110px;

      align-items:center;

      gap:10px;

      padding:12px;

      margin-bottom:8px;

      border:
        1px solid #e2e7ec;

      border-radius:12px;

      background:white;
    }

    .match-row:last-child {
      margin-bottom:0;
    }

    .group-label {
      margin-bottom:5px;

      color:#9aa3ae;

      font-size:8px;
      font-weight:900;
      letter-spacing:1px;
    }

    .match-name {
      color:#263247;

      font-size:11px;
      font-weight:850;
      line-height:1.55;
    }

    .assign-btn {
      width:100%;
      height:38px;

      border:0;

      border-radius:9px;

      background:
        linear-gradient(
          115deg,
          var(--navy),
          #123e6c
        );

      color:white;

      font-size:10px;
      font-weight:850;
    }

    .completed {
      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:12px;

      padding:12px;

      margin-bottom:8px;

      border:
        1px solid #e1e7e4;

      border-radius:12px;

      background:#fbfdfc;
    }

    .completed:last-child {
      margin-bottom:0;
    }

    .completed-main {
      min-width:0;
      flex:1;
    }

    .completed-actions {
      display:flex;
      flex-wrap:wrap;
      gap:6px;

      margin-top:8px;
    }

    .text-btn {
      height:29px;

      padding:0 9px;

      border:
        1px solid #dce2e8;

      border-radius:8px;

      background:white;

      color:#657184;

      font-size:9px;
      font-weight:800;
    }

    .text-btn.restore {
      color:#9b641e;

      background:#fff8ed;

      border-color:#ecd5b7;
    }

    .score {
      flex-shrink:0;

      padding:7px 10px;

      border-radius:8px;

      background:var(--green-soft);

      color:var(--green);

      font-size:12px;
      font-weight:900;
    }

    .empty {
      padding:37px 15px;

      text-align:center;

      color:#9ba4af;

      font-size:11px;
      line-height:1.7;
    }

    .footer {
      display:flex;
      justify-content:space-between;

      margin-top:28px;

      padding-top:18px;

      border-top:
        1px solid #e2e6eb;

      color:#9aa2ad;

      font-size:9px;
      letter-spacing:1px;
    }

    .footer strong {
      color:var(--navy);
    }

    .q {
      color:#9eb421;
      font-weight:900;
    }

    /* 공통 모달 */

    .modal-wrap {
      display:none;

      position:fixed;
      inset:0;

      z-index:100;

      align-items:center;
      justify-content:center;

      padding:20px;

      background:
        rgba(4,17,31,.57);
    }

    .modal-wrap.show {
      display:flex;
    }

    .modal {
      width:min(460px,100%);

      padding:24px;

      border-radius:20px;

      background:white;

      box-shadow:
        0 30px 80px rgba(0,0,0,.24);
    }

    .modal-title {
      color:var(--navy);

      font-size:19px;
      font-weight:900;
    }

    .modal-desc {
      margin:
        8px 0 18px;

      color:#788493;

      font-size:11px;
      line-height:1.65;
    }

    .selected-match {
      padding:13px 14px;

      margin-bottom:16px;

      border:
        1px solid #e3e8ed;

      border-radius:12px;

      background:#f8fafb;

      color:#263247;

      font-size:12px;
      font-weight:850;
      line-height:1.7;
    }

    /* 코트 선택 */

    .court-picker {
      display:grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        );

      gap:9px;
    }

    .court-choice {
      min-height:62px;

      padding:10px;

      border:
        1px solid #dce2e8;

      border-radius:12px;

      background:white;

      color:var(--navy);

      font-size:12px;
      font-weight:900;
    }

    .court-choice:hover:not(:disabled) {
      border-color:#738fac;
      background:#f8fafc;
    }

    .court-choice:disabled {
      cursor:not-allowed;

      background:#f3f5f7;

      color:#a0a8b3;

      opacity:.75;
    }

    .court-choice small {
      display:block;

      margin-top:4px;

      font-size:8px;
      font-weight:750;

      color:#9ba4af;
    }

    .court-choice:disabled small {
      color:#b2bac3;
    }

    .modal-bottom {
      display:flex;
      gap:8px;

      margin-top:18px;
    }

    .modal-btn {
      flex:1;
      height:44px;

      border-radius:10px;

      font-weight:800;
    }

    .cancel {
      border:
        1px solid #dce2e8;

      background:white;

      color:#596677;
    }

    .confirm {
      border:0;

      background:var(--navy);

      color:white;
    }

    /* 점수 입력 */

    .score-grid {
      display:grid;

      grid-template-columns:
        1fr 34px 1fr;

      align-items:end;

      gap:10px;
    }

    .score-player {
      min-height:32px;

      margin-bottom:7px;

      color:#526072;

      font-size:10px;
      font-weight:800;
    }

    .score-input {
      width:100%;
      height:53px;

      border:
        1px solid #dce2e8;

      border-radius:11px;

      outline:none;

      text-align:center;

      font-size:22px;
      font-weight:900;
    }

    .score-input:focus {
      border-color:#7090af;

      box-shadow:
        0 0 0 4px rgba(24,74,121,.06);
    }

    .score-dash {
      height:53px;

      display:flex;
      align-items:center;
      justify-content:center;

      color:#a0a8b3;

      font-size:20px;
      font-weight:900;
    }

    @media(max-width:900px) {

      .layout {
        grid-template-columns:1fr;
      }

    }

    @media(max-width:650px) {

      .topbar {
        padding:0 17px;
      }

      .top-title {
        display:none;
      }

      .container {
        width:
          calc(100% - 26px);

        padding-top:29px;
      }

      .head {
        display:block;
      }

      .stats {
        margin-top:14px;
      }

      h1 {
        font-size:29px;
      }

      .courts {
        grid-template-columns:1fr;
      }

      .match-row {
        grid-template-columns:
          minmax(0,1fr) 90px;
      }

      .court-picker {
        grid-template-columns:1fr 1fr;
      }

    }

    @media(max-width:430px) {

      .court-picker {
        grid-template-columns:1fr;
      }

      .completed {
        align-items:flex-start;
      }

    }
  </style>
</head>

<body>

<header class="topbar">

  <div class="brand">

    <div class="fwt">
      FW<span>T</span>
    </div>

    <div class="top-title">
      TOURNAMENT CONTROL
    </div>

  </div>

  <button
    class="back-btn"
    onclick="location.href='./group-matches.html'"
  >
    ← 예선 대진
  </button>

</header>


<main class="container">

  <div class="head">

    <div>

      <div class="kicker">
        MATCH CONTROL
      </div>

      <h1>
        경기 운영
      </h1>

      <p class="desc">
        실제 비는 코트에 경기를 배정하고 결과를 입력합니다.
      </p>

    </div>


    <div class="stats">

      <div class="stat">
        전체
        <strong id="totalCount">0</strong>
      </div>

      <div class="stat">
        경기중
        <strong id="liveCount">0</strong>
      </div>

      <div class="stat">
        대기
        <strong id="waitingCount">0</strong>
      </div>

      <div class="stat">
        완료
        <strong id="completedCount">0</strong>
      </div>

    </div>

  </div>


  <div class="section-title">
    코트 현황
  </div>


  <section
    class="courts"
    id="courts"
  ></section>


  <div class="layout">

    <!-- 대기 경기 -->

    <div class="card">

      <div class="card-head">

        <div>

          <div class="card-title">
            대기 경기
          </div>

          <div class="card-sub">
            경기 선택 후 빈 코트를 바로 배정합니다.
          </div>

        </div>

        <div
          class="count"
          id="waitingBadge"
        >
          0
        </div>

      </div>

      <div
        class="waiting-list"
        id="waitingList"
      ></div>

    </div>


    <!-- 완료 경기 -->

    <div class="card">

      <div class="card-head">

        <div>

          <div class="card-title">
            완료 경기
          </div>

          <div class="card-sub">
            결과 수정 또는 대기 상태로 복구할 수 있습니다.
          </div>

        </div>

        <div
          class="count"
          id="completedBadge"
        >
          0
        </div>

      </div>

      <div
        class="completed-list"
        id="completedList"
      ></div>

    </div>

  </div>


  <footer class="footer">

    <div>
      <strong>FWT</strong>
      · FRIENDS WITH TENNIS
    </div>

    <div>
      CREATED BY
      <span class="q">Q</span>
    </div>

  </footer>

</main>


<!-- 코트 선택 모달 -->

<div
  class="modal-wrap"
  id="courtModal"
>

  <div class="modal">

    <div class="modal-title">
      코트 배정
    </div>

    <div class="modal-desc">
      빈 코트를 누르면 즉시 경기 시작 상태로 변경됩니다.
    </div>

    <div
      class="selected-match"
      id="courtModalMatch"
    ></div>

    <div
      class="court-picker"
      id="courtPicker"
    ></div>

    <div class="modal-bottom">

      <button
        class="modal-btn cancel"
        id="cancelCourt"
      >
        취소
      </button>

    </div>

  </div>

</div>


<!-- 점수 모달 -->

<div
  class="modal-wrap"
  id="scoreModal"
>

  <div class="modal">

    <div class="modal-title">
      경기 결과 입력
    </div>

    <div
      class="modal-desc"
      id="scoreModalInfo"
    ></div>

    <div class="score-grid">

      <div>

        <div
          class="score-player"
          id="scorePlayer1"
        ></div>

        <input
          class="score-input"
          type="number"
          min="0"
          id="score1"
        >

      </div>

      <div class="score-dash">
        :
      </div>

      <div>

        <div
          class="score-player"
          id="scorePlayer2"
        ></div>

        <input
          class="score-input"
          type="number"
          min="0"
          id="score2"
        >

      </div>

    </div>

    <div class="modal-bottom">

      <button
        class="modal-btn cancel"
        id="cancelScore"
      >
        취소
      </button>

      <button
        class="modal-btn confirm"
        id="saveScore"
      >
        경기 완료
      </button>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://opwuyqerisocqobbbisg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Eo_zfONeGLs9ATCVg2Fk_g_y_IAJFV-";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


async function checkLogin() {

  const { data } =
    await supabaseClient.auth.getSession();

  if (!data.session) {

    location.href = "./";

  }

}


checkLogin();


const tournament =
  JSON.parse(
    sessionStorage.getItem(
      "fwtNewTournament"
    ) || "null"
  );


const entries =
  JSON.parse(
    sessionStorage.getItem(
      "fwtNewTournamentEntries"
    ) || "null"
  );


const matchGroups =
  JSON.parse(
    sessionStorage.getItem(
      "fwtGroupMatches"
    ) || "null"
  );


if (
  !tournament ||
  !entries ||
  !matchGroups
) {

  alert(
    "예선 대진 정보가 없습니다."
  );

  location.href =
    "./group-matches.html";

}


const courts =
  Array.isArray(
    tournament.courts
  )
    ? tournament.courts
    : [];


let matches = [];

let selectedCourtMatchId =
  null;

let selectedFinishMatchId =
  null;


/* --------------------------------
   현재 대진 고유값
-------------------------------- */

function createDrawSignature() {

  const compact =
    matchGroups.map(
      group => ({

        groupName:
          group.groupName,

        matches:
          group.matches.map(
            match => [
              match.player1,
              match.player2
            ]
          )

      })
    );


  return JSON.stringify(
    compact
  );

}


const currentDrawSignature =
  createDrawSignature();


/* --------------------------------
   참가자 이름
-------------------------------- */

function entryName(entry) {

  if (!entry) {
    return "알 수 없음";
  }


  if (
    entry.type ===
    "singles"
  ) {

    if (
      entry.nickname &&
      entry.name
    ) {

      return `${entry.nickname} (${entry.name})`;

    }

    return (
      entry.nickname ||
      entry.name ||
      "이름 없음"
    );

  }


  const p1 =
    entry.player1?.nickname ||
    entry.player1?.name ||
    "선수1";


  const p2 =
    entry.player2?.nickname ||
    entry.player2?.name ||
    "선수2";


  return `${p1} / ${p2}`;

}


/* --------------------------------
   HTML 안전 처리
-------------------------------- */

function escapeHtml(value) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value ?? "";

  return div.innerHTML;

}


/* --------------------------------
   최초 경기 생성
-------------------------------- */

function createInitialMatches() {

  matches = [];


  matchGroups.forEach(
    (
      group,
      groupIndex
    ) => {

      group.matches.forEach(
        (
          match,
          matchIndex
        ) => {

          matches.push({

            id:
              `G${groupIndex}-M${matchIndex}`,

            groupName:
              group.groupName,

            player1:
              match.player1,

            player2:
              match.player2,

            status:
              "waiting",

            court:
              null,

            score1:
              null,

            score2:
              null

          });

        }
      );

    }
  );


  saveState();

}


/* --------------------------------
   상태 저장
-------------------------------- */

function saveState() {

  const state = {

    signature:
      currentDrawSignature,

    matches:
      matches

  };


  sessionStorage.setItem(
    "fwtMatchControlState",
    JSON.stringify(
      state
    )
  );

}


/* --------------------------------
   저장된 상태 유효성 확인
-------------------------------- */

function stateMatchesCurrentDraw(
  parsed
) {

  if (
    !parsed ||
    typeof parsed !==
      "object"
  ) {

    return false;

  }


  if (
    parsed.signature !==
    currentDrawSignature
  ) {

    return false;

  }


  if (
    !Array.isArray(
      parsed.matches
    )
  ) {

    return false;

  }


  const expectedCount =
    matchGroups.reduce(
      (
        total,
        group
      ) =>
        total +
        group.matches.length,
      0
    );


  if (
    parsed.matches.length !==
    expectedCount
  ) {

    return false;

  }


  return true;

}


/* --------------------------------
   상태 불러오기
-------------------------------- */

function loadState() {

  const raw =
    sessionStorage.getItem(
      "fwtMatchControlState"
    );


  if (raw) {

    try {

      const parsed =
        JSON.parse(
          raw
        );


      if (
        stateMatchesCurrentDraw(
          parsed
        )
      ) {

        matches =
          parsed.matches;

        return;

      }

    } catch(e) {}

  }


  createInitialMatches();

}


/* --------------------------------
   경기 찾기
-------------------------------- */

function getMatch(id) {

  return matches.find(
    match =>
      match.id === id
  );

}


/* --------------------------------
   코트 사용 여부
-------------------------------- */

function getPlayingMatchOnCourt(
  courtName
) {

  return matches.find(
    match =>
      match.status ===
        "playing"
      &&
      match.court ===
        courtName
  );

}


function isCourtBusy(
  courtName
) {

  return Boolean(
    getPlayingMatchOnCourt(
      courtName
    )
  );

}


/* --------------------------------
   선수 경기중 여부
-------------------------------- */

function getPlayingMatchForPlayer(
  playerIndex,
  excludeMatchId = null
) {

  return matches.find(
    match => {

      if (
        excludeMatchId &&
        match.id ===
          excludeMatchId
      ) {

        return false;

      }


      if (
        match.status !==
        "playing"
      ) {

        return false;

      }


      return (
        match.player1 ===
          playerIndex
        ||
        match.player2 ===
          playerIndex
      );

    }
  );

}


/* --------------------------------
   코트 선택 모달
-------------------------------- */

function openCourtModal(
  matchId
) {

  const match =
    getMatch(
      matchId
    );


  if (!match) {
    return;
  }


  if (
    match.status !==
    "waiting"
  ) {

    alert(
      "현재 대기 상태의 경기가 아닙니다."
    );

    render();

    return;

  }


  const player1Busy =
    getPlayingMatchForPlayer(
      match.player1,
      match.id
    );


  if (
    player1Busy
  ) {

    alert(
      `${entryName(
        entries[
          match.player1
        ]
      )} 선수가 현재 ${player1Busy.court}에서 경기 중입니다.`
    );

    return;

  }


  const player2Busy =
    getPlayingMatchForPlayer(
      match.player2,
      match.id
    );


  if (
    player2Busy
  ) {

    alert(
      `${entryName(
        entries[
          match.player2
        ]
      )} 선수가 현재 ${player2Busy.court}에서 경기 중입니다.`
    );

    return;

  }


  selectedCourtMatchId =
    matchId;


  document.getElementById(
    "courtModalMatch"
  ).innerHTML = `

    <strong>
      ${escapeHtml(
        match.groupName
      )}
    </strong>

    <br>

    ${escapeHtml(
      entryName(
        entries[
          match.player1
        ]
      )
    )}

    &nbsp; VS &nbsp;

    ${escapeHtml(
      entryName(
        entries[
          match.player2
        ]
      )
    )}

  `;


  renderCourtPicker();


  document.getElementById(
    "courtModal"
  ).classList.add(
    "show"
  );

}


/* --------------------------------
   코트 버튼 생성
-------------------------------- */

function renderCourtPicker() {

  const box =
    document.getElementById(
      "courtPicker"
    );


  box.innerHTML = "";


  if (
    courts.length === 0
  ) {

    box.innerHTML = `
      <div class="empty">
        등록된 코트가 없습니다.
      </div>
    `;

    return;

  }


  courts.forEach(
    courtName => {

      const playing =
        getPlayingMatchOnCourt(
          courtName
        );


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "court-choice";


      if (playing) {

        button.disabled =
          true;


        button.innerHTML = `

          ${escapeHtml(
            courtName
          )}

          <small>
            경기중
          </small>

        `;

      } else {

        button.innerHTML = `

          ${escapeHtml(
            courtName
          )}

          <small>
            빈 코트
          </small>

        `;


        button.addEventListener(
          "click",
          function() {

            startMatch(
              selectedCourtMatchId,
              courtName
            );

          }
        );

      }


      box.appendChild(
        button
      );

    }
  );

}


/* --------------------------------
   코트 선택 모달 닫기
-------------------------------- */

function closeCourtModal() {

  selectedCourtMatchId =
    null;


  document.getElementById(
    "courtModal"
  ).classList.remove(
    "show"
  );

}


/* --------------------------------
   경기 시작
-------------------------------- */

function startMatch(
  matchId,
  courtName
) {

  const match =
    getMatch(
      matchId
    );


  if (!match) {
    return;
  }


  if (
    match.status !==
    "waiting"
  ) {

    alert(
      "현재 대기 상태의 경기가 아닙니다."
    );

    closeCourtModal();

    render();

    return;

  }


  if (
    isCourtBusy(
      courtName
    )
  ) {

    alert(
      `${courtName} 코트는 현재 경기 중입니다.`
    );

    renderCourtPicker();

    return;

  }


  const player1Busy =
    getPlayingMatchForPlayer(
      match.player1,
      match.id
    );


  if (
    player1Busy
  ) {

    alert(
      `${entryName(
        entries[
          match.player1
        ]
      )} 선수가 현재 ${player1Busy.court}에서 경기 중입니다.`
    );

    closeCourtModal();

    return;

  }


  const player2Busy =
    getPlayingMatchForPlayer(
      match.player2,
      match.id
    );


  if (
    player2Busy
  ) {

    alert(
      `${entryName(
        entries[
          match.player2
        ]
      )} 선수가 현재 ${player2Busy.court}에서 경기 중입니다.`
    );

    closeCourtModal();

    return;

  }


  match.status =
    "playing";

  match.court =
    courtName;

  match.score1 =
    null;

  match.score2 =
    null;


  saveState();

  closeCourtModal();

  render();

}


/* --------------------------------
   경기중 → 대기
-------------------------------- */

function cancelPlaying(
  matchId
) {

  const match =
    getMatch(
      matchId
    );


  if (!match) {
    return;
  }


  const ok =
    confirm(
      "이 경기를 다시 대기 상태로 돌릴까요?"
    );


  if (!ok) {
    return;
  }


  match.status =
    "waiting";

  match.court =
    null;

  match.score1 =
    null;

  match.score2 =
    null;


  saveState();

  render();

}


/* --------------------------------
   완료 경기 → 대기 복구
-------------------------------- */

function restoreCompleted(
  matchId
) {

  const match =
    getMatch(
      matchId
    );


  if (!match) {
    return;
  }


  const ok =
    confirm(
      "이 경기의 결과를 취소하고 다시 대기 경기로 복구할까요?\n입력된 점수와 기존 코트 배정이 초기화됩니다."
    );


  if (!ok) {
    return;
  }


  match.status =
    "waiting";

  match.court =
    null;

  match.score1 =
    null;

  match.score2 =
    null;


  saveState();

  render();

}


/* --------------------------------
   점수 입력 열기
-------------------------------- */

function openScore(
  matchId
) {

  const match =
    getMatch(
      matchId
    );


  if (!match) {
    return;
  }


  if (
    match.status !==
    "playing"
  ) {

    alert(
      "현재 경기 중인 경기가 아닙니다."
    );

    return;

  }


  selectedFinishMatchId =
    matchId;


  document.getElementById(
    "scoreModalInfo"
  ).textContent =
    `${match.groupName} · ${match.court}`;


  document.getElementById(
    "scorePlayer1"
  ).textContent =
    entryName(
      entries[
        match.player1
      ]
    );


  document.getElementById(
    "scorePlayer2"
  ).textContent =
    entryName(
      entries[
        match.player2
      ]
    );


  document.getElementById(
    "score1"
  ).value = "";


  document.getElementById(
    "score2"
  ).value = "";


  document.getElementById(
    "scoreModal"
  ).classList.add(
    "show"
  );


  setTimeout(
    () => {

      document.getElementById(
        "score1"
      ).focus();

    },
    100
  );

}


/* --------------------------------
   점수 모달 닫기
-------------------------------- */

function closeScore() {

  selectedFinishMatchId =
    null;


  document.getElementById(
    "scoreModal"
  ).classList.remove(
    "show"
  );

}


/* --------------------------------
   경기 완료
-------------------------------- */

function finishMatch() {

  if (
    !selectedFinishMatchId
  ) {

    return;

  }


  const value1 =
    document.getElementById(
      "score1"
    ).value;


  const value2 =
    document.getElementById(
      "score2"
    ).value;


  if (
    value1 === "" ||
    value2 === ""
  ) {

    alert(
      "양쪽 스코어를 모두 입력해주세요."
    );

    return;

  }


  const score1 =
    Number(
      value1
    );


  const score2 =
    Number(
      value2
    );


  if (
    !Number.isFinite(
      score1
    )
    ||
    !Number.isFinite(
      score2
    )
    ||
    score1 < 0
    ||
    score2 < 0
  ) {

    alert(
      "올바른 점수를 입력해주세요."
    );

    return;

  }


  if (
    score1 === score2
  ) {

    const ok =
      confirm(
        "동점으로 결과를 저장할까요?"
      );


    if (!ok) {
      return;
    }

  }


  const match =
    getMatch(
      selectedFinishMatchId
    );


  if (!match) {
    return;
  }


  match.score1 =
    score1;

  match.score2 =
    score2;

  match.status =
    "completed";


  saveState();

  closeScore();

  render();

}


/* --------------------------------
   완료 결과 수정
-------------------------------- */

function editCompleted(
  matchId
) {

  const match =
    getMatch(
      matchId
    );


  if (!match) {
    return;
  }


  const first =
    prompt(
      `${entryName(
        entries[
          match.player1
        ]
      )} 점수`,
      match.score1
    );


  if (
    first === null
  ) {

    return;

  }


  const second =
    prompt(
      `${entryName(
        entries[
          match.player2
        ]
      )} 점수`,
      match.score2
    );


  if (
    second === null
  ) {

    return;

  }


  if (
    first.trim() === "" ||
    second.trim() === ""
  ) {

    alert(
      "양쪽 점수를 모두 입력해주세요."
    );

    return;

  }


  const score1 =
    Number(first);

  const score2 =
    Number(second);


  if (
    !Number.isFinite(
      score1
    )
    ||
    !Number.isFinite(
      score2
    )
    ||
    score1 < 0
    ||
    score2 < 0
  ) {

    alert(
      "올바른 점수를 입력해주세요."
    );

    return;

  }


  match.score1 =
    score1;

  match.score2 =
    score2;


  saveState();

  render();

}


/* --------------------------------
   코트 현황 렌더
-------------------------------- */

function renderCourts() {

  const box =
    document.getElementById(
      "courts"
    );


  box.innerHTML = "";


  if (
    courts.length === 0
  ) {

    box.innerHTML = `
      <div class="empty">
        등록된 코트가 없습니다.
      </div>
    `;

    return;

  }


  courts.forEach(
    courtName => {

      const playing =
        getPlayingMatchOnCourt(
          courtName
        );


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "court";


      if (!playing) {

        card.innerHTML = `

          <div class="court-head">

            <div class="court-name">
              ${escapeHtml(
                courtName
              )}
            </div>

            <div class="court-status">
              빈 코트
            </div>

          </div>

          <div class="court-body">

            <div class="empty-court">
              현재 진행 중인 경기가 없습니다.
            </div>

          </div>

        `;

      } else {

        card.innerHTML = `

          <div class="court-head">

            <div class="court-name">
              ${escapeHtml(
                courtName
              )}
            </div>

            <div class="court-status live">
              경기중
            </div>

          </div>

          <div class="court-body">

            <div class="live-group">
              ${escapeHtml(
                playing.groupName
              )}
            </div>

            <div class="live-player">
              ${escapeHtml(
                entryName(
                  entries[
                    playing.player1
                  ]
                )
              )}
            </div>

            <div class="vs">
              VS
            </div>

            <div class="live-player">
              ${escapeHtml(
                entryName(
                  entries[
                    playing.player2
                  ]
                )
              )}
            </div>

            <div class="court-actions">

              <button
                class="court-btn"
                onclick="
                  cancelPlaying(
                    '${playing.id}'
                  )
                "
              >
                대기로 되돌리기
              </button>

              <button
                class="court-btn finish"
                onclick="
                  openScore(
                    '${playing.id}'
                  )
                "
              >
                경기 완료
              </button>

            </div>

          </div>

        `;

      }


      box.appendChild(
        card
      );

    }
  );

}


/* --------------------------------
   대기 경기 렌더
-------------------------------- */

function renderWaiting() {

  const box =
    document.getElementById(
      "waitingList"
    );


  const waiting =
    matches.filter(
      match =>
        match.status ===
        "waiting"
    );


  box.innerHTML = "";


  if (
    waiting.length === 0
  ) {

    box.innerHTML = `
      <div class="empty">
        대기 중인 경기가 없습니다.
      </div>
    `;

    return;

  }


  waiting.forEach(
    match => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "match-row";


      row.innerHTML = `

        <div>

          <div class="group-label">
            ${escapeHtml(
              match.groupName
            )}
          </div>

          <div class="match-name">

            ${escapeHtml(
              entryName(
                entries[
                  match.player1
                ]
              )
            )}

            <br>

            VS

            <br>

            ${escapeHtml(
              entryName(
                entries[
                  match.player2
                ]
              )
            )}

          </div>

        </div>


        <button
          class="assign-btn"
          onclick="
            openCourtModal(
              '${match.id}'
            )
          "
        >
          코트 배정
        </button>

      `;


      box.appendChild(
        row
      );

    }
  );

}


/* --------------------------------
   완료 경기 렌더
-------------------------------- */

function renderCompleted() {

  const box =
    document.getElementById(
      "completedList"
    );


  const completed =
    matches.filter(
      match =>
        match.status ===
        "completed"
    );


  box.innerHTML = "";


  if (
    completed.length === 0
  ) {

    box.innerHTML = `
      <div class="empty">
        아직 완료된 경기가 없습니다.
      </div>
    `;

    return;

  }


  completed
    .slice()
    .reverse()
    .forEach(
      match => {

        const row =
          document.createElement(
            "div"
          );


        row.className =
          "completed";


        row.innerHTML = `

          <div class="completed-main">

            <div class="group-label">

              ${escapeHtml(
                match.groupName
              )}

              ${match.court
                ? ` · ${escapeHtml(
                    match.court
                  )}`
                : ""
              }

            </div>


            <div class="match-name">

              ${escapeHtml(
                entryName(
                  entries[
                    match.player1
                  ]
                )
              )}

              vs

              ${escapeHtml(
                entryName(
                  entries[
                    match.player2
                  ]
                )
              )}

            </div>


            <div class="completed-actions">

              <button
                class="text-btn"
                onclick="
                  editCompleted(
                    '${match.id}'
                  )
                "
              >
                결과 수정
              </button>


              <button
                class="text-btn restore"
                onclick="
                  restoreCompleted(
                    '${match.id}'
                  )
                "
              >
                대기로 복구
              </button>

            </div>

          </div>


          <div class="score">

            ${match.score1}
            :
            ${match.score2}

          </div>

        `;


        box.appendChild(
          row
        );

      }
    );

}


/* --------------------------------
   통계 렌더
-------------------------------- */

function renderStats() {

  const total =
    matches.length;


  const waiting =
    matches.filter(
      match =>
        match.status ===
        "waiting"
    ).length;


  const live =
    matches.filter(
      match =>
        match.status ===
        "playing"
    ).length;


  const completed =
    matches.filter(
      match =>
        match.status ===
        "completed"
    ).length;


  document.getElementById(
    "totalCount"
  ).textContent =
    total;


  document.getElementById(
    "waitingCount"
  ).textContent =
    waiting;


  document.getElementById(
    "liveCount"
  ).textContent =
    live;


  document.getElementById(
    "completedCount"
  ).textContent =
    completed;


  document.getElementById(
    "waitingBadge"
  ).textContent =
    waiting;


  document.getElementById(
    "completedBadge"
  ).textContent =
    completed;

}


/* --------------------------------
   전체 렌더
-------------------------------- */

function render() {

  renderStats();

  renderCourts();

  renderWaiting();

  renderCompleted();

}


/* --------------------------------
   버튼 이벤트
-------------------------------- */

document.getElementById(
  "cancelCourt"
).addEventListener(
  "click",
  closeCourtModal
);


document.getElementById(
  "cancelScore"
).addEventListener(
  "click",
  closeScore
);


document.getElementById(
  "saveScore"
).addEventListener(
  "click",
  finishMatch
);


/* 배경 클릭으로 모달 닫기 */

document.getElementById(
  "courtModal"
).addEventListener(
  "click",
  function(event) {

    if (
      event.target === this
    ) {

      closeCourtModal();

    }

  }
);


document.getElementById(
  "scoreModal"
).addEventListener(
  "click",
  function(event) {

    if (
      event.target === this
    ) {

      closeScore();

    }

  }
);


/* --------------------------------
   시작
-------------------------------- */

loadState();

render();

</script>

</body>
</html>
