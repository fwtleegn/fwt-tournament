<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>경기 운영 | FWT Tournament</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --navy:#071a31;
      --navy2:#0c294a;
      --blue:#184a79;
      --lime:#c9df45;

      --bg:#f4f6f9;
      --white:#ffffff;

      --text:#172033;
      --muted:#667386;
      --line:#e2e7ec;

      --green:#178b61;
      --green-soft:#edf8f3;

      --orange:#9d651d;
      --orange-soft:#fff8ed;

      --shadow:
        0 10px 30px rgba(20,35,55,.055);
    }

    * {
      box-sizing:border-box;
    }

    html,
    body {
      margin:0;
      min-height:100%;

      background:var(--bg);
      color:var(--text);

      font-family:
        Inter,
        Pretendard,
        "Noto Sans KR",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input {
      font:inherit;
    }

    button {
      cursor:pointer;
    }

    .topbar {
      height:68px;
      padding:0 24px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      color:white;

      background:
        linear-gradient(
          110deg,
          #07182d,
          #0b2848 60%,
          #10375f
        );
    }

    .brand {
      display:flex;
      align-items:center;
      gap:22px;
    }

    .fwt {
      font-size:29px;
      font-weight:950;
      font-style:italic;
      letter-spacing:-3px;
    }

    .fwt span {
      color:var(--lime);
    }

    .top-title {
      font-size:11px;
      font-weight:800;
      letter-spacing:1.8px;
      color:rgba(255,255,255,.72);
    }

    .back-btn {
      padding:9px 13px;

      border:1px solid rgba(255,255,255,.16);
      border-radius:10px;

      background:rgba(255,255,255,.07);
      color:white;

      font-size:12px;
      font-weight:750;
    }

    .container {
      width:min(1280px,calc(100% - 34px));
      margin:0 auto;

      padding:32px 0 64px;
    }

    .head {
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:20px;

      margin-bottom:18px;
    }

    .kicker {
      margin-bottom:7px;

      color:var(--blue);

      font-size:11px;
      font-weight:900;
      letter-spacing:1.8px;
    }

    h1 {
      margin:0;

      color:var(--navy);

      font-size:34px;
      font-weight:900;
      letter-spacing:-1.5px;
    }

    .desc {
      margin:7px 0 0;

      color:#5f6c7e;

      font-size:13px;
      line-height:1.55;
    }

    .head-right {
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:10px;
    }

    .stats {
      display:flex;
      flex-wrap:wrap;
      gap:7px;
    }

    .stat {
      padding:8px 11px;

      border:1px solid var(--line);
      border-radius:999px;

      background:white;

      color:#526073;

      font-size:11px;
      font-weight:800;
    }

    .stat strong {
      color:var(--navy);
      font-size:13px;
    }

    .standings-btn {
      height:43px;
      padding:0 18px;

      border:0;
      border-radius:10px;

      background:var(--navy);
      color:white;

      font-size:13px;
      font-weight:850;
    }

    .standings-btn span {
      color:var(--lime);
      margin-left:5px;
    }

    .section-title {
      display:flex;
      align-items:center;
      justify-content:space-between;

      margin:22px 0 10px;
    }

    .section-title-main {
      color:var(--navy);

      font-size:17px;
      font-weight:900;
    }

    .section-title-sub {
      color:#6b7788;

      font-size:11px;
      font-weight:700;
    }

    .courts {
      display:grid;
      grid-template-columns:
        repeat(
          auto-fit,
          minmax(220px,1fr)
        );
      gap:9px;
    }

    .court {
      overflow:hidden;

      border:1px solid var(--line);
      border-radius:14px;

      background:white;
      box-shadow:var(--shadow);
    }

    .court-inner {
      min-height:82px;
      padding:12px 13px;
    }

    .court-top {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;

      margin-bottom:8px;
    }

    .court-name {
      color:var(--navy);

      font-size:15px;
      font-weight:900;
    }

    .court-status {
      padding:5px 8px;

      border-radius:999px;

      background:#f0f3f6;
      color:#657183;

      font-size:10px;
      font-weight:850;
    }

    .court-status.live {
      background:var(--green-soft);
      color:var(--green);
    }

    .court-empty {
      color:#677487;

      font-size:12px;
      font-weight:700;
    }

    .court-match-line {
      overflow:hidden;

      color:#202d41;

      font-size:14px;
      font-weight:850;

      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .court-group {
      margin-bottom:4px;

      color:var(--navy2);

      font-size:12px;
      font-weight:900;
    }

    .court-actions {
      display:flex;
      gap:6px;

      margin-top:9px;
    }

    .court-btn {
      height:34px;

      padding:0 10px;

      border:1px solid #d9e0e6;
      border-radius:8px;

      background:white;
      color:#526073;

      font-size:11px;
      font-weight:800;
    }

    .court-btn.finish {
      flex:1;

      border:0;

      background:var(--navy);
      color:white;
    }

    .next-card {
      overflow:hidden;

      border:1px solid var(--line);
      border-radius:16px;

      background:white;
      box-shadow:var(--shadow);
    }

    .next-list {
      padding:8px;
    }

    .next-match {
      display:grid;

      grid-template-columns:
        65px minmax(0,1fr) 115px;

      align-items:center;
      gap:10px;

      min-height:66px;

      padding:10px 11px;

      border-bottom:1px solid #e8ecf0;
    }

    .next-match:last-child {
      border-bottom:0;
    }

    .group-badge {
      height:38px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:10px;

      background:#eef2f6;
      color:var(--navy);

      font-size:14px;
      font-weight:900;
    }

    .next-players {
      min-width:0;
      overflow:hidden;

      color:#202d41;

      font-size:15px;
      font-weight:850;

      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .assign-btn {
      height:40px;

      border:0;
      border-radius:9px;

      background:
        linear-gradient(
          115deg,
          var(--navy),
          #123e6c
        );

      color:white;

      font-size:12px;
      font-weight:850;
    }

    .waiting-toggle-wrap {
      margin-top:10px;
    }

    .waiting-toggle {
      width:100%;
      height:48px;

      border:1px solid #dce2e8;
      border-radius:11px;

      background:white;
      color:var(--navy);

      font-size:13px;
      font-weight:850;
    }

    .waiting-toggle span {
      margin-left:5px;
    }

    .full-waiting {
      display:none;

      margin-top:10px;

      overflow:hidden;

      border:1px solid var(--line);
      border-radius:16px;

      background:white;
      box-shadow:var(--shadow);
    }

    .full-waiting.show {
      display:block;
    }

    .waiting-tabs {
      display:flex;
      gap:6px;

      overflow-x:auto;

      padding:10px 10px 0;

      scrollbar-width:none;
    }

    .waiting-tabs::-webkit-scrollbar {
      display:none;
    }

    .tab-btn {
      flex-shrink:0;

      height:38px;
      padding:0 14px;

      border:1px solid #dce2e8;
      border-radius:999px;

      background:white;
      color:#4d5a6c;

      font-size:12px;
      font-weight:850;
    }

    .tab-btn.active {
      border-color:var(--navy);
      background:var(--navy);
      color:white;
    }

    .waiting-list {
      padding:10px;
    }

    .waiting-row {
      display:grid;

      grid-template-columns:
        65px minmax(0,1fr) 110px;

      align-items:center;
      gap:10px;

      min-height:62px;

      padding:9px 10px;

      border-bottom:1px solid #e9edf1;
    }

    .waiting-row:last-child {
      border-bottom:0;
    }

    .waiting-group {
      color:var(--navy);

      font-size:13px;
      font-weight:900;
    }

    .waiting-players {
      min-width:0;
      overflow:hidden;

      color:#263247;

      font-size:14px;
      font-weight:800;

      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .completed-card {
      margin-top:13px;

      overflow:hidden;

      border:1px solid var(--line);
      border-radius:16px;

      background:white;
      box-shadow:var(--shadow);
    }

    .card-head {
      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:15px 16px;

      border-bottom:1px solid var(--line);
    }

    .card-title {
      color:var(--navy);

      font-size:16px;
      font-weight:900;
    }

    .count {
      min-width:31px;
      height:31px;
      padding:0 9px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:999px;

      background:#eef2f5;
      color:var(--navy);

      font-size:12px;
      font-weight:900;
    }

    .completed-list {
      padding:10px;
    }

    .completed {
      display:grid;

      grid-template-columns:
        minmax(0,1fr) auto;

      align-items:center;
      gap:12px;

      padding:11px 12px;
      margin-bottom:7px;

      border:1px solid #e2e8e5;
      border-radius:11px;

      background:#fbfdfc;
    }

    .completed:last-child {
      margin-bottom:0;
    }

    .completed-group {
      margin-bottom:4px;

      color:var(--navy);

      font-size:12px;
      font-weight:900;
    }

    .completed-name {
      color:#263247;

      font-size:14px;
      font-weight:850;
    }

    .completed-actions {
      display:flex;
      gap:6px;

      margin-top:7px;
    }

    .small-btn {
      height:31px;
      padding:0 10px;

      border:1px solid #dce2e8;
      border-radius:8px;

      background:white;
      color:#536071;

      font-size:10px;
      font-weight:800;
    }

    .small-btn.restore {
      color:var(--orange);

      border-color:#ecd4b3;
      background:var(--orange-soft);
    }

    .score {
      min-width:48px;

      padding:7px 9px;

      border-radius:8px;

      background:var(--green-soft);
      color:var(--green);

      text-align:center;

      font-size:13px;
      font-weight:900;
    }

    .empty {
      padding:30px 15px;

      text-align:center;

      color:#657184;

      font-size:13px;
      line-height:1.6;
    }

    .footer {
      display:flex;
      justify-content:space-between;

      margin-top:26px;
      padding-top:17px;

      border-top:1px solid #e2e6eb;

      color:#7c8795;

      font-size:10px;
      letter-spacing:1px;
    }

    .footer strong {
      color:var(--navy);
    }

    .q {
      color:#91a719;
      font-weight:900;
    }

    .modal-wrap {
      display:none;

      position:fixed;
      inset:0;
      z-index:100;

      align-items:center;
      justify-content:center;

      padding:18px;

      background:rgba(4,17,31,.6);
    }

    .modal-wrap.show {
      display:flex;
    }

    .modal {
      width:min(460px,100%);
      max-height:calc(100vh - 36px);

      overflow-y:auto;

      padding:22px;

      border-radius:19px;

      background:white;

      box-shadow:0 30px 80px rgba(0,0,0,.24);
    }

    .modal-title {
      color:var(--navy);

      font-size:21px;
      font-weight:900;
    }

    .modal-desc {
      margin:7px 0 16px;

      color:#5d697a;

      font-size:13px;
      line-height:1.55;
    }

    .selected-match {
      padding:13px 14px;
      margin-bottom:15px;

      border:1px solid #e1e6eb;
      border-radius:11px;

      background:#f7f9fb;
      color:#263247;

      font-size:15px;
      font-weight:850;
      line-height:1.6;
    }

    .selected-match strong {
      color:var(--navy);
    }

    .court-picker {
      display:grid;
      grid-template-columns:
        repeat(2,minmax(0,1fr));
      gap:8px;
    }

    .court-choice {
      min-height:64px;
      padding:10px;

      border:1px solid #dce2e8;
      border-radius:11px;

      background:white;
      color:var(--navy);

      font-size:14px;
      font-weight:900;
    }

    .court-choice small {
      display:block;

      margin-top:4px;

      color:#667386;

      font-size:11px;
      font-weight:750;
    }

    .court-choice:disabled {
      cursor:not-allowed;

      background:#f1f3f5;
      color:#929ba7;
    }

    .score-grid {
      display:grid;

      grid-template-columns:
        1fr 30px 1fr;

      align-items:end;
      gap:9px;
    }

    .score-player {
      min-height:36px;
      margin-bottom:7px;

      color:#354255;

      font-size:12px;
      font-weight:850;
    }

    .score-input {
      width:100%;
      height:54px;

      border:1px solid #d9e0e6;
      border-radius:11px;

      outline:none;

      text-align:center;

      font-size:23px;
      font-weight:900;
    }

    .score-dash {
      height:54px;

      display:flex;
      align-items:center;
      justify-content:center;

      color:#7e8997;

      font-size:20px;
      font-weight:900;
    }

    .modal-bottom {
      display:flex;
      gap:8px;

      margin-top:18px;
    }

    .modal-btn {
      flex:1;
      height:46px;

      border-radius:10px;

      font-size:13px;
      font-weight:850;
    }

    .cancel {
      border:1px solid #dce2e8;

      background:white;
      color:#536071;
    }

    .confirm {
      border:0;

      background:var(--navy);
      color:white;
    }

    @media(max-width:700px) {

      .topbar {
        height:64px;
        padding:0 14px;
      }

      .top-title {
        display:none;
      }

      .container {
        width:calc(100% - 22px);
        padding:24px 0 50px;
      }

      .head {
        display:block;
      }

      .head-right {
        margin-top:13px;
        align-items:stretch;
      }

      h1 {
        font-size:30px;
      }

      .desc {
        font-size:14px;
      }

      .stats {
        justify-content:flex-start;
      }

      .stat {
        padding:8px 10px;
        font-size:12px;
      }

      .stat strong {
        font-size:14px;
      }

      .standings-btn {
        width:100%;
        min-height:48px;

        font-size:14px;
      }

      .section-title {
        margin:20px 0 9px;
      }

      .section-title-main {
        font-size:19px;
      }

      .section-title-sub {
        font-size:12px;
      }

      .courts {
        grid-template-columns:
          repeat(2,minmax(0,1fr));
        gap:7px;
      }

      .court-inner {
        min-height:91px;
        padding:10px;
      }

      .court-name {
        font-size:15px;
      }

      .court-status {
        padding:4px 6px;
        font-size:10px;
      }

      .court-group {
        font-size:12px;
      }

      .court-match-line {
        font-size:14px;
      }

      .court-empty {
        font-size:13px;
      }

      .court-btn {
        min-width:0;
        height:38px;

        padding:0 6px;

        font-size:11px;
      }

      .next-match {
        grid-template-columns:
          52px minmax(0,1fr) 94px;

        gap:8px;

        min-height:68px;
        padding:9px 8px;
      }

      .group-badge {
        height:42px;
        font-size:15px;
      }

      .next-players {
        font-size:15px;
      }

      .assign-btn {
        height:43px;
        font-size:12px;
      }

      .waiting-toggle {
        height:50px;
        font-size:14px;
      }

      .waiting-row {
        grid-template-columns:
          48px minmax(0,1fr) 90px;

        gap:7px;

        min-height:64px;
        padding:9px 8px;
      }

      .waiting-group {
        font-size:14px;
      }

      .waiting-players {
        font-size:14px;
      }

      .card-title {
        font-size:17px;
      }

      .completed-group {
        font-size:13px;
      }

      .completed-name {
        font-size:14px;
      }

      .small-btn {
        height:35px;
        font-size:11px;
      }

      .score {
        font-size:14px;
      }

      .modal-title {
        font-size:22px;
      }

      .court-choice {
        min-height:66px;
        font-size:15px;
      }

    }

  </style>
</head>

<body>

<header class="topbar">

  <div class="brand">

    <div class="fwt">
      FW<span>T</span>
    </div>

    <div class="top-title">
      TOURNAMENT CONTROL
    </div>

  </div>

  <button
    class="back-btn"
    onclick="location.href='./group-matches.html'"
  >
    ← 예선 대진
  </button>

</header>


<main class="container">

  <div class="head">

    <div>

      <div class="kicker">
        MATCH CONTROL
      </div>

      <h1>
        경기 운영
      </h1>

      <p class="desc">
        빈 코트에 다음 경기를 배정하고 경기 결과를 관리합니다.
      </p>

    </div>


    <div class="head-right">

      <div class="stats">

        <div class="stat">
          전체
          <strong id="totalCount">0</strong>
        </div>

        <div class="stat">
          경기중
          <strong id="liveCount">0</strong>
        </div>

        <div class="stat">
          대기
          <strong id="waitingCount">0</strong>
        </div>

        <div class="stat">
          완료
          <strong id="completedCount">0</strong>
        </div>

      </div>

      <button
        class="standings-btn"
        onclick="location.href='./group-standings.html'"
      >
        조별 순위 보기
        <span>→</span>
      </button>

    </div>

  </div>


  <div class="section-title">

    <div class="section-title-main">
      코트 현황
    </div>

    <div class="section-title-sub">
      현재 경기 상황
    </div>

  </div>


  <section
    class="courts"
    id="courts"
  ></section>


  <div class="section-title">

    <div class="section-title-main">
      다음 경기
    </div>

    <div class="section-title-sub">
      조별 우선 경기
    </div>

  </div>


  <section class="next-card">

    <div
      class="next-list"
      id="nextList"
    ></div>

  </section>


  <div class="waiting-toggle-wrap">

    <button
      class="waiting-toggle"
      id="waitingToggle"
    >
      전체 대기 경기 보기
      <span id="waitingArrow">
        ▼
      </span>
    </button>

  </div>


  <section
    class="full-waiting"
    id="fullWaiting"
  >

    <div
      class="waiting-tabs"
      id="waitingTabs"
    ></div>

    <div
      class="waiting-list"
      id="waitingList"
    ></div>

  </section>


  <section class="completed-card">

    <div class="card-head">

      <div class="card-title">
        완료 경기
      </div>

      <div
        class="count"
        id="completedBadge"
      >
        0
      </div>

    </div>

    <div
      class="completed-list"
      id="completedList"
    ></div>

  </section>


  <footer class="footer">

    <div>
      <strong>FWT</strong>
      · FRIENDS WITH TENNIS
    </div>

    <div>
      CREATED BY
      <span class="q">Q</span>
    </div>

  </footer>

</main>


<div
  class="modal-wrap"
  id="courtModal"
>

  <div class="modal">

    <div class="modal-title">
      코트 배정
    </div>

    <div class="modal-desc">
      빈 코트를 누르면 즉시 경기가 시작됩니다.
    </div>

    <div
      class="selected-match"
      id="courtModalMatch"
    ></div>

    <div
      class="court-picker"
      id="courtPicker"
    ></div>

    <div class="modal-bottom">

      <button
        class="modal-btn cancel"
        id="cancelCourt"
      >
        취소
      </button>

    </div>

  </div>

</div>


<div
  class="modal-wrap"
  id="scoreModal"
>

  <div class="modal">

    <div class="modal-title">
      경기 결과 입력
    </div>

    <div

let waitingExpanded =

function createDrawSignature() {

  return JSON.stringify(

    matchGroups.map(
      group => ({

        groupName:
          group.groupName,

        matches:
          group.matches.map(
            match => [
              match.player1,
              match.player2
            ]
          )

      })
    )

  );

}


const currentDrawSignature =
  createDrawSignature();


function entryName(entry) {

  if (!entry) {
    return "알 수 없음";
  }


  if (
    entry.type === "singles"
  ) {

    if (
      entry.nickname &&
      entry.name
    ) {

      return `${entry.nickname} (${entry.name})`;

    }


    return (
      entry.nickname ||
      entry.name ||
      "이름 없음"
    );

  }


  const p1 =
    entry.player1?.nickname ||
    entry.player1?.name ||
    "선수1";


  const p2 =
    entry.player2?.nickname ||
    entry.player2?.name ||
    "선수2";


  return `${p1} / ${p2}`;

}


function shortEntryName(entry) {

  if (!entry) {
    return "알 수 없음";
  }


  if (
    entry.type === "singles"
  ) {

    return (
      entry.nickname ||
      entry.name ||
      "이름 없음"
    );

  }


  const p1 =
    entry.player1?.nickname ||
    entry.player1?.name ||
    "선수1";


  const p2 =
    entry.player2?.nickname ||
    entry.player2?.name ||
    "선수2";


  return `${p1}/${p2}`;

}


function escapeHtml(value) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value ?? "";

  return div.innerHTML;

}


function createInitialMatches() {

  matches = [];


  matchGroups.forEach(
    (
      group,
      groupIndex
    ) => {

      group.matches.forEach(
        (
          match,
          matchIndex
        ) => {

          matches.push({

            id:
              `G${groupIndex}-M${matchIndex}`,

            groupName:
              group.groupName,

            groupIndex:
              groupIndex,

            order:
              matchIndex,

            player1:
              match.player1,

            player2:
              match.player2,

            status:
              "waiting",

            court:
              null,

            score1:
              null,

            score2:
              null

          });

        }
      );

    }
  );


  saveState();

}


function saveState() {

  sessionStorage.setItem(
    "fwtMatchControlState",
    JSON.stringify({

      signature:
        currentDrawSignature,

      matches:
        matches

    })
  );

}


function stateMatchesCurrentDraw(
  parsed
) {

  if (
    !parsed ||
    typeof parsed !== "object"
  ) {

    return false;

  }


  if (
    parsed.signature !==
    currentDrawSignature
  ) {

    return false;

  }


  if (
    !Array.isArray(
      parsed.matches
    )
  ) {

    return false;

  }


  const expectedCount =
    matchGroups.reduce(
      (
        total,
        group
      ) =>
        total +
        group.matches.length,
      0
    );


  return (
    parsed.matches.length ===
    expectedCount
  );

}


function loadState() {

  const raw =
    sessionStorage.getItem(
      "fwtMatchControlState"
    );


  if (raw) {

    try {

      const parsed =
        JSON.parse(raw);


      if (
        stateMatchesCurrentDraw(
          parsed
        )
      ) {

        matches =
          parsed.matches;

        return;

      }

    } catch(e) {}

  }


  createInitialMatches();

}


function getMatch(id) {

  return matches.find(
    match =>
      match.id === id
  );

}


function getPlayingMatchOnCourt(
  courtName
) {

  return matches.find(
    match =>
      match.status ===
        "playing"
      &&
      match.court ===
        courtName
  );

}


function isCourtBusy(
  courtName
) {

  return Boolean(
    getPlayingMatchOnCourt(
      courtName
    )
  );

}


function getPlayingMatchForPlayer(
  playerIndex,
  excludeMatchId = null
) {

  return matches.find(
    match => {

      if (
        excludeMatchId &&
        match.id ===
          excludeMatchId
      ) {

        return false;

      }


      if (
        match.status !==
        "playing"
      ) {

        return false;

      }


      return (
        match.player1 ===
          playerIndex
        ||
        match.player2 ===
          playerIndex
      );

    }
  );

}


function openCourtModal(
  matchId
) {

  const match =
    getMatch(
      matchId
    );


  if (
    !match ||
    match.status !==
      "waiting"
  ) {

    return;

  }


  const p1Busy =
    getPlayingMatchForPlayer(
      match.player1,
      match.id
    );


  if (p1Busy) {

    alert(
      `${entryName(
        entries[
          match.player1
        ]
      )} 선수가 현재 ${p1Busy.court}에서 경기 중입니다.`
    );

    return;

  }


  const p2Busy =
    getPlayingMatchForPlayer(
      match.player2,
      match.id
    );


  if (p2Busy) {

    alert(
      `${entryName(
        entries[
          match.player2
        ]
      )} 선수가 현재 ${p2Busy.court}에서 경기 중입니다.`
    );

    return;

  }


  selectedCourtMatchId =
    matchId;


  document.getElementById(
    "courtModalMatch"
  ).innerHTML = `

    <strong>
      ${escapeHtml(
        match.groupName
      )}
    </strong>

    <br>

    ${escapeHtml(
      entryName(
        entries[
          match.player1
        ]
      )
    )}

    &nbsp; vs &nbsp;

    ${escapeHtml(
      entryName(
        entries[
          match.player2
        ]
      )
    )}

  `;


  renderCourtPicker();


  document.getElementById(
    "courtModal"
  ).classList.add(
    "show"
  );

}


function renderCourtPicker() {

  const box =
    document.getElementById(
      "courtPicker"
    );


  box.innerHTML = "";


  if (
    courts.length === 0
  ) {

    box.innerHTML = `
      <div class="empty">
        등록된 코트가 없습니다.
      </div>
    `;

    return;

  }


  courts.forEach(
    courtName => {

      const playing =
        getPlayingMatchOnCourt(
          courtName
        );


      const button =
        document.createElement(
          "button"
        );

        "court-choice";


      if (playing) {

        button.disabled =
          true;


        button.innerHTML = `

          ${escapeHtml(
            courtName
          )}

          <small>
            경기중
          </small>

        `;

      } else {

        button.innerHTML = `

          ${escapeHtml(
            courtName
          )}

          <small>
            빈 코트
          </small>

        `;


        button.addEventListener(
          "click",

              selectedCourtMatchId,

        );

      }

}


function closeCourtModal() {

  selectedCourtMatchId =
    null;


  document.getElementById(
    "courtModal"
  ).classList.remove(
    "show"
  );

}


function startMatch(
  matchId,
  courtName
) {

  const match =
    getMatch(
      matchId
    );


  if (
    !match ||
    match.status !==
      "waiting"
  ) {

    closeCourtModal();
    render();

    return;

  }


  if (
    isCourtBusy(
      courtName
    )
  ) {

    alert(
      `${courtName} 코트는 현재 경기 중입니다.`
    );

    renderCourtPicker();

    return;

  }


  const p1Busy =
    getPlayingMatchForPlayer(
      match.player1,
      match.id
    );


  if (p1Busy) {

    alert(
      `${entryName(
        entries[
          match.player1
        ]
      )} 선수가 현재 ${p1Busy.court}에서 경기 중입니다.`
    );

    closeCourtModal();

    return;

  }


  const p2Busy =
    getPlayingMatchForPlayer(
      match.player2,
      match.id
    );


  if (p2Busy) {

    alert(
      `${entryName(
        entries[
          match.player2
        ]
      )} 선수가 현재 ${p2Busy.court}에서 경기 중입니다.`
    );

    closeCourtModal();

    return;

  }


  match.status =
    "playing";

  match.court =
    courtName;

  match.score1 =
    null;

  match.score2 =
    null;


  saveState();

  closeCourtModal();

  render();

}


function cancelPlaying(

function openScore(

) {

  const match =
    getMatch(
      matchId

    match.status !==
      "playing"

  document.getElementById(
    "scorePlayer1"

      ]
    );

  document.getElementById(

  document.getElementById(
    "score2"
  ).value = "";


  document.getElementById(
    "scoreModal"
  ).classList.add(
    "show"
  );

}


function closeScore() {

  selectedFinishMatchId =
    null;


  document.getElementById(
    "scoreModal"
  ).classList.remove(
    "show"
  );

}


function finishMatch() {

  if (
    !selectedFinishMatchId
  ) {
    return;
  }


  const raw1 =
    document.getElementById(
      "score1"
    ).value;


  const raw2 =
    document.getElementById(
      "score2"
    ).value;


  if (
    raw1 === "" ||
    raw2 === ""
  ) {

    alert(
      "양쪽 점수를 모두 입력해주세요."
    );

    return;

  }


  const score1 =
    Number(raw1);


  const score2 =
    Number(raw2);


  if (
    !Number.isFinite(score1)
    ||
    !Number.isFinite(score2)
    ||
    score1 < 0
    ||
    score2 < 0
  ) {

    alert(
      "올바른 점수를 입력해주세요."
    );

    return;

  }


  if (
    score1 === score2
  ) {

    if (
      !confirm(
        "동점으로 결과를 저장할까요?"
      )
    ) {

      return;

    }

  }


  const match =
    getMatch(
      selectedFinishMatchId
    );


  if (!match) {
    return;
  }


  match.score1 =
    score1;

  match.score2 =
    score2;

  match.status =
    "completed";


  saveState();

  closeScore();

  render();

}


function editCompleted(
  matchId
) {

  const match =
    getMatch(
      matchId
    );


  if (!match) {
    return;
  }


  const first =
    prompt(
      `${entryName(
        entries[
          match.player1
        ]
      )} 점수`,
      match.score1
    );


  if (
    first === null
  ) {
    return;
  }


  const second =
    prompt(
      `${entryName(
        entries[
          match.player2
        ]
      )} 점수`,
      match.score2
    );


  if (
    second === null
  ) {
    return;
  }


  if (
    first.trim() === "" ||
    second.trim() === ""
  ) {

    return;

  }


  const score1 =
    Number(first);


  const score2 =
    Number(second);


  if (
    !Number.isFinite(score1)
    ||
    !Number.isFinite(score2)
    ||
    score1 < 0
    ||
    score2 < 0
  ) {

    alert(
      "올바른 점수를 입력해주세요."
    );

    return;

  }


  match.score1 =
    score1;

  match.score2 =
    score2;


  saveState();

  render();

}

function getNextMatchesByGroup() {

  const result = [];


  matchGroups.forEach(
    group => {

      const next =
        matches.find(
          match =>
            match.groupName ===
              group.groupName
            &&
            match.status ===
              "waiting"
        );


      if (next) {
        result.push(next);
      }

    }
  );


  return result;

}


function renderNextMatches() {

  const box =
    document.getElementById(

function getGroupNames() {

  return matchGroups.map(
    group =>
      group.groupName
  );

}


function renderWaitingTabs() {

  const box =
    document.getElementById(
      "waitingTabs"
    );


  box.innerHTML = "";


  const groups =
    [
      {
        key:"all",
        label:"전체"
      },

      ...getGroupNames().map(
        name => ({
          key:name,
          label:name
        })
      )
    ];


  groups.forEach(
    item => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "tab-btn";


      if (
        activeGroupFilter ===
        item.key
      ) {

        button.classList.add(
          "active"
        );

      }


      button.textContent =
        item.label;


      button.addEventListener(
        "click",
        function() {

          activeGroupFilter =
            item.key;

          renderWaitingTabs();

          renderFullWaiting();

        }
      );


      box.appendChild(
        button
      );

    }
  );

}


function renderFullWaiting() {

  const box =
    document.getElementById(
      "waitingList"
    );


  let waiting =
    matches.filter(
      match =>
        match.status ===
          "waiting"
    );


  if (
    activeGroupFilter !==
    "all"
  ) {

    waiting =
      waiting.filter(
        match =>
          match.groupName ===
          activeGroupFilter
      );

  }


  box.innerHTML = "";


  if (
    waiting.length === 0
  ) {

    box.innerHTML = `
      <div class="empty">
        해당 조의 대기 경기가 없습니다.
      </div>
    `;

    return;

  }


  waiting.forEach(
    match => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "waiting-row";


      row.innerHTML = `

        <div class="waiting-group">
          ${escapeHtml(
            match.groupName

        <div class="waiting-players">

          ${escapeHtml(
            shortEntryName(
              entries[

            )

            shortEntryName(
              entries[
                match.player2
              ]
            )

          onclick="

            )
          "
        >

      `;


      box.appendChild(
        row
      );

    }
  );

}

                    match.player1
                  ]
                )
              )}

              vs

              ${escapeHtml(
                shortEntryName(
                  entries[
                    match.player2
                  ]
                )
              )}

            </div>

            <div class="completed-actions">

              <button
                class="small-btn"
                onclick="
                  editCompleted(
                    '${match.id}'
                  )
                "
              >
                결과 수정
              </button>

              <button
                class="small-btn restore"
                onclick="
                  restoreCompleted(
                    '${match.id}'
                  )
                "
              >
                대기로 복구
              </button>

            </div>

          </div>

          <div class="score">

            ${match.score1}
            :
            ${match.score2}

          </div>

        `;


        box.appendChild(
          row
        );

      }
    );

}


function renderStats() {

  const total =
    matches.length;


  const waiting =
    matches.filter(
      match =>
        match.status ===
          "waiting"
    ).length;


  const live =
    matches.filter(
      match =>
        match.status ===
          "playing"
    ).length;


  const completed =
    matches.filter(
      match =>
        match.status ===
          "completed"
    ).length;


  document.getElementById(
    "totalCount"
  ).textContent =
    total;


  document.getElementById(
    "waitingCount"
  ).textContent =
    waiting;


  document.getElementById(
    "liveCount"
  ).textContent =
    live;


  document.getElementById(
    "completedCount"
  ).textContent =
    completed;


  document.getElementById(
    "waitingToggle"
  ).firstChild.textContent =
    `전체 대기 경기 ${waiting}개 보기 `;

}


function render() {

  renderStats();

  renderCourts();

  renderNextMatches();

  renderWaitingTabs();

  renderFullWaiting();

  renderCompleted();

}


document.getElementById(
  "waitingToggle"
).addEventListener(
  "click",
  function() {

    waitingExpanded =
      !waitingExpanded;


    document.getElementById(
      "fullWaiting"
    ).classList.toggle(
      "show",
      waitingExpanded
    );


    document.getElementById(
      "waitingArrow"
    ).textContent =
      waitingExpanded
        ? "▲"
        : "▼";

  }
);


document.getElementById(
  "cancelCourt"
).addEventListener(
  "click",
  closeCourtModal
);


document.getElementById(
  "cancelScore"
).addEventListener(
  "click",
  closeScore
);


document.getElementById(
  "saveScore"
).addEventListener(
  "click",
  finishMatch
);


document.getElementById(
  "courtModal"
).addEventListener(
  "click",
  function(event) {

    if (
      event.target === this
    ) {

      closeCourtModal();

    }

  }
);


document.getElementById(
  "scoreModal"
).addEventListener(
  "click",
  function(event) {

    if (
      event.target === this
    ) {

      closeScore();

    }

  }
);


loadState();

render();

</script>

</body>
</html>
