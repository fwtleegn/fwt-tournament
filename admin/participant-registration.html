<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>참가자 등록 | FWT Tournament</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --navy: #071a31;
      --navy2: #0c294a;
      --blue: #184a79;
      --lime: #c9df45;
      --bg: #f4f6f9;
      --white: #ffffff;
      --text: #172033;
      --muted: #7b8492;
      --line: #e3e8ee;
      --danger: #d94b4b;
      --danger-bg: #fff1f1;
      --green: #178b61;
      --shadow: 0 14px 40px rgba(20, 35, 55, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family:
        Inter,
        Pretendard,
        "Noto Sans KR",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      height: 72px;
      background:
        linear-gradient(
          110deg,
          #07182d,
          #0b2848 60%,
          #10375f
        );
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      box-shadow: 0 4px 22px rgba(6, 23, 43, 0.16);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 26px;
    }

    .fwt {
      position: relative;
      font-size: 30px;
      font-weight: 950;
      font-style: italic;
      letter-spacing: -3px;
      transform: skewX(-5deg);
    }

    .fwt span {
      color: var(--lime);
    }

    .fwt::after {
      content: "";
      position: absolute;
      width: 25px;
      height: 3px;
      right: -23px;
      top: 12px;
      border-radius: 10px;
      background: var(--lime);
      transform: rotate(-10deg);
    }

    .top-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.8px;
      color: rgba(255,255,255,.7);
    }

    .back-btn {
      padding: 9px 13px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 10px;
      background: rgba(255,255,255,.07);
      color: white;
      font-size: 11px;
      font-weight: 750;
    }

    .container {
      width: min(1000px, calc(100% - 34px));
      margin: 0 auto;
      padding: 42px 0 70px;
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-end;
      margin-bottom: 26px;
    }

    .kicker {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--blue);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .kicker::before {
      content: "";
      width: 24px;
      height: 2px;
      background: var(--lime);
    }

    h1 {
      margin: 0;
      font-size: 36px;
      letter-spacing: -1.8px;
      color: var(--navy);
    }

    .page-desc {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .summary-chip {
      padding: 8px 11px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: white;
      font-size: 10px;
      font-weight: 800;
      color: #596577;
    }

    .summary-chip strong {
      color: var(--navy);
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr);
      gap: 18px;
    }

    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-head {
      padding: 21px 23px;
      border-bottom: 1px solid var(--line);
    }

    .card-title {
      font-size: 15px;
      font-weight: 850;
      color: var(--navy);
    }

    .card-sub {
      margin-top: 5px;
      font-size: 10px;
      color: var(--muted);
    }

    .card-body {
      padding: 22px;
    }

    .field {
      margin-bottom: 17px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 11px;
      font-weight: 800;
      color: #3b4759;
    }

    input[type="text"] {
      width: 100%;
      height: 50px;
      border: 1px solid #dce1e7;
      border-radius: 11px;
      padding: 0 14px;
      outline: none;
      background: #fbfcfd;
      font-size: 14px;
    }

    input:focus {
      border-color: #6d91b5;
      background: white;
      box-shadow: 0 0 0 4px rgba(23,73,120,.06);
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    .add-btn {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 11px;
      margin-top: 6px;
      background: linear-gradient(115deg, var(--navy), #123e6c);
      color: white;
      font-weight: 800;
      font-size: 13px;
    }

    .count-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      margin-bottom: 14px;
      border-radius: 12px;
      background: #f7f9fb;
      border: 1px solid #edf0f4;
    }

    .count-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
    }

    .count-number {
      font-size: 20px;
      font-weight: 900;
      color: var(--navy);
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .entry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid #e2e6eb;
      border-radius: 13px;
      padding: 13px 14px;
      background: #fff;
    }

    .entry-left {
      min-width: 0;
    }

    .entry-number {
      font-size: 9px;
      font-weight: 900;
      color: #9aa3af;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .entry-name {
      font-size: 13px;
      font-weight: 850;
      color: #263247;
      word-break: keep-all;
    }

    .entry-sub {
      margin-top: 3px;
      font-size: 10px;
      color: #929ba7;
    }

    .entry-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .mini-btn {
      height: 32px;
      padding: 0 10px;
      border-radius: 9px;
      border: 1px solid #dce1e7;
      background: white;
      font-size: 10px;
      font-weight: 750;
      color: #526071;
    }

    .mini-btn.delete {
      color: var(--danger);
      border-color: #f0cccc;
      background: var(--danger-bg);
    }

    .empty {
      padding: 42px 18px;
      text-align: center;
      color: #9aa3af;
      font-size: 11px;
      line-height: 1.7;
    }

    .bottom-bar {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .secondary-btn,
    .next-btn {
      height: 52px;
      border-radius: 12px;
      font-weight: 800;
    }

    .secondary-btn {
      width: 160px;
      border: 1px solid #d8dde4;
      background: white;
      color: #536072;
    }

    .next-btn {
      flex: 1;
      border: 0;
      background: linear-gradient(115deg, var(--navy), #123e6c);
      color: white;
      box-shadow: 0 10px 26px rgba(7,26,49,.12);
    }

    .next-btn span {
      color: var(--lime);
      margin-left: 5px;
    }

    .footer {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid #e2e6eb;
      display: flex;
      justify-content: space-between;
      color: #9aa2ad;
      font-size: 9px;
      letter-spacing: 1px;
    }

    .footer strong {
      color: var(--navy);
    }

    .footer .q {
      color: #9eb421;
      font-weight: 900;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 760px) {
      .topbar {
        padding: 0 17px;
      }

      .top-title {
        display: none;
      }

      .container {
        width: calc(100% - 26px);
        padding-top: 30px;
      }

      .page-head {
        display: block;
      }

      .summary {
        justify-content: flex-start;
        margin-top: 16px;
      }

      h1 {
        font-size: 29px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        border-radius: 16px;
      }

      .two-col {
        grid-template-columns: 1fr;
      }

      .bottom-bar {
        flex-direction: column-reverse;
      }

      .secondary-btn,
      .next-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="brand">
      <div class="fwt">FW<span>T</span></div>
      <div class="top-title">TOURNAMENT CONTROL</div>
    </div>

    <button
      class="back-btn"
      onclick="window.location.href='./create-tournament.html'"
    >
      ← 이전
    </button>
  </header>


  <main class="container">

    <div class="page-head">

      <div>
        <div class="kicker">
          PARTICIPANTS
        </div>

        <h1>
          참가자 등록
        </h1>

        <p class="page-desc">
          참가자 또는 팀을 등록한 뒤 다음 단계에서 조편성과 대진을 구성합니다.
        </p>
      </div>

      <div class="summary">
        <div class="summary-chip">
          <strong id="summaryType">-</strong>
        </div>

        <div class="summary-chip">
          <strong id="summaryFormat">-</strong>
        </div>

        <div class="summary-chip">
          <strong id="summaryCount">0</strong> 참가
        </div>
      </div>

    </div>


    <section class="grid">

      <!-- LEFT: REGISTER -->
      <div class="card">

        <div class="card-head">
          <div class="card-title" id="registerTitle">
            참가자 추가
          </div>
          <div class="card-sub" id="registerSub">
            참가자 정보를 입력해주세요.
          </div>
        </div>


        <div class="card-body">

          <!-- SINGLES -->
          <div id="singlesForm">

            <div class="field">
              <label>이름</label>
              <input
                type="text"
                id="singleName"
                placeholder="예: 이규남"
              />
            </div>

            <div class="field">
              <label>닉네임</label>
              <input
                type="text"
                id="singleNickname"
                placeholder="예: Q"
              />
            </div>

          </div>


          <!-- DOUBLES -->
          <div id="doublesForm" class="hidden">

            <div class="two-col">

              <div class="field">
                <label>선수 1 이름</label>
                <input
                  type="text"
                  id="player1Name"
                  placeholder="선수 1"
                />
              </div>

              <div class="field">
                <label>선수 1 닉네임</label>
                <input
                  type="text"
                  id="player1Nickname"
                  placeholder="닉네임"
                />
              </div>

            </div>


            <div class="two-col">

              <div class="field">
                <label>선수 2 이름</label>
                <input
                  type="text"
                  id="player2Name"
                  placeholder="선수 2"
                />
              </div>

              <div class="field">
                <label>선수 2 닉네임</label>
                <input
                  type="text"
                  id="player2Nickname"
                  placeholder="닉네임"
                />
              </div>

            </div>

          </div>


          <button
            type="button"
            class="add-btn"
            id="addEntryButton"
          >
            + 참가자 추가
          </button>

        </div>

      </div>


      <!-- RIGHT: LIST -->
      <div class="card">

        <div class="card-head">
          <div class="card-title">
            등록된 참가자
          </div>
          <div class="card-sub">
            추가된 참가자는 언제든 수정하거나 삭제할 수 있습니다.
          </div>
        </div>

        <div class="card-body">

          <div class="count-box">
            <div class="count-label">
              현재 참가 수
            </div>

            <div class="count-number" id="entryCount">
              0
            </div>
          </div>

          <div id="entryList" class="list">
            <div class="empty">
              아직 등록된 참가자가 없습니다.<br />
              왼쪽에서 참가자를 추가해주세요.
            </div>
          </div>

        </div>

      </div>

    </section>


    <div class="bottom-bar">

      <button
        class="secondary-btn"
        onclick="window.location.href='./create-tournament.html'"
      >
        이전 단계
      </button>

      <button
        class="next-btn"
        id="nextButton"
      >
        조편성 · 대진으로 이동
        <span>→</span>
      </button>

    </div>


    <footer class="footer">
      <div>
        <strong>FWT</strong> · FRIENDS WITH TENNIS
      </div>

      <div>
        CREATED BY <span class="q">Q</span>
      </div>
    </footer>

  </main>


  <script>

    const SUPABASE_URL =
      "https://opwuyqerisocqobbbisg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Eo_zfONeGLs9ATCVg2Fk_g_y_IAJFV-";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    async function checkLogin() {
      const { data } =
        await supabaseClient.auth.getSession();

      if (!data.session) {
        window.location.href = "./";
      }
    }

    checkLogin();


    const rawTournament =
      sessionStorage.getItem(
        "fwtNewTournament"
      );

    if (!rawTournament) {
      alert(
        "대회 기본 정보가 없습니다. 먼저 새 대회를 만들어주세요."
      );

      window.location.href =
        "./create-tournament.html";
    }


    const tournament =
      JSON.parse(rawTournament);


    const isDoubles =
      tournament.matchType === "doubles";


    document.getElementById(
      "summaryType"
    ).textContent =
      isDoubles ? "복식" : "단식";


    document.getElementById(
      "summaryFormat"
    ).textContent =
      tournament.format ===
      "group_knockout"
        ? "조별리그 + 토너먼트"
        : "토너먼트";


    if (isDoubles) {
      document.getElementById(
        "singlesForm"
      ).classList.add("hidden");

      document.getElementById(
        "doublesForm"
      ).classList.remove("hidden");

      document.getElementById(
        "registerTitle"
      ).textContent =
        "복식팀 추가";

      document.getElementById(
        "registerSub"
      ).textContent =
        "2명의 선수를 한 팀으로 등록합니다.";

      document.getElementById(
        "addEntryButton"
      ).textContent =
        "+ 복식팀 추가";
    }


    let entries = [];

    const savedEntries =
      sessionStorage.getItem(
        "fwtNewTournamentEntries"
      );

    if (savedEntries) {
      try {
        entries =
          JSON.parse(savedEntries);
      } catch (e) {
        entries = [];
      }
    }


    function saveEntries() {
      sessionStorage.setItem(
        "fwtNewTournamentEntries",
        JSON.stringify(entries)
      );
    }


    function displayPerson(name, nickname) {
      if (nickname) {
        return `${nickname} (${name})`;
      }

      return name;
    }


    function renderEntries() {

      const list =
        document.getElementById(
          "entryList"
        );

      list.innerHTML = "";


      document.getElementById(
        "entryCount"
      ).textContent =
        entries.length;


      document.getElementById(
        "summaryCount"
      ).textContent =
        entries.length;


      if (entries.length === 0) {
        list.innerHTML = `
          <div class="empty">
            아직 등록된 참가자가 없습니다.<br />
            왼쪽에서 참가자를 추가해주세요.
          </div>
        `;

        return;
      }


      entries.forEach(
        (entry, index) => {

          const div =
            document.createElement(
              "div"
            );

          div.className = "entry";


          let title = "";
          let sub = "";


          if (entry.type === "singles") {

            title =
              escapeHtml(
                displayPerson(
                  entry.name,
                  entry.nickname
                )
              );

            sub = "단식 참가자";

          } else {

            title =
              escapeHtml(
                displayPerson(
                  entry.player1.name,
                  entry.player1.nickname
                )
              )
              +
              " / "
              +
              escapeHtml(
                displayPerson(
                  entry.player2.name,
                  entry.player2.nickname
                )
              );

            sub = "복식팀";
          }


          div.innerHTML = `
            <div class="entry-left">
              <div class="entry-number">
                ENTRY ${String(index + 1).padStart(2, "0")}
              </div>

              <div class="entry-name">
                ${title}
              </div>

              <div class="entry-sub">
                ${sub}
              </div>
            </div>

            <div class="entry-actions">
              <button
                class="mini-btn"
                onclick="editEntry(${index})"
              >
                수정
              </button>

              <button
                class="mini-btn delete"
                onclick="deleteEntry(${index})"
              >
                삭제
              </button>
            </div>
          `;


          list.appendChild(div);

        }
      );

    }


    function addEntry() {

      if (!isDoubles) {

        const name =
          document.getElementById(
            "singleName"
          ).value.trim();

        const nickname =
          document.getElementById(
            "singleNickname"
          ).value.trim();


        if (!name && !nickname) {
          alert(
            "이름 또는 닉네임을 입력해주세요."
          );
          return;
        }


        entries.push({
          type: "singles",
          name,
          nickname
        });


        document.getElementById(
          "singleName"
        ).value = "";

        document.getElementById(
          "singleNickname"
        ).value = "";

      } else {

        const player1Name =
          document.getElementById(
            "player1Name"
          ).value.trim();

        const player1Nickname =
          document.getElementById(
            "player1Nickname"
          ).value.trim();

        const player2Name =
          document.getElementById(
            "player2Name"
          ).value.trim();

        const player2Nickname =
          document.getElementById(
            "player2Nickname"
          ).value.trim();


        if (
          (!player1Name &&
           !player1Nickname)
          ||
          (!player2Name &&
           !player2Nickname)
        ) {
          alert(
            "복식팀은 두 명의 선수를 모두 입력해야 합니다."
          );
          return;
        }


        entries.push({
          type: "doubles",

          player1: {
            name: player1Name,
            nickname: player1Nickname
          },

          player2: {
            name: player2Name,
            nickname: player2Nickname
          }
        });


        document.getElementById(
          "player1Name"
        ).value = "";

        document.getElementById(
          "player1Nickname"
        ).value = "";

        document.getElementById(
          "player2Name"
        ).value = "";

        document.getElementById(
          "player2Nickname"
        ).value = "";

      }


      saveEntries();
      renderEntries();

    }


    function editEntry(index) {

      const entry =
        entries[index];


      if (entry.type === "singles") {

        const current =
          displayPerson(
            entry.name,
            entry.nickname
          );

        const value =
          prompt(
            "참가자 표시명을 수정합니다.\n닉네임 또는 이름을 입력하세요.",
            current
          );


        if (value === null) {
          return;
        }


        const edited =
          value.trim();


        if (!edited) {
          return;
        }


        entry.nickname = edited;
        entry.name = "";

      } else {

        const first =
          prompt(
            "선수 1 이름 또는 닉네임",
            displayPerson(
              entry.player1.name,
              entry.player1.nickname
            )
          );

        if (first === null) {
          return;
        }


        const second =
          prompt(
            "선수 2 이름 또는 닉네임",
            displayPerson(
              entry.player2.name,
              entry.player2.nickname
            )
          );

        if (second === null) {
          return;
        }


        entry.player1 = {
          name: "",
          nickname: first.trim()
        };

        entry.player2 = {
          name: "",
          nickname: second.trim()
        };

      }


      saveEntries();
      renderEntries();

    }


    function deleteEntry(index) {

      const ok =
        confirm(
          "이 참가자를 삭제하시겠습니까?"
        );

      if (!ok) {
        return;
      }


      entries.splice(index, 1);

      saveEntries();
      renderEntries();

    }


    function escapeHtml(value) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent = value;

      return div.innerHTML;

    }


    document
      .getElementById(
        "addEntryButton"
      )
      .addEventListener(
        "click",
        addEntry
      );


    document
      .getElementById(
        "nextButton"
      )
      .addEventListener(
        "click",
        function () {

          if (entries.length < 2) {
            alert(
              "참가자를 최소 2명 이상 등록해주세요."
