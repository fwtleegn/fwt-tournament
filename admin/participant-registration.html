<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>참가자 등록 | FWT Tournament</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --navy:#071a31;
      --navy2:#0c294a;
      --blue:#184a79;
      --lime:#c9df45;

      --bg:#f4f6f9;
      --white:#ffffff;

      --text:#172033;
      --muted:#5f6d7e;
      --line:#dfe5eb;

      --green:#178b61;
      --green-soft:#edf8f3;

      --red:#c64b4b;
      --red-soft:#fff2f2;

      --orange:#99631c;
      --orange-soft:#fff7eb;

      --shadow:
        0 12px 35px rgba(20,35,55,.06);
    }

    * {
      box-sizing:border-box;
    }

    html,
    body {
      margin:0;
      min-height:100%;

      background:var(--bg);
      color:var(--text);

      font-family:
        Inter,
        Pretendard,
        "Noto Sans KR",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input {
      font:inherit;
    }

    button {
      cursor:pointer;
    }

    .topbar {
      height:68px;

      padding:0 24px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      color:white;

      background:
        linear-gradient(
          110deg,
          #07182d,
          #0b2848 60%,
          #10375f
        );

      box-shadow:
        0 4px 18px rgba(6,23,43,.14);
    }

    .brand {
      display:flex;
      align-items:center;
      gap:22px;
    }

    .fwt {
      font-size:29px;
      font-weight:950;
      font-style:italic;
      letter-spacing:-3px;
    }

    .fwt span {
      color:var(--lime);
    }

    .top-title {
      font-size:11px;
      font-weight:800;
      letter-spacing:1.8px;

      color:rgba(255,255,255,.72);
    }

    .back-btn {
      min-height:40px;

      padding:0 14px;

      border:
        1px solid rgba(255,255,255,.16);

      border-radius:10px;

      background:
        rgba(255,255,255,.07);

      color:white;

      font-size:12px;
      font-weight:800;
    }

    .container {
      width:
        min(
          980px,
          calc(100% - 34px)
        );

      margin:0 auto;

      padding:34px 0 64px;
    }

    .head {
      display:flex;
      align-items:flex-end;
      justify-content:space-between;

      gap:20px;

      margin-bottom:20px;
    }

    .kicker {
      margin-bottom:7px;

      color:var(--blue);

      font-size:11px;
      font-weight:900;
      letter-spacing:1.8px;
    }

    h1 {
      margin:0;

      color:var(--navy);

      font-size:34px;
      font-weight:900;
      letter-spacing:-1.5px;
    }

    .desc {
      margin:8px 0 0;

      color:var(--muted);

      font-size:13px;
      line-height:1.65;
    }

    .counter {
      flex-shrink:0;

      padding:10px 14px;

      border:1px solid var(--line);
      border-radius:999px;

      background:white;

      color:#526073;

      font-size:12px;
      font-weight:850;
    }

    .counter strong {
      margin-left:4px;

      color:var(--navy);

      font-size:16px;
      font-weight:950;
    }

    /* =================================
       TOURNAMENT INFO
    ================================= */

    .tournament-info {
      display:flex;
      flex-wrap:wrap;
      gap:7px;

      margin-bottom:14px;
    }

    .info-chip {
      padding:8px 11px;

      border:1px solid var(--line);
      border-radius:999px;

      background:white;

      color:#536174;

      font-size:11px;
      font-weight:800;
    }

    .info-chip strong {
      color:var(--navy);
    }

    /* =================================
       CARD
    ================================= */

    .card {
      overflow:hidden;

      border:1px solid var(--line);
      border-radius:18px;

      background:white;

      box-shadow:var(--shadow);
    }

    .card-head {
      padding:18px 20px;

      border-bottom:
        1px solid #e8ecf0;
    }

    .card-title {
      color:var(--navy);

      font-size:17px;
      font-weight:900;
    }

    .card-desc {
      margin-top:5px;

      color:#687587;

      font-size:11px;
      line-height:1.6;
    }

    .form-area {
      padding:20px;
    }

    .grid {
      display:grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap:14px;
    }

    .field.full {
      grid-column:1 / -1;
    }

    .player-block {
      padding:16px;

      border:1px solid #e2e7ec;
      border-radius:13px;

      background:#fafbfc;
    }

    .player-block-title {
      margin-bottom:13px;

      color:var(--navy);

      font-size:14px;
      font-weight:900;
    }

    label {
      display:block;

      margin-bottom:7px;

      color:#38475a;

      font-size:12px;
      font-weight:850;
    }

    input {
      width:100%;
      height:49px;

      padding:0 13px;

      border:1px solid #d7dee5;
      border-radius:10px;

      outline:none;

      background:white;
      color:#263247;

      font-size:14px;
      font-weight:650;
    }

    input:focus {
      border-color:#6587a7;

      box-shadow:
        0 0 0 4px rgba(24,74,121,.06);
    }

    input::placeholder {
      color:#a1aab4;
    }

    .form-note {
      margin-top:11px;

      color:#697688;

      font-size:11px;
      line-height:1.6;
    }

    /* =================================
       ADD BUTTON
    ================================= */

    .add-button {
      width:100%;
      min-height:52px;

      margin-top:15px;

      border:0;
      border-radius:11px;

      background:var(--navy);
      color:white;

      font-size:14px;
      font-weight:900;
    }

    .add-button span {
      color:var(--lime);
      margin-right:5px;
    }

    .add-button:disabled {
      cursor:not-allowed;
      opacity:.55;
    }

    /* =================================
       PARTICIPANTS
    ================================= */

    .list-card {
      margin-top:14px;

      overflow:hidden;

      border:1px solid var(--line);
      border-radius:18px;

      background:white;

      box-shadow:var(--shadow);
    }

    .list-head {
      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:17px 20px;

      border-bottom:
        1px solid #e8ecf0;
    }

    .list-title {
      color:var(--navy);

      font-size:17px;
      font-weight:900;
    }

    .db-status {
      display:flex;
      align-items:center;
      gap:6px;

      color:var(--green);

      font-size:10px;
      font-weight:850;
    }

    .db-dot {
      width:7px;
      height:7px;

      border-radius:50%;

      background:var(--green);
    }

    .entry-list {
      padding:10px;
    }

    .entry {
      display:grid;

      grid-template-columns:
        45px minmax(0,1fr) auto;

      align-items:center;

      gap:11px;

      min-height:70px;

      padding:10px 11px;

      margin-bottom:7px;

      border:1px solid #e2e7ec;
      border-radius:12px;

      background:#fff;
    }

    .entry:last-child {
      margin-bottom:0;
    }

    .entry-number {
      width:38px;
      height:38px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:10px;

      background:#eef2f6;

      color:var(--navy);

      font-size:13px;
      font-weight:950;
    }

    .entry-main {
      min-width:0;
    }

    .entry-name {
      overflow:hidden;

      color:#263247;

      font-size:14px;
      font-weight:900;

      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .entry-sub {
      margin-top:4px;

      color:#687587;

      font-size:10px;
      font-weight:700;
    }

    .entry-actions {
      display:flex;
      gap:6px;
    }

    .entry-btn {
      min-height:36px;

      padding:0 10px;

      border:1px solid #dce2e8;
      border-radius:8px;

      background:white;
      color:#536174;

      font-size:10px;
      font-weight:850;
    }

    .entry-btn.delete {
      border-color:#eed0d0;

      background:var(--red-soft);
      color:var(--red);
    }

    .empty-list {
      padding:35px 15px;

      text-align:center;

      color:#697688;

      font-size:13px;
      line-height:1.7;
    }

    /* =================================
       BOTTOM
    ================================= */

    .bottom {
      display:flex;
      gap:10px;

      margin-top:17px;
    }

    .previous,
    .next {
      height:55px;
      min-height:55px;

      border-radius:11px;

      font-weight:900;
    }

    .previous {
      width:175px;

      border:1px solid #d8dee5;

      background:white;
      color:#526073;
    }

    .next {
      flex:1;

      border:0;

      background:
        linear-gradient(
          115deg,
          var(--navy),
          #123e6c
        );

      color:white;

      font-size:14px;
    }

    .next span {
      margin-left:5px;

      color:var(--lime);
    }

    .previous:disabled,
    .next:disabled {
      cursor:not-allowed;

      opacity:.55;
    }

    /* =================================
       LOADING
    ================================= */

    .loading-overlay {
      display:none;

      position:fixed;
      inset:0;

      z-index:200;

      align-items:center;
      justify-content:center;

      padding:20px;

      background:
        rgba(4,17,31,.62);
    }

    .loading-overlay.show {
      display:flex;
    }

    .loading-box {
      width:min(350px,100%);

      padding:25px;

      border-radius:17px;

      background:white;

      text-align:center;

      box-shadow:
        0 30px 80px rgba(0,0,0,.25);
    }

    .spinner {
      width:38px;
      height:38px;

      margin:0 auto 15px;

      border:4px solid #e6eaee;
      border-top-color:var(--navy);

      border-radius:50%;

      animation:spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform:rotate(360deg);
      }
    }

    .loading-title {
      color:var(--navy);

      font-size:16px;
      font-weight:900;
    }

    .loading-text {
      margin-top:6px;

      color:#657184;

      font-size:12px;
      line-height:1.6;
    }

    /* =================================
       FOOTER
    ================================= */

    .footer {
      display:flex;
      justify-content:space-between;

      margin-top:26px;
      padding-top:17px;

      border-top:1px solid #e2e6eb;

      color:#7c8795;

      font-size:10px;
      letter-spacing:1px;
    }

    .footer strong {
      color:var(--navy);
    }

    .q {
      color:#91a719;
      font-weight:900;
    }

    /* =================================
       MOBILE
    ================================= */

    @media(max-width:700px) {

      .topbar {
        height:64px;

        padding:0 14px;
      }

      .top-title {
        display:none;
      }

      .back-btn {
        min-height:44px;

        padding:0 12px;

        font-size:12px;
      }

      .container {
        width:
          calc(100% - 22px);

        padding:
          24px 0 50px;
      }

      .head {
        display:block;
      }

      .counter {
        display:inline-block;

        margin-top:13px;

        font-size:13px;
      }

      h1 {
        font-size:30px;
      }

      .desc {
        font-size:14px;
      }

      .info-chip {
        font-size:12px;
      }

      .card-title,
      .list-title {
        font-size:19px;
      }

      .card-desc {
        font-size:13px;
      }

      .card-head,
      .form-area {
        padding:
          17px 14px;
      }

      .grid {
        grid-template-columns:1fr;
      }

      .field.full {
        grid-column:auto;
      }

      .player-block {
        padding:14px 12px;
      }

      .player-block-title {
        font-size:16px;
      }

      label {
        font-size:13px;
      }

      input {
        height:52px;
        min-height:52px;

        font-size:15px;
      }

      .form-note {
        font-size:12px;
      }

      /*
        핵심 액션 버튼 모바일 고정
      */

      .add-button {
        width:100%;

        height:56px;
        min-height:56px;

        flex:none;

        font-size:15px;
      }

      .entry {
        grid-template-columns:
          42px minmax(0,1fr);

        gap:9px;

        min-height:78px;

        padding:10px;
      }

      .entry-number {
        width:40px;
        height:40px;

        font-size:14px;
      }

      .entry-name {
        font-size:15px;
      }

      .entry-sub {
        font-size:12px;
      }

      .entry-actions {
        grid-column:
          1 / -1;

        display:grid;

        grid-template-columns:
          1fr 1fr;

        gap:7px;
      }

      .entry-btn {
        width:100%;

        height:44px;
        min-height:44px;

        font-size:12px;
      }

      /*
        모바일 하단:
        얇아지지 않게 flex:none 강제
      */

      .bottom {
        flex-direction:column-reverse;

        gap:9px;
      }

      .previous,
      .next {
        width:100%;

        height:56px;
        min-height:56px;

        flex:none;

        font-size:15px;
      }

    }
  </style>
</head>


<body>

<header class="topbar">

  <div class="brand">

    <div class="fwt">
      FW<span>T</span>
    </div>

    <div class="top-title">
      PARTICIPANT REGISTRATION
    </div>

  </div>

  <button
    class="back-btn"
    onclick="location.href='./create-tournament.html'"
  >
    ← 대회 설정
  </button>

</header>


<main class="container">

  <div class="head">

    <div>

      <div class="kicker">
        PARTICIPANTS
      </div>

      <h1>
        참가자 등록
      </h1>

      <p class="desc" id="pageDescription">
        대회에 참가할 선수를 등록합니다.
      </p>

    </div>


    <div class="counter">
      등록
      <strong id="entryCount">0</strong>
    </div>

  </div>


  <div
    class="tournament-info"
    id="tournamentInfo"
  ></div>


  <!-- ===============================
       참가자 입력
  ================================ -->

  <section class="card">

    <div class="card-head">

      <div class="card-title">
        참가자 추가
      </div>

      <div
        class="card-desc"
        id="registrationGuide"
      ></div>

    </div>


    <div class="form-area">

      <!-- 단식 -->

      <div
        id="singlesForm"
      >

        <div class="grid">

          <div class="field">

            <label>
              이름
            </label>

            <input
              id="singleName"
              type="text"
              maxlength="50"
              placeholder="예: 이규남"
            >

          </div>


          <div class="field">

            <label>
              닉네임
            </label>

            <input
              id="singleNickname"
              type="text"
              maxlength="50"
              placeholder="예: Q"
            >

          </div>

        </div>

        <div class="form-note">
          이름 또는 닉네임 중 하나 이상 입력하면 됩니다.
        </div>

      </div>


      <!-- 복식 -->

      <div
        id="doublesForm"
        style="display:none;"
      >

        <div class="grid">

          <div class="player-block">

            <div class="player-block-title">
              선수 1
            </div>

            <div class="grid">

              <div class="field">

                <label>
                  이름
                </label>

                <input
                  id="player1Name"
                  type="text"
                  maxlength="50"
                  placeholder="이름"
                >

              </div>

              <div class="field">

                <label>
                  닉네임
                </label>

                <input
                  id="player1Nickname"
                  type="text"
                  maxlength="50"
                  placeholder="닉네임"
                >

              </div>

            </div>

          </div>


          <div class="player-block">

            <div class="player-block-title">
              선수 2
            </div>

            <div class="grid">

              <div class="field">

                <label>
                  이름
                </label>

                <input
                  id="player2Name"
                  type="text"
                  maxlength="50"
                  placeholder="이름"
                >

              </div>

              <div class="field">

                <label>
                  닉네임
                </label>

                <input
                  id="player2Nickname"
                  type="text"
                  maxlength="50"
                  placeholder="닉네임"
                >

              </div>

            </div>

          </div>

        </div>

        <div class="form-note">
          각 선수마다 이름 또는 닉네임 중 하나 이상 입력해야 합니다.
        </div>

      </div>


      <button
        class="add-button"
        id="addEntryButton"
        type="button"
      >
        <span>＋</span>
        참가자 등록
      </button>

    </div>

  </section>


  <!-- ===============================
       참가자 목록
  ================================ -->

  <section class="list-card">

    <div class="list-head">

      <div class="list-title">
        등록된 참가자
      </div>


      <div class="db-status">

        <div class="db-dot"></div>

        DB 저장

      </div>

    </div>


    <div
      class="entry-list"
      id="entryList"
    ></div>

  </section>


  <!-- ===============================
       NEXT
  ================================ -->

  <div class="bottom">

    <button
      class="previous"
      id="previousButton"
      type="button"
      onclick="location.href='./create-tournament.html'"
    >
      이전 단계
    </button>


    <button
      class="next"
      id="nextButton"
      type="button"
    >
      참가자 등록 완료 · 다음 단계
      <span>→</span>
    </button>

  </div>


  <footer class="footer">

    <div>
      <strong>FWT</strong>
      · FRIENDS WITH TENNIS
    </div>

    <div>
      CREATED BY
      <span class="q">Q</span>
    </div>

  </footer>

</main>


<!-- ===============================
     LOADING
================================ -->

<div
  class="loading-overlay"
  id="loadingOverlay"
>

  <div class="loading-box">

    <div class="spinner"></div>

    <div
      class="loading-title"
      id="loadingTitle"
    >
      참가자를 저장하고 있습니다
    </div>

    <div
      class="loading-text"
      id="loadingText"
    >
      FWT 데이터베이스와 동기화 중입니다.
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://opwuyqerisocqobbbisg.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_Eo_zfONeGLs9ATCVg2Fk_g_y_IAJFV-";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const tournament =
  JSON.parse(
    sessionStorage.getItem(
      "fwtNewTournament"
    ) || "null"
  );


if (
  !tournament ||
  !tournament.tournamentId ||
  !tournament.divisionId
) {

  alert(
    "대회 데이터가 없습니다.\n새 대회를 먼저 생성해주세요."
  );

  location.href =
    "./create-tournament.html";

}


let currentSession =
  null;


let entries = [];


let busy =
  false;


/* =====================================
   HELPERS
===================================== */

function cleanText(value) {

  const text =
    String(
      value ?? ""
    ).trim();


  return text || null;

}


function hasPlayerName(
  name,
  nickname
) {

  return Boolean(
    cleanText(name)
    ||
    cleanText(nickname)
  );

}


function playerDisplayName(
  player
) {

  if (!player) {

    return "이름 없음";

  }


  return (
    player.nickname ||
    player.name ||
    "이름 없음"
  );

}


function fullPlayerDisplay(
  player
) {

  if (!player) {

    return "이름 없음";

  }


  if (
    player.nickname &&
    player.name
  ) {

    return (
      `${player.nickname} (${player.name})`
    );

  }


  return (
    player.nickname ||
    player.name ||
    "이름 없음"
  );

}


function entryDisplayName(
  entry
) {

  if (
    entry.type ===
    "singles"
  ) {

    return fullPlayerDisplay(
      entry
    );

  }


  return (
    `${fullPlayerDisplay(
      entry.player1
    )} / ${fullPlayerDisplay(
      entry.player2
    )}`
  );

}


function entryShortName(
  entry
) {

  if (
    entry.type ===
    "singles"
  ) {

    return playerDisplayName(
      entry
    );

  }


  return (
    `${playerDisplayName(
      entry.player1
    )} / ${playerDisplayName(
      entry.player2
    )}`
  );

}


function escapeHtml(value) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value ?? "";

  return div.innerHTML;

}


/* =====================================
   AUTH
===================================== */

async function checkLogin() {

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getSession();


  if (
    error ||
    !data.session
  ) {

    location.href = "./";

  }


  currentSession =

/* =====================================
   LOAD ENTRIES FROM DATABASE
===================================== */

async function loadEntriesFromDatabase() {

  const divisionId =
    tournament.divisionId;


  const {
    data:entryRows,
    error:entryError
  } =
    await supabaseClient
      .from("entries")
      .select(
        "id,display_name,seed,status,sort_order"
      )
      .eq(
        "division_id",
        divisionId
      )
      .order(
        "sort_order",
        {
          ascending:true
        }
      );


  if (entryError) {

    throw new Error(
      "참가자 목록 조회 실패: "
      +
      entryError.message
    );

  }


  if (
    !entryRows ||
    entryRows.length === 0
  ) {

    entries = [];

    saveEntriesToSession();

    renderEntries();

    return;

  }


  const entryIds =
    entryRows.map(
      row =>
        row.id
    );


  const {
    data:memberRows,
    error:memberError
  } =
    await supabaseClient
      .from("entry_members")
      .select(
        "id,entry_id,player_id,member_order"
      )
      .in(
        "entry_id",
        entryIds
      );


  if (memberError) {

    throw new Error(
      "참가자 연결정보 조회 실패: "
      +
      memberError.message
    );

  }


  const playerIds =
    [
      ...new Set(
        (memberRows || [])
          .map(
            row =>
              row.player_id
          )
      )
    ];


  let playerRows = [];


  if (
    playerIds.length > 0
  ) {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("players")
        .select(
          "id,name,nickname"
        )
        .in(
          "id",
          playerIds
        );


    if (error) {

      throw new Error(
        "선수 정보 조회 실패: "
        +
        error.message
      );

    }


    playerRows =
      data || [];

  }


  const playerMap =
    new Map();


  playerRows.forEach(
    player => {

      playerMap.set(
        player.id,
        player
      );

    }
  );


  const memberMap =
    new Map();


  (memberRows || [])
    .forEach(
      member => {

        if (
          !memberMap.has(
            member.entry_id
          )
        ) {

          memberMap.set(
            member.entry_id,
            []
          );

        }


        memberMap
          .get(
            member.entry_id
          )
          .push(
            member
          );

      }
    );


  entries =
    entryRows.map(
      entryRow => {

        const members =
          (
            memberMap.get(
              entryRow.id
            ) || []
          )
          .sort(
            (a,b) =>
              a.member_order -
              b.member_order
          );


        if (
          tournament.matchType ===
          "doubles"
        ) {

          const member1 =
            members.find(
              member =>
                member.member_order === 1
            );


          const member2 =
            members.find(
              member =>
                member.member_order === 2
            );


          const player1 =
            member1
              ? playerMap.get(
                  member1.player_id
                )
              : null;


          const player2 =
            member2
              ? playerMap.get(
                  member2.player_id
                )
              : null;


          return {

            type:"doubles",

            dbEntryId:
              entryRow.id,

            sortOrder:
              entryRow.sort_order,

            player1: {

              dbPlayerId:
                player1?.id || null,

              name:
                player1?.name || "",

              nickname:
                player1?.nickname || ""

            },

            player2: {

              dbPlayerId:
                player2?.id || null,

              name:
                player2?.name || "",

              nickname:
                player2?.nickname || ""

            }

          };

        }


        const member =
          members[0];


        const player =
          member
            ? playerMap.get(
                member.player_id
              )
            : null;


        return {

          type:"singles",

          dbEntryId:
            entryRow.id,

          dbPlayerId:
            player?.id || null,

          sortOrder:
            entryRow.sort_order,

          name:
            player?.name || "",

          nickname:
            player?.nickname || ""

        };

      }
    );


  saveEntriesToSession();

  renderEntries();

}

async function createPlayer(

  nickname
) {

  const {

      )
    );

  }


  return data;

}

/* =====================================

===================================== */

async function createSinglesEntry() {

  const name =
    cleanText(
      document.getElementById(
        "singleName"
      ).value
    );


  const nickname =
    cleanText(
      document.getElementById(
        "singleNickname"
      ).value
    );


  if (
    !hasPlayerName(
      name,
      nickname
    )
  ) {

    alert(
      "이름 또는 닉네임 중 하나 이상 입력해주세요."
    );

    document.getElementById(
      "singleName"
    ).focus();

    return;

  }


  let createdPlayer =
    null;


  let createdEntry =
    null;


  try {

    setBusy(
      true,
      "참가자 등록 중",
      "선수 정보를 FWT 데이터베이스에 저장하고 있습니다."
    );


    /*
      1. PLAYER
    */

    createdPlayer =
      await createPlayer(
        name,
        nickname
      );


    /*
      2. ENTRY
    */

    const sortOrder =
      entries.length === 0
        ? 0
        : Math.max(
            ...entries.map(
              entry =>
                Number(
                  entry.sortOrder || 0
                )
            )
          ) + 1;


    const displayName =
      nickname ||
      name;


    const {
      data:entryRow,
      error:entryError
    } =
      await supabaseClient
        .from("entries")
        .insert({

          division_id:
            tournament.divisionId,

          display_name:
            displayName,

          status:
            "active",

          sort_order:
            sortOrder

        })
        .select(
          "id,sort_order"
        )
        .single();


    if (
      entryError ||
      !entryRow
    ) {

      throw new Error(
        "출전 정보 저장 실패: "
        +
        (
          entryError?.message ||
          "알 수 없는 오류"
        )
      );

    }


    createdEntry =
      entryRow;


    /*
      3. ENTRY MEMBER
    */

    const {
      error:memberError
    } =
      await supabaseClient
        .from("entry_members")
        .insert({

          entry_id:
            createdEntry.id,

          player_id:
            createdPlayer.id,

          member_order:
            1

        });


    if (
      memberError
    ) {

      throw new Error(
        "선수 연결정보 저장 실패: "
        +
        memberError.message
      );

    }


    entries.push({

      type:"singles",

      dbEntryId:
        createdEntry.id,

      dbPlayerId:
        createdPlayer.id,

      sortOrder:
        createdEntry.sort_order,

      name:
        createdPlayer.name || "",

      nickname:
        createdPlayer.nickname || ""

    });


    saveEntriesToSession();


    document.getElementById(
      "singleName"
    ).value = "";


    document.getElementById(
      "singleNickname"
    ).value = "";


    setBusy(false);


    renderEntries();


    document.getElementById(
      "singleName"
    ).focus();


  } catch(error) {

    /*
      중간 실패 시 생성 데이터 정리
    */

    if (
      createdEntry?.id
    ) {

      await cleanupEntry(
        createdEntry.id
      );

    }


    if (
      createdPlayer?.id
    ) {

      await cleanupPlayer(
        createdPlayer.id
      );

    }


    setBusy(false);


    alert(
      "참가자를 등록하지 못했습니다.\n\n"
      +
      (
        error?.message ||
        "알 수 없는 오류가 발생했습니다."
      )
    );

  }

}

      ) || "";


    entry.player1.nickname =
      cleanText(
        p1Nickname
      ) || "";


    entry.player2.name =
      cleanText(
        p2Name
      ) || "";


    entry.player2.nickname =
      cleanText(
        p2Nickname
      ) || "";


    saveEntriesToSession();


    setBusy(false);

    renderEntries();


  } catch(error) {

    setBusy(false);


    alert(
      "수정하지 못했습니다.\n\n"
      +
      error.message
    );

  }

}


/* =====================================
   EDIT ENTRY
===================================== */

async function editEntry(
  index
) {

  if (busy) {

    return;

  }


  if (
    entries[index].type ===
    "doubles"
  ) {

    await editDoublesEntry(
      index
    );

  } else {

    await editSinglesEntry(
      index
    );

  }

}


/* =====================================
   DELETE ENTRY
===================================== */

async function deleteEntry(
  index
) {

  if (busy) {

    return;

  }


  const entry =
    entries[index];


  const name =
    entryShortName(
      entry
    );


  const ok =
    confirm(
      `${name}\n\n이 참가자를 삭제할까요?`
    );


  if (!ok) {

    return;

  }


  const playerIds =
    entry.type ===
    "doubles"
      ? [
          entry.player1.dbPlayerId,
          entry.player2.dbPlayerId
        ]
      : [
          entry.dbPlayerId
        ];


  try {

    setBusy(
      true,
      "참가자 삭제 중",
      "데이터베이스에서 참가자 정보를 삭제하고 있습니다."
    );


    /*
      entry를 먼저 삭제하면
      entry_members는 FK cascade로 제거됨.
    */

    const {
      error:entryError
    } =
      await supabaseClient
        .from("entries")
        .delete()
        .eq(
          "id",
          entry.dbEntryId
        );


    if (
      entryError
    ) {

      throw new Error(
        entryError.message
      );

    }


    /*
      이 앱에서는 현재 참가 등록 때
      player도 새로 생성하므로
      연결 해제 후 player도 정리한다.
    */

    for (
      const playerId
      of playerIds
    ) {

      if (!playerId) {
        continue;
      }


      const {
        error:playerError
      } =
        await supabaseClient
          .from("players")
          .delete()
          .eq(
            "id",
            playerId
          );


      if (
        playerError
      ) {

        console.warn(
          "player cleanup warning",
          playerError
        );

      }

    }


    entries.splice(
      index,
      1
    );


    saveEntriesToSession();


    setBusy(false);

    renderEntries();


  } catch(error) {

    setBusy(false);


    alert(
      "참가자를 삭제하지 못했습니다.\n\n"
      +
      error.message
    );

  }

}


/* =====================================
   RENDER ENTRIES
===================================== */

function renderEntries() {

  const box =
    document.getElementById(
      "entryList"
    );


  document.getElementById(
    "entryCount"
  ).textContent =
    entries.length;


  box.innerHTML = "";


  if (
    entries.length === 0
  ) {

    box.innerHTML = `

      <div class="empty-list">

        아직 등록된 참가자가 없습니다.<br>
        위에서 참가자를 추가해주세요.

      </div>

    `;

    return;

  }


  entries.forEach(
    (
      entry,
      index
    ) => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "entry";


      let subText =
        tournament.matchType ===
        "doubles"
          ? "복식 팀"
          : "단식 참가자";


      if (
        entry.dbEntryId
      ) {

        subText +=
          " · DB 저장됨";

      }


      row.innerHTML = `

        <div class="entry-number">
          ${index + 1}
        </div>


        <div class="entry-main">

          <div class="entry-name">

            ${escapeHtml(
              entryDisplayName(
                entry
              )
            )}

          </div>

          <div class="entry-sub">
            ${escapeHtml(
              subText
            )}
          </div>

        </div>


        <div class="entry-actions">

          <button
            class="entry-btn edit"
            type="button"
          >
            수정
          </button>

          <button
            class="entry-btn delete"
            type="button"
          >
            삭제
          </button>

        </div>

      `;


      row
        .querySelector(
          ".edit"
        )
        .addEventListener(
          "click",
          function() {

            editEntry(index);

          }
        );


      row
        .querySelector(
          ".delete"
        )
        .addEventListener(
          "click",
          function() {

            deleteEntry(index);

          }
        );


      box.appendChild(
        row
      );

    }
  );

}


/* =====================================
   NEXT STEP
===================================== */

function goNext() {

  if (busy) {

    return;

  }


  if (
    entries.length < 2
  ) {

    alert(
      "참가자를 최소 2명 이상 등록해주세요."
    );

    return;

  }


  /*
    기존 다음 페이지들과 호환
  */

  saveEntriesToSession();


  /*
    참가자 구성이 바뀌었으므로
    이후 단계 데이터 초기화
  */

  sessionStorage.removeItem(
    "fwtGroupAssignments"
  );

  sessionStorage.removeItem(
    "fwtGroupData"
  );

  sessionStorage.removeItem(
    "fwtGroupMatches"
  );

  sessionStorage.removeItem(
    "fwtMatchControlState"
  );

  sessionStorage.removeItem(
    "fwtStandingsData"
  );

  sessionStorage.removeItem(
    "fwtKnockoutQualifiers"
  );

  sessionStorage.removeItem(
    "fwtKnockoutBracket"
  );


  if (
    tournament.format ===
    "group_knockout"
  ) {

    location.href =
      "./group-setup.html";

  } else {

    location.href =
      "./knockout-setup.html";

  }

}


/* =====================================
   KEYBOARD
===================================== */

function setupEnterKeys() {

  if (
    tournament.matchType ===
    "doubles"
  ) {

    document.getElementById(
      "player2Nickname"
    ).addEventListener(
      "keydown",
      function(event) {

        if (
          event.key ===
          "Enter"
        ) {

          event.preventDefault();

          addEntry();

        }

      }
    );

  } else {

    document.getElementById(
      "singleNickname"
    ).addEventListener(
      "keydown",
      function(event) {

        if (
          event.key ===
          "Enter"
        ) {

          event.preventDefault();

          addEntry();

        }

      }
    );

  }

}


/* =====================================
   EVENTS
===================================== */

document.getElementById(
  "addEntryButton"
).addEventListener(
  "click",
  addEntry
);


document.getElementById(
  "nextButton"
).addEventListener(
  "click",
  goNext
);


/* =====================================
   START
===================================== */

async function start() {

  const loggedIn =
    await checkLogin();


  if (!loggedIn) {

    return;

  }


  renderTournamentInfo();

  setupEnterKeys();


  try {

    setBusy(
      true,
      "참가자 목록 확인 중",
      "데이터베이스에 저장된 참가자를 불러오고 있습니다."
    );


    await loadEntriesFromDatabase();


    setBusy(false);


  } catch(error) {

    setBusy(false);


    console.error(error);


    alert(
      "참가자 정보를 불러오지 못했습니다.\n\n"
      +
      error.message
    );

  }

}


start();

</script>
