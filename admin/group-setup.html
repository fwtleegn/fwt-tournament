<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>조편성 | FWT Tournament</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --navy:#071a31;
      --navy2:#0c294a;
      --blue:#184a79;
      --lime:#c9df45;

      --bg:#f4f6f9;
      --white:#ffffff;
      --text:#172033;
      --muted:#5f6d7e;
      --line:#dfe5eb;

      --green:#178b61;
      --green-soft:#edf8f3;

      --orange:#99631c;
      --orange-soft:#fff7eb;

      --red:#c64b4b;
      --red-soft:#fff2f2;

      --shadow:
        0 12px 35px rgba(20,35,55,.06);
    }

    * {
      box-sizing:border-box;
    }

    html,
    body {
      margin:0;
      min-height:100%;

      background:var(--bg);
      color:var(--text);

      font-family:
        Inter,
        Pretendard,
        "Noto Sans KR",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    select {
      font:inherit;
    }

    button {
      cursor:pointer;
    }

    .topbar {
      height:68px;

      padding:0 24px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      color:white;

      background:
        linear-gradient(
          110deg,
          #07182d,
          #0b2848 60%,
          #10375f
        );

      box-shadow:
        0 4px 18px rgba(6,23,43,.14);
    }

    .brand {
      display:flex;
      align-items:center;
      gap:22px;
    }

    .fwt {
      font-size:29px;
      font-weight:950;
      font-style:italic;
      letter-spacing:-3px;
    }

    .fwt span {
      color:var(--lime);
    }

    .top-title {
      font-size:11px;
      font-weight:800;
      letter-spacing:1.8px;
      color:rgba(255,255,255,.72);
    }

    .back-btn {
      min-height:40px;

      padding:0 14px;

      border:
        1px solid rgba(255,255,255,.16);

      border-radius:10px;

      background:
        rgba(255,255,255,.07);

      color:white;

      font-size:12px;
      font-weight:800;
    }

    .container {
      width:
        min(
          1120px,
          calc(100% - 34px)
        );

      margin:0 auto;

      padding:34px 0 64px;
    }

    .head {
      display:flex;
      align-items:flex-end;
      justify-content:space-between;

      gap:20px;

      margin-bottom:18px;
    }

    .kicker {
      margin-bottom:7px;

      color:var(--blue);

      font-size:11px;
      font-weight:900;
      letter-spacing:1.8px;
    }

    h1 {
      margin:0;

      color:var(--navy);

      font-size:34px;
      font-weight:900;
      letter-spacing:-1.5px;
    }

    .desc {
      margin:8px 0 0;

      color:var(--muted);

      font-size:13px;
      line-height:1.65;
    }

    .summary {
      display:flex;
      flex-wrap:wrap;
      gap:7px;
    }

    .summary-chip {
      padding:9px 12px;

      border:1px solid var(--line);
      border-radius:999px;

      background:white;

      color:#526073;

      font-size:11px;
      font-weight:850;
    }

    .summary-chip strong {
      margin-left:3px;

      color:var(--navy);

      font-size:14px;
    }

    /* =================================
       CONTROL
    ================================= */

    .control-card {
      margin-bottom:14px;

      padding:15px;

      border:1px solid var(--line);
      border-radius:15px;

      background:white;

      box-shadow:var(--shadow);
    }

    .control-title {
      margin-bottom:10px;

      color:var(--navy);

      font-size:15px;
      font-weight:900;
    }

    .control-desc {
      margin-bottom:13px;

      color:#657184;

      font-size:12px;
      line-height:1.65;
    }

    .control-buttons {
      display:grid;

      grid-template-columns:
        repeat(3,minmax(0,1fr));

      gap:8px;
    }

    .control-btn {
      min-height:46px;

      border:1px solid #d9e0e6;
      border-radius:10px;

      background:white;
      color:#526073;

      font-size:12px;
      font-weight:850;
    }

    .control-btn.primary {
      border-color:var(--navy);

      background:var(--navy);
      color:white;
    }

    .control-btn.reset {
      border-color:#ecd3d3;

      background:var(--red-soft);
      color:var(--red);
    }

    /* =================================
       PARTICIPANTS
    ================================= */

    .participant-card {
      overflow:hidden;

      margin-bottom:14px;

      border:1px solid var(--line);
      border-radius:17px;

      background:white;

      box-shadow:var(--shadow);
    }

    .card-head {
      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:16px 18px;

      border-bottom:1px solid #e8ecf0;
    }

    .card-title {
      color:var(--navy);

      font-size:17px;
      font-weight:900;
    }

    .db-status {
      display:flex;
      align-items:center;
      gap:6px;

      color:var(--green);

      font-size:10px;
      font-weight:850;
    }

    .db-dot {
      width:7px;
      height:7px;

      border-radius:50%;

      background:var(--green);
    }

    .participant-list {
      padding:9px;
    }

    .participant-row {
      display:grid;

      grid-template-columns:
        46px minmax(0,1fr) 150px;

      align-items:center;

      gap:10px;

      min-height:64px;

      padding:9px 10px;

      border-bottom:1px solid #e9edf1;
    }

    .participant-row:last-child {
      border-bottom:0;
    }

    .participant-number {
      width:39px;
      height:39px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:10px;

      background:#eef2f6;
      color:var(--navy);

      font-size:13px;
      font-weight:950;
    }

    .participant-main {
      min-width:0;
    }

    .participant-name {
      overflow:hidden;

      color:#263247;

      font-size:14px;
      font-weight:900;

      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .participant-sub {
      margin-top:3px;

      color:#687587;

      font-size:10px;
      font-weight:700;
    }

    .group-select {
      width:100%;
      height:43px;

      padding:0 10px;

      border:1px solid #d6dde4;
      border-radius:9px;

      outline:none;

      background:white;
      color:#263247;

      font-size:12px;
      font-weight:850;
    }

    .group-select:focus {
      border-color:#6485a4;

      box-shadow:
        0 0 0 3px rgba(24,74,121,.06);
    }

    /* =================================
       GROUP PREVIEW
    ================================= */

    .group-preview-title {
      display:flex;
      align-items:center;
      justify-content:space-between;

      margin:20px 0 10px;
    }

    .group-preview-title-main {
      color:var(--navy);

      font-size:18px;
      font-weight:900;
    }

    .group-preview-title-sub {
      color:#667386;

      font-size:11px;
      font-weight:750;
    }

    .groups {
      display:grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(220px,1fr)
        );

      gap:10px;
    }

    .group-card {
      overflow:hidden;

      border:1px solid var(--line);
      border-radius:14px;

      background:white;

      box-shadow:var(--shadow);
    }

    .group-head {
      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:13px 14px;

      border-bottom:1px solid #e7ebef;

      background:#fafbfc;
    }

    .group-name {
      color:var(--navy);

      font-size:16px;
      font-weight:950;
    }

    .group-count {
      min-width:29px;
      height:29px;

      padding:0 8px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:999px;

      background:#eef2f5;
      color:var(--navy);

      font-size:11px;
      font-weight:900;
    }

    .group-members {
      padding:9px;
    }

    .member {
      padding:10px 11px;

      margin-bottom:6px;

      border:1px solid #e4e8ec;
      border-radius:9px;

      color:#29364a;

      font-size:13px;
      font-weight:850;
    }

    .member:last-child {
      margin-bottom:0;
    }

    .empty-group {
      padding:24px 10px;

      text-align:center;

      color:#7a8593;

      font-size:12px;
    }

    /* =================================
       WARNING
    ================================= */

    .warning {
      display:none;

      margin-top:13px;

      padding:13px 14px;

      border:1px solid #ecd7b9;
      border-radius:11px;

      background:var(--orange-soft);
      color:#83561e;

      font-size:12px;
      font-weight:750;
      line-height:1.6;
    }

    .warning.show {
      display:block;
    }

    /* =================================
       BOTTOM
    ================================= */

    .bottom {
      display:flex;
      gap:10px;

      margin-top:18px;
    }

    .previous,
    .next {
      height:55px;
      min-height:55px;

      border-radius:11px;

      font-weight:900;
    }

    .previous {
      width:180px;

      border:1px solid #d8dee5;

      background:white;
      color:#526073;
    }

    .next {
      flex:1;

      border:0;

      background:
        linear-gradient(
          115deg,
          var(--navy),
          #123e6c
        );

      color:white;

      font-size:14px;
    }

    .next span {
      margin-left:5px;

      color:var(--lime);
    }

    .previous:disabled,
    .next:disabled,
    .control-btn:disabled {
      cursor:not-allowed;
      opacity:.55;
    }

    /* =================================
       LOADING
    ================================= */

    .loading-overlay {
      display:none;

      position:fixed;
      inset:0;

      z-index:200;

      align-items:center;
      justify-content:center;

      padding:20px;

      background:
        rgba(4,17,31,.62);
    }

    .loading-overlay.show {
      display:flex;
    }

    .loading-box {
      width:min(350px,100%);

      padding:25px;

      border-radius:17px;

      background:white;

      text-align:center;

      box-shadow:
        0 30px 80px rgba(0,0,0,.25);
    }

    .spinner {
      width:38px;
      height:38px;

      margin:0 auto 15px;

      border:4px solid #e6eaee;
      border-top-color:var(--navy);

      border-radius:50%;

      animation:spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform:rotate(360deg);
      }
    }

    .loading-title {
      color:var(--navy);

      font-size:16px;
      font-weight:900;
    }

    .loading-text {
      margin-top:6px;

      color:#657184;

      font-size:12px;
      line-height:1.6;
    }

    /* =================================
       FOOTER
    ================================= */

    .footer {
      display:flex;
      justify-content:space-between;

      margin-top:26px;
      padding-top:17px;

      border-top:1px solid #e2e6eb;

      color:#7c8795;

      font-size:10px;
      letter-spacing:1px;
    }

    .footer strong {
      color:var(--navy);
    }

    .q {
      color:#91a719;
      font-weight:900;
    }

    /* =================================
       MOBILE
    ================================= */

    @media(max-width:700px) {

      .topbar {
        height:64px;

        padding:0 14px;
      }

      .top-title {
        display:none;
      }

      .back-btn {
        min-height:44px;

        padding:0 12px;

        font-size:12px;
      }

      .container {
        width:
          calc(100% - 22px);

        padding:
          24px 0 50px;
      }

      .head {
        display:block;
      }

      .summary {
        margin-top:13px;
      }

      h1 {
        font-size:30px;
      }

      .desc {
        font-size:14px;
      }

      .summary-chip {
        font-size:12px;
      }

      .control-card {
        padding:14px;
      }

      .control-title {
        font-size:17px;
      }

      .control-desc {
        font-size:13px;
      }

      /*
        모바일 조편성 버튼
        절대 얇아지지 않도록 고정
      */

      .control-buttons {
        grid-template-columns:1fr;
      }

      .control-btn {
        width:100%;

        height:54px;
        min-height:54px;

        flex:none;

        font-size:14px;
      }

      .card-title {
        font-size:19px;
      }

      .participant-row {
        grid-template-columns:
          43px minmax(0,1fr);

        gap:9px;

        min-height:78px;

        padding:10px;
      }

      .participant-number {
        width:40px;
        height:40px;

        font-size:14px;
      }

      .participant-name {
        font-size:15px;
      }

      .participant-sub {
        font-size:12px;
      }

      .group-select {
        grid-column:
          1 / -1;

        width:100%;

        height:50px;
        min-height:50px;

        font-size:14px;
      }

      .group-preview-title-main {
        font-size:19px;
      }

      .group-preview-title-sub {
        font-size:12px;
      }

      .groups {
        grid-template-columns:
          repeat(
            2,
            minmax(0,1fr)
          );

        gap:7px;
      }

      .group-head {
        padding:11px;
      }

      .group-name {
        font-size:16px;
      }

      .member {
        padding:10px 8px;

        font-size:13px;
      }

      /*
        모바일 하단 버튼
      */

      .bottom {
        flex-direction:column-reverse;

        gap:9px;
      }

      .previous,
      .next {
        width:100%;

        height:56px;
        min-height:56px;

        flex:none;

        font-size:15px;
      }

    }

    @media(max-width:390px) {

      .groups {
        grid-template-columns:1fr;
      }

    }
  </style>
</head>


<body>

<header class="topbar">

  <div class="brand">

    <div class="fwt">
      FW<span>T</span>
    </div>

    <div class="top-title">
      GROUP SETUP
    </div>

  </div>

  <button
    class="back-btn"
    onclick="location.href='./participant-registration.html'"
  >
    ← 참가자
  </button>

</header>


<main class="container">

  <div class="head">

    <div>

      <div class="kicker">
        GROUP SETUP
      </div>

      <h1>
        조편성
      </h1>

      <p class="desc">
        시드 참가자를 먼저 수동으로 배치한 뒤 나머지를 자동 배정할 수 있습니다.
      </p>

    </div>


    <div class="summary">

      <div class="summary-chip">
        참가
        <strong id="entryCount">0</strong>
      </div>

      <div class="summary-chip">
        조
        <strong id="groupCount">0</strong>
      </div>

      <div class="summary-chip">
        미배정
        <strong id="unassignedCount">0</strong>
      </div>

    </div>

  </div>


  <!-- 조편성 도구 -->

  <section class="control-card">

    <div class="control-title">
      조편성 도구
    </div>

    <div class="control-desc">
      특정 참가자를 원하는 조에 먼저 배치할 수 있습니다.
      이후 나머지만 자동으로 균등 배정할 수 있습니다.
    </div>


    <div class="control-buttons">

      <button
        class="control-btn primary"
        id="autoRemainingButton"
        type="button"
      >
        나머지 자동 배정
      </button>


      <button
        class="control-btn"
        id="randomAllButton"
        type="button"
      >
        전체 랜덤 배정
      </button>


      <button
        class="control-btn reset"
        id="resetButton"
        type="button"
      >
        전체 초기화
      </button>

    </div>

  </section>


  <!-- 참가자별 조 선택 -->

  <section class="participant-card">

    <div class="card-head">

      <div class="card-title">
        참가자 배정
      </div>

      <div class="db-status">

        <div class="db-dot"></div>

        DB 연결

      </div>

    </div>


    <div
      class="participant-list"
      id="participantList"
    ></div>

  </section>


  <!-- 조 미리보기 -->

  <div class="group-preview-title">

    <div class="group-preview-title-main">
      조별 현황
    </div>

    <div class="group-preview-title-sub">
      실시간 반영
    </div>

  </div>


  <section
    class="groups"
    id="groups"
  ></section>


  <div
    class="warning"
    id="warning"
  ></div>


  <div class="bottom">

    <button
      class="previous"
      id="previousButton"
      type="button"
      onclick="location.href='./participant-registration.html'"
    >
      이전 단계
    </button>


    <button
      class="next"
      id="confirmButton"
      type="button"
    >
      조편성 확정 · 대진 생성
      <span>→</span>
    </button>

  </div>


  <footer class="footer">

    <div>
      <strong>FWT</strong>
      · FRIENDS WITH TENNIS
    </div>

    <div>
      CREATED BY
      <span class="q">Q</span>
    </div>

  </footer>

</main>


<!-- 로딩 -->

<div
  class="loading-overlay"
  id="loadingOverlay"
>

  <div class="loading-box">

    <div class="spinner"></div>

    <div
      class="loading-title"
      id="loadingTitle"
    >
      조편성을 저장하고 있습니다
    </div>

    <div
      class="loading-text"
      id="loadingText"
    >
      FWT 데이터베이스에 저장 중입니다.
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://opwuyqerisocqobbbisg.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_Eo_zfONeGLs9ATCVg2Fk_g_y_IAJFV-";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const tournament =
  JSON.parse(
    sessionStorage.getItem(
      "fwtNewTournament"
    ) || "null"
  );


const entries =
  JSON.parse(
    sessionStorage.getItem(
      "fwtNewTournamentEntries"
    ) || "null"
  );


if (
  !tournament ||
  !tournament.divisionId ||
  !Array.isArray(entries)
  ||
  entries.length === 0
) {

  alert(
    "참가자 또는 대회 정보가 없습니다."
  );

  location.href =
    "./participant-registration.html";

}


const groupCount =
  Number(
    tournament.groupCount || 0
  );


if (
  groupCount < 1
) {

  alert(
    "조 개수 설정이 올바르지 않습니다."
  );

  location.href =
    "./create-tournament.html";

}


let currentSession =
  null;


let busy =
  false;


/*
  각 참가자의 현재 조 이름.

  예:
  [
    "A조",
    "B조",
    null,
    "C조"
  ]
*/

let assignments =
  new Array(
    entries.length
  ).fill(null);


/* =====================================
   HELPERS
===================================== */

function escapeHtml(value) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value ?? "";

  return div.innerHTML;

}


function shortEntryName(entry) {

  if (!entry) {

    return "알 수 없음";

  }


  if (
    entry.type ===
    "singles"
  ) {

    return (
      entry.nickname ||
      entry.name ||
      "이름 없음"
    );

  }


  const p1 =
    entry.player1?.nickname ||
    entry.player1?.name ||
    "선수1";


  const p2 =
    entry.player2?.nickname ||
    entry.player2?.name ||
    "선수2";


  return `${p1}/${p2}`;

}


function fullEntryName(entry) {

  if (!entry) {

    return "알 수 없음";

  }


  if (
    entry.type ===
    "singles"
  ) {

    if (
      entry.nickname &&
      entry.name
    ) {

      return `${entry.nickname} (${entry.name})`;

    }


    return (
      entry.nickname ||
      entry.name ||
      "이름 없음"
    );

  }


  function one(player) {

    if (
      player?.nickname &&
      player?.name
    ) {

      return (
        `${player.nickname} (${player.name})`
      );

    }


    return (
      player?.nickname ||
      player?.name ||
      "이름 없음"
    );

  }


  return (
    `${one(
      entry.player1
    )} / ${one(
      entry.player2
    )}`
  );

}


/* =====================================
   GROUP NAMES
===================================== */

function makeGroupName(index) {

  if (
    index < 26
  ) {

    return (
      String.fromCharCode(
        65 + index
      )
      +
      "조"
    );

  }


  return (
    `${index + 1}조`
  );

}


const groupNames =
  Array.from(
    {
      length:
        groupCount
    },
    (
      _,
      index
    ) =>
      makeGroupName(
        index
      )
  );


/* =====================================
   AUTH
===================================== */

async function checkLogin() {

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getSession();


  if (
    error ||
    !data.session
  ) {

    location.href = "./";

    return false;

  }


  currentSession =
    data.session;


  return true;

}


/* =====================================
   BUSY
===================================== */

function setBusy(
  state,
  title = "",
  text = ""
) {

  busy =
    state;


  [
    "autoRemainingButton",
    "randomAllButton",
    "resetButton",
    "previousButton",
    "confirmButton"
  ]
    .forEach(
      id => {

        const el =
          document.getElementById(
            id
          );


        if (el) {

          el.disabled =
            state;

        }

      }
    );


  document.getElementById(
    "loadingOverlay"
  ).classList.toggle(
    "show",
    state
  );


  if (title) {

    document.getElementById(
      "loadingTitle"
    ).textContent =
      title;

  }


  if (text) {

    document.getElementById(
      "loadingText"
    ).textContent =
      text;

  }

}


/* =====================================
   SESSION SAVE
===================================== */

function createGroupData() {

  return groupNames.map(
    groupName => ({

      name:
        groupName,

      members:
        assignments
          .map(
            (
              assignedGroup,
              entryIndex
            ) => (
              assignedGroup ===
                groupName
                ? entryIndex
                : null
            )
          )
          .filter(
            value =>
              value !== null
          )

    })
  );

}


function saveSessionData() {

  sessionStorage.setItem(
    "fwtGroupAssignments",
    JSON.stringify(
      assignments
    )
  );


  sessionStorage.setItem(
    "fwtGroupData",
    JSON.stringify(
      createGroupData()
    )
  );

}


/* =====================================
   DB에서 기존 조편성 불러오기
===================================== */

async function loadExistingGroups() {

  const {
    data:groupRows,
    error:groupError
  } =
    await supabaseClient
      .from("groups")
      .select(
        "id,name,sort_order"
      )
      .eq(
        "division_id",
        tournament.divisionId
      )
      .order(
        "sort_order",
        {
          ascending:true
        }
      );


  if (groupError) {

    throw new Error(
      "조 정보 조회 실패: "
      +
      groupError.message
    );

  }


  if (
    !groupRows ||
    groupRows.length === 0
  ) {

    /*
      DB에는 아직 조편성이 없지만
      기존 sessionStorage 테스트 데이터가
      있다면 그것을 복원.
    */

    const saved =
      JSON.parse(
        sessionStorage.getItem(
          "fwtGroupAssignments"
        ) || "null"
      );


    if (
      Array.isArray(saved)
      &&
      saved.length ===
        entries.length
    ) {

      assignments =
        saved.map(
          value =>
            groupNames.includes(
              value
            )
              ? value
              : null
        );

    }


    return;

  }


  const groupIds =
    groupRows.map(
      group =>
        group.id
    );


  const {
    data:groupEntryRows,
    error:memberError
  } =
    await supabaseClient
      .from("group_entries")
      .select(
        "group_id,entry_id,seed_order"
      )
      .in(
        "group_id",
        groupIds
      );


  if (memberError) {

    throw new Error(
      "조별 참가자 조회 실패: "
      +
      memberError.message
    );

  }


  /*
    DB entry UUID → 현재 entries 배열 index
  */

  const entryIndexMap =
    new Map();


  entries.forEach(
    (
      entry,
      index
    ) => {

      if (
        entry.dbEntryId
      ) {

        entryIndexMap.set(
          entry.dbEntryId,
          index
        );

      }

    }
  );


  const groupNameMap =
    new Map();


  groupRows.forEach(
    group => {

      groupNameMap.set(
        group.id,
        group.name
      );

    }
  );


  assignments =
    new Array(
      entries.length
    ).fill(null);


  (groupEntryRows || [])
    .forEach(
      row => {

        const entryIndex =
          entryIndexMap.get(
            row.entry_id
          );


        const groupName =
          groupNameMap.get(
            row.group_id
          );


        if (
          entryIndex !==
            undefined
          &&
          groupNames.includes(
            groupName
          )
        ) {

          assignments[
            entryIndex
          ] =
            groupName;

        }

      }
    );


  saveSessionData();

}


/* =====================================
   COUNTS
===================================== */

function getGroupMemberIndexes(
  groupName
) {

  return assignments
    .map(
      (
        assignment,
        index
      ) =>
        assignment ===
          groupName
          ? index
          : null
    )
    .filter(
      value =>
        value !== null
    );

}


function getUnassignedIndexes() {

  return assignments
    .map(
      (
        assignment,
        index
      ) =>
        assignment === null
          ? index
          : null
    )
    .filter(
      value =>
        value !== null
    );

}


/* =====================================
   SHUFFLE
===================================== */

function shuffleArray(array) {

  const result =
    [...array];


  for (
    let i =
      result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      result[i],
      result[j]
    ] =
    [
      result[j],
      result[i]
    ];

  }


  return result;

}


/* =====================================
   나머지 자동배정

   기존 수동 배치는 유지하고
   현재 인원이 적은 조부터 채움.
===================================== */

function autoAssignRemaining() {

  if (busy) {

    return;

  }


  const unassigned =
    shuffleArray(
      getUnassignedIndexes()
    );


  if (
    unassigned.length === 0
  ) {

    alert(
      "미배정 참가자가 없습니다."
    );

    return;

  }


  unassigned.forEach(
    entryIndex => {

      let smallestGroups =
        [];


      let smallestCount =
        Infinity;


      groupNames.forEach(
        groupName => {

          const count =
            getGroupMemberIndexes(
              groupName
            ).length;


          if (
            count <
            smallestCount
          ) {

            smallestCount =
              count;


            smallestGroups = [
              groupName
            ];

          } else if (
            count ===
            smallestCount
          ) {

            smallestGroups.push(
              groupName
            );

          }

        }
      );


      const target =
        smallestGroups[
          Math.floor(
            Math.random() *
            smallestGroups.length
          )
        ];


      assignments[
        entryIndex
      ] =
        target;

    }
  );


  saveSessionData();

  render();

}


/* =====================================
   전체 랜덤
===================================== */

function randomAll() {

  if (busy) {

    return;

  }


  if (
    !confirm(
      "현재 수동 배치를 모두 지우고 전체 참가자를 랜덤으로 다시 배정할까요?"
    )
  ) {

    return;

  }


  assignments =
    new Array(
      entries.length
    ).fill(null);


  const shuffled =
    shuffleArray(
      entries.map(
        (
          _,
          index
        ) =>
          index
      )
    );


  shuffled.forEach(
    (
      entryIndex,
      position
    ) => {

      assignments[
        entryIndex
      ] =
        groupNames[
          position %
          groupNames.length
        ];

    }
  );


  saveSessionData();

  render();

}


/* =====================================
   전체 초기화
===================================== */

function resetAll() {

  if (busy) {

    return;

  }


  if (
    !confirm(
      "현재 화면의 조 배정을 모두 초기화할까요?\nDB에 저장된 조편성은 '조편성 확정'을 누르기 전까지 변경되지 않습니다."
    )
  ) {

    return;

  }


  assignments =
    new Array(
      entries.length
    ).fill(null);


  saveSessionData();

  render();

}


/* =====================================
   개별 참가자 수동 배정
===================================== */

function changeAssignment(
  entryIndex,
  groupName
) {

  assignments[
    entryIndex
  ] =
    groupName || null;


  saveSessionData();

  renderSummary();

  renderGroups();

  renderWarning();

}


/* =====================================
   참가자 렌더
===================================== */

function renderParticipants() {

  const box =
    document.getElementById(
      "participantList"
    );


  box.innerHTML = "";


  entries.forEach(
    (
      entry,
      index
    ) => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "participant-row";


      const options =
        [

          `<option value="">
            미배정
          </option>`,

          ...groupNames.map(
            groupName =>
              `
                <option
                  value="${escapeHtml(
                    groupName
                  )}"
                  ${
                    assignments[
                      index
                    ] ===
                    groupName
                      ? "selected"
                      : ""
                  }
                >
                  ${escapeHtml(
                    groupName
                  )}
                </option>
              `
          )

        ].join("");


      row.innerHTML = `

        <div class="participant-number">
          ${index + 1}
        </div>


        <div class="participant-main">

          <div class="participant-name">

            ${escapeHtml(
              fullEntryName(
                entry
              )
            )}

          </div>

          <div class="participant-sub">

            ${
              assignments[
                index
              ]
                ? escapeHtml(
                    assignments[
                      index
                    ]
                  )
                : "아직 조 미배정"
            }

          </div>

        </div>


        <select
          class="group-select"
          aria-label="조 선택"
        >
          ${options}
        </select>

      `;


      row
        .querySelector(
          ".group-select"
        )
        .addEventListener(
          "change",
          function() {

            changeAssignment(
              index,
              this.value
            );

          }
        );


      box.appendChild(
        row
      );

    }
  );

}


/* =====================================
   조 미리보기
===================================== */

function renderGroups() {

  const box =
    document.getElementById(
      "groups"
    );


  box.innerHTML = "";


  groupNames.forEach(
    groupName => {

      const memberIndexes =
        getGroupMemberIndexes(
          groupName
        );


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "group-card";


      let membersHtml = "";


      if (
        memberIndexes.length === 0
      ) {

        membersHtml = `

          <div class="empty-group">
            배정된 참가자 없음
          </div>

        `;

      } else {

        membersHtml =
          memberIndexes
            .map(
              entryIndex => `

                <div class="member">

                  ${escapeHtml(
                    shortEntryName(
                      entries[
                        entryIndex
                      ]
                    )
                  )}

                </div>

              `
            )
            .join("");

      }


      card.innerHTML = `

        <div class="group-head">

          <div class="group-name">
            ${escapeHtml(
              groupName
            )}
          </div>

          <div class="group-count">
            ${memberIndexes.length}
          </div>

        </div>


        <div class="group-members">
          ${membersHtml}
        </div>

      `;


      box.appendChild(
        card
      );

    }
  );

}


/* =====================================
   SUMMARY
===================================== */

function renderSummary() {

  document.getElementById(
    "entryCount"
  ).textContent =
    entries.length;


  document.getElementById(
    "groupCount"
  ).textContent =
    groupCount;


  document.getElementById(
    "unassignedCount"
  ).textContent =
    getUnassignedIndexes()
      .length;

}


/* =====================================
   WARNING
===================================== */

function renderWarning() {

  const warning =
    document.getElementById(
      "warning"
    );


  const unassigned =
    getUnassignedIndexes()
      .length;


  if (
    unassigned > 0
  ) {

    warning.textContent =
      `아직 ${unassigned}명의 참가자가 조에 배정되지 않았습니다.`;

    warning.classList.add(
      "show"
    );

    return;

  }


  const invalidGroups =
    groupNames.filter(
      groupName =>
        getGroupMemberIndexes(
          groupName
        ).length < 2
    );


  if (
    invalidGroups.length > 0
  ) {

    warning.textContent =
      `${invalidGroups.join(", ")}의 참가자가 2명 미만입니다. 조별 리그를 만들려면 각 조에 최소 2명이 필요합니다.`;

    warning.classList.add(
      "show"
    );

    return;

  }


  warning.classList.remove(
    "show"
  );

  warning.textContent = "";

}


/* =====================================
   전체 렌더
===================================== */

function render() {

  renderSummary();

  renderParticipants();

  renderGroups();

  renderWarning();

}


/* =====================================
   조편성 검증
===================================== */

function validateGroups() {

  const unassigned =
    getUnassignedIndexes();


  if (
    unassigned.length > 0
  ) {

    alert(
      `아직 ${unassigned.length}명의 참가자가 조에 배정되지 않았습니다.`
    );

    return false;

  }


  const tooSmall =
    groupNames.filter(
      groupName =>
        getGroupMemberIndexes(
          groupName
        ).length < 2
    );


  if (
    tooSmall.length > 0
  ) {

    alert(
      `${tooSmall.join(", ")}의 참가자가 2명 미만입니다.\n각 조에 최소 2명을 배정해주세요.`
    );

    return false;

  }


  /*
    모든 참가자가 DB entry UUID를
    가지고 있는지도 확인.
  */

  const missingDbEntry =
    entries.find(
      entry =>
        !entry.dbEntryId
    );


  if (
    missingDbEntry
  ) {

    alert(
      "일부 참가자의 DB 연결 정보가 없습니다.\n참가자 등록 페이지에서 다시 확인해주세요."
    );

    return false;

  }


  return true;

}


/* =====================================
   DB 조편성 저장

   기존 groups 삭제
   ↓
   FK cascade로 group_entries 삭제
   ↓
   새 groups 생성
   ↓
   group_entries 생성
===================================== */

async function saveGroupsToDatabase() {

  /*
    1. 기존 조 삭제
  */

  const {
    error:deleteError
  } =
    await supabaseClient
      .from("groups")
      .delete()
      .eq(
        "division_id",
        tournament.divisionId
      );


  if (
    deleteError
  ) {

    throw new Error(
      "기존 조편성 삭제 실패: "
      +
      deleteError.message
    );

  }


  /*
    2. 새 groups 생성
  */

  const groupRows =
    groupNames.map(
      (
        groupName,
        index
      ) => ({

        division_id:
          tournament.divisionId,

        name:
          groupName,

        sort_order:
          index

      })
    );


  const {
    data:savedGroups,
    error:groupError
  } =
    await supabaseClient
      .from("groups")
      .insert(
        groupRows
      )
      .select(
        "id,name,sort_order"
      );


  if (
    groupError ||
    !savedGroups ||
    savedGroups.length !==
      groupNames.length
  ) {

    throw new Error(
      "새 조 생성 실패: "
      +
      (
        groupError?.message ||
        "조 데이터 확인 실패"
      )
    );

  }


  const groupIdMap =
    new Map();


  savedGroups.forEach(
    group => {

      groupIdMap.set(
        group.name,
        group.id
      );

    }
  );


  /*
    3. group_entries 생성
  */

  const groupEntryRows = [];


  groupNames.forEach(
    groupName => {

      const memberIndexes =
        getGroupMemberIndexes(
          groupName
        );


      memberIndexes.forEach(
        (
          entryIndex,
          memberOrder
        ) => {

          groupEntryRows.push({

            group_id:
              groupIdMap.get(
                groupName
              ),

            entry_id:
              entries[
                entryIndex
              ].dbEntryId,

            /*
              지금 단계에서는 실제 시드 번호라기보다는
              조 내부 배치 순서로 활용.
            */

            seed_order:
              memberOrder

          });

        }
      );

    }
  );


  const {
    error:entryError
  } =
    await supabaseClient
      .from("group_entries")
      .insert(
        groupEntryRows
      );


  if (
    entryError
  ) {

    throw new Error(
      "조별 참가자 저장 실패: "
      +
      entryError.message
    );

  }


  /*
    다음 페이지에서도 DB ID를 사용할 수 있게
    groupData에 UUID를 추가해 둔다.
  */

  const groupData =
    groupNames.map(
      groupName => {

        const memberIndexes =
          getGroupMemberIndexes(
            groupName
          );


        return {

          name:
            groupName,

          dbGroupId:
            groupIdMap.get(
              groupName
            ),

          members:
            memberIndexes

        };

      }
    );


  sessionStorage.setItem(
    "fwtGroupAssignments",
    JSON.stringify(
      assignments
    )
  );


  sessionStorage.setItem(
    "fwtGroupData",
    JSON.stringify(
      groupData
    )
  );

}


/* =====================================
   확정
===================================== */

async function confirmGroups() {

  if (busy) {

    return;

  }


  if (
    !validateGroups()
  ) {

    return;

  }


  const ok =
    confirm(
      "현재 조편성을 확정하고 대진을 생성할까요?"
    );


  if (!ok) {

    return;

  }


  try {

    setBusy(
      true,
      "조편성을 저장하고 있습니다",
      "A조, B조 등의 조 정보와 참가자 배정을 데이터베이스에 저장하고 있습니다."
    );


    await saveGroupsToDatabase();


    /*
      조편성이 바뀌었으므로
      이후 경기 데이터는 브라우저 쪽에서 초기화.
      DB matches 연결은 다음 단계에서 처리.
    */

    sessionStorage.removeItem(
      "fwtGroupMatches"
    );

    sessionStorage.removeItem(
      "fwtMatchControlState"
    );

    sessionStorage.removeItem(
      "fwtStandingsData"
    );

    sessionStorage.removeItem(
      "fwtKnockoutQualifiers"
    );

    sessionStorage.removeItem(
      "fwtKnockoutBracket"
    );


    setBusy(
      true,
      "조편성 저장 완료",
      "조별 예선 대진 화면으로 이동합니다."
    );


    setTimeout(
      function() {

        location.href =
          "./group-matches.html";

      },
      400
    );


  } catch(error) {

    console.error(error);


    setBusy(false);


    alert(
      "조편성을 저장하지 못했습니다.\n\n"
      +
      (
        error?.message ||
        "알 수 없는 오류가 발생했습니다."
      )
    );

  }

}


/* =====================================
   EVENTS
===================================== */

document.getElementById(
  "autoRemainingButton"
).addEventListener(
  "click",
  autoAssignRemaining
);


document.getElementById(
  "randomAllButton"
).addEventListener(
  "click",
  randomAll
);


document.getElementById(
  "resetButton"
).addEventListener(
  "click",
  resetAll
);


document.getElementById(
  "confirmButton"
).addEventListener(
  "click",
  confirmGroups
);


/* =====================================
   START
===================================== */

async function start() {

  const loggedIn =
    await checkLogin();


  if (!loggedIn) {

    return;

  }


  try {

    setBusy(
      true,
      "조편성 확인 중",
      "기존에 저장된 조편성이 있는지 데이터베이스에서 확인하고 있습니다."
    );


    await loadExistingGroups();


    setBusy(false);


    render();


  } catch(error) {

    console.error(error);


    setBusy(false);


    alert(
      "조편성 정보를 불러오지 못했습니다.\n\n"
      +
      (
        error?.message ||
        "알 수 없는 오류"
      )
    );


    render();

  }

}


start();
